<style>
:root{--bg:#FBF8F2;--paper:#FFFFFF;--ink:#23262B;--mute:#6E6A63;--line:#E4DED3;--accent:#D9694F;--accent-soft:#FBE9E3;--good:#2E8B57;--good-soft:#E3F3E9;--bad:#C4443A;--bad-soft:#FBE5E3;--why:#F3EFE6;--tab:#EFE9DD;--sel:#23262B;--sel-ink:#FFFFFF;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17181C;--paper:#1F2126;--ink:#ECE8E0;--mute:#A39D92;--line:#33363D;--accent:#E98368;--accent-soft:#3A2822;--good:#5CBF86;--good-soft:#1E3327;--bad:#E26A60;--bad-soft:#3A2220;--why:#25272D;--tab:#2A2C33;--sel:#ECE8E0;--sel-ink:#17181C;}}
:root[data-theme="dark"]{--bg:#17181C;--paper:#1F2126;--ink:#ECE8E0;--mute:#A39D92;--line:#33363D;--accent:#E98368;--accent-soft:#3A2822;--good:#5CBF86;--good-soft:#1E3327;--bad:#E26A60;--bad-soft:#3A2220;--why:#25272D;--tab:#2A2C33;--sel:#ECE8E0;--sel-ink:#17181C;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Heiti TC",sans-serif;font-size:16px;line-height:1.6;padding-block:0 60px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px 8px}

.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

.brand{flex-wrap:wrap;gap:6px}

.vopt:hover{border-color:var(--accent)} .vopt.right{border-color:var(--good);background:var(--good-soft)} .vopt.wrong{border-color:var(--bad);background:var(--bad-soft)} .vopt:disabled{cursor:default}
.vlearn{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin:8px 0} .vcard{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)} .ven{font:800 18px/1.3 Nunito,"Noto Sans TC",sans-serif} .vzh{margin-top:4px;color:var(--ink)} .vsay{border:0;background:transparent;font-size:16px;cursor:pointer;padding:0 4px}

<header><div class="wrap">
<div class="brand"><h1>國三英文<small>妳會講的句子，考卷叫它什麼</small></h1><div class="score" id="score"></div></div>

<script>

const DATA = [{"n": 1, "point": "現在完成式", "grade": "九上", "stem": "Iga Swiatek was not a famous tennis player at first. However, she _____ many prizes over the past few years. Now she is a superstar.", "opts": ["has won", "won", "will win", "has to win"], "ans": "A", "why": "訊號詞 over the past few years（過去到現在的一段時間）＋ Now she is a superstar，要用現在完成式 has won。"}, {"n": 2, "point": "不定詞與動名詞", "grade": "八上", "stem": "Did you finish ______ the kitchen when I called you this afternoon?", "opts": ["clean", "cleaning", "to clean", "cleaned"], "ans": "B", "why": "finish 後面只能接動名詞 V-ing，不能接不定詞。"}, {"n": 3, "point": "被動語態", "grade": "九上", "stem": "The cartoon character SpongeBob __________ a TV show to make children laugh and learn at the same time.", "opts": ["was creating for", "was created for", "created for", "has created for"], "ans": "B", "why": "主詞 SpongeBob 是「被創造出來」的卡通人物 → 被動 be＋p.p.（was created）；四個選項都帶 for，差別只在主動／被動。"}, {"n": 4, "point": "be 動詞與一般動詞現在式", "grade": "七上", "stem": "Mike: Is that your frog?\nStella: No, _____.", "opts": ["it is", "it isn't", "that is", "they aren't"], "ans": "B", "why": "Is that...? 的否定簡答要把 that 換成 it，並用 be 動詞否定：No, it isn't。"}, {"n": 5, "point": "關係代名詞 who/which/that", "grade": "九上", "stem": "Many girls like the tall boy ＿＿＿ is good at playing basketball.", "opts": ["he", "╳", "which", "who"], "ans": "D", "why": "先行詞 the tall boy 是人，且關代在子句中當主詞（主格），要用 who／that，主格不可省略。"}, {"n": 6, "point": "過去式（規則/不規則）", "grade": "八上", "stem": "Taro: ___ you feed our cat today?\nHina: No, I didn't, but Ella ___.", "opts": ["Were; was", "Did; did", "Do; don't", "Did; didn't"], "ans": "B", "why": "feed 是一般動詞、today 已過，問句助動詞用 Did；後句 but 表對比，Ella 有餵，所以用肯定代動詞 did。"}, {"n": 7, "point": "時間與條件子句（when/if 現在式代未來）", "grade": "九上", "stem": "I am not sure if the teacher will agree with our plan, but if ________, we can start preparing the report right away.", "opts": ["he will", "he agree", "he is", "he does"], "ans": "D", "why": "if 帶的條件子句不能用 will，用現在式代替未來；主詞 he 要用 does（代替 agrees）。訊號：if ＋ 還沒發生的事。"}, {"n": 8, "point": "比較級與最高級", "grade": "八下", "stem": "Wow, Jerry runs so fast! I think he is ______ anyone else in our school.", "opts": ["fastest", "faster than", "the faster", "the fastest"], "ans": "B", "why": "後面有 anyone else（跟其他每一個人比）→ 比較級 faster than；不是三者以上排名，所以不用 the fastest。"}, {"n": 9, "point": "間接問句", "grade": "九上", "stem": "I have no idea _______ he gave up so easily when he was so close to success.", "opts": ["who", "why", "what", "how"], "ans": "B", "why": "空格後 he gave up 已有完整主詞＋動詞，缺的是「原因」，用 why 引導名詞子句。"}, {"n": 10, "point": "現在進行式", "grade": "七上", "stem": "Tim: What are you doing, Gina?\nGina: _____ Where are they?", "opts": ["She's painting.", "I'm looking for my keys.", "I can sing and dance.", "Let's get the ball rolling!"], "ans": "B", "why": "What are you doing? 問「你正在做什麼」，要用現在進行式 I'm V-ing 回答；後面 Where are they? 的 they 指前面的 keys。"}, {"n": 11, "point": "未來式 be going to / will", "grade": "八上", "stem": "Remember to take an umbrella with you. It ______ rain this afternoon.", "opts": ["is going", "will be", "will", "is going to have"], "ans": "C", "why": "rain 是動詞，未來式要用 will + 原形動詞；be going 少了 to，will be / is going to have 後面接不了 rain。"}, {"n": 12, "point": "連綴動詞＋形容詞（sound / look / taste…）", "grade": "八下", "stem": "A: Lora, how about going to BLACKPINK's concert with me next weekend?\nB: That ______ wonderful! Let's get the ticket on the Internet now.", "opts": ["sounds", "smells", "feels", "tastes"], "ans": "A", "why": "對方是用「說」的提議，聽起來很棒要用連綴動詞 sound + 形容詞 wonderful。"}, {"n": 13, "point": "助動詞 can/will/should", "grade": "七下", "stem": "Josh: Can your brothers play basketball?\nOlivia: No, ______.", "opts": ["he can", "my brothers cannot", "he can't", "they can't"], "ans": "D", "why": "問句主詞 your brothers 是複數，簡答要用代名詞 they，且助動詞 can 的否定簡答為 they can't。"}, {"n": 14, "point": "附加問句", "grade": "八下", "stem": "There isn't going to be any class tomorrow because the teachers' meeting is in the morning, _______?", "opts": ["aren't they", "will there", "is there", "isn't there"], "ans": "C", "why": "主要子句是 There isn't...（否定），附加問句要用肯定，且 there be 句型主詞用 there，故為 is there。"}, {"n": 15, "point": "連接詞 and/but/or/because/so 與 too…to / so…that", "grade": "八上", "stem": "____ Villa's homework was not easy, ___ her sister helped her with it.", "opts": ["Because; X", "Because; so", "So; X", "So; Because"], "ans": "A", "why": "中文的「因為…所以…」在英文裡 because 和 so 只能擇一，兩個不可同時出現。"}, {"n": 16, "point": "現在完成式", "grade": "九上", "stem": "Linda's read Slam Dunk several times, but I _____ . Maybe I need to watch the TV series first.", "opts": ["am not", "haven't", "didn't", "don't"], "ans": "B", "why": "前半 Linda's read（＝has read）是現在完成式，後半「我還沒」要用同一種時態的否定 haven't（省略了 read it）。訊號：several times、前句的 has。"}, {"n": 17, "point": "過去式（規則/不規則）", "grade": "八上", "stem": "A: Jason, why ___ you call me yesterday?\nB: Sorry, I ___ busy.", "opts": ["don't; was", "did; am", "didn't; was", "was; didn't"], "ans": "C", "why": "yesterday 是過去，一般動詞 call 的否定疑問用 didn't；答句 busy 是形容詞，要用 be 動詞過去式 was。"}, {"n": 18, "point": "關係代名詞 who/which/that", "grade": "九上", "stem": "Among all my family members, my sister is the only one _______ raw (生的) fish like sashimi.", "opts": ["loves", "to love", "that loves", "who love"], "ans": "C", "why": "先行詞 the only one 前有 the only，關代慣用 that；先行詞是單數，動詞要加 s，故 that loves。"}, {"n": 19, "point": "不定詞與動名詞", "grade": "八上", "stem": "Gina and her family love _____. They plan _____ on the mountain this weekend.", "opts": ["to camp; camping", "camping ; go camping", "go camping ; to camp", "camping ; to go camping"], "ans": "D", "why": "love 後接 V-ing 或 to V 都可，但 plan 只能接不定詞 to V，所以第二格必須是 to go camping。"}, {"n": 20, "point": "時間與條件子句（when/if 現在式代未來）", "grade": "九上", "stem": "If people _______ the environment, the Earth will become more polluted.", "opts": ["didn't take care of", "won't care about", "hurts", "don't protect"], "ans": "D", "why": "if 條件子句要用現在式代替未來式（不能 won't），主詞 people 是複數用 don't，語意是「不保護」環境。"}, {"n": 21, "point": "現在進行式", "grade": "七上", "stem": "In the middle of the park, there is a big garden. Look! Some people ______ , and some kids ______ .", "opts": ["to draw ; to play", "is drawing ; are playing", "draw ; play", "are drawing ; are playing"], "ans": "D", "why": "訊號詞 Look!（看！正在發生）要用現在進行式；主詞 some people 與 some kids 都是複數，be 動詞用 are。"}, {"n": 22, "point": "被動語態", "grade": "九上", "stem": "When I _______ the chance to challenge myself, I discovered that I was stronger than I imagined.", "opts": ["was given", "will give", "give", "has given"], "ans": "A", "why": "機會是「被給予」的，且主要子句 discovered 是過去式，要用過去被動 was given。"}, {"n": 23, "point": "比較級與最高級", "grade": "八下", "stem": "Which is ______ popular smartphone brand in Taiwan? Apple, Samsung, or Oppo?", "opts": ["less", "more", "most", "the most"], "ans": "D", "why": "三者以上相比（Apple, Samsung, Oppo）用最高級，且最高級前面要加 the，故為 the most popular。"}, {"n": 24, "point": "助動詞 can/will/should", "grade": "八下", "stem": "If we practice every day this month, we will ______ run five kilometers next week, but remember to rest on Sundays.", "opts": ["can", "maybe", "be able to", "able"], "ans": "C", "why": "兩個助動詞不能連用（will can 是錯的），要把 can 換成 be able to。"}, {"n": 25, "point": "情緒動詞 -ed / -ing（excited / exciting）", "grade": "九上", "stem": "The movie \"Demon Slayer: Kimetsu no Yaiba - Castillo infinito\" really______ me. I couldn't stop thinking of it last night.", "opts": ["surprise", "surprised", "was surprised at", "are surprising to"], "ans": "B", "why": "主詞是電影（使人驚訝的來源），surprise 當及物動詞直接接受詞 me；last night 表過去，用 surprised。"}, {"n": 26, "point": "祈使句", "grade": "九上", "stem": "_______ carefully before making any decision, because even a small mistake can lead to serious results in the future.", "opts": ["To think", "Think", "Thinking", "By thinking"], "ans": "B", "why": "整句沒有主詞、是在勸告對方，屬祈使句，開頭直接用原形動詞 Think。"}, {"n": 27, "point": "be 動詞與一般動詞現在式", "grade": "七下", "stem": "Fifi: Do you usually go to school on foot?\nSunny: No, _____________.", "opts": ["I always do.", "I never am.", "I seldom do.", "I usually do."], "ans": "C", "why": "問句用一般動詞 go，簡答要用代動詞 do（不是 am）；答 No 表示不常，頻率副詞用 seldom。"}, {"n": 28, "point": "間接問句", "grade": "九上", "stem": "Michael wants to know ＿＿＿.", "opts": ["how much money did his wife spend last night", "how much money his wife spent last night", "his wife spent how much money last night", "how much his wife spent money last night"], "ans": "B", "why": "間接問句（名詞子句）要用「疑問詞＋主詞＋動詞」的敘述句語序，不能保留 did 倒裝。"}, {"n": 29, "point": "未來式 be going to / will", "grade": "八上", "stem": "Sue: Is there ______ a new restaurant near the park?\nCamille: Yes, ______.", "opts": ["going to have; there is", "going to go to have; it is", "going to go to; it will", "going to be; there will"], "ans": "D", "why": "there be 的未來式是 there is going to be（不是 going to have）；簡答主詞也要用 there，故 there will。"}, {"n": 30, "point": "連接詞 and/but/or/because/so 與 too…to / so…that", "grade": "九上", "stem": "Rosé and Bruno Mars sing _____ powerfully and beautifully _____ the song APT. has become really popular around the world.", "opts": ["either; or", "neither; nor", "so; that", "too; to"], "ans": "C", "why": "第一格後接副詞 powerfully and beautifully、第二格後是完整句子，符合 so + 副詞 + that + 子句（如此…以致於…）。"}]; const GMAP = {"volumes": [{"title": "第一冊　七年級上（翰林單元順序略有前後）", "units": [{"title": "be 動詞與主詞", "items": [{"key": "be_present", "name": "be 動詞現在式 am / is / are", "one": "就是中文的「是」跟「在」，把主詞和後面的身分、狀態、地點接起來。", "signal": "主詞是 I → am；主詞是 you 或兩個以上 → are；其他單數（他／她／它／一個人一樣東西）→ is。", "ex": ["I am a junior high school student.", "My sister is at home now."], "trap": "後面已經有一般動詞了還放 be，寫成 I am like dogs。"}, {"key": "subject_pronoun", "name": "主格人稱代名詞 I / you / he / she / it / we / they", "one": "句子開頭「誰」的那個字，用來代替前面提過的人或東西，不用一直重複。", "signal": "位置在句首、動詞前面 → 用主格；一個男生 he、一個女生 she、東西 it、兩個以上 they。", "ex": ["My brother is tall. He plays basketball.", "The books are new. They are mine."], "trap": "把受格放句首，寫成 Me and my friend are…（要用 My friend and I）。"}, {"key": "be_neg_question", "name": "be 動詞的否定與疑問", "one": "要說「不是」就在 be 後面加 not，要問「是不是」就把 be 搬到句首。", "signal": "看到否定 → am/is/are + not（isn't、aren't）；答案是 Yes, I am. 這種 → 問句開頭一定是 Are/Is/Am。", "ex": ["She is not my classmate.", "Are you ready?"], "trap": "問句忘記把 be 提到最前面，寫成 You are ready?"}]}, {"title": "名詞、冠詞與指示詞", "items": [{"key": "noun_plural", "name": "名詞複數", "one": "東西不只一個的時候，名詞屁股要加 s，有幾個字要小變形。", "signal": "看到 two / three / many / some / a lot of → 可數名詞加 s；-s、-x、-ch、-sh 結尾 → 加 es；子音 + y → 去 y 加 ies。", "ex": ["I have two dogs.", "There are many boxes in the room."], "trap": "數字後面忘記加 s，寫成 three book。"}, {"key": "article_a_an_the", "name": "冠詞 a / an / the", "one": "a 和 an 是「隨便一個」，the 是「就是那一個，你知道我在講哪個」。", "signal": "第一次提到、單數可數 → 看「發音」不是看字母：唸起來是子音開頭用 a，唸起來是母音開頭用 an（an hour 的 h 不發音；a university 的 u 唸 /ju/ 是子音開頭）；第二次提到、雙方都知道是哪一個 → the。", "ex": ["I saw a cat. The cat was black.", "She is an English teacher."], "trap": "用字母而不是發音判斷，寫成 a hour（h 不發音，要 an hour）。"}, {"key": "this_these", "name": "指示詞 this / that / these / those", "one": "近的用 this、these，遠的用 that、those；一個用單數、多個用複數。", "signal": "近 + 單數 this；近 + 複數 these；遠 + 單數 that；遠 + 複數 those，後面 be 動詞跟著變 is / are。", "ex": ["This is my pencil.", "Those are her shoes."], "trap": "These、Those 後面還用 is，寫成 These is my books。"}, {"key": "possessive_adj", "name": "所有格 my / your / his / her 與名詞 's", "one": "表示「誰的」，人名或名詞後面加 's，代名詞就換成 my、your、his、her。", "signal": "看到「…的」而且後面馬上接名詞 → 用 my / your / his / her / its / our / their，或名詞加 's。", "ex": ["This is my brother's bike.", "Her bag is on the desk."], "trap": "忘記加 's，寫成 my brother bike；或 his 跟 her 弄反。"}]}, {"title": "一般動詞現在式", "items": [{"key": "present_simple", "name": "一般動詞現在式", "one": "講習慣、常常做的事、或一直都成立的事實，動詞用原形。", "signal": "看到 every day / usually / often / always / on Sundays → 用現在式原形動詞。", "ex": ["I go to school by bus every day.", "We play basketball after school."], "trap": "一個句子裡同時有 be 和一般動詞，寫成 I am go to school。"}, {"key": "third_person_s", "name": "第三人稱單數動詞加 -s / -es", "one": "主詞是「他、她、它、一個人一樣東西」的時候，動詞屁股要加 s。", "signal": "主詞可以換成 he / she / it（單數，而且不是 I 也不是 you）→ 動詞加 s；go、do、watch 類加 es；子音 + y 變 ies。", "ex": ["My father works in a hospital.", "She studies English every night."], "trap": "主詞是單數名詞（像 My brother）就忘記加 s。"}, {"key": "do_does", "name": "do / does 的否定與疑問", "one": "一般動詞要說「不」或要問問題，得請助動詞 do、does 出來幫忙。", "signal": "主詞是 he / she / it → does；其他 → do。只要出現 does、doesn't、did，後面動詞一律回原形。", "ex": ["She doesn't like milk.", "Do you have any questions?"], "trap": "does 後面動詞還加 s，寫成 Does she likes it?"}]}, {"title": "疑問詞與基本句型", "items": [{"key": "wh_question", "name": "疑問詞問句 what / who / where / when / why / how", "one": "不能用 Yes 或 No 回答的問句，開頭先放你想知道的那個東西。", "signal": "問東西 What、問人 Who、問地方 Where、問時間 When、問原因 Why（回答用 Because）、問方法 How；疑問詞後面接 be 或 do / does。", "ex": ["Where do you live?", "What is your favorite subject?"], "trap": "疑問詞後面忘記倒裝，寫成 Where you live?"}, {"key": "how_many_much", "name": "How many / How much", "one": "問數量的兩種問法，看那個東西能不能一個一個數。", "signal": "數得出來（books、people）→ How many + 複數名詞；數不出來（water、money、time）→ How much；問價錢也用 How much。", "ex": ["How many classes do you have today?", "How much water do you drink every day?"], "trap": "How many 後面名詞忘記加 s，寫成 How many book。"}, {"key": "there_be", "name": "There is / There are", "one": "說某個地方「有」什麼東西，開頭放 There，be 動詞跟著「有的那個東西」變。", "signal": "There is + 單數或不可數；There are + 複數。動詞跟緊接在後面那個名詞一致，不是跟地點。", "ex": ["There is a computer in the room.", "There are five students in the library."], "trap": "中文「我家有一隻狗」直翻成 My home has a dog，要用 There is a dog in my home。"}, {"key": "imperative", "name": "祈使句", "one": "叫別人做事或不要做事，句子直接用動詞開頭，不寫主詞。", "signal": "沒有主詞、動詞原形開頭 → 祈使句；說「不要…」→ Don't + 原形；加 please 比較客氣。", "ex": ["Close the door, please.", "Don't be late for class."], "trap": "忘記用原形，寫成 Closing the door 或 Don't to be late。"}]}]}, {"title": "第二冊　七年級下（翰林單元順序略有前後）", "units": [{"title": "現在進行式", "items": [{"key": "present_continuous", "name": "現在進行式 be + V-ing", "one": "講「現在正在做」的事，be 動詞加上動詞的 ing。", "signal": "看到 now / right now / at the moment / Look! / Listen! → be + V-ing。", "ex": ["I am doing my homework now.", "Look! The dog is running."], "trap": "只寫 ing 忘記 be，寫成 I doing my homework。"}, {"key": "v_ing_spelling", "name": "動詞加 -ing 的拼法", "one": "加 ing 的時候有些字要去掉 e、有些要重複最後一個字母。", "signal": "字尾是 e → 去 e 加 ing（make 變 making）；短母音加單子音 → 重複字尾再加 ing（run 變 running、sit 變 sitting）；其他直接加。", "ex": ["She is writing a letter.", "They are swimming in the pool."], "trap": "忘記去 e 或忘記重複字母，寫成 makeing、runing。"}, {"key": "present_vs_continuous", "name": "現在式和現在進行式怎麼選", "one": "平常都這樣就用現在式，此時此刻正在做才用進行式。", "signal": "every day / usually / always → 現在式；now / Look! / at the moment → 進行式。", "ex": ["I usually walk to school, but I am taking the bus today.", "He plays the guitar every weekend."], "trap": "看到 every day 還用進行式，寫成 I am going to school every day。"}]}, {"title": "過去式", "items": [{"key": "be_past", "name": "be 動詞過去式 was / were", "one": "講以前「是」或「在」什麼樣子，am 和 is 變 was，are 變 were。", "signal": "看到 yesterday / last night / ago / then → I、he、she、it 用 was；you、we、they 用 were。", "ex": ["I was very tired last night.", "They were at the park yesterday."], "trap": "主詞是 you 卻用 was，寫成 You was late。"}, {"key": "past_regular", "name": "規則動詞過去式加 -ed", "one": "已經做過、已經結束的事，動詞後面加 ed。", "signal": "看到 yesterday / last week / two days ago / in 2020 → 動詞加 ed；字尾 e 只加 d；子音 + y 變 ied。", "ex": ["We watched a movie last Saturday.", "She studied for the test yesterday."], "trap": "時間明明是過去卻用現在式，或 y 結尾忘記變 ied，寫成 studyed。"}, {"key": "past_irregular", "name": "不規則動詞過去式", "one": "有一批很常用的動詞，過去式不是加 ed，要一個一個記。", "signal": "go 變 went、have 變 had、eat 變 ate、see 變 saw、buy 變 bought、take 變 took；看到過去時間詞就換成這個形。", "ex": ["I went to the night market last night.", "He bought a new phone last month."], "trap": "把不規則動詞硬加 ed，寫成 goed、buyed。"}, {"key": "past_did", "name": "過去式的否定與疑問 did", "one": "過去式要問問題或說「沒有」，用 did，動詞就退回原形。", "signal": "看到 didn't 或 Did…? → 後面動詞一律原形，不可以再用過去式。", "ex": ["I didn't finish my homework last night.", "Did you see the game yesterday?"], "trap": "did 後面還用過去式，寫成 Did you saw it?"}]}, {"title": "未來式", "items": [{"key": "be_going_to", "name": "be going to + 原形", "one": "講已經打算好、準備要做的事。", "signal": "看到 tomorrow / next week / this weekend，而且是事先計畫好的 → am / is / are going to + 動詞原形。", "ex": ["I am going to visit my grandmother this weekend.", "They are going to have a party next Friday."], "trap": "going to 後面放 ing，寫成 I am going to watching TV。"}, {"key": "will_future", "name": "will + 原形", "one": "講未來會發生的事，或當下才決定要做的事。", "signal": "看到 will、won't 或未來時間詞 → will + 原形，主詞不管是誰都一樣寫法。", "ex": ["It will rain tomorrow.", "I will call you later."], "trap": "will 後面加 to 或加 s，寫成 She will goes、will to go。"}]}, {"title": "頻率、時間與地點", "items": [{"key": "frequency_adverb", "name": "頻率副詞", "one": "表示「多常做」的字，位置有固定規矩。", "signal": "always 到 usually、often、sometimes、seldom、never 頻率遞減；放在一般動詞前面、be 動詞後面。", "ex": ["She always gets up at six.", "I am never late for school."], "trap": "位置放錯，寫成 I go always to school。"}, {"key": "ordinal", "name": "序數 first / second / third…（第幾）", "one": "「第幾個」的講法，跟 one、two 那種「有幾個」不一樣，序數前面通常要加 the。", "signal": "看到「第幾」「日期」「名次」「樓層」→ 用序數：日期 the tenth of October、名次 come first（得第一名）。拼法 one→first、two→second、three→third、five→fifth、eight→eighth、nine→ninth、twelve→twelfth，其他大多原數字加 th；幾十幾只有最後一個字變序數（ninety-ninth）。", "ex": ["My grandfather's ninety-ninth birthday is coming.", "Speed Fire came first in the race last year."], "trap": "幾十幾把前面那個字也變成序數，寫成 ninetieth-ninth（要 ninety-ninth）。"}, {"key": "prep_time", "name": "時間介系詞 in / on / at", "one": "時間前面配哪個字，看那段時間的大小。", "signal": "大單位（年、月、季節、上午下午）→ in；中單位（星期、日期）→ on；小單位（幾點、特定時刻）→ at。", "ex": ["My birthday is in July.", "The class starts at eight o'clock."], "trap": "星期用 in，寫成 in Monday。"}, {"key": "prep_place", "name": "地點介系詞 in / on / at", "one": "在裡面用 in、在表面上用 on、在一個定點用 at。", "signal": "在裡面（房間、城市）→ in；在表面上（桌上、牆上）→ on；一個定點（車站、門口）→ at。", "ex": ["The keys are on the table.", "We waited at the bus stop."], "trap": "交通工具混用，公車火車要 on the bus，小客車才是 in the car。"}, {"key": "prep_fixed", "name": "介系詞固定片語 on business / on vacation / on foot / by bus", "one": "這幾組是整組背起來的，不用去想 in、on、at 誰大誰小。", "signal": "出差 on business、度假 on vacation、走路 on foot、搭車 by bus / by car / by bike / by MRT（by 後面的交通工具不加 a、不加 the、不加 s）。", "ex": ["She is going to New York on business.", "I go to school on foot, but my brother goes by bike."], "trap": "on foot 寫成 by foot；或 by 後面加冠詞，寫成 by a bus。"}]}, {"title": "助動詞、受格與提議", "items": [{"key": "can_ability", "name": "助動詞 can", "one": "表示「會、能夠」，後面永遠接動詞原形。", "signal": "看到 can、can't、Can you…? → 後面動詞原形，不加 s 也不加 to。", "ex": ["I can swim very well.", "She can't come to the party."], "trap": "can 後面加 to 或加 s，寫成 He can plays the piano。"}, {"key": "object_pronoun", "name": "受格代名詞 me / him / her / us / them", "one": "放在動詞或介系詞後面的「我、他、她、他們」，長得跟主格不一樣。", "signal": "位置在動詞後面，或 to / for / with 後面 → 用受格 me、you、him、her、it、us、them。", "ex": ["Please help me.", "I went to the movies with them."], "trap": "介系詞後面用主格，寫成 with they。"}, {"key": "suggestion_lets", "name": "提議句型 Let's / How about / Why don't we", "one": "邀別人一起做某件事的三種說法，後面接的形式不一樣。", "signal": "Let's + 原形；How about、What about + V-ing 或名詞；Why don't we + 原形。", "ex": ["Let's go to the library after school.", "How about eating out tonight?"], "trap": "How about 後面用原形，寫成 How about go out?"}]}]}, {"title": "第三冊　八年級上", "units": [{"title": "情態助動詞", "items": [{"key": "modal_must_have_to", "name": "must / have to（一定要）", "one": "都是「必須」，must 偏規定和語氣強，have to 偏情況逼你做。", "signal": "看到 must、have to、has to → 後面動詞原形；主詞是 he / she / it 用 has to。", "ex": ["You must wear a helmet when you ride a scooter.", "I have to finish my report tonight."], "trap": "mustn't 是「絕對不可以」，don't have to 是「不必」，意思完全相反，段考最愛考。"}, {"key": "modal_should", "name": "should（應該）", "one": "給建議用的「應該」，語氣比 must 輕很多。", "signal": "題目在給建議、說什麼比較好 → should + 原形；否定用 shouldn't。", "ex": ["You should drink more water.", "We shouldn't talk in the library."], "trap": "should 後面加 to，寫成 should to go。"}, {"key": "modal_may_could", "name": "may / might / could（禮貌請求與可能）", "one": "用來客氣地請求，或表示「可能會」。", "signal": "開頭 May I…? 或 Could you…? → 禮貌請求；句子中間的 may、might → 不確定的「可能」。", "ex": ["May I ask you a question?", "It might rain this afternoon."], "trap": "看到 could 就把整句改成過去式，其實 Could you 只是客氣，不是在講過去。"}]}, {"title": "不定詞與動名詞", "items": [{"key": "infinitive_to_v", "name": "不定詞 to + 原形", "one": "一個動詞後面要再接第二個動作時，有些動詞規定要用 to。", "signal": "看到 want / hope / plan / decide / need / would like → 後面 to + 原形。", "ex": ["I want to be a nurse.", "She decided to join the club."], "trap": "to 後面放 ing 或過去式，寫成 want to going。"}, {"key": "gerund_v_ing", "name": "動名詞 V-ing 當受詞", "one": "有些動詞後面規定接 ing，那個 ing 其實是當名詞在用。", "signal": "看到 enjoy / finish / keep / practice / mind / give up → 後面 V-ing；任何介系詞後面也一定 V-ing。", "ex": ["I enjoy listening to music.", "He finished cleaning his room."], "trap": "enjoy 後面用 to，寫成 enjoy to read。"}, {"key": "verb_object_to", "name": "ask / tell / want + 人 + to V", "one": "「叫某人去做某事」，人放中間，動作用 to 加原形。", "signal": "看到 ask / tell / want / would like 後面接人 → 人的後面接 to + 原形。", "ex": ["My mother asked me to wash the dishes.", "The teacher told us to be quiet."], "trap": "中間那個人用主格，寫成 ask he to go，應該是 him。"}, {"key": "cost_take_spend_pay", "name": "cost / take / spend / pay 誰當主詞", "one": "四個中文都翻成「花」，差別只在句子開頭放的是「東西」、「事情」還是「人」。", "signal": "先看主詞是誰：主詞是東西 → cost（東西 cost 人 錢）；主詞是事情或 It ＋ 人 ＋ 時間 → take（It takes 人 時間）；主詞是人 ＋ 時間或錢 → spend（人 spend 時間／錢 on 某事）；主詞是人 ＋ 錢 ＋ for → pay（人 pay 錢 for 某物）。", "ex": ["It takes me twenty minutes to walk to school.", "I spent three hundred dollars on this book."], "trap": "主詞不是人卻用 spend，寫成 Walking there won't spend us too much time（主詞 Walking 是事情，要用 take）。"}]}, {"title": "比較", "items": [{"key": "comparative", "name": "比較級", "one": "兩個東西比一比，形容詞加 er 或前面放 more，後面接 than。", "signal": "看到 than → 前面一定是比較級；短的字加 er，三音節以上或 -ful、-ous 結尾加 more。", "ex": ["My bag is heavier than yours.", "This question is more difficult than that one."], "trap": "more 和 er 同時用，寫成 more taller。"}, {"key": "superlative", "name": "最高級", "one": "三個以上比一比，挑出最怎樣的那一個，前面要加 the。", "signal": "看到 the…est、the most、in the class、of the three → 用最高級。", "ex": ["He is the tallest boy in our class.", "This is the most interesting book I have."], "trap": "忘記加 the，或範圍介系詞用錯（地方或團體用 in、同類複數用 of）。"}, {"key": "as_as", "name": "as…as 同級比較", "one": "兩個一樣的時候用，中間一定放形容詞的原形。", "signal": "看到 as…as → 中間絕對是原級，不是 er 也不是 more；not as…as 表示「沒有那麼…」。", "ex": ["She is as tall as her sister.", "This test is not as hard as the last one."], "trap": "中間放比較級，寫成 as taller as。"}]}, {"title": "連接詞與從屬子句", "items": [{"key": "conj_because_so", "name": "because / so", "one": "because 後面接原因，so 後面接結果，中文的「因為…所以…」在英文只能留一個。", "signal": "看到 because → 後面是原因；看到 so → 後面是結果；同一句不能兩個都放。", "ex": ["I stayed home because it was raining.", "It was raining, so I stayed home."], "trap": "中文直翻，寫成 Because it was raining, so I stayed home。"}, {"key": "conj_when_if", "name": "when / if 子句用現在式表未來", "one": "講「等到…的時候」或「如果…」，這半句不可以放 will。", "signal": "看到 when / if / before / after / until 帶的那半句 → 用現在式；另外半句才放 will。", "ex": ["I will call you when I get home.", "If it rains tomorrow, we will stay home."], "trap": "兩邊都放 will，寫成 when I will get home。"}, {"key": "conj_although", "name": "although / though 與 but", "one": "表示「雖然…可是…」，一樣只能用一個。", "signal": "看到 although 或 though → 後面是讓步那半句，主句就不能再放 but。", "ex": ["Although he was tired, he kept working.", "He was tired, but he kept working."], "trap": "although 和 but 同時出現在一句裡。"}]}, {"title": "過去進行式", "items": [{"key": "past_continuous", "name": "過去進行式 was / were + V-ing", "one": "講過去某個時間點「正在做」的事，常搭配另一件突然發生的事（九下 when / while 還會再考）。", "signal": "看到 at eight last night、while、或 when + 過去式 → 用 was / were + V-ing。", "ex": ["I was taking a shower when the phone rang.", "They were playing basketball at four yesterday."], "trap": "when 後面接短動作用過去式、while 後面接長動作用進行式，兩個弄反。"}]}]}, {"title": "第四冊　八年級下", "units": [{"title": "使役動詞、感官動詞與副詞", "items": [{"key": "causative_make_let_have", "name": "make / let / have + 人 + 原形", "one": "叫人做事的三個特別動詞，後面的動作不加 to。", "signal": "看到 make、let、have 後面接人 → 人的後面直接用動詞原形，沒有 to。", "ex": ["My mother makes me clean my room every day.", "Please let me try again."], "trap": "多加 to，寫成 let me to go；但 ask、tell 就要 to，別搞混。"}, {"key": "sense_verb", "name": "感官動詞 see / hear / watch + 人 + V 或 V-ing", "one": "看到、聽到某人做某事，後面接原形表示整件事，接 ing 表示正在進行。", "signal": "看到 see / hear / watch / feel 後面接人或東西 → 接原形或 V-ing，絕對不接 to。", "ex": ["I saw him run across the street.", "I heard someone singing next door."], "trap": "加 to，寫成 I saw him to run。"}, {"key": "adverb_manner", "name": "副詞（形容詞加 -ly）", "one": "說明動作「怎麼做」的字，大部分是形容詞後面加 ly。", "signal": "要修飾名詞用形容詞；要修飾動詞、說明怎麼做 → 副詞加 ly。good 的副詞是 well，fast、hard 不變。", "ex": ["She sings beautifully.", "He drives carefully."], "trap": "用形容詞修飾動詞，寫成 He runs quick。"}]}, {"title": "代名詞與數量詞", "items": [{"key": "reflexive_pronoun", "name": "反身代名詞 myself / yourself / himself", "one": "動作的對象就是自己的時候用，也可以用來強調「親自」。", "signal": "主詞和受詞是同一個人 → 用 -self 或 -selves；by oneself 就是「獨自、自己一個人」。", "ex": ["He hurt himself while playing.", "She made the cake by herself."], "trap": "複數用單數形，寫成 themself，正確是 themselves。"}, {"key": "indefinite_other", "name": "one / another / the other / others / the others", "one": "講「這個…另一個…剩下的」的一整組字，差別在「還有沒有剩」。", "signal": "總共兩個 → one…the other；三個以上而且還有剩 → another；剩下的全部（複數）→ the others；泛指其他人 → others。", "ex": ["I have two pens. One is red, and the other is blue.", "Some students like math, and others like English."], "trap": "只剩最後一個卻用 another，兩個東西的第二個一定要 the other。"}, {"key": "possessive_pronoun", "name": "所有格代名詞 mine / yours / hers", "one": "「我的東西」講一次就好，後面不再放名詞。", "signal": "後面沒有名詞 → 用 mine、yours、his、hers、ours、theirs；後面有名詞 → 用 my、your、her。", "ex": ["This bag is mine.", "Yours is on the desk."], "trap": "兩個一起用，寫成 This is mine bag。"}, {"key": "both_either_neither", "name": "both / either / neither / all / none", "one": "講「兩個都、任一個、兩個都不」的字，後面動詞單複數要跟著變。", "signal": "both + 複數動詞；either、neither 當主詞 + 單數動詞；both…and 兩個都、either…or 二選一、neither…nor 兩個都不。", "ex": ["Both of my parents are teachers.", "Neither answer is correct."], "trap": "neither 當主詞卻配複數動詞，寫成 Neither of them are right，考卷要單數。"}]}, {"title": "常見句型與補語（含 used to、had better）", "items": [{"key": "that_clause", "name": "動詞 + that 子句", "one": "說「我覺得、我知道…」的時候，後面整句話用 that 接起來，that 常常可以省略。", "signal": "看到 think / know / believe / hope / say → 後面接一個完整句子，that 可寫可不寫。", "ex": ["I think that this movie is great.", "She knows I am busy today."], "trap": "中文「我覺得他不會來」直接翻，寫成 I think he won't come；英文習慣把 not 往前搬，要寫 I don't think he will come。"}, {"key": "object_complement", "name": "受詞補語 make / keep / find + 受詞 + 形容詞", "one": "「讓某個東西變成怎樣」的句型，受詞後面補一個形容詞。", "signal": "看到 make / keep / find / call + 受詞 → 後面補形容詞或名詞，說明它變成什麼狀態。", "ex": ["The news made me happy.", "Please keep the room clean."], "trap": "補語位置放副詞，寫成 keep the room cleanly。"}, {"key": "it_is_adj_to_v", "name": "It is + 形容詞 + to V（虛主詞）", "one": "真正的主詞是後面那個動作，因為太長所以先用 it 卡位。", "signal": "句首 It is + 形容詞 +（for 人）+ to + 原形 → 這個 it 沒有意思，只是代替後面的不定詞。", "ex": ["It is important to eat breakfast.", "It is hard for me to get up early."], "trap": "把 it 當成真的「它」去翻譯，或 for 後面用主格，寫成 for I。"}, {"key": "wh_to_v", "name": "疑問詞 + to V", "one": "「要怎麼做、該說什麼」可以縮成疑問詞加 to 加原形。", "signal": "看到 how / what / where / when + to + 原形 → 這一整串當名詞用，放在動詞後面。", "ex": ["I don't know what to say.", "Can you show me how to use it?"], "trap": "中間多放一個主詞，寫成 how I to use it。"}, {"key": "used_to", "name": "used to + 原形（以前…現在不了）", "one": "講以前的習慣或狀態，而且現在已經不是那樣了。", "signal": "used to + 原形 → 過去的習慣；be used to + V-ing → 習慣於某件事，差在有沒有 be。", "ex": ["I used to be afraid of dogs.", "He used to play the violin when he was young."], "trap": "和 be used to V-ing 混用，寫成 I am used to be afraid of dogs。"}, {"key": "had_better", "name": "had better + 原形（最好…）", "one": "給比較強的建議，不照做會有不好的結果。", "signal": "看到 had better 或縮寫 'd better → 後面動詞原形；否定是 had better not + 原形。", "ex": ["You had better see a doctor.", "We had better not be late."], "trap": "後面加 to，或把 not 放錯位置，寫成 had not better go。"}]}, {"title": "感嘆句與附和句", "items": [{"key": "exclamatory", "name": "感嘆句 What / How", "one": "表示「好…啊！」，看後面有沒有名詞決定用哪一個。", "signal": "後面有名詞 → What (a / an) + 形容詞 + 名詞；後面只有形容詞或副詞 → How + 形容詞。", "ex": ["What a beautiful day it is!", "How kind she is!"], "trap": "後面明明有名詞卻用 How，寫成 How a nice car!"}, {"key": "tag_question", "name": "附加問句", "one": "講完一句話再補一個小問句，用來確認「對吧？」。", "signal": "前面肯定 → 後面否定；前面否定 → 後面肯定；用哪個動詞跟著前面的 be、助動詞和時態走，主詞換成代名詞。", "ex": ["You are a student, aren't you?", "She didn't come, did she?"], "trap": "前面是一般動詞卻用 be 反問，寫成 He likes it, isn't he?"}, {"key": "so_do_i", "name": "So do I. / Neither do I.（附和）", "one": "別人的情況你也一樣，用倒裝的短句回應。", "signal": "前面是肯定 → So + 助動詞 + 主詞；前面是否定 → Neither + 助動詞 + 主詞，助動詞要對應原句的時態。", "ex": ["My sister likes pizza, and so do I.", "He can't swim, and neither can I."], "trap": "忘記倒裝，寫成 So I do，那是另一個意思（確實如此）。"}, {"key": "too_either", "name": "…, too / …, either（也）", "one": "「也」的兩種寫法，肯定句用 too，否定句用 either。", "signal": "句子是肯定 → 句尾 , too；句子有 not → 句尾 , either。", "ex": ["I am hungry, too.", "He doesn't like it, either."], "trap": "否定句用 too，寫成 I don't like it, too。"}]}]}, {"title": "第五冊　九年級上", "units": [{"title": "第一課　現在完成式（Have You Had Breakfast Yet?）", "items": [{"key": "present_perfect_form", "name": "現在完成式 have / has + 過去分詞", "one": "講一件事「到現在為止」已經發生或一直持續，重點不是什麼時候做，而是跟現在有關係。", "signal": "主詞是 he / she / it → has + 過去分詞；其他主詞 → have + 過去分詞。動詞要用第三態：eat-ate-eaten、go-went-gone、see-saw-seen。", "ex": ["I have finished my homework.", "She has read that book twice."], "trap": "句子裡有 yesterday、last night、two days ago、in 2020 這種明確過去時間詞，就一律用過去式，不能用完成式。"}, {"key": "perfect_already_yet_just", "name": "完成用法 already / yet / just", "one": "用來說「已經做好了」「還沒」「剛剛才」。", "signal": "already 放在 have 和過去分詞中間，用在肯定句；yet 放句尾，用在否定和疑問句；just 放 have 後面表示剛剛。", "ex": ["I have already cleaned my room.", "He hasn't come back yet."], "trap": "把 yet 放進肯定句，寫成 I have finished it yet，肯定句要用 already。"}, {"key": "perfect_ever_been_gone", "name": "經驗用法 ever / never 與 have been to", "one": "講「有沒有做過這件事」，是人生經驗，不管是什麼時候做的。", "signal": "看到 ever、never、once、twice、three times、before → have / has + 過去分詞。去過而且回來了用 have been to，去了還沒回來用 has gone to。", "ex": ["Have you ever eaten Indian food?", "I have never been to that museum."], "trap": "講自己用 have gone to，寫成 I have gone to Taipei，那表示人還在那裡，說話的不可能是自己。"}, {"key": "perfect_since_for", "name": "繼續用法 for / since 與 How long", "one": "一件事從以前開始一直到現在都還在，重點是持續了多久。", "signal": "看到 for + 一段時間（for three years）、since + 時間起點（since 2020、since I was ten）、How long have you…? → have / has + 過去分詞。", "ex": ["I have studied English for six years.", "They have lived here since last summer."], "trap": "for 和 since 弄反（for 接長度、since 接起點），或看到 since 還寫過去式。"}, {"key": "perfect_vs_past", "name": "現在完成式 vs 過去式　怎麼選", "one": "句子有講清楚是「什麼時候」發生的，就用過去式；沒講什麼時候、重點在「到現在為止」或「到現在還在」，就用現在完成式。", "signal": "看到 yesterday / last night / last week / … ago / in 2020 / just now / When did…? → 過去式；看到 for 一段時間 / since 起點 / already / yet / just / ever / never / before / 次數（twice、three times）/ How long…? → 現在完成式。", "ex": ["My father bought this car three years ago.", "My father has had this car for three years."], "trap": "句子裡已經有明確過去時間詞還用完成式，寫成 I have seen that movie last night（有 last night 就要寫 I saw that movie last night）。"}]}, {"title": "第二課　連綴動詞、情緒形容詞、so…that／too…to（The Movie Looks Exciting）", "items": [{"key": "linking_verb_adj", "name": "連綴動詞 + 形容詞（look / sound / taste / smell / feel）", "one": "這幾個動詞後面不接副詞，要接形容詞，因為它們在形容主詞的狀態。", "signal": "看到 look / sound / taste / smell / feel / become / get 後面是空格，而選項有形容詞也有副詞 → 選形容詞。", "ex": ["The soup tastes good.", "You look tired today."], "trap": "被「動詞後面加副詞」的印象拐走，寫成 The soup tastes well。"}, {"key": "linking_like_noun", "name": "look like / sound like + 名詞", "one": "後面要接名詞的時候，中間得補一個 like。", "signal": "後面是名詞（a teacher、my sister）→ 一定加 like；後面是形容詞（happy、nice）→ 不加 like。", "ex": ["She looks like her mother.", "That sounds like a good idea."], "trap": "名詞前面漏掉 like，寫成 She looks her mother。"}, {"key": "emotion_ed_ing", "name": "情緒動詞的 -ed 與 -ing", "one": "-ed 是「人覺得」，-ing 是「東西讓人覺得」。", "signal": "主詞是人、講他的感受 → -ed（interested、bored、excited、surprised）；主詞是事物或活動、講它給人的感覺 → -ing（interesting、boring、exciting）。", "ex": ["I am interested in science.", "The game was exciting."], "trap": "描述自己用 -ing，寫成 I am boring，那是「我這個人很無趣」。"}, {"key": "so_adj_that", "name": "so…that（如此…以至於）", "one": "程度誇張到造成某個結果的句型。", "signal": "看到 so + 形容詞或副詞 + that + 完整句子 → 這個句型；so 後面不能直接接名詞，那要用 such。", "ex": ["The movie was so boring that I fell asleep.", "She ran so fast that no one could catch her."], "trap": "跟 too…to 互換時忘記加 not，寫成 so heavy that I could carry it。"}, {"key": "too_to_enough", "name": "too…to 與 enough to", "one": "too…to 是「太…所以不能」，enough to 是「夠…可以」。", "signal": "看到 too + 形容詞 + to → 意思是否定；看到 形容詞 + enough + to → 意思是肯定，enough 要放形容詞後面。", "ex": ["The box is too heavy to carry.", "He is old enough to ride a bike."], "trap": "too…to 本身已經有否定的意思，再加 not 就錯了。"}]}, {"title": "第三課　被動語態（The Soldier Was Saved by a Dog）", "items": [{"key": "passive_form", "name": "被動語態 be + 過去分詞", "one": "主詞不是做動作的人，而是被動作的那個東西。", "signal": "主詞是「被做的東西」→ be + 過去分詞；be 要跟著時態變：現在 am / is / are、過去 was / were、未來 will be。", "ex": ["The classroom is cleaned every day.", "The window was broken last night."], "trap": "只寫過去分詞、忘記 be，寫成 The window broken last night。"}, {"key": "passive_by_agent", "name": "被動語態的 by + 動作者", "one": "要指出「被誰做的」，在後面加 by 再加那個人。", "signal": "看到 by + 人或動物，而且主詞是被做的東西 → 用 be + 過去分詞；動作者不知道或不重要時可以整個省略。", "ex": ["This song was written by a famous singer.", "These photos were taken by my brother."], "trap": "by 後面用主格，寫成 by he，應該是 by him。"}, {"key": "passive_neg_question", "name": "被動語態的否定、疑問與助動詞", "one": "被動句要否定或發問，動的是 be 或助動詞，過去分詞本身不變。", "signal": "否定 → be + not + 過去分詞；疑問 → 把 be 提到句首；有 will、can、must → 後面接 be + 過去分詞。", "ex": ["The homework was not finished on time.", "Can this problem be solved?"], "trap": "主動改被動時忘記換時態，或把 happen、appear 這種不及物動詞硬改成被動。"}]}, {"title": "第四課　間接問句（Do You Know Where the File Is?）", "items": [{"key": "indirect_wh", "name": "間接問句（疑問詞）", "one": "問句被塞進另一句話裡當受詞，就不再用問句的順序，要改回一般直述句的順序。", "signal": "看到 Do you know / Can you tell me / I don't know / I wonder + 疑問詞（where、what、who、when、how）→ 疑問詞後面用「主詞 + 動詞」。", "ex": ["Do you know where the library is?", "I don't know what he wants."], "trap": "後半段還維持倒裝，寫成 Do you know where is the library?"}, {"key": "indirect_yes_no", "name": "間接問句（if / whether）", "one": "原本是 Yes / No 問句時沒有疑問詞可用，就用 if 或 whether 接起來。", "signal": "原問句開頭是 be 或 do / does / did / can（要用 Yes 或 No 回答）→ 用 if 或 whether + 主詞 + 動詞。", "ex": ["I don't know if she is at home.", "Can you tell me whether the store is open?"], "trap": "直接把問句搬進去，寫成 I don't know is she at home。"}, {"key": "indirect_aux_tense", "name": "間接問句裡 do / does / did 要拿掉", "one": "變成間接問句以後助動詞會消失，時態和第三人稱的 s 要還給主要動詞。", "signal": "原句有 does → 主要動詞加 s；原句有 did → 主要動詞變過去式；助動詞本身不寫出來。", "ex": ["I don't know where he lives.", "Can you tell me what she said?"], "trap": "does 忘了拿掉，或拿掉後忘記把 s 加回動詞，寫成 where he live。"}]}, {"title": "第五課　關係代名詞主格（The Man Who Shook Hands with Me…）", "items": [{"key": "relative_who_subject", "name": "關係代名詞主格 who（人）", "one": "用一整句話當形容詞貼在某個人後面，who 代替那個人，在後面那句當主詞。", "signal": "前面是人，who 後面直接接動詞、中間沒有另一個主詞 → 主格 who，也可以用 that。", "ex": ["The boy who won the race is my neighbor.", "I like teachers who listen to students."], "trap": "who 後面又補一個主詞，寫成 The boy who he won the race。"}, {"key": "relative_which_that_subject", "name": "關係代名詞主格 which / that（事物）", "one": "同樣把一句話變成形容詞，只是形容的是東西或動物。", "signal": "前面是東西或動物、關代後面直接接動詞 → 用 which 或 that；人用 who 或 that，東西用 which 或 that。", "ex": ["I bought a bag which has two pockets.", "The bus that goes downtown is late."], "trap": "拿 who 去形容東西，或在 which 後面再放一次代名詞，寫成 a bag which it has。"}, {"key": "relative_verb_agreement", "name": "主格關代後面動詞的單複數", "one": "關代後面的動詞要跟「前面那個被形容的名詞」一致，不是跟句子最前面的主詞。", "signal": "先行詞單數 → 動詞加 s；先行詞複數 → 動詞原形；整句是過去式 → 關代後面也用過去式。", "ex": ["She is a student who studies very hard.", "These are the students who help me every day."], "trap": "只看句首主詞決定動詞，寫成 She is a student who study hard。"}, {"key": "prep_phrase_postmod", "name": "介系詞片語放名詞後面修飾（the girl in red）", "one": "一小段介系詞片語跟在名詞後面，說明「是哪一個」；跟關係子句一樣是往後修飾。", "signal": "看到 名詞 ＋ in / on / with / from / under… 一串 → 那一串是在講前面那個名詞；主詞還是前面那個名詞，動詞要跟它一致。", "ex": ["The girl in the red dress is my sister.", "The books on the desk are mine."], "trap": "動詞跟著最靠近的名詞變化，寫成 The books on the desk is mine（主詞是 books，要用 are）。"}]}, {"title": "第六課　關係代名詞受格（The Sign Which You Used Is Not OK）", "items": [{"key": "relative_whom_object", "name": "關係代名詞受格 who / whom / that（人）", "one": "被形容的那個人，在後面那句裡是「被做的對象」，所以用受格。", "signal": "關代後面還有一個「主詞 + 動詞」，而且那個動詞後面少了受詞 → 用受格 whom，口語常寫成 who 或 that。正式寫法可以用 whom；考卷上 who／that／整個省略都對。", "ex": ["The man who I met yesterday is a doctor.", "She is the friend that I trust the most."], "trap": "受格後面又補一次受詞，寫成 The man whom I met him yesterday。"}, {"key": "relative_which_object", "name": "關係代名詞受格 which / that（事物）", "one": "東西版本的受格關代，後面那句缺的是受詞。", "signal": "前面是東西、關代後面接「主詞 + 動詞」而且動詞後面空著 → 用 which 或 that。", "ex": ["The book which you lent me is very good.", "This is the song that I like best."], "trap": "動詞後面重複寫受詞，寫成 The book which you lent me it。"}, {"key": "relative_omit_object", "name": "受格關代可以省略", "one": "受格的關代整個不寫也對，但主格的不能省。", "signal": "關代後面緊接著「主詞 + 動詞」→ 可以省略；關代後面直接是動詞（那是主格）→ 不能省。", "ex": ["The movie we watched last night was scary.", "This is the bike I bought last year."], "trap": "連主格關代也省掉，寫成 The man lives next door is friendly，who 不能省。"}]}]}, {"title": "第六冊　九年級下", "units": [{"title": "連接詞進階", "items": [{"key": "correlative_both_either_neither", "name": "both…and / either…or / neither…nor", "one": "把兩樣東西綁在一起講「兩個都、二選一、兩個都不」。", "signal": "both A and B → 動詞用複數；either A or B、neither A nor B → 動詞跟「靠動詞比較近的那個」一致。", "ex": ["Both my brother and I like baseball.", "Neither he nor I am free tomorrow."], "trap": "either…or 一律用複數動詞，忘記要看靠近動詞的那個名詞。"}, {"key": "not_only_but_also", "name": "not only…but also", "one": "「不只…而且…」，前後放的東西詞性要一樣。", "signal": "看到 not only → 後面一定找得到 but also；動詞跟 but also 後面那個主詞一致。", "ex": ["She is not only smart but also kind.", "He not only sings but also plays the piano."], "trap": "前後不對稱，一邊放形容詞、一邊放整個句子。"}, {"key": "not_until", "name": "not…until（直到…才…）", "one": "中文的「才」，在英文是靠主句的 not 表現出來的。", "signal": "看到「直到…才」→ 主句一定要有 not，until 後面接時間或一個子句（講未來時用現在式）。", "ex": ["He didn't go to bed until midnight.", "I won't leave until you come back."], "trap": "漏掉 not，寫成 He went to bed until midnight。"}]}, {"title": "假設與願望（高中先修，段考不考）", "items": [{"key": "if_unreal_present", "name": "與現在事實相反的假設", "one": "講「如果我是…就會…」，其實根本不是那樣，所以動詞退一格用過去式。", "signal": "看到 If + 主詞 + 過去式（be 一律用 were）→ 主句用 would 或 could + 原形。", "ex": ["If I were you, I would tell the truth.", "If he had more time, he would learn to cook."], "trap": "跟真的可能發生的條件句混用，把 If it rains tomorrow 寫成 If it rained tomorrow。", "tag": "高中先修，段考不考"}, {"key": "wish_clause", "name": "wish + 過去式（但願）", "one": "講一件現在做不到、只能希望的事。", "signal": "看到 I wish → 後面子句動詞用過去式，be 用 were，表示跟現在事實相反。", "ex": ["I wish I could fly.", "I wish I were taller."], "trap": "wish 後面用現在式，寫成 I wish I can fly。", "tag": "高中先修，段考不考"}]}, {"title": "比較級進階", "items": [{"key": "comparative_and_comparative", "name": "比較級 and 比較級（越來越…）", "one": "同一個比較級講兩次，表示程度一直往上跑。", "signal": "看到「越來越」→ 短字用 er and er（colder and colder）；長字用 more and more + 原級。", "ex": ["The weather is getting colder and colder.", "The game became more and more popular."], "trap": "長字寫成 more colder and more colder，或短字硬套 more and more。"}, {"key": "the_more_the_more", "name": "The + 比較級, the + 比較級（越…就越…）", "one": "兩件事一起往同一個方向跑的句型。", "signal": "看到「越…越…」→ 前後兩個 the + 比較級，中間逗號分開，每半句都要有自己的主詞和動詞。", "ex": ["The more you practice, the better you get.", "The busier he is, the happier he feels."], "trap": "忘記兩邊都要加 the，或把比較級丟到句尾去。"}, {"key": "one_of_the_superlative", "name": "one of the + 最高級 + 複數名詞", "one": "「最…的其中之一」，名詞一定要複數，但整句的動詞是單數。", "signal": "看到 one of the → 後面接最高級加複數名詞；句子主詞其實是 one，所以動詞用單數。", "ex": ["This is one of the best movies I have ever seen.", "He is one of the tallest students in the class."], "trap": "名詞忘記複數，或動詞用複數，寫成 One of the students are late。", "tag": "總複習點（八年級教過）"}]}, {"title": "分詞與動名詞", "items": [{"key": "participle_adj", "name": "分詞片語修飾名詞", "one": "用一串 V-ing 或過去分詞接在名詞後面，等於省略關代的形容詞子句。", "signal": "那個名詞主動做這個動作 → 用 V-ing；名詞是被做的 → 用過去分詞；這一串直接放在名詞後面。", "ex": ["The girl sitting by the window is my cousin.", "The letter written in English is for you."], "trap": "主動被動弄反，寫成 The letter writing in English。", "tag": "閱讀看得懂就好"}, {"key": "gerund_subject", "name": "動名詞當主詞", "one": "一個動作要當句子的主詞時要變成 V-ing，而且算單數。", "signal": "句首是一個動作 → V-ing（或 To + 原形）；主詞是動名詞 → 動詞用單數 is、was。", "ex": ["Swimming is good exercise.", "Getting up early is not easy for me."], "trap": "動名詞主詞後面用複數動詞，寫成 Swimming are fun。"}]}, {"title": "關係詞進階", "items": [{"key": "relative_whose", "name": "關係代名詞所有格 whose", "one": "表示「他的、它的」，後面一定緊接一個名詞。", "signal": "關代後面直接接名詞、沒有動詞 → 用 whose，人和東西都可以用。", "ex": ["I know a boy whose father is a pilot.", "She lives in a house whose roof is red."], "trap": "寫成 who's（那是 who is），或 whose 後面漏掉名詞。"}, {"key": "relative_where_when", "name": "關係副詞 where / when", "one": "先行詞是地方就用 where、是時間就用 when，後面接的是不缺東西的完整句子。", "signal": "前面是地方（place、city、school）→ where；前面是時間（day、year、time）→ when；後面句子不缺主詞也不缺受詞。", "ex": ["This is the park where we played as kids.", "I still remember the day when we first met."], "trap": "後面句子其實缺受詞卻用 where，那種情況要用 which。"}]}, {"title": "其他常考句型", "items": [{"key": "so_that_purpose", "name": "so that（為了、以便）", "one": "表示做某件事的目的，後面接完整句子，常搭配 can 或 could。", "signal": "看到 so that → 後面是目的，常配 can / could / will；和 so…that 不同的是中間沒有形容詞。", "ex": ["I got up early so that I could catch the first bus.", "She speaks slowly so that everyone can understand."], "trap": "跟 so + 形容詞 + that（如此…以至於）搞混。"}, {"key": "phrasal_verb_separable", "name": "可分／不可分片語動詞（turn it off／look after her）", "one": "動詞加上介副詞變成一個新意思；有的受詞可以夾在中間（可分），有的不行（不可分）。", "signal": "看到 turn on/off、put on、take off、pick up、give up ＋ 代名詞 → 代名詞一定夾中間（turn it off）；看到 look after / look for / get on ＋ 受詞 → 受詞放後面、不能拆。", "ex": ["Please turn it off before you leave.", "She has to look after her little brother."], "trap": "代名詞放在可分片語動詞後面，寫成 turn off it（要寫 turn it off）。"}]}]}]}; const POINTS = ["現在完成式", "不定詞與動名詞", "被動語態", "be 動詞與一般動詞現在式", "關係代名詞 who/which/that", "過去式（規則/不規則）", "時間與條件子句（when/if 現在式代未來）", "比較級與最高級", "間接問句", "現在進行式", "未來式 be going to / will", "連綴動詞＋形容詞（sound / look / taste…）", "助動詞 can/will/should", "附加問句", "連接詞 and/but/or/because/so 與 too…to / so…that", "情緒動詞 -ed / -ing（excited / exciting）", "祈使句"];
const EXAM = [{"n": 101, "point": "cost / take / spend / pay 誰當主詞", "grade": "九上複習", "stem": "The bookstore is only two blocks away. Why don't we walk there? Walking there won't ______ us too much time.", "opts": ["cost", "pay", "spend", "take"], "ans": "D", "why": "主詞是 Walking（一件事、不是人）＋ us ＋ time → take；看到 spend 先問「主詞是人嗎」，不是人就直接刪掉。", "mapkey": "cost_take_spend_pay"}, {"n": 102, "point": "時間介系詞 in / on / at", "grade": "九上複習", "stem": "A: Ella's birthday is ______ the tenth of October.\nB: Wow, it is also our national（國家的）day.", "opts": ["for", "in", "at", "on"], "ans": "D", "why": "看到日期 the tenth of October（哪一天）→ on；只有月份 October 才 in，只有鐘點才 at。", "mapkey": "prep_time"}, {"n": 103, "point": "序數 first / second / third…（第幾）", "grade": "九上複習", "stem": "（克漏字）Welcome back to the race. As you already knew, Mama Horse won the last race. Now the second race is going to start! Here we can see five horses, and their names are Trendy, Fasty, Blue Valet, Quick Time, and Speed Fire. Among them, Fasty is the youngest horse, but Speed Fire came ______ last year. So, which horse will win the race? The race must be a really exciting one!", "opts": ["one", "the one", "first", "slowly"], "ans": "C", "why": "看到 came ＋ but 轉折 ＋ 後面在問「哪匹馬會贏」→ come first（得第一名）；came slowly 文法通但跟 but 對不上。", "mapkey": "ordinal"}, {"n": 104, "point": "介系詞固定片語 on business / on vacation / on foot / by bus", "grade": "九上複習", "stem": "（對話克漏字，In customs）\nCustoms officer: Ms. Kate Green, where are you going?\nKate: I'm going to New York ______ business.\nCustoms officer: Well, what do you do?\nKate: I'm an engineer.", "opts": ["with", "of", "in", "on"], "ans": "D", "why": "看到 go somewhere ______ business → on business（出差）；同一組還有 on vacation。", "mapkey": "prep_fixed"}]; const ALLQ = DATA.concat(EXAM); const FIX = new Set(EXAM.map(q=>q.mapkey).filter(Boolean));
const state = {};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function show(key){
  document.querySelectorAll('.set').forEach(s=>s.classList.toggle('on', s.id==='set-'+key));
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.id==='tab-'+key));
  window.scrollTo({top:0});
}

const LSW='xe_wrong_v1', DAY=86400000, today=()=>new Date(new Date().toDateString()).getTime();
function loadW(){ try{ return JSON.parse(localStorage.getItem(LSW)||'{}')||{}; }catch(e){ return {}; } }
const WRONG=loadW();
function saveW(){ try{ localStorage.setItem(LSW, JSON.stringify(WRONG)); }catch(e){} }
function recordWrong(n, ok){
  const w=WRONG[n];
  if(!ok){ WRONG[n]={n, miss:(w?w.miss:0)+1, streak:0, next:today()+2*DAY}; }
  else if(w){ w.streak=(w.streak||0)+1; if(w.streak>=2){ delete WRONG[n]; } else { w.next=today()+7*DAY; } }
  saveW(); renderWrong(); renderToday();
}
(function seed(){ let seen={}; try{ seen=JSON.parse(localStorage.getItem('xe_seeded_v1')||'{}')||{}; }catch(e){} let ch=false; EXAM.forEach(q=>{ if(seen[q.n]) return; seen[q.n]=1; ch=true; if(!WRONG[q.n]) WRONG[q.n]={n:q.n, miss:1, streak:0, next:today()}; }); if(ch){ saveW(); try{ localStorage.setItem('xe_seeded_v1', JSON.stringify(seen)); }catch(e){} } })();

  art.querySelectorAll('.opt').forEach((o,i)=>{ if('ABCD'[i]===q.ans) o.classList.add('right'); else if(o===b) o.classList.add('wrong'); });
  art.querySelector('.fb').innerHTML=`<div class="verdict ${ok?'ok':'ng'}"><span>${ok?'✓ 答對':'✗ 又錯了，2 天後再來'}</span><span class="a">答案 ${q.ans}</span></div>${q.why?`<div class="why"><b>為什麼：</b>${esc(q.why)}</div>`:''}`;

ced"}, {"en": "century", "zh": "世紀", "pos": "n.", "level": "advanced"}, {"en": "damage", "zh": "損害", "pos": "n./v.", "level": "advanced"}]};
(function(){
  if(!VOCAB || !((VOCAB.words&&VOCAB.words.length) || (VOCAB.unit&&VOCAB.unit.words&&VOCAB.unit.words.length))) return;
  const BANK=(VOCAB.words||[]).map((w,i)=>Object.assign({i},w)), UNIT=((VOCAB.unit&&VOCAB.unit.words)||[]).map((w,i)=>Object.assign({i:1e5+i,unit:1},w));
  const ALL=BANK.concat(UNIT), byEn={}; ALL.forEach(w=>byEn[w.en]=w);
  const PER=VOCAB.perDay||6, TARGET=VOCAB.target||2000, KEY='xm_vocab_v2', DAY=86400000, t0=()=>new Date(new Date().toDateString()).getTime();
  const dstr=d=>new Date(d).toISOString().slice(0,10);
  let D={known:{},S:{},intro:{},done:{},place:{i:0,list:null}}; try{ const x=JSON.parse(localStorage.getItem(KEY)||'null'); if(x&&x.S) D=Object.assign(D,x); }catch(e){}
  const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){} };
  const S=D.S, st=w=>S[w.en]||(S[w.en]={seen:0,ok:0,miss:0,streak:0,next:0});
  const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
  const accept=(en,ans)=>{ const a=norm(ans); if(!a) return false; const forms=new Set([norm(en)]); const base=norm(en).replace(/\(.*?\)/g,' ').replace(/\s+/g,' ').trim(); base.split(/[\/,;]/).forEach(x=>{ x=x.trim(); if(x) forms.add(x); }); (norm(en).match(/\((.*?)\)/g)||[]).forEach(m=>forms.add(m.slice(1,-1).trim())); return forms.has(a); };
  const rnd=(a,seed)=>{ const b=a.slice(); let s=seed%233280; for(let i=b.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
  const dayNo=Math.floor(t0()/DAY), isFri=new Date().getDay()===5, today=dstr(t0());
  const say=en=>{ try{ if(!window.speechSynthesis) return; const u=new SpeechSynthesisUtterance(String(en).replace(/\(.*?\)/g,'').split('/')[0].trim()); u.lang='en-US'; u.rate=0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} };
  const isDue=w=>S[w.en]&&S[w.en].next&&S[w.en].next<=t0();
  const dueList=()=>ALL.filter(isDue);
  const introduced=()=>BANK.filter(w=>D.intro[w.en]);
  const learned=()=>Object.keys(D.known).length + BANK.filter(w=>D.intro[w.en]&&S[w.en]&&S[w.en].ok>0).length;
  // 今天的新字：快篩標「不認得」的優先，其餘照字庫順序（基本 1200 → 常用 800），跳過認得的
  function newToday(){ const t=D.done[today]&&D.done[today].newList; if(t) return t.map(en=>byEn[en]).filter(Boolean);
    const unk=BANK.filter(w=>D.place&&D.place.unk&&D.place.unk[w.en]&&!D.intro[w.en]); const rest=BANK.filter(w=>!D.known[w.en]&&!D.intro[w.en]&&!(D.place&&D.place.unk&&D.place.unk[w.en]));
    const list=unk.concat(rest).slice(0,PER); return list; }
  function mark(w,ok){ const s=st(w); s.seen++; if(ok){ s.ok++; s.streak++; if(s.next){ if(s.streak>=2) s.next=0; else s.next=t0()+7*DAY; } } else { s.miss++; s.streak=0; s.next=t0()+2*DAY; } save(); if(typeof logEvent==='function') logEvent('vocab:'+w.en, ok?'ok':'ng', ok); }
  // tab + section
  const tabs=document.getElementById('tabs'), main=document.getElementById('main');
  const t=document.createElement('button'); t.className='tab'; t.role='tab'; t.id='tab-vocab'; t.textContent=(typeof CIRC==='string'?CIRC[tabs.querySelectorAll('.tab').length]+' ':'')+'單字'; t.setAttribute('aria-selected','false'); t.onclick=()=>show('vocab'); tabs.appendChild(t);
  const sec=document.createElement('section'); sec.className='set'; sec.id='set-vocab'; main.appendChild(sec);
  const card=(w,i,n)=>`<article class="vq"><div class="num"><span>${i+1}／${n}</span></div>`;
  function home(){
    const due=dueList().length, done=D.done[today]||{}, needPlace=VOCAB.placement&&!(D.place&&D.place.finished), nNew=newToday().length;
    let h=`<div class="setsub"><b>${esc(VOCAB.title||'一年 2000 字')}</b>　累積 <b>${learned()}</b>／${TARGET}${BANK.length?`（字庫 ${BANK.length} 字）`:''}<br>每天：${PER} 個新字 → 拼 10 個 → 選 10 個，大約 8–10 分鐘。錯的字 2 天後自己回來，對兩次就畢業。<br>今天：新字 ${done.newDone?'✓':nNew+' 個'}　到期複習 ${due} 個　${done.drill?'✓ 今天做完了':''}</div>`;
    h+=`<div class="vmenu">`;
    if(needPlace) h+=`<button class="gbtn" data-v="place">🔍 先做 200 字快篩（${(D.place&&D.place.i)||0}／200）</button>`;
    else { if(BANK.length) h+=`<button class="gbtn" data-v="new">${done.newDone?'✓ ':''}① 今天的 ${nNew} 個新字</button>`; h+=`<button class="gbtn" data-v="spell">② 拼 10 個</button><button class="gbtn" data-v="choose">③ 選 10 個</button>`; if(isFri||VOCAB.weekly) h+=`<button class="gbtn" data-v="all">📅 這週全部再考</button>`; }
    if(UNIT.length) h+=`<button class="gbtn" data-v="unit" style="background:var(--tab);color:var(--ink)">📘 ${esc(VOCAB.unit.name||'這課的單字')}（${UNIT.length}）</button>`;
    h+=`<button class="gbtn" data-v="list" style="background:var(--tab);color:var(--ink)">📖 進度表</button></div><div id="varea"></div>`;
    if(VOCAB.video&&VOCAB.video.list){ const wk=Math.max(1,Math.floor((t0()-new Date(VOCAB.video.start||'2026-09-22').getTime())/(7*DAY))+1); h+=`<div class="vvid">📺 這週的一集：<a href="https://www.youtube.com/playlist?list=${esc(VOCAB.video.list)}&index=${wk}" target="_blank" rel="noopener">${esc(VOCAB.video.name||'單字影片')} 第 ${String(wk).padStart(3,'0')} 集</a>　週末聽一遍，聽發音和例句就好。</div>`; }
    sec.innerHTML=h;
  }
  function place(){ const area=document.getElementById('varea'); if(!D.place.list){ const b=rnd(BANK.filter(w=>w.level==='basic'),20260916).slice(0,120), a=rnd(BANK.filter(w=>w.level!=='basic'),20260917).slice(0,80); D.place={i:0,list:rnd(b.concat(a),7).map(w=>w.en),unk:{},k:0}; save(); }
    const one=()=>{ const P=D.place; if(P.i>=P.list.length){ P.finished=true; save(); const pct=Math.round(100*P.k/P.list.length); const est=Math.round(BANK.length*(1-P.k/P.list.length)); area.innerHTML=`<div class="finish">🎉 快篩完成：200 個裡認得 ${P.k} 個（約 ${pct}％）<br>估計要背的大約 ${est} 個字，先從妳說「不認得」的開始。</div>`; setTimeout(home,1800); return; }

      area.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ if(b.dataset.p==='1'){ D.known[w.en]=1; P.k++; } else { P.unk[w.en]=1; } P.i++; save(); one(); }); }; one(); }
  function learn(){ const list=newToday(); const area=document.getElementById('varea'); if(!list.length){ area.innerHTML='<div class="finish">字庫的字都看過了 🎉</div>'; return; }
    D.done[today]=Object.assign(D.done[today]||{},{newList:list.map(w=>w.en)}); list.forEach(w=>{ if(!D.intro[w.en]) D.intro[w.en]=today; }); save();
    area.innerHTML=`<div class="vlearn">${list.map((w,i)=>`<div class="vcard"><div class="ven">${esc(w.en)} <span class="pt">${esc(w.pos||'')}</span> <button class="vsay" data-say="${esc(w.en)}">🔊</button></div><div class="vzh">${esc(w.zh)}</div></div>`).join('')}</div><div style="font-size:13px;color:var(--mute);margin:6px 0">每個字：按 🔊 聽一次、跟著唸一次、看中文。</div><button class="gbtn" data-v="newdone">都看過了 → 去拼 ②</button>`; }
  function spell(list,after){ const area=document.getElementById('varea'); let i=0, ok=0; const one=()=>{ if(i>=list.length){ area.innerHTML=`<div class="finish">🎉 拼完了：${ok}／${list.length}${ok<list.length?'　拼錯的字 2 天後會回來':''}</div>${after?`<button class="gbtn" data-v="${after}">下一步 →</button>`:''}`; return; } const w=list[i];
      area.innerHTML=`<article class="vq"><div class="num"><span>${i+1}／${list.length}</span></div><div class="stem" style="font-size:20px">${esc(w.zh)}${w.pos?` <span class="pt">${esc(w.pos)}</span>`:''}</div><input class="ansin" id="vin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="拼出英文，按 Enter"><div class="fb"></div></article>`;
      const inp=document.getElementById('vin'); inp.focus(); inp.onkeydown=e=>{ if(e.key!=='Enter') return; const good=accept(w.en,inp.value); mark(w,good); if(good) ok++; inp.disabled=true; say(w.en); area.querySelector('.fb').innerHTML=`<div class="verdict ${good?'ok':'no ng'}"><span>${good?'✓ 對了':'✗ 是 <b>'+esc(w.en)+'</b>'}</span></div><button class="gbtn" id="vnext">下一個 →</button>`; const nb=document.getElementById('vnext'); nb.focus(); nb.onclick=()=>{ i++; one(); }; }; }; one(); }
  function choose(list,after){ const area=document.getElementById('varea'); let i=0, ok=0; const pool=ALL.length>=4?ALL:BANK; const one=()=>{ if(i>=list.length){ area.innerHTML=`<div class="finish">🎉 選完了：${ok}／${list.length}</div>`; if(after==='done'){ D.done[today]=Object.assign(D.done[today]||{},{drill:true}); save(); setTimeout(home,1500); } return; } const w=list[i]; const others=rnd(pool.filter(x=>x.en!==w.en&&x.zh!==w.zh),dayNo+i).slice(0,3); const opts=rnd([w].concat(others),dayNo*7+i);
      area.innerHTML=`<article class="vq"><div class="num"><span>${i+1}／${list.length}</span></div><div class="stem" style="font-size:22px">${esc(w.en)}${w.pos?` <span class="pt">${esc(w.pos)}</span>`:''} <button class="vsay" data-say="${esc(w.en)}">🔊</button></div><div class="vopts">${opts.map((o,k)=>`<button class="vopt" data-k="${k}">${esc(o.zh)}</button>`).join('')}</div><div class="fb"></div></article>`; say(w.en);
      area.querySelectorAll('.vopt').forEach(b=>b.onclick=()=>{ const good=opts[+b.dataset.k].en===w.en; mark(w,good); if(good) ok++; area.querySelectorAll('.vopt').forEach((x,k)=>{ x.disabled=true; if(opts[k].en===w.en) x.classList.add('right'); else if(x===b) x.classList.add('wrong'); }); area.querySelector('.fb').innerHTML=`<button class="gbtn" id="vnext">下一個 →</button>`; document.getElementById('vnext').onclick=()=>{ i++; one(); }; }); }; one(); }
  function drillList(n){ const nw=(D.done[today]&&D.done[today].newList||[]).map(en=>byEn[en]).filter(Boolean); const due=dueList().filter(w=>!nw.includes(w)); const old=introduced().filter(w=>!nw.includes(w)&&!due.includes(w)); return nw.concat(rnd(due,dayNo), rnd(old,dayNo+3)).slice(0,n); }

    else if(m==='unitspell') spell(rnd(UNIT,dayNo).slice(0,10)); else if(m==='unitchoose') choose(rnd(UNIT,dayNo+1).slice(0,10));
    else if(m==='list'){ const rows=BANK.filter(w=>D.known[w.en]||D.intro[w.en]); document.getElementById('varea').innerHTML=`<div style="font-size:13px;color:var(--mute);margin:6px 0">認得 ${Object.keys(D.known).length}・學過 ${introduced().length}・到期 ${dueList().length}・連續天數 ${Object.keys(D.done).filter(k=>D.done[k].drill).length} 天有做</div><table class="vt"><thead><tr><th>英文</th><th>中文</th><th>狀態</th></tr></thead><tbody>${rows.slice(-120).reverse().map(w=>{ const s=S[w.en]; return `<tr><td>${esc(w.en)}</td><td>${esc(w.zh)}</td><td>${D.known[w.en]?'認得':(!s?'新':(isDue(w)?'到期':(s.next?'回來中':(s.ok>=2?'畢業':'學過'))))}</td></tr>`; }).join('')}</tbody></table>`; } });
  home();
})();
