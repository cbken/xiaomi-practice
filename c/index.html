直角對直角、相等的銳角對相等的銳角、剩下的對剩下的。順序寫對，比例式就是把對應的邊照順序放：AP：RQ＝PS：QC＝AS：RC。", "recap": "相似的字母順序＝對應關係，比例照順序寫。", "confirm": {"q": "△APS ∼ △RQC，P 對到誰？為什麼？", "a": "Q，因為兩個都是直角。"}, "retest": {"q": "△ABC ∼ △DEF，AB 對哪一邊？BC 對哪一邊？", "a": "AB 對 DE，BC 對 EF。"}, "jingle": "相似照順序，字母對字母", "alt": "寫 △ABC ∼ △DEF 的時候，字母的位置就是在講對應：A 配 D、B 配 E、C 配 F。所以邊也照順序配：AB 對 DE、BC 對 EF、AC 對 DF。配對的方法是先找「一定對得上」的角——直角對直角、相等的銳角對相等的銳角、共用的角對共用的角，剩下的就是最後一組。順序寫反，比例式整個顛倒，答案就會錯。", "pre": [{"q": "△ABC ∼ △DEF，B 對到哪一點？", "a": "E。"}, {"q": "那 AB 對到哪一邊？", "a": "DE。"}], "widget": "sim_order", "ask": "我卡在【相似要照對應順序寫】，可以教我嗎？", "signal": {"see": "要寫 △ ∼ △ 這個式子", "think": "字母順序就是對應關係", "do": "先配直角對直角、再配相等的銳角，剩下的是最後一組；比例式照這個順序寫"}}, "collinear": {"name": "先看哪些點在同一條線上", "teach": "寫比例前要先確定「哪幾個點在同一條直線上」，線段才能加減。例：D、H、G、C 都在 DC 這條邊上，所以 DG＝DC－CG，DH＋HG＝DG。", "recap": "同一直線上的點，線段可以加減。", "confirm": {"q": "G 在 DC 上、CG＝3、DC＝9，DG 多長？", "a": "6"}, "retest": {"q": "B、C、D 在一直線上，BC＝8、CD＝5，BD 多長？", "a": "13"}, "jingle": "同一條線上，線段能加減", "alt": "只有「在同一條直線上」的點，線段才能直接加減。所以寫比例式之前，第一件事是看圖確認哪幾個點排在同一條線上，把每一小段的長度標在圖上。像 B、C、D 在一直線上，BD 就是 BC＋CD——最常錯的是把 BD 當成 BC 或 CD 其中一段。", "pre": [{"q": "B、C、D 在同一條線上，BC＝8、CD＝5，BD 多長？", "a": "13（8＋5）。"}, {"q": "G 在 DC 上，DC＝9、CG＝3，DG 多長？", "a": "6（9－3）。"}], "widget": "collinear", "ask": "我卡在【先看哪些點在同一條線上】，可以教我嗎？", "signal": {"see": "圖上有三個以上的點排在同一條線上", "think": "線段可以加減（整段 ＝ 兩小段相加）", "do": "先把每一小段的長度標到圖上，再寫比例式"}}, "ratio3_def": {"name": "連比 a：b：c 的意思", "teach": "連比就是「三個量一起比」。像調飲料：紅茶：牛奶：糖漿＝2：3：5，意思是每次都照這個份數倒——2 杯紅茶配 3 杯牛奶配 5 杯糖漿。不是只比兩個，是三個同時對得起來。所以 2：3：5 也可以是 4：6：10、20：30：50，只要三個一起同倍放大就行。", "recap": "連比＝三個量同時比，可以三個一起同倍放大縮小。", "confirm": {"q": "紅：黃：藍＝2：3：5，一共 30 顆珠子，藍色幾顆？", "a": "15 顆（總份數 2＋3＋5＝10，一份 3 顆，藍 5 份＝15）。"}, "retest": {"q": "a：b：c＝1：2：4，已知 a＝3，那 b 和 c 各是多少？", "a": "b＝6、c＝12（三個一起乘 3）。"}, "jingle": "三個量一起比，份數對得起", "alt": "換個角度看：連比是把兩個比「黏」成一串。a：b：c 這一串裡面，同時藏著 a：b、b：c、a：c 三個比，你要哪個就從裡面抽哪兩個出來。例如 2：3：5 裡，a：b＝2：3、b：c＝3：5、a：c＝2：5。而且整串同時乘同一個數，三個關係都不會壞掉。", "pre": [{"q": "2：3 是什麼意思？", "a": "第一個量有 2 份時，第二個量有 3 份。"}, {"q": "2：3 跟 4：6 一樣嗎？", "a": "一樣，兩邊同時乘 2 比值不變。"}], "signal": {"see": "題目出現三個東西的比，中間有兩個冒號，像「2：3：5」", "think": "這是三個量同時比，可以三個一起同倍放大", "do": "先把三個數字加起來當總份數，再算一份是多少"}, "widget": "ratio3_def", "ask": "我卡在【連比 a：b：c 的意思】，可以教我嗎？"}, "ratio3_merge": {"name": "兩個比合併成連比", "teach": "題目給你 a：b＝2：3、b：c＝4：5，兩句話都提到 b，但一個說 b 是 3 份、一個說 b 是 4 份——單位不一樣，不能直接串起來。做法跟通分一模一樣：把 b 化成 3 和 4 的最小公倍數 12。第一個比整組乘 4 變成 8：12，第二個比整組乘 3 變成 12：15，b 對齊了，就串成 a：b：c＝8：12：15。", "recap": "把兩個比裡共同的那個字化成一樣大（取最小公倍數），再串起來。", "confirm": {"q": "a：b＝2：3、b：c＝4：5，為什麼要把 b 化成 12？", "a": "因為 3 和 4 的最小公倍數是 12，b 兩邊一樣大才能串成一串。"}, "retest": {"q": "a：b＝3：4、b：c＝6：7，合併成連比是多少？", "a": "9：12：14（b 化成 12：前面乘 3 得 9：12，後面乘 2 得 12：14）。"}, "jingle": "中間那個字，化成一樣大", "alt": "把它想成兩張齒輪圖要接在一起。左邊那組寫著「a 轉 2 圈、b 轉 3 圈」，右邊那組寫著「b 轉 4 圈、c 轉 5 圈」。b 是同一個齒輪，卻被記成兩種圈數，所以要找一個 b 兩邊都能達到的圈數——12。左邊整組放大 4 倍、右邊整組放大 3 倍，b 都變成 12，三個齒輪就接起來了：8：12：15。重點：放大時「整組一起乘」，不能只乘 b。", "pre": [{"q": "3 和 4 的最小公倍數是多少？", "a": "12。"}, {"q": "2：3 兩邊同時乘 4，變成什麼？", "a": "8：12。"}], "signal": {"see": "題目給兩個比，而且同一個字母（或同一個東西）在兩個比裡都出現", "think": "共同的那個要先化成一樣的數字才能串起來", "do": "找共同項兩邊數字的最小公倍數，各自整組乘上去，再串成三個數"}, "widget": "ratio3_merge", "ask": "我卡在【兩個比合併成連比】，可以教我嗎？"}, "ratio3_k": {"name": "連比例式設 k", "teach": "看到 a：b：c＝2：3：5，最好用的一招是「設一份是 k」：a＝2k、b＝3k、c＝5k。這樣三個未知數瞬間變成一個未知數 k，題目給的條件（總和多少、相差多少）就能直接列成一條方程式。例如總和是 60，就是 2k＋3k＋5k＝10k＝60，k＝6，馬上得 a＝12、b＝18、c＝30。", "recap": "設一份為 k，a＝2k、b＝3k、c＝5k，三個未知數變一個。", "confirm": {"q": "a：b：c＝2：3：5 且 a＋b＋c＝60，求 b。", "a": "b＝18（10k＝60，k＝6，b＝3k＝18）。"}, "retest": {"q": "x：y：z＝1：3：4，且 z－x＝12，求 y。", "a": "y＝12（4k－1k＝3k＝12，k＝4，y＝3k＝12）。"}, "jingle": "一份設成 k，三個變一個", "alt": "k 就是「一份有多大」。比例只告訴你「誰是幾份」，沒告訴你「一份多少」，缺的就是 k。所以先把三個量都寫成份數乘 k，再用題目那句多出來的話（總和是…、差是…、其中一個是…）把 k 解出來。解出 k 之後不要停——題目問誰，就把誰的份數乘回 k。最常見的錯就是算出 k＝6 就交卷，忘了乘回去。", "pre": [{"q": "如果一份是 4，3 份是多少？", "a": "12。"}, {"q": "2k＋3k＋5k 合併同類項等於多少？", "a": "10k。"}], "signal": {"see": "題目給一個比，又給「總和是…」「相差…」「其中一個是…」這種一句話", "think": "設一份為 k，把每個量寫成幾 k", "do": "列出含 k 的方程式解 k，再把 k 乘回題目問的那一份"}, "widget": "ratio3_k", "ask": "我卡在【連比例式設 k】，可以教我嗎？"}, "propseg_def": {"name": "比例線段（四條線段成比例）", "teach": "四條線段 a、b、c、d，如果 a：b＝c：d，就說這四條線段「成比例」。比例線段最好用的性質是交叉相乘：a：b＝c：d 等價於 ad＝bc。例如 2：3＝4：6，交叉相乘 2×6＝12、3×4＝12，相等所以真的成比例。以後看到比例式要解未知數，通通用交叉相乘變成方程式。", "recap": "a：b＝c：d ⟺ ad＝bc（交叉相乘）。", "confirm": {"q": "2：3 和 4：6 成比例嗎？用交叉相乘檢查。", "a": "成比例（2×6＝12，3×4＝12，兩邊相等）。"}, "retest": {"q": "3：x＝6：10，求 x。", "a": "x＝5（交叉相乘 3×10＝6x，30＝6x，x＝5）。"}, "jingle": "四線成比例，交叉相乘看", "alt": "把比例式想成一個天平。a：b＝c：d 的意思是「a 對 b 的胖瘦程度」和「c 對 d 的胖瘦程度」一模一樣。要檢查有沒有一樣，最快的方法不是算除法（常常除不盡），而是把外側兩個相乘、內側兩個相乘，看兩個乘積等不等。外×外＝內×內，就是成比例；有一個是未知數，這條式子就變成你要解的方程式。", "pre": [{"q": "1：2＝3：6 對嗎？", "a": "對，兩邊比值都是 1/2。"}, {"q": "2x＝10，x 是多少？", "a": "5。"}], "signal": {"see": "題目列出一條有冒號（或分數）的等式，裡面有一個未知數", "think": "交叉相乘可以把比例式變成方程式", "do": "外側兩個相乘等於內側兩個相乘，解出未知數"}, "widget": "propseg_def", "ask": "我卡在【比例線段（四條線段成比例）】，可以教我嗎？"}, "par_prop": {"name": "平行線截比例線段", "teach": "△ABC 裡，D 在 AB 上、E 在 AC 上，只要 DE ∥ BC，就有 AD：DB＝AE：EC。可以想成一把平行的刀橫切三角形：刀切得高，左右兩邊被切掉的比例一樣多；刀往下移，兩邊的比例還是同步變。左右永遠同進同退，這就是「平行線截出比例線段」。", "recap": "DE ∥ BC → 左右兩邊被切成一樣的比：AD：DB＝AE：EC。", "confirm": {"q": "△ABC 中 DE ∥ BC，AD＝4、DB＝2、AE＝6，求 EC。", "a": "EC＝3（AD：DB＝4：2＝2：1，所以 6：EC＝2：1，EC＝3）。"}, "retest": {"q": "△ABC 中 DE ∥ BC，AD＝3、DB＝6、AE＝2，求 EC。", "a": "EC＝4（3：6＝1：2，所以 2：EC＝1：2，EC＝4）。"}, "jingle": "平行一刀切，兩邊比相等", "alt": "另一種看法是相似三角形。DE ∥ BC 會讓 ∠ADE＝∠ABC（同位角），再加上共用的 ∠A，所以 △ADE ∼ △ABC，對應邊成比例 AD：AB＝AE：AC。這個叫「上比全」。而 AD：DB＝AE：EC 叫「上比下」。兩種都對，但要小心別混：AB 是整條，DB 只是下半段，代數字前先看清楚題目給的是整條還是半條。", "pre": [{"q": "DE ∥ BC 時，∠ADE 和 ∠ABC 是什麼角？", "a": "同位角，所以相等。"}, {"q": "AD＝4、DB＝2，AD：DB 化簡是多少？", "a": "2：1。"}], "signal": {"see": "三角形圖裡有一條線跟底邊畫成平行（標「∥」或看起來平行）", "think": "被切開的左右兩邊比例一樣", "do": "寫 AD：DB＝AE：EC，代入已知數字交叉相乘求未知邊"}, "widget": "par_prop", "ask": "我卡在【平行線截比例線段】，可以教我嗎？"}, "par_prop_conv": {"name": "比例線段逆定理（比相等就平行）", "teach": "上一招是「先平行，才有比相等」。逆定理反過來走：如果 D 在 AB 上、E 在 AC 上，而且 AD：DB＝AE：EC，那 DE 一定平行 BC。用途是「證明平行」——題目要你證某兩條線平行時，不用去量角度，只要算出兩邊被切的比一樣就好了。", "recap": "AD：DB＝AE：EC → DE ∥ BC（比相等就平行）。", "confirm": {"q": "△ABC 中 D 在 AB 上、E 在 AC 上，AD：DB＝2：1，AE＝6、EC＝3。DE 和 BC 是什麼關係？", "a": "平行（AE：EC＝6：3＝2：1，和 AD：DB 相等，由逆定理得 DE ∥ BC）。"}, "retest": {"q": "AB＝10、AD＝4；AC＝15、AE＝6。DE 和 BC 平行嗎？", "a": "平行（DB＝6、EC＝9，AD：DB＝4：6＝2：3，AE：EC＝6：9＝2：3，兩比相等）。"}, "jingle": "比一樣，就平行", "alt": "把它想成「兩個人爬樓梯」。D 沿著 AB 爬、E 沿著 AC 爬，只要兩個人爬的「進度百分比」一樣，他們手上拉的那條繩子 DE 就會保持水平（平行 BC）。有一個人爬快了，繩子就歪掉。所以要證平行，就是證兩人進度相同——算出兩個比，化到最簡看是不是同一個比。注意兩個比要「同方向」：都寫成上：下，或都寫成上：全，不能一個上：下、一個上：全。", "pre": [{"q": "AB＝10、AD＝4，DB 是多少？", "a": "6。"}, {"q": "4：6 和 6：9 化到最簡各是多少？", "a": "都是 2：3。"}], "signal": {"see": "題目給了四段長度，要你「判斷」或「證明」兩條線平不平行", "think": "算兩邊被切的比，一樣就平行", "do": "兩個比都化成最簡，相同就寫「由平行線截比例線段的逆定理，DE ∥ BC」"}, "widget": "par_prop_conv", "ask": "我卡在【比例線段逆定理（比相等就平行）】，可以教我嗎？"}, "midseg": {"name": "三角形中點連線定理", "teach": "△ABC 裡，D 是 AB 的中點、E 是 AC 的中點，把 D、E 連起來，會得到兩件事：DE ∥ BC，而且 DE＝BC 的一半。這是上一個定理的特例——中點就是把兩邊都切成 1：1，比相等所以平行；長度則剛好縮一半。不管三角形被拉成什麼奇怪的形狀，這兩件事都不會變。", "recap": "兩邊中點連起來：平行第三邊，長度是它的一半。", "confirm": {"q": "△ABC 中 D、E 分別是 AB、AC 的中點，BC＝10，求 DE，並說 DE 和 BC 的關係。", "a": "DE＝5，且 DE ∥ BC。"}, "retest": {"q": "D、E 是 AB、AC 的中點，DE＝7，求 BC。", "a": "BC＝14（中點連線是第三邊的一半，所以第三邊是它的兩倍）。"}, "jingle": "中點連中點，平行又一半", "alt": "反過來想比較有感覺：△ADE 就是 △ABC 縮小一半的版本。因為 AD 是 AB 的一半、AE 是 AC 的一半，兩邊都縮一半又共用 ∠A，所以 △ADE ∼ △ABC，相似比 1：2。相似比 1：2 代表「每一條對應邊都是一半」，DE 當然也是 BC 的一半。考題常反過來給你 DE 問 BC，這時要乘 2，不是除 2——先確認題目給的是小的還是大的。", "pre": [{"q": "D 是 AB 的中點，AD：DB 是多少？", "a": "1：1。"}, {"q": "10 的一半是多少？7 的兩倍是多少？", "a": "5；14。"}], "signal": {"see": "圖上兩條邊的正中間各有一個點（或題目寫「中點」），兩點被連起來", "think": "中點連線平行第三邊，而且是第三邊的一半", "do": "給第三邊就除以 2，給連線就乘以 2；要證平行直接引中點連線定理"}, "widget": "midseg", "ask": "我卡在【三角形中點連線定理】，可以教我嗎？"}, "par_equal": {"name": "平行線截等長線段", "teach": "好幾條互相平行、而且間距都相等的線（像筆記本的橫線），拿任何一條斜線去穿過它們，被切出來的每一段都一樣長。斜線畫得越斜，每一段都會一起變長，但彼此還是相等。這就是為什麼老師教「把一條線段五等分」時，會先畫一排等距的平行線去截它。", "recap": "等距平行線截任何一條直線，切出來的各段等長。", "confirm": {"q": "三條等距的平行線截一條斜線，上面那段長 5，下面那段多長？", "a": "5（等距平行線截出的各段等長）。"}, "retest": {"q": "四條等距平行線截一條斜線，切成 3 段，全長 18，每段多長？", "a": "6（三段等長，18÷3＝6）。"}, "jingle": "等距平行線，切出等長段", "alt": "換個角度：這是「平行線截比例線段」的等份版。平行線本來就會讓被截的兩條線按同樣的比例分開，現在其中一條線被分成 1：1：1，那另一條也一定是 1：1：1。所以重點不是線有多斜，而是平行線之間「等距」這件事。如果平行線間距不相等，同一條斜線上切出來的各段就不相等了；但換另一條斜線去截，兩條斜線上被切出的比例還是一樣的——這是最常被考的陷阱。", "pre": [{"q": "筆記本的橫線彼此是什麼關係？", "a": "平行，而且間距相等。"}, {"q": "18 平分成 3 段，一段多長？", "a": "6。"}], "signal": {"see": "圖上好幾條平行線，而且相鄰的間隔畫得一樣寬，有一條斜線穿過去", "think": "被切出來的每一段都一樣長", "do": "把總長除以段數，或直接把已知的那一段抄到其他段"}, "widget": "par_equal", "ask": "我卡在【平行線截等長線段】，可以教我嗎？"}, "inner_pt": {"name": "內分點", "teach": "P 在線段 AB 上（在 A、B 之間），把 AB 分成 AP：PB＝m：n，就說 P 是 AB 的「m：n 內分點」。算法就是分份數：總份數 m＋n，AP 拿走前面 m 份，所以 AP＝AB×m/(m＋n)。例如 AB＝12、要 1：2 內分，總份數 3，AP＝12×1/3＝4，P 就落在離 A 四格的地方。", "recap": "AP＝AB×m/(m＋n)，前面幾份就乘幾，分母是總份數。", "confirm": {"q": "數線上 A＝0、B＝12，P 是 AB 的 1：2 內分點，P 的座標是多少？", "a": "4（AP＝12×1/3＝4，從 A＝0 走 4 格）。"}, "retest": {"q": "數線上 A＝2、B＝14，P 把 AB 分成 AP：PB＝1：3，P 的座標是多少？", "a": "5（AB＝12，AP＝12×1/4＝3，座標 2＋3＝5）。"}, "jingle": "全長乘上：前面幾份÷總份數", "alt": "把它想成走路。你從 A 走到 B，全程被分成 m＋n 步的份量，P 就是你走完「前 m 份」停下來的位置。所以先問「全長多少」，再問「總共幾份」，最後「走幾份」。最容易錯兩個地方：一是分母寫成 m（要寫 m＋n），二是忘了 P 的座標不是 AP，要從 A 的座標加上去——A 不是 0 的時候特別容易漏。", "pre": [{"q": "把 12 分成 1：2，前面那份是多少？", "a": "4（總共 3 份，一份 4）。"}, {"q": "數線上 A＝2、B＝14，AB 的長度是多少？", "a": "12（14－2）。"}], "signal": {"see": "題目說某個點在線段「上」（在兩端點之間），並給一個比像「AP：PB＝1：3」", "think": "分份數：全長除以總份數，再乘前面的份數", "do": "AP＝AB×m/(m＋n)，再從 A 的座標加上 AP 得到 P"}, "widget": "inner_pt", "ask": "我卡在【內分點】，可以教我嗎？"}, "sim_def": {"name": "相似的定義", "teach": "兩個圖形相似，就是「形狀一樣、大小可以不一樣」——像同一張照片印成大張和小張。數學上要同時滿足兩件事：對應角都相等（形狀沒歪），對應邊成比例（每條邊都放大同樣的倍數）。符號寫 △ABC ∼ △DEF，字母的順序就是對應關係：A 對 D、B 對 E、C 對 F。", "recap": "相似＝對應角相等＋對應邊成比例，寫的時候字母要對齊。", "confirm": {"q": "△ABC ∼ △DEF，AB＝4、DE＝6、BC＝6，求 EF。", "a": "EF＝9（相似比 AB：DE＝4：6＝2：3，所以 6：EF＝2：3，EF＝9）。"}, "retest": {"q": "△ABC ∼ △PQR，∠B＝70°、AB＝3、PQ＝9。∠Q 幾度？相似比多少？", "a": "∠Q＝70°，相似比 1：3。"}, "jingle": "角要一樣，邊要成比例", "alt": "跟「全等」比較就清楚了：全等是形狀一樣、大小也一樣（影印 100%）；相似是形狀一樣、大小可以縮放（影印 200%）。影印放大時，角度不會跑掉，每條邊卻都乘同一個倍數——這個倍數就是相似比。所以拿到相似題，第一件事是找出相似比（用一組已知的對應邊算），第二件事是把相似比套到題目問的那一組邊上。", "pre": [{"q": "△ABC ∼ △DEF 時，AB 的對應邊是哪一條？", "a": "DE（字母順序對字母順序）。"}, {"q": "4：6 化到最簡是多少？", "a": "2：3。"}], "signal": {"see": "題目出現「∼」符號，或圖上兩個一大一小、長得一樣的圖形", "think": "對應角相等、對應邊成比例", "do": "照字母順序配對，用已知的一組對應邊算出相似比，再套到要求的邊"}, "widget": "sim_def", "ask": "我卡在【相似的定義】，可以教我嗎？"}, "sim_area": {"name": "相似比、周長比、面積比", "teach": "兩個相似圖形的相似比是 k，那周長比也是 k，但面積比是 k²。想想影印放大 2 倍：每條邊變 2 倍，一圈繞下來的周長當然也是 2 倍；可是面積是「長×寬」，兩個方向都變 2 倍，所以變 4 倍。邊長 ×k 兩次，面積就 ×k²。", "recap": "邊 k 倍、周長 k 倍、面積 k² 倍。", "confirm": {"q": "兩個相似三角形相似比 2：3，小的面積 8，大的面積多少？", "a": "18（面積比 2²：3²＝4：9，8：x＝4：9，x＝18）。"}, "retest": {"q": "兩個相似三角形面積比 9：25，相似比是多少？", "a": "3：5（面積比開平方，√9：√25＝3：5）。"}, "jingle": "邊 k 倍，面積 k 平方倍", "alt": "用格子紙最好懂。畫一個 1×1 的小正方形，面積 1 格；放大 3 倍變成 3×3，數一數是 9 格，不是 3 格。因為長也變 3 倍、寬也變 3 倍，3×3＝9。反過來，如果題目給的是面積比要你回推相似比，就要「開平方」：面積比 9：25 → 相似比 3：5。記住方向——邊到面積是平方，面積到邊是開根號。", "pre": [{"q": "邊長 3 的正方形面積多少？邊長 6 呢？", "a": "9 和 36（面積變 4 倍，不是 2 倍）。"}, {"q": "√9 和 √25 各是多少？", "a": "3 和 5。"}], "signal": {"see": "題目同時提到「相似」和「面積」（或周長），給其中一個要另一個", "think": "周長跟邊同比，面積是比的平方", "do": "邊比求面積比就平方；面積比求邊比就開平方；周長直接用邊比"}, "widget": "sim_area", "ask": "我卡在【相似比、周長比、面積比】，可以教我嗎？"}, "SAS_sim": {"name": "SAS 相似", "teach": "不用量三個角也不用量三條邊，只要「兩組對應邊成比例，而且它們夾的那個角相等」，兩個三角形就相似。關鍵字是「夾」——那個角必須被那兩條邊夾在中間，不能是旁邊的角。像是用兩根固定角度的筷子擺 V 字，兩根同時放大同樣倍數、夾角不動，擺出來的形狀就一模一樣。", "recap": "兩邊成比例＋夾角相等 → 相似（SAS）。", "confirm": {"q": "△ABC 中 AB＝4、AC＝6、∠A＝50°；△DEF 中 DE＝6、DF＝9、∠D＝50°。兩個三角形相似嗎？為什麼？", "a": "相似（AB：DE＝4：6＝2：3，AC：DF＝6：9＝2：3，兩比相等且夾角 ∠A＝∠D＝50°，符合 SAS 相似）。"}, "retest": {"q": "△ABC 中 AB＝3、AC＝5、∠A＝60°；△DEF 中 DE＝6、DF＝10、∠D＝60°。相似嗎？相似比多少？", "a": "相似，相似比 1：2（3：6＝5：10＝1：2，夾角都是 60°）。"}, "jingle": "兩邊成比例，夾角要相等", "alt": "想像一把剪刀。剪刀的兩片就是那兩條邊，中間的轉軸就是夾角。只要角度卡在 50° 不動，把兩片同時換成 1.5 倍長的，剪刀張開的形狀完全一樣，只是變大——這就是相似。反過來，如果只有兩邊成比例但角度不同，剪刀張開的樣子就變了，兩個三角形就不相似。所以寫證明時一定要指明「夾角」相等，光說有一個角相等不夠。", "pre": [{"q": "4：6 和 6：9 化到最簡各是多少？", "a": "都是 2：3。"}, {"q": "AB 和 AC 這兩條邊夾住的角是哪一個？", "a": "∠A。"}], "signal": {"see": "題目給兩個三角形各兩條邊的長度，還給一個角度（而且這角剛好在那兩條邊中間）", "think": "兩邊成比例、夾角相等就相似", "do": "算兩組邊的比化到最簡，確認相等，再確認相等的角是被夾的那個，寫 SAS 相似"}, "widget": "SAS_sim", "ask": "我卡在【SAS 相似】，可以教我嗎？"}, "SSS_sim": {"name": "SSS 相似", "teach": "如果兩個三角形的三組對應邊都成比例，完全不用管角度，它們就一定相似。因為三邊的長度比一旦固定，形狀就被鎖死了，角度只能跟著長那樣。例如 3、4、5 和 6、8、10：3：6＝4：8＝5：10＝1：2，三個比都一樣，所以相似，相似比 1：2。", "recap": "三組對應邊都成比例 → 相似（SSS）。", "confirm": {"q": "三邊 3、4、5 的三角形和三邊 6、8、10 的三角形相似嗎？相似比多少？", "a": "相似，相似比 1：2（3：6、4：8、5：10 都等於 1：2）。"}, "retest": {"q": "三邊 4、6、8 和三邊 6、9、12 的兩個三角形相似嗎？", "a": "相似（4：6、6：9、8：12 都等於 2：3）。"}, "jingle": "三邊同比例，形狀就一樣", "alt": "用三根吸管做實驗就懂了。拿 3、4、5 公分的吸管接成三角形，形狀是唯一的，你怎麼扳都扳不成別的樣子。換成 6、8、10 公分，也是唯一的形狀，而且剛好是前面那個的放大版。所以三邊比例一確定，角度就沒有選擇了。做題時的重點是「對應」：要先把兩個三角形的邊各自從小排到大，再一組一組去比，不能照題目給的順序亂配。", "pre": [{"q": "3：6、4：8、5：10 化到最簡各是多少？", "a": "都是 1：2。"}, {"q": "比較兩個三角形的邊時，該怎麼配對？", "a": "各自從小排到大，最小配最小、最大配最大。"}], "signal": {"see": "題目給兩個三角形的三條邊長，一個角度都沒給", "think": "沒角度就比三組邊的比", "do": "兩組邊各自由小排到大配對，算三個比化到最簡，全部相同就是 SSS 相似"}, "widget": "SSS_sim", "ask": "我卡在【SSS 相似】，可以教我嗎？"}, "sim_height": {"name": "對應高、中線、角平分線的比", "teach": "兩個三角形相似、相似比是 k，那不只三條邊是 k 倍，「裡面畫出來的線」也全都是 k 倍——對應的高、對應的中線、對應的角平分線都一樣。道理很簡單：整張圖是同一個放大鏡放大出來的，圖上每一條線段都被放大同樣的倍數，沒有東西會例外。", "recap": "相似比 k → 對應高、對應中線、對應角平分線的比也都是 k。", "confirm": {"q": "兩個相似三角形相似比 2：3，小三角形某條高是 4，大三角形對應的高多長？", "a": "6（4：x＝2：3，x＝6）。"}, "retest": {"q": "兩個相似三角形的對應中線是 5 和 15，它們的相似比和面積比各是多少？", "a": "相似比 1：3，面積比 1：9。"}, "jingle": "高中線角平分，都跟邊同比", "alt": "另一個想法：把相似比想成「地圖的比例尺」。一張 1：3 的地圖上，主要道路縮 3 倍，小巷子也縮 3 倍，連路口到路口的距離都縮 3 倍——地圖上任何兩點的距離都照同一個比例尺。三角形也是這樣，高、中線、角平分線都是「圖上的某兩點距離」，所以全部照同一個 k。唯一不照 k 走的是面積（照 k²）。", "pre": [{"q": "什麼是三角形的高？", "a": "從一個頂點垂直畫到對邊的線段。"}, {"q": "5：15 化到最簡是多少？", "a": "1：3。"}], "signal": {"see": "題目在相似三角形裡又提到「高」「中線」或「角平分線」的長度", "think": "這些線的比跟邊的比一樣，都是相似比", "do": "用已知的一組對應邊（或已知的高）求出相似比，再直接套到要求的那條線"}, "widget": "sim_height", "ask": "我卡在【對應高、中線、角平分線的比】，可以教我嗎？"}, "mother_child": {"name": "母子相似", "teach": "直角三角形 ABC（∠A＝90°），從直角頂點 A 往斜邊 BC 拉一條垂直的高 AD。這一刀下去，原本的大三角形被切成兩個小三角形，而這三個三角形——大的 △ABC 和兩個小的 △DBA、△DAC——彼此都相似！像媽媽生出兩個孩子，長得一模一樣，只是大小不同，所以叫「母子相似」。原因是每個三角形都有一個直角，而且小的跟大的還共用一個銳角，兩角相等就相似（AA）。", "recap": "直角三角形拉斜邊上的高 → 大小三個三角形全部相似。", "confirm": {"q": "∠A＝90°、AD ⊥ BC。△ABD 和 △CBA 為什麼相似？", "a": "兩個都有直角（∠ADB＝∠BAC＝90°），又共用 ∠B，兩角相等所以相似（AA）。"}, "retest": {"q": "∠A＝90°、AD ⊥ BC 於 D，圖中一共有幾個互相相似的三角形？分別是哪些？", "a": "3 個：△ABC、△DBA、△DAC，三個互相相似。"}, "jingle": "斜邊拉條高，三兄弟全像", "alt": "換個方式找對應：三個三角形都是直角三角形，把每個三角形的角照「直角、大銳角、小銳角」排好，就能一一對上。△ABC 的直角在 A，△DBA 的直角在 D，△DAC 的直角也在 D。共用 ∠B 的是 △ABC 和 △DBA；共用 ∠C 的是 △ABC 和 △DAC。所以寫的時候要照對應順序：△ABC ∼ △DBA ∼ △DAC，字母排錯就會算錯邊。", "pre": [{"q": "兩個三角形有兩組角相等，是什麼關係？", "a": "相似（AA）。"}, {"q": "AD ⊥ BC，∠ADB 是幾度？", "a": "90°。"}], "signal": {"see": "圖上一個直角三角形，從直角那個頂點又往斜邊畫了一條垂線（有兩個直角符號）", "think": "母子相似，三個三角形互相相似", "do": "照「直角、共用的銳角」把三個三角形配對，寫成 △ABC ∼ △DBA ∼ △DAC 再列比例式"}, "widget": "mother_child", "ask": "我卡在【母子相似】，可以教我嗎？"}, "mc_formula": {"name": "母子相似的公式", "teach": "直角三角形 ABC（∠A＝90°），AD 是斜邊 BC 上的高，D 把 BC 切成 BD 和 DC 兩段。相似關係會生出三條公式：AB²＝BD×BC、AC²＝CD×CB、AD²＝BD×DC。前兩條的記法是「邊的平方＝它靠著的那一小段 × 整條斜邊」；第三條是「高的平方＝左右兩小段相乘」。例：BD＝9、DC＝16 → AD²＝144，AD＝12；BC＝25，AB²＝9×25＝225，AB＝15；AC²＝16×25＝400，AC＝20。", "recap": "AB²＝BD×BC、AC²＝CD×CB、AD²＝BD×DC。", "confirm": {"q": "∠A＝90°、AD ⊥ BC，BD＝9、DC＝16，求 AD。", "a": "AD＝12（AD²＝BD×DC＝9×16＝144，AD＝12）。"}, "retest": {"q": "∠A＝90°、AD ⊥ BC，BD＝4、BC＝25，求 AB。", "a": "AB＝10（AB²＝BD×BC＝4×25＝100，AB＝10）。"}, "jingle": "斜邊兩段相乘，等於高的平方", "alt": "這三條公式其實都是從相似的比例式來的，背不起來就現推。以 AB 為例：△DBA ∼ △ABC，對應邊 BD：BA＝BA：BC，交叉相乘就得到 AB²＝BD×BC。看得出來嗎？AB 在比例式裡出現兩次（一次當後項、一次當前項），這種「自己跟自己相乘」的比例叫比例中項，平方就是這樣冒出來的。AD 也一樣：△DBA ∼ △DAC，得 BD：AD＝AD：DC，所以 AD²＝BD×DC。分不清用哪條的時候，就看題目問的那條線「兩端接著誰」。", "pre": [{"q": "9×16 是多少？它的平方根是多少？", "a": "144；12。"}, {"q": "BD＝4、BC＝25，DC 是多少？", "a": "21（25－4）。"}], "signal": {"see": "直角三角形加一條畫到斜邊上的高，題目給斜邊上被切出的兩小段長度", "think": "母子相似公式，出現平方", "do": "求高用 AD²＝BD×DC；求斜邊，用那條邊靠著的小段乘整條斜邊再開根號"}, "widget": "mc_formula", "ask": "我卡在【母子相似的公式】，可以教我嗎？"}, "shadow": {"name": "測量應用（影長、鏡子、縮尺）", "teach": "太陽很遠，同一時間照下來的光線可以看成平行，所以人和影子、樹和影子會做出兩個相似的直角三角形。既然相似，就有「人高：人影＝樹高：樹影」。量得到的是人高、人影、樹影三個數，用比例式就能算出量不到的樹高。鏡子題、縮尺題原理完全一樣，都是拿量得到的去推量不到的。", "recap": "同一時間，高：影長 是固定的比，用比例式算出高度。", "confirm": {"q": "小美身高 1.6 m、影長 2 m，同一時間旁邊的樹影長 5 m，樹高多少？", "a": "4 m（1.6：2＝x：5，2x＝8，x＝4）。"}, "retest": {"q": "一根 2 m 的竿子影長 3 m，同一時間大樓的影長 30 m，大樓多高？", "a": "20 m（2：3＝x：30，3x＝60，x＝20）。"}, "jingle": "同時量影子，高影成比例", "alt": "把它想成「影子的放大倍率」。那一天那個時刻，太陽把每樣東西的影子都用同一個倍率拉長：小美 1.6 m 拉出 2 m 的影子，倍率是 2÷1.6＝1.25 倍。樹的影子 5 m，也是被同一個 1.25 倍拉出來的，所以樹高＝5÷1.25＝4 m。兩種做法答案一樣，選你順手的。注意單位——公分和公尺混在一起要先統一，這是這類題最常見的失分點。", "pre": [{"q": "為什麼人和樹的影子問題可以用相似？", "a": "因為人和樹都跟地面垂直，所以兩個都是直角三角形（第一組角相等）；太陽光是平行的，照下來的仰角也一樣（第二組角相等）。兩組角相等，由 AA 得到相似。"}, {"q": "1.6：2＝x：5，交叉相乘後的式子是什麼？", "a": "2x＝8，所以 x＝4。"}], "signal": {"see": "題目出現「同一時間」「影子長」「鏡子」「比例尺」這些字，還有量不到的高度", "think": "兩個相似三角形，高和影長成比例", "do": "列「已知高：已知影＝未知高：已知影」，交叉相乘解出來（先統一單位）"}, "widget": "shadow", "ask": "我卡在【測量應用（影長、鏡子、縮尺）】，可以教我嗎？"}, "trig_def": {"name": "sin、cos、tan 的定義", "teach": "在直角三角形裡盯著一個銳角 ∠A：正對著它的那條邊叫「對邊」，貼著它的那條（不是斜邊）叫「鄰邊」，直角對面最長的叫「斜邊」。三角比就是三種邊的比值：sin A＝對邊/斜邊、cos A＝鄰邊/斜邊、tan A＝對邊/鄰邊。只要角度不變，三角形放大縮小都沒差，這三個比值永遠一樣——這就是三角比好用的原因。", "recap": "sin＝對/斜、cos＝鄰/斜、tan＝對/鄰。", "confirm": {"q": "直角三角形中對 ∠A 而言，對邊 3、鄰邊 4、斜邊 5。sin A、cos A、tan A 各是多少？", "a": "sin A＝3/5、cos A＝4/5、tan A＝3/4。"}, "retest": {"q": "對 ∠A 而言對邊 5、鄰邊 12、斜邊 13，求 sin A、cos A、tan A。", "a": "sin A＝5/13、cos A＝12/13、tan A＝5/12。"}, "jingle": "正對斜、餘鄰斜、切對鄰", "alt": "三角比可以想成「這個角的身分證」。同一個 30° 角，不管畫成小三角形還是大三角形，對邊除以斜邊永遠是 0.5——因為放大時對邊和斜邊一起變 k 倍，比值上下約掉就不變了。所以 sin、cos、tan 是「角度的函數」，給我角度我就能查出比值，給我比值也能反推角度。認邊的口訣：先找直角，直角對面是斜邊；再看你盯的那個角，正對面是對邊，剩下那條就是鄰邊。角換了，對邊和鄰邊就對調，這是最常錯的地方。", "pre": [{"q": "直角三角形裡，哪一條邊是斜邊？", "a": "直角正對面那條，也是最長的那條。"}, {"q": "對 ∠A 來說，「對邊」是哪一條？", "a": "∠A 正對面的那一條邊。"}], "signal": {"see": "圖是直角三角形，題目給一個角度和一條邊，要求另一條邊", "think": "看已知和未知是哪兩種邊，決定用 sin、cos 還是 tan", "do": "先標出對邊、鄰邊、斜邊，再挑「剛好連接已知和未知」的那個三角比列式"}, "widget": "trig_def", "ask": "我卡在【sin、cos、tan 的定義】，可以教我嗎？"}, "trig_special": {"name": "30°、45°、60° 的三角比", "teach": "只要記住兩個三角形，特殊角就全拿到了。第一個是 30-60-90，三邊比 1：√3：2（短邊對 30°、長邊對 60°、斜邊 2）。第二個是 45-45-90，三邊比 1：1：√2（兩股一樣長）。把邊套進定義就得到：sin 30°＝1/2、cos 30°＝√3/2、tan 30°＝√3/3；sin 45°＝cos 45°＝√2/2、tan 45°＝1；sin 60°＝√3/2、cos 60°＝1/2、tan 60°＝√3。", "recap": "30-60-90 是 1：√3：2，45-45-90 是 1：1：√2，套定義就出來。", "confirm": {"q": "sin 30°、cos 30°、tan 30° 各是多少？", "a": "sin 30°＝1/2、cos 30°＝√3/2、tan 30°＝√3/3。"}, "retest": {"q": "直角三角形中 ∠A＝30°，斜邊長 8，∠A 的對邊多長？", "a": "4（對邊＝斜邊×sin 30°＝8×1/2＝4）。"}, "jingle": "一根三二，一一根二", "alt": "不想背表就用「畫圖現推」。把一個邊長 2 的正三角形對半切，就得到 30-60-90：斜邊 2、短邊 1（被切一半）、長邊用畢氏定理算出 √3。把一個邊長 1 的正方形沿對角線切，就得到 45-45-90：兩股都是 1、斜邊 √2。圖畫好，sin 就是對邊除斜邊，當場讀出來，不會記錯。檢查小技巧：角度越大，sin 越大、cos 越小，所以 sin 30° 一定比 sin 60° 小——1/2 < √3/2，對得起來。", "pre": [{"q": "邊長 2 的正三角形對半切，短邊多長？", "a": "1（底邊的一半）。"}, {"q": "兩股都是 1 的直角三角形，斜邊多長？", "a": "√2（1²＋1²＝2）。"}], "signal": {"see": "題目的角度剛好是 30°、45° 或 60°，沒有給計算機也沒給表", "think": "這是特殊角，三邊比是 1：√3：2 或 1：1：√2", "do": "在旁邊畫出那個標準三角形，標上三邊，再照 sin、cos、tan 的定義讀出比值"}, "widget": "trig_special", "ask": "我卡在【30°、45°、60° 的三角比】，可以教我嗎？"}, "circle_terms": {"name": "圓的名詞", "teach": "把圓想成一個披薩。正中間那一點是圓心；從圓心切到邊邊一刀是半徑；穿過圓心從這邊切到那邊是直徑（＝兩條半徑接起來，所以直徑＝2×半徑）。圓上任兩點連起來的直線段叫弦，最長的那條弦就是直徑；圓周上被截下來那一段彎彎的線叫弧。從圓心切兩刀夾住一塊 → 扇形；直接用一條弦切下來的那塊 → 弓形。", "recap": "圓心、半徑、直徑、弦、弧、扇形、弓形，七個名詞先認位置。", "confirm": {"q": "弦和直徑有什麼關係？", "a": "直徑是通過圓心的弦，也是圓裡最長的弦。"}, "retest": {"q": "一個圓的半徑是 7，直徑多少？兩條半徑和一段弧圍起來的那一塊叫什麼？", "a": "直徑＝14；那一塊叫扇形。"}, "jingle": "圓心半徑弦和弧，名詞先認清", "alt": "換個方式分類：先問「這是線還是面？」半徑、直徑、弦都是直直的線段（弦連圓上兩點，直徑是最特別的那條弦），弧是彎的、是圓周的一部分。面的只有兩種：扇形是兩條半徑加一段弧圍出來的（像披薩），弓形是一條弦加一段弧圍出來的（像缺一角的月亮）。認名詞時先問直的還是彎的、線還是面，就不會混。", "pre": [{"q": "半徑 5 的圓，直徑多少？", "a": "10。"}, {"q": "圓上每一個點到圓心的距離都一樣嗎？", "a": "一樣，都等於半徑。"}], "signal": {"see": "題目裡出現「弦」「弧」「扇形」這些字，或圖上畫了一個圓和幾條線", "think": "先分清楚哪條是半徑、哪條是弦、哪一段是弧", "do": "在圖上把圓心 O 和半徑 r 標出來，再標出題目講的那條弦或那段弧"}, "widget": "circle_terms", "ask": "我卡在【圓的名詞】，可以教我嗎？"}, "pt_circle": {"name": "點與圓的位置", "teach": "要判斷一個點在圓的裡面、上面還是外面，只要比一件事：這個點到圓心的距離 d，跟半徑 r 誰大。d＜r → 點躲在圓裡面；d＝r → 剛好站在圓周上；d＞r → 跑到圓外面去了。像操場的跑道：你離中心比跑道半徑近，你就在場內。", "recap": "比 d 和 r：小在內、等在上、大在外。", "confirm": {"q": "圓 O 的半徑是 5，OP＝3，點 P 在圓內、圓上還是圓外？", "a": "d＝3＜r＝5，P 在圓內。"}, "retest": {"q": "圓心 O 在原點、半徑 5，點 P 的座標是 (3, 4)，P 在圓內、圓上還是圓外？", "a": "OP＝√(3²＋4²)＝5＝r，P 在圓上。"}, "jingle": "比半徑小在圓內，大在外", "alt": "反過來想：圓本來就是「離圓心剛好 r 遠」的那些點連成的線。所以一個點只有三種命運——離得不夠遠（d＜r，在裡面）、剛剛好（d＝r，在線上）、太遠（d＞r，在外面）。題目要你判斷位置，一定會給你算得出 d 的資料（座標或長度），第一個動作就是把 d 算出來，再跟 r 比。", "pre": [{"q": "(0, 0) 到 (3, 4) 的距離是多少？", "a": "5。"}, {"q": "半徑就是圓心到圓上任一點的距離，對嗎？", "a": "對。"}], "signal": {"see": "題目給一個點到圓心的長度（或給座標），問這個點「在圓內、圓上還是圓外」", "think": "這是在比 d 和 r 誰大", "do": "先算出 d，再跟 r 比大小，寫出內／上／外"}, "widget": "pt_circle", "ask": "我卡在【點與圓的位置】，可以教我嗎？"}, "line_circle": {"name": "直線與圓的位置", "teach": "一條直線跟圓的關係只有三種，看的還是同一件事：圓心到直線的距離 d 跟半徑 r 比大小。d＞r → 離太遠碰不到，叫相離，0 個交點；d＝r → 剛好擦過一點，叫相切，1 個交點；d＜r → 直接切進圓裡穿過去，叫相交，2 個交點。想像一把尺慢慢靠近圓：還沒碰到 → 剛好碰到 → 切進去。", "recap": "d＞r 相離、d＝r 相切、d＜r 相交，交點 0、1、2 個。", "confirm": {"q": "圓的半徑是 5，圓心到某直線的距離是 3，這條直線和圓有幾個交點？", "a": "d＝3＜r＝5，相交，有 2 個交點。"}, "retest": {"q": "圓的半徑是 4，圓心到直線的距離也是 4，兩者是什麼關係？有幾個交點？", "a": "d＝r，相切，只有 1 個交點（切點）。"}, "jingle": "小相交、等相切、大相離", "alt": "最容易錯的是 d 抓錯：d 一定是「圓心到直線的垂直距離」，不能隨便抓一段斜的。所以做法固定三步：從圓心往直線畫一條垂線 → 那段垂線長就是 d → 拿 d 跟 r 比。比 r 大代表圓還沒碰到它，一樣大代表剛好貼著，比 r 小代表直線已經插進圓裡了。", "pre": [{"q": "點到直線的距離要怎麼量？", "a": "從點作垂線到那條直線，那段垂線的長度。"}, {"q": "d＝r 的時候，點在圓的哪裡？", "a": "在圓上。"}], "signal": {"see": "圖上有一個圓，旁邊一條直線，可能碰到圓也可能沒碰到", "think": "量圓心到那條直線的垂直距離，拿來跟半徑比", "do": "從圓心作垂線量出 d，跟 r 比大小，判斷相離／相切／相交"}, "widget": "line_circle", "ask": "我卡在【直線與圓的位置】，可以教我嗎？"}, "chord_perp": {"name": "弦心距垂直平分弦", "teach": "從圓心往一條弦畫垂線，那段垂線叫弦心距。它有一個超好用的性質：一定會把這條弦切成一模一樣的兩半。原因很直覺——圓是左右對稱的，圓心正對著弦的正中間。另外還有一句，但只在同一個圓（或一樣大的圓）裡才算數：弦愈長就愈靠近圓心，弦心距愈短；同一個圓裡最長的弦是直徑，它的弦心距是 0。不同大小的兩個圓不能這樣比。", "recap": "圓心到弦的垂線會平分那條弦；弦愈長、弦心距愈短。", "confirm": {"q": "圓心 O 作 OM⊥弦 AB 於 M，弦 AB 長 10，AM 多長？", "a": "AM＝5（弦心距平分弦，AM＝MB＝10÷2）。"}, "retest": {"q": "同一個圓裡，弦 AB＝12、弦 CD＝8，哪一條的弦心距比較短？為什麼？", "a": "AB 的比較短。弦愈長離圓心愈近，弦心距愈短。"}, "jingle": "圓心垂弦，一定平分", "alt": "想成摺紙：沿著「圓心到弦的那條垂線」把圓對摺，弦的左半段會剛好蓋住右半段，所以兩半一樣長。這也代表三件事會綁在一起出現——垂直、平分、通過圓心，知道其中兩個就能推出第三個。所以看到圖上從圓心畫到弦的那條垂線，第一個動作就是把弦長除以 2。", "pre": [{"q": "「垂直平分一條線段」是什麼意思？", "a": "垂直，而且把它切成相等的兩段。"}, {"q": "一個圓裡最長的弦是哪一條？", "a": "直徑。"}], "signal": {"see": "圖上從圓心畫一條線到弦，交點那裡有個小小的直角記號", "think": "這條線會把弦切成相等的兩半", "do": "把弦長除以 2 得到半弦長，直接標在圖上"}, "widget": "chord_perp", "ask": "我卡在【弦心距垂直平分弦】，可以教我嗎？"}, "chord_pyth": {"name": "半徑、弦心距、半弦的畢氏關係", "teach": "從圓心往弦畫垂線之後，圖上會冒出一個直角三角形：圓心 O、垂足 M、弦的端點 A。三個邊分別是弦心距 d（OM）、半弦長 L/2（AM），還有半徑 r（OA）——r 對著直角，所以 r 是斜邊。因此 r²＝d²＋(L/2)²。這個題型幾乎都是給你其中兩個、要你算第三個，直接套畢氏就好。", "recap": "半徑是斜邊：r²＝d²＋(半弦長)²。", "confirm": {"q": "圓的半徑 5，弦心距 3，這條弦多長？", "a": "半弦長＝√(5²−3²)＝√16＝4，弦長＝4×2＝8。"}, "retest": {"q": "圓的半徑 13，弦長 24，弦心距多少？", "a": "半弦長＝24÷2＝12，弦心距＝√(13²−12²)＝√25＝5。"}, "jingle": "半徑當斜邊，畢氏來救援", "alt": "記一個畫面就夠：「r 是斜邊，d 和半弦是兩隻腳。」最常出現的兩組數字是 3-4-5 和 5-12-13：r＝5、d＝3 → 半弦 4（弦長 8）；r＝13、d＝5 → 半弦 12（弦長 24）。有兩個陷阱要特別小心：（1）題目給的是「整條弦」，要先除以 2 才能丟進畢氏；（2）算出來的是「半弦」，要再乘回 2 才是弦長。", "pre": [{"q": "直角三角形兩股是 3 和 4，斜邊多長？", "a": "5。"}, {"q": "圓心到弦的垂線會把弦怎麼樣？", "a": "平分成相等的兩段。"}], "signal": {"see": "題目同時給了半徑，還有弦長或圓心到弦的距離", "think": "這裡藏了一個直角三角形，半徑是斜邊", "do": "弦長先除以 2，套 r²＝d²＋(L/2)² 解出未知的那一個，最後看要不要乘回 2"}, "widget": "chord_pyth", "ask": "我卡在【半徑、弦心距、半弦的畢氏關係】，可以教我嗎？"}, "tangent": {"name": "切線的性質", "teach": "切線就是只碰到圓一次的那條直線，碰到的那一點叫切點。第一個性質：切線一定垂直過切點的那條半徑，所以圖上會出現一個直角。第二個性質：從圓外一點 P 往圓拉兩條切線，兩條切線長 PA、PB 一定相等——因為 △OAP 和 △OBP 共用斜邊 OP、半徑又一樣長，兩個直角三角形完全一樣。", "recap": "切線⊥過切點的半徑；圓外一點拉出的兩條切線長相等。", "confirm": {"q": "圓 O 半徑 6，圓外一點 P 使 OP＝10，PA 是切線、A 是切點，PA 多長？", "a": "∠OAP＝90°，PA＝√(10²−6²)＝√64＝8。"}, "retest": {"q": "圓 O 半徑 5，OP＝13，從 P 作兩條切線分別切於 A、B，PA 和 PB 各多長？", "a": "PA＝√(13²−5²)＝√144＝12，PB 也是 12（兩切線長相等）。"}, "jingle": "切線垂半徑，雙切線等長", "alt": "想像拿一根棍子去碰一顆球，剛好只碰到一點——那個碰點和球心的連線，一定跟棍子垂直。這個直角就是解題的鑰匙：把切點和圓心連起來之後，O、A、P 變成直角三角形，半徑、切線長、圓心到 P 的距離三者就能用畢氏互相算。「兩條切線一樣長」這件事，在內切圓、切線圍出的三角形周長這類題幾乎每題都用到。", "pre": [{"q": "直角三角形斜邊 10、一股 6，另一股多長？", "a": "8。"}, {"q": "直線和圓只有一個交點時叫什麼？", "a": "相切。"}], "signal": {"see": "圖上有一條線碰到圓、而且只碰到一個點，或題目寫「切於 A 點」", "think": "把切點和圓心連起來就有直角，可以用畢氏", "do": "連 OA 畫直角，用 半徑²＋切線長²＝OP² 求未知的邊"}, "widget": "tangent", "ask": "我卡在【切線的性質】，可以教我嗎？"}, "two_circles": {"name": "兩圓的位置關係", "teach": "兩個圓的關係，就看「兩個圓心的距離 d」跟「兩半徑的和 R＋r、差 R−r」比大小。把兩個圓從很遠慢慢推近：碰不到（d＞R＋r，外離）→ 剛好碰到一點（d＝R＋r，外切）→ 疊出兩個交點（R−r＜d＜R＋r，相交）→ 小圓縮進大圓、內側剛好貼一點（d＝R−r，內切）→ 完全躲進去碰不到（d＜R−r，內離）。", "recap": "拿 d 跟 R＋r、R−r 比：大於和是外離、等於和是外切、夾在中間是相交、等於差是內切、小於差是內離。", "confirm": {"q": "兩圓半徑 5 和 3，圓心距 d＝8，是什麼位置關係？", "a": "R＋r＝8＝d，所以外切（只有 1 個交點）。"}, "retest": {"q": "兩圓半徑 7 和 3，圓心距 d＝4，是什麼位置關係？", "a": "R−r＝4＝d，所以內切。"}, "jingle": "圓心距比和差，位置就知道", "alt": "也可以用交點個數來對答案：外離 0 個、外切 1 個、相交 2 個、內切 1 個、內離 0 個。但光數交點分不出外離和內離、外切和內切，還是要靠 d 跟 R＋r、R−r 比，才知道是「在外面」還是「一個包住另一個」。做題順序固定：先把 R＋r 和 R−r 這兩個門檻算出來，再看 d 掉在哪一段。", "pre": [{"q": "兩圓半徑 6 和 2，R＋r 和 R−r 各是多少？", "a": "R＋r＝8、R−r＝4。"}, {"q": "兩個圓心之間的距離叫什麼？", "a": "圓心距 d。"}], "signal": {"see": "題目給兩個圓的半徑，還有兩個圓心之間的距離，問位置關係或交點幾個", "think": "先算兩半徑的和與差，再看 d 落在哪一段", "do": "算出 R＋r 和 R−r，把 d 跟這兩個數比，對出外離／外切／相交／內切／內離"}, "widget": "two_circles", "ask": "我卡在【兩圓的位置關係】，可以教我嗎？"}, "common_tangent": {"name": "公切線長", "teach": "同時跟兩個圓都相切的直線叫公切線：兩個圓在同一側的是外公切線，從兩圓中間穿過去的是內公切線。求長度的招式一樣——把半徑平移，湊出一個直角三角形，斜邊永遠是圓心距 d。外公切線的另一股是 R−r，長＝√(d²−(R−r)²)；內公切線的另一股是 R＋r，長＝√(d²−(R＋r)²)。", "recap": "外公切線配 R−r、內公切線配 R＋r，都拿 d 當斜邊開根號。", "confirm": {"q": "兩圓半徑 5 和 2，圓心距 d＝5，外公切線長多少？", "a": "R−r＝3，長＝√(5²−3²)＝√16＝4。"}, "retest": {"q": "兩圓半徑 4 和 2，圓心距 d＝10，內公切線長多少？", "a": "R＋r＝6，長＝√(10²−6²)＝√64＝8。"}, "jingle": "外減內加，畢氏開根號", "alt": "為什麼外公切線用「減」、內公切線用「加」？外公切線的兩條半徑指向同一邊，把小圓的半徑平移貼到大圓上，剩下的高度差就是 R−r；內公切線的兩條半徑指向相反邊，接起來就是 R＋r。兩種情況剩下的都是直角三角形、斜邊都是 d，所以公式都是「d² 減掉那一段的平方再開根號」。存在條件也要記：外公切線長要 d＞R−r 才是正數（d＝R−r 是內切，兩個切點重合、長度 0）；內公切線長要 d＞R＋r（兩圓外離才有）。", "pre": [{"q": "√(10²−6²) 等於多少？", "a": "8。"}, {"q": "直角三角形斜邊 5、一股 3，另一股多長？", "a": "4。"}], "signal": {"see": "題目說有一條直線同時和兩個圓相切，問這條線切點之間有多長", "think": "圓心距當斜邊，另一股是 R−r（外）或 R＋r（內）", "do": "先判斷是內還是外公切線，再套 √(d²−(R−r)²) 或 √(d²−(R＋r)²)"}, "widget": "common_tangent", "ask": "我卡在【公切線長】，可以教我嗎？"}, "central_angle": {"name": "圓心角、弧長與扇形面積", "teach": "圓心角就是頂點在圓心的角。它張開幾度，對到的那段弧就是幾度——角和弧是同一個數字。整個圓是 360°，所以一個 θ 度的圓心角，等於拿走整個圓的 θ/360 這麼多。弧長＝2πr×θ/360（整圈周長的 θ/360），扇形面積＝πr²×θ/360（整個圓面積的 θ/360）。就像切披薩，切走幾分之幾，餅皮邊和面積就都是幾分之幾。", "recap": "圓心角幾度弧就幾度；弧長和扇形面積都乘上 θ/360。", "confirm": {"q": "半徑 6 的圓，圓心角 60°，弧長和扇形面積各多少？", "a": "60/360＝1/6。弧長＝2π×6×1/6＝2π；扇形面積＝π×6²×1/6＝6π。"}, "retest": {"q": "半徑 4 的圓，圓心角 90°，弧長和扇形面積各多少？", "a": "90/360＝1/4。弧長＝2π×4×1/4＝2π；扇形面積＝π×4²×1/4＝4π。"}, "jingle": "圓心角幾度，弧就幾度", "alt": "與其背公式，不如先算「佔幾分之幾」再乘。看到 90° 就想 1/4、120° 想 1/3、60° 想 1/6、45° 想 1/8。整圈的周長是 2πr、整個面積是 πr²，把它們各乘上這個分數就得到答案。要注意兩個東西單位不同：弧長是長度，配 2πr；扇形面積是面積，配 πr²，千萬別拿錯。", "pre": [{"q": "120° 佔整個圓的幾分之幾？", "a": "120/360＝1/3。"}, {"q": "半徑 6 的圓，周長和面積各多少？", "a": "周長 12π、面積 36π。"}], "signal": {"see": "圖上塗色的是一塊披薩形狀，題目給了半徑和圓心那個角的度數", "think": "這個角佔整圈的幾分之幾", "do": "先算 θ/360，再乘 2πr 得弧長、乘 πr² 得扇形面積"}, "widget": "central_angle", "ask": "我卡在【圓心角、弧長與扇形面積】，可以教我嗎？"}, "inscribed_half": {"name": "圓周角＝弧的一半", "teach": "頂點在圓周上、兩邊各是一條弦的角，叫圓周角。它有一條鐵則：圓周角＝它所對的那段弧的一半，也等於同一段弧的圓心角的一半。弧 AB 是 100°，只要 P 落在另外那一段弧上（隔著弦 AB、跟弧 AB 對面的那一側），∠APB 永遠是 50°。P 在那段弧上滑來滑去角度都不會變，因為它只跟「所對的那段弧」有關，跟 P 停在哪裡無關。要小心：如果 P 跑到弧 AB 自己那一段上去，它對到的就變成另一段 260° 的弧，角度會變成 130°，不是 50°。", "recap": "圓周角是它所對弧的一半，也是圓心角的一半。", "confirm": {"q": "弧 AB 的度數是 100°，P 在圓周上，∠APB 幾度？", "a": "50°（100÷2）。"}, "retest": {"q": "P 在圓周上、∠APB＝35°，它所對的弧 AB 幾度？圓心角 ∠AOB 幾度？", "a": "弧 AB＝35×2＝70°，∠AOB＝70°。"}, "jingle": "圓周角，弧一半", "alt": "用「誰離弧比較近」來記：圓心角的頂點在圓心，離弧近、張得比較開；圓周角的頂點退到圓周上，離弧遠、張得比較小，剛好是一半。所以同一段弧會配兩種角：圓心角＝弧，圓周角＝弧÷2。做題時先確定「這個角對到哪一段弧」，再決定方向：從角推弧就 ×2，從弧推角就 ÷2。", "pre": [{"q": "圓心角 80°，它所對的弧幾度？", "a": "80°。"}, {"q": "一個角的頂點在圓周上、兩邊都是弦，這叫什麼角？", "a": "圓周角。"}], "signal": {"see": "角的尖端點在圓的邊上，兩條邊往圓裡連到另外兩個點", "think": "這個角是它對到的那段弧的一半", "do": "先圈出角對到的那段弧，弧÷2 得角；反過來角×2 得弧"}, "widget": "inscribed_half", "ask": "我卡在【圓周角＝弧的一半】，可以教我嗎？"}, "same_arc": {"name": "同弧圓周角相等、半圓 90°", "teach": "既然圓周角＝弧的一半，那對著「同一段弧」的圓周角，算出來一定一樣大。所以 P、Q 兩點都在圓周上，只要 P、Q 在弦 AB 的同一側（同在另一段弧上）、對的是同一段弧 AB，就有 ∠APB＝∠AQB。如果 P、Q 分在弦的兩側，兩個角是互補（加起來 180°），不是相等。最常考的特例：如果 AB 是直徑，弧 AB 就是半圓 180°，圓周角＝180÷2＝90°——直徑所對的圓周角永遠是直角。", "recap": "同一段弧的圓周角都相等；直徑所對的圓周角＝90°。", "confirm": {"q": "P、Q 都在圓周上、在弦 AB 的同一側、都對著弧 AB，已知 ∠APB＝40°，∠AQB 幾度？", "a": "40°（同弧圓周角相等）。"}, "retest": {"q": "AB 是圓的直徑、C 在圓上，∠ACB 幾度？若 ∠A＝35°，∠B 幾度？", "a": "∠ACB＝90°（直徑對的圓周角）；∠B＝180°−90°−35°＝55°。"}, "jingle": "同弧角相等，半圓九十度", "alt": "反過來用也很好用：看到圖上有兩個角「站在同一條弦的同一側」，先懷疑它們相等，這常常就是 AA 相似的第一個條件。看到題目寫「直徑」，就在圓周上那個頂點補一個直角記號——直角一出現，畢氏定理和相似三角形都能接著用。這是圓這一章跟前面章節接起來的橋。", "pre": [{"q": "圓周角是它所對弧的幾分之幾？", "a": "一半。"}, {"q": "半圓的弧是幾度？", "a": "180°。"}], "signal": {"see": "圖上兩個角的尖端都在圓邊上，而且都連到同樣的那兩個點；或題目寫「AB 是直徑」", "think": "同一段弧的圓周角一樣大；直徑對的角是 90°", "do": "把相等的兩個角標上同樣的記號，或在直徑所對的頂點畫上直角"}, "widget": "same_arc", "ask": "我卡在【同弧圓周角相等、半圓 90°】，可以教我嗎？"}, "tan_chord": {"name": "弦切角＝弧的一半", "teach": "一條切線和一條弦在切點交出來的角，叫弦切角。它跟圓周角一樣講理：弦切角＝它所夾的那段弧的一半。弧 AB 是 80°，弦切角就是 40°。可以這樣想：把圓周角的頂點一路滑到跟 A 重合，它的其中一邊就變成切線了，規則沒變，還是弧的一半。", "recap": "弦切角＝它夾住的那段弧的一半，和同一段弧的圓周角一樣大。", "confirm": {"q": "切線和弦 AB 在切點 A 夾出一個弦切角，所夾的弧 AB 是 80°，這個弦切角幾度？", "a": "40°（80÷2）。"}, "retest": {"q": "弦切角是 65°，它所夾的弧幾度？這段弧所對的圓周角幾度？", "a": "弧＝65×2＝130°；圓周角＝130÷2＝65°，和弦切角一樣大。"}, "jingle": "弦切角，也是弧一半", "alt": "一個切點其實會生出兩個弦切角（弦的左邊一個、右邊一個），它們各自夾住一段弧，兩段弧加起來 360°，所以兩個弦切角加起來 180°。判斷「夾住哪一段」很簡單：角的開口朝哪一邊，就夾那一邊的弧。算法永遠只有一句：角＝弧÷2、弧＝角×2。", "pre": [{"q": "圓周角 50°，它所對的弧幾度？", "a": "100°。"}, {"q": "切線和過切點的半徑夾幾度？", "a": "90°。"}], "signal": {"see": "圖上一條線只碰圓一個點，從那個點又拉一條線到圓上另一點，中間夾出一個角", "think": "這是弦切角，等於它夾住那段弧的一半", "do": "找出它夾住的那段弧除以 2；或反過來把角乘 2 得到弧"}, "widget": "tan_chord", "ask": "我卡在【弦切角＝弧的一半】，可以教我嗎？"}, "cyclic_quad": {"name": "圓內接四邊形", "teach": "四個頂點都在同一個圓上的四邊形，叫圓內接四邊形。它的招牌性質是：一組對角加起來 180°，也就是 ∠A＋∠C＝180°、∠B＋∠D＝180°。理由是 ∠A 和 ∠C 分別對到兩段弧，兩段弧合起來剛好整個圓 360°，各取一半就是 180°。再延伸一條：某個角的外角＝它的內對角（因為外角＝180°−這個角＝它的對角）。", "recap": "圓內接四邊形對角互補（和 180°），一個角的外角＝它的內對角。", "confirm": {"q": "圓內接四邊形 ABCD 中 ∠A＝110°，∠C 幾度？", "a": "∠C＝180°−110°＝70°。"}, "retest": {"q": "圓內接四邊形 ABCD 中 ∠B＝85°，∠D 幾度？∠D 的外角幾度？", "a": "∠D＝180°−85°＝95°；∠D 的外角＝180°−95°＝85°，剛好等於內對角 ∠B。"}, "jingle": "對角湊一八０，外角等內對", "alt": "要提醒的是：「對角互補」只有在四個點都在圓上時才成立，普通四邊形沒有這條（普通四邊形只保證四個角加起來 360°）。題目也常反過來考：如果一個四邊形有一組對角加起來 180°，那這四個點就共圓。所以看到 180° 想共圓、看到共圓想 180°，兩邊互推。", "pre": [{"q": "四邊形的內角和是幾度？", "a": "360°。"}, {"q": "和一個角加起來 180° 的角叫什麼？", "a": "補角。"}], "signal": {"see": "圖上一個四邊形，四個頂點剛好都點在圓的邊上", "think": "隔著對面的兩個角加起來一定是 180°", "do": "用 180° 減掉已知的那個角，得到它的對角"}, "widget": "cyclic_quad", "ask": "我卡在【圓內接四邊形】，可以教我嗎？"}, "power_pt": {"name": "圓冪（相交弦、切割線）", "teach": "從一個點 P 拉兩條直線去穿過圓，每條線都會被圓截出兩段。圓冪說的是：這兩段相乘的結果，兩條線一定一樣，PA·PB＝PC·PD。P 在圓內（兩弦相交）成立，P 在圓外（兩條割線）也成立。理由是連起來會生出一對相似三角形，對應邊成比例、交叉相乘就是這個式子。如果其中一條是切線 PT，兩段重合成同一段，就變成 PT²＝PA·PB。", "recap": "同一點拉出去的兩條線，各自兩段的乘積相等；切線那條是 PT²。", "confirm": {"q": "圓內兩弦 AB、CD 交於 P，PA＝4、PB＝6、PC＝3，PD 多長？", "a": "PA·PB＝4×6＝24，所以 PD＝24÷3＝8。"}, "retest": {"q": "圓外一點 P，切線長 PT＝6，一條割線穿過圓交於 A、B（A 比較靠近 P），PA＝4，PB 多長？", "a": "PT²＝PA·PB → 6²＝4×PB → 36＝4×PB，PB＝9。"}, "jingle": "兩段乘積，兩邊一樣", "alt": "用相似來記比較不會忘：把交點連起來會出現兩個相似三角形（同弧圓周角相等 → AA 相似），對應邊 PA/PC＝PD/PB，交叉相乘就得到 PA·PB＝PC·PD。最常錯的是量錯段：兩段都要「從 P 量到圓上的交點」，不是隨便抓弦被切出來的兩段。切線版本 PT²＝PA·PB 記成「切線是中項」——切線長自己乘自己。", "pre": [{"q": "4×6 等於多少？", "a": "24。"}, {"q": "a/b＝c/d 可以交叉相乘變成什麼？", "a": "ad＝bc。"}], "signal": {"see": "同一個點有兩條線往圓連出去，題目給了好幾段長度、剛好少一段", "think": "兩條線各自兩段的乘積會相等", "do": "寫下 PA·PB＝PC·PD（有切線就寫 PT²＝PA·PB），把已知代進去解未知"}, "widget": "power_pt", "ask": "我卡在【圓冪（相交弦、切割線）】，可以教我嗎？"}, "proof_format": {"name": "證明的寫法：已知→求證→證明", "teach": "證明不是算答案，是「說服別人」。格式固定三段：已知（題目已經給你的條件）、求證（題目要你說明的那一句話）、證明（一步一步從已知走到求證）。每一步後面都要用括號補上理由，像「（SSS 全等）」，沒寫理由的那一步等於沒說服力。把它想成帶朋友走一條路：每個轉彎都要說出「因為這裡有招牌」，人家才跟得上。", "recap": "已知 → 求證 → 證明，每一步都補上理由。", "confirm": {"q": "題目：「△ABC 中 AB＝AC，D 是 BC 的中點，求證 AD⊥BC」。哪些要寫在「已知」、哪一句是「求證」？", "a": "已知：AB＝AC、BD＝CD（D 是 BC 中點）；求證：AD⊥BC（也就是 ∠ADB＝90°）。"}, "retest": {"q": "△ABC 中 AB＝AC，∠B 的平分線交 AC 於 D、∠C 的平分線交 AB 於 E，要證明 BD＝CE。第一步要證哪兩個三角形全等？括號裡的理由寫什麼？", "a": "證 △BCD ≅ △CBE：∠DBC＝∠ECB（等腰底角的一半，因為 ∠ABC＝∠ACB 且各被平分）、BC＝CB（共用邊）、∠DCB＝∠EBC（等腰兩底角相等）→ ASA。全等後對應邊 BD＝CE。"}, "jingle": "已知求證加理由，一步一句", "alt": "換個畫面：證明像上法庭。「已知」是手上已經有的證據，「求證」是你要讓法官相信的那句話，「證明」是一句一句的推論。法官不接受「我覺得」，每一句都要說出根據哪一條法律 —— 在數學裡就是括號裡的理由（全等、相似、平行線角、等腰…）。所以寫證明卡住的時候，先回頭看「已知」還有哪個條件沒用到，那個沒用到的條件通常就是下一步的鑰匙。", "pre": [{"q": "等腰三角形的兩個底角有什麼關係？", "a": "相等。"}, {"q": "兩個三角形三邊分別相等，可以說它們全等嗎？用哪一個判別？", "a": "可以，SSS。"}], "signal": {"see": "題目最後不是問數字，而是出現「求證」、「試說明」這種字", "think": "這題要我寫理由，不是算答案", "do": "先把題目的條件抄成「已知」、要證的那句抄成「求證」，再想哪一個工具（全等／相似／平行線角／等腰）可以把兩邊接起來"}, "widget": "proof_format", "ask": "我卡在【證明的寫法：已知→求證→證明】，可以教我嗎？"}, "proof_tools": {"name": "證明常用的幾把工具（全等五招）", "teach": "證明題其實只有幾把工具，看到圖先問「我手上有哪一把」。最常用的是全等五招：SSS（三邊）、SAS（兩邊夾角）、ASA（兩角夾邊）、AAS（兩角和其中一邊）、RHS（直角三角形：直角＋斜邊＋一股）。另外三把是相似（AA，兩角相等）、平行線的同位角／內錯角相等、等腰三角形兩底角相等。要小心：AAA 只能得到相似、不能全等；SSA（角沒夾在中間）也不算工具——唯一的例外是直角三角形的 RHS，因為直角把那個模稜兩可的狀況鎖死了，所以才特別開放。", "recap": "全等五招 SSS、SAS、ASA、AAS、RHS；AAA 只給相似。", "confirm": {"q": "兩個三角形：AB＝DE＝8、AC＝DF＝6、∠A＝∠D＝50°。它們全等嗎？用哪一招？", "a": "全等，SAS（∠A 正好夾在 AB、AC 之間）。"}, "retest": {"q": "兩個直角三角形，斜邊都是 13、其中一股都是 5。全等嗎？用哪一招？", "a": "全等，RHS（直角＋斜邊 13＋一股 5）。"}, "jingle": "三邊、兩邊夾角、兩角一邊", "alt": "換一種記法：全等要湊「三個條件」，而且不能三個都是角。SSS 是三條邊；SAS 是兩邊夾一角、ASA 是兩角夾一邊、AAS 是兩角配旁邊那條邊；RHS 是直角三角形的特別優惠。最關鍵的一個字是「夾」—— SAS 的角一定要夾在那兩條邊中間，如果角沒夾著（SSA），同樣的條件可以畫出兩個不一樣的三角形，所以不能用。判題時我習慣先數：題目給了幾個邊、幾個角、角有沒有夾在中間。", "pre": [{"q": "「全等」和「相似」差在哪裡？", "a": "全等是形狀和大小都一樣；相似只有形狀一樣，大小可以不同。"}, {"q": "三個角都相等的兩個三角形，一定全等嗎？", "a": "不一定，只能保證相似。"}], "signal": {"see": "圖上兩個三角形，有些邊畫了一樣的小橫槓、有些角畫了一樣的弧線", "think": "先數一數：給了幾條邊、幾個角，角有沒有夾在兩邊中間", "do": "對照五招挑一招寫下來（三邊→SSS、兩邊夾角→SAS、兩角一邊→ASA/AAS、直角＋斜邊＋一股→RHS）"}, "widget": "proof_tools", "ask": "我卡在【證明常用的幾把工具（全等五招）】，可以教我嗎？"}, "quad_props": {"name": "平行四邊形、菱形、等腰梯形的性質", "teach": "這幾種四邊形是同一家人，差別只在「多加了什麼條件」。平行四邊形（兩組對邊平行）：對邊等長、對角相等、鄰角互補、兩條對角線互相平分。菱形（平行四邊形再加四邊等長）：對角線除了互相平分，還互相垂直，而且平分內角。等腰梯形（只有一組對邊平行、兩腰等長）：同一底上的兩個底角相等，兩條對角線等長。", "recap": "平四：對邊等、對角等、對角線互相平分；菱形再加垂直；等腰梯形兩對角線等長。", "confirm": {"q": "平行四邊形 ABCD 中，∠A＝70°。∠B 和 ∠C 各是幾度？為什麼？", "a": "∠B＝110°（鄰角互補，70°＋110°＝180°）、∠C＝70°（對角相等）。"}, "retest": {"q": "菱形 ABCD 的兩條對角線長 6 和 8，邊長是多少？", "a": "5。對角線互相垂直平分，半對角線是 3 和 4，畢氏定理 3²＋4²＝25 → 邊長 5。"}, "jingle": "對角線平分，菱形再垂直", "alt": "換個角度：用「對角線」一句話就能分家族。兩條對角線：互相平分 → 平行四邊形；平分＋垂直 → 菱形；平分＋等長 → 矩形；平分＋垂直＋等長 → 正方形。梯形是另外一支，只有一組對邊平行，所以對角線不會互相平分；但等腰梯形的兩條對角線會一樣長。判別題就是反過來走：題目給你哪一條對角線的性質，你就對回這張清單挑名字。", "pre": [{"q": "平行四邊形的對邊有什麼關係？", "a": "既平行又等長。"}, {"q": "「互相平分」是什麼意思？", "a": "兩條線段的交點，剛好是兩條線段各自的中點。"}], "signal": {"see": "圖上是四邊形，而且標了「對邊平行」的箭頭、或四邊都畫了一樣的小橫槓、或畫出了兩條對角線", "think": "先分家族：兩組對邊平行？四邊都一樣長？只有一組平行？", "do": "查對應的性質清單（對邊、對角、鄰角、對角線）把要用的那一條寫成式子"}, "widget": "quad_props", "ask": "我卡在【平行四邊形、菱形、等腰梯形的性質】，可以教我嗎？"}, "circumcenter": {"name": "外心：到三個頂點一樣遠", "teach": "先問一個生活問題：三個同學家在 A、B、C，要找一個地方蓋便利商店，讓三家走過去「一樣遠」，蓋在哪？先只看 A、B 兩家 —— 到 A、B 一樣遠的點，全部排在 AB 的中垂線上。同樣地，到 B、C 一樣遠的點排在 BC 的中垂線上。兩條中垂線一交，那個交點就同時滿足兩件事，於是到三家都一樣遠 —— 這個點叫外心 O。以 O 為圓心、OA 為半徑畫圓，圓會剛好穿過三個頂點，就是外接圓。", "recap": "三邊中垂線的交點＝外心，OA＝OB＝OC＝外接圓半徑。", "confirm": {"q": "銳角三角形 ABC 的外心是 O，∠A＝40°、OA＝6。(1) ∠BOC 幾度？(2) OB 多長？", "a": "(1) ∠BOC＝2∠A＝80°（同一段弧 BC，圓心角是圓周角的兩倍）。(2) OB＝6（外心到三個頂點等距）。"}, "retest": {"q": "△ABC 中 ∠C＝90°、AB＝10。外心在哪裡？外接圓半徑多少？", "a": "外心就在斜邊 AB 的中點；半徑＝10÷2＝5。"}, "jingle": "中垂線交外心，三頂點等距", "alt": "反過來想會更好懂：如果有一個圓剛好通過 A、B、C 三個點，那圓心到三個頂點的距離都等於半徑 —— 所以那個圓心就是外心。三角形的形狀不同，外心會躲在不同地方：銳角三角形的外心在裡面，直角三角形的外心剛好落在斜邊的中點（因為斜邊就是直徑），鈍角三角形的外心跑到三角形外面去。這三種位置常常單獨考一題選擇題，記「銳內、直中、鈍外」。另外要注意：∠BOC＝2∠A 這條只在 ∠A 不是鈍角時能直接用；∠A 是鈍角時，∠BOC＝360°－2∠A。", "pre": [{"q": "到 A、B 兩點距離相等的所有點，會排在哪一條線上？", "a": "線段 AB 的中垂線上。"}, {"q": "什麼是中垂線？", "a": "通過線段中點、而且垂直這條線段的直線。"}], "signal": {"see": "題目說某一點到三角形三個頂點的距離相等，或說「畫一個圓通過三個頂點」", "think": "那個點是三邊中垂線的交點，它到三個頂點一樣遠", "do": "把 OA＝OB＝OC 寫下來當方程式，或直接用它是外接圓半徑；先判斷三角形是銳角、直角還是鈍角來確定外心位置"}, "widget": "circumcenter", "ask": "我卡在【外心：到三個頂點一樣遠】，可以教我嗎？"}, "incenter": {"name": "內心：到三個邊一樣遠", "teach": "這次換一個問題：在一塊三角形的地裡蓋一座燈塔，要讓它到「三面牆」一樣遠，蓋在哪？到一個角的兩邊一樣遠的點，全部排在那個角的角平分線上。所以畫 ∠B 的角平分線（到 AB、BC 一樣遠）和 ∠C 的角平分線（到 BC、CA 一樣遠），兩條一交的那個點 I，就到三個邊都一樣遠。以 I 為圓心、那個距離為半徑畫圓，圓會剛好碰到三個邊，這叫內切圓，I 就是內心。", "recap": "三角平分線的交點＝內心，到三邊等距＝內切圓半徑；∠BIC＝90°＋∠A/2。", "confirm": {"q": "△ABC 的內心是 I，∠A＝50°。∠BIC 幾度？", "a": "115°。∠BIC＝90°＋∠A/2＝90°＋25°＝115°。"}, "retest": {"q": "△ABC 的內心是 I，∠A＝80°，而且 I 到 AB 的距離是 3。(1) ∠BIC 幾度？(2) I 到 BC、到 CA 的距離各是多少？", "a": "(1) ∠BIC＝90°＋40°＝130°。(2) 都是 3（內心到三邊等距，這個距離就是內切圓半徑）。"}, "jingle": "角平分交內心，三邊等距", "alt": "換個角度看：內心就是「內切圓的圓心」，所以它永遠在三角形裡面，不管銳角還是鈍角都一樣（這點和外心很不同）。常考的 ∠BIC＝90°＋∠A/2 其實可以自己推一次：在 △BIC 裡，∠IBC 和 ∠ICB 分別是 ∠B、∠C 的一半，兩個加起來＝(∠B＋∠C)÷2＝(180°−∠A)÷2＝90°−∠A/2；再用三角形內角和，∠BIC＝180°−(90°−∠A/2)＝90°＋∠A/2。另外把內心連到三個頂點，三角形會被切成三塊，每一塊的高都是 r，所以三角形面積＝r × 半周長。", "pre": [{"q": "角平分線上的點有什麼特別的性質？", "a": "它到這個角的兩邊距離相等。"}, {"q": "∠A＝80°，∠A 的一半是幾度？", "a": "40°。"}], "signal": {"see": "題目說某一點到三角形三個邊的距離相等，或圖上有一個圓剛好碰到三個邊", "think": "那是三條角平分線的交點，到三邊一樣遠", "do": "把三邊的距離都設成 r；要算角度就套 ∠BIC＝90°＋∠A/2；要算 r 就用 面積＝r × 半周長"}, "widget": "incenter", "ask": "我卡在【內心：到三個邊一樣遠】，可以教我嗎？"}, "centroid": {"name": "重心：中線交點，分 2:1", "teach": "拿一塊三角形紙板，用一根手指頂住某個點它剛好不會掉下來 —— 那個平衡點就是重心。找法：從每個頂點畫一條線到「對邊的中點」（這叫中線），三條中線一定交在同一個點 G。最常考的是這個交點把每條中線分成 2:1：靠頂點的那一段，是靠中點那一段的兩倍。所以中線長 9 的話，頂點到 G 是 6、G 到中點是 3。", "recap": "三條中線交於重心，靠頂點那段 : 靠中點那段＝2:1。", "confirm": {"q": "△ABC 的重心是 G，中線 AM 長 9（M 是 BC 中點）。AG 和 GM 各多長？", "a": "AG＝6、GM＝3（分成 3 份，AG 佔 2 份、GM 佔 1 份）。"}, "retest": {"q": "△ABC 的面積是 36，三條中線把它切成六個小三角形。每一個小三角形面積多少？", "a": "6（三條中線把面積六等分，36÷6＝6）。"}, "jingle": "重心分中線，二比一", "alt": "用「份數」來想比較不會弄反：把一條中線切成 3 等份，重心站在「從頂點數過來第 2 份結束的地方」，所以 AG 佔 2 份、GM 佔 1 份、整條 AM 是 3 份。題目給 GM＝4，整條 AM 就是 4×3＝12、AG 是 4×2＝8；題目給 AM，就先除以 3 再乘 2 得到 AG。另外一個常考的：三條中線會把三角形切成六個小三角形，六塊面積完全一樣，所以面積題只要拿總面積除以 6。", "pre": [{"q": "什麼是三角形的中線？", "a": "從一個頂點連到對邊中點的線段。"}, {"q": "一條線段被分成 2:1，總共是幾份？", "a": "3 份。"}], "signal": {"see": "圖上從頂點畫線到對邊的中點（邊上有中點記號），三條線交在一點", "think": "那個交點是重心，它把每條中線分成 2:1", "do": "把中線當成 3 份：靠頂點 2 份、靠中點 1 份，代進題目給的數字；問面積就除以 6"}, "widget": "centroid", "ask": "我卡在【重心：中線交點，分 2:1】，可以教我嗎？"}, "incircle_r": {"name": "直角三角形的內切圓半徑", "teach": "直角三角形的內切圓半徑有一條很好用的捷徑：兩股加起來、減掉斜邊，再除以 2，也就是 r＝(a＋b−c)/2。例如 3-4-5 的直角三角形，r＝(3＋4−5)/2＝1。為什麼可以這樣？因為內切圓碰到兩股的兩個切點，和直角頂點圍出一個邊長剛好是 r 的正方形，把三邊拆開整理就會得到這個式子。另外還有一條所有三角形都通用的：面積＝r × 半周長，3-4-5 的面積是 6、半周長也是 6，剛好 6＝1×6，可以用來檢查答案。", "recap": "直角△：r＝(兩股和 − 斜邊)÷2；通用：面積＝r × 半周長。", "confirm": {"q": "三邊 3、4、5 的直角三角形，內切圓半徑 r 是多少？", "a": "r＝(3＋4−5)/2＝2/2＝1。"}, "retest": {"q": "三邊 5、12、13 的直角三角形，內切圓半徑是多少？再用「面積＝r × 半周長」檢查一次。", "a": "r＝(5＋12−13)/2＝4/2＝2。檢查：面積＝5×12÷2＝30，半周長＝(5＋12＋13)/2＝15，r×半周長＝2×15＝30 ✓。"}, "jingle": "兩股相加減斜邊，再除以二", "alt": "自己推一次就不會背錯順序。用「圓外一點畫出的兩條切線一樣長」：設從 A 出發的切線長是 x、從 B 出發是 y；直角頂點 C 出發的兩段都等於 r（因為那個角落是邊長 r 的正方形）。於是兩股 b＝x＋r、a＝y＋r，斜邊 c＝x＋y。把 a＋b−c 算開：(y＋r)＋(x＋r)−(x＋y)＝2r，所以 r＝(a＋b−c)/2。重點是「被減掉的一定是斜邊」，順序寫反答案會變成負數，一看就知道錯了。", "pre": [{"q": "直角三角形 6、8、10，兩股加起來再減斜邊是多少？", "a": "6＋8−10＝4。"}, {"q": "三邊 3、4、5 的三角形，半周長是多少？", "a": "(3＋4＋5)÷2＝6。"}], "signal": {"see": "直角三角形裡畫了一個剛好碰到三個邊的圓，題目又給了三邊長", "think": "有直角就直接用 r＝(兩股和 − 斜邊)÷2", "do": "代公式算出 r，再用「面積＝r × 半周長」對一次答案"}, "widget": "incircle_r", "ask": "我卡在【直角三角形的內切圓半徑】，可以教我嗎？"}, "circum_r_right": {"name": "直角三角形的外接圓半徑＝斜邊的一半", "teach": "直角三角形的外接圓半徑最好記：就是斜邊的一半。理由來自圓的性質 —— 半圓的圓周角是 90°。反過來說，一個三角形如果有一個 90° 的角，那這個角對面的邊（斜邊）一定就是直徑，所以外接圓的圓心剛好落在斜邊中點，半徑＝斜邊 ÷ 2。例如 3-4-5 的直角三角形，外接圓半徑＝5÷2＝2.5。", "recap": "直角△的外心在斜邊中點，外接圓半徑＝斜邊 ÷ 2。", "confirm": {"q": "兩股 3、4，斜邊 5 的直角三角形，外接圓半徑是多少？", "a": "2.5（斜邊 5 就是直徑，半徑＝5÷2＝2.5）。"}, "retest": {"q": "△ABC 中 ∠C＝90°，外接圓半徑是 6.5。(1) AB 多長？(2) 若 BC＝5，AC 多長？", "a": "(1) AB＝6.5×2＝13（斜邊是直徑）。(2) AC＝12（13²−5²＝169−25＝144，√144＝12）。"}, "jingle": "直角對斜邊，斜邊是直徑", "alt": "換一個畫面：拿一條直徑 AB，在圓周上隨便挑一點 C 連過去，∠C 永遠是 90°，不管 C 跑到圓周的哪裡。所以「直角三角形的外接圓」其實就是「以斜邊為直徑畫的圓」。這也代表直角頂點 C 到斜邊中點 O 的距離 OC 一定等於半徑，也就是斜邊的一半 —— 這個結論（直角三角形斜邊上的中線＝斜邊的一半）本身也很常單獨考，看到就直接用。", "pre": [{"q": "半圓的圓周角是幾度？", "a": "90°。"}, {"q": "直徑是半徑的幾倍？", "a": "2 倍。"}], "signal": {"see": "題目說直角三角形的外接圓，或圖上三角形的斜邊剛好穿過圓心", "think": "斜邊就是直徑，圓心在斜邊中點", "do": "半徑＝斜邊 ÷ 2；反過來給半徑就乘 2 得斜邊，再用畢氏定理補另一邊"}, "widget": "circum_r_right", "ask": "我卡在【直角三角形的外接圓半徑＝斜邊的一半】，可以教我嗎？"}, "sign_record": {"name": "基準當 0 的正負記號", "teach": "正負號是在記「跟基準比，往哪一邊、差多少」。像跟朋友約在校門口：校門口就是 0，往東走記 +、往西走記 −。溫度也一樣，0 度是基準，比 0 度高記 +、低記 −。最重要的是：基準不一定是真的 0——題目說「以 70 公尺為基準」，那 70 就要當成 0 來看。", "recap": "先找基準當 0，一邊記 +、另一邊記 −。", "confirm": {"q": "以海平面為 0，海拔 50 公尺記成 +50。那海平面「下」20 公尺要記成什麼？", "a": "−20（往下是另一邊，所以是負的）"}, "retest": {"q": "某社區以一樓為 0、往上一層記 +1。地下二樓記成什麼？", "a": "−2"}, "jingle": "基準當零，一邊正一邊負", "alt": "換個方式想：正負號其實是「方向」，數字才是「差多少」。電梯按鈕最好懂——1 樓當 0，上去是 +、下來是 −，B2 就是 −2。所以看到題目給你一個基準，第一件事不是算，而是在那個數字旁邊寫一個大大的 0，接下來就只要問「往哪一邊、差多少」。", "pre": [{"q": "「+15」唸作什麼？它表示比基準高還是低？", "a": "正十五，比基準高。"}, {"q": "溫度「比 0 度低 3 度」，是比 0 大還是比 0 小？", "a": "比 0 小（所以要用負號）。"}], "widget": "", "ask": "我卡在【基準當 0 的正負記號】，可以教我嗎？", "signal": {"see": "題目出現「以 ○○ 為基準」「比零度高／低」「東邊／西邊」「記為 +5」", "think": "基準就是 0，一邊正、一邊負", "do": "先在基準那個數字旁邊寫「＝0」，再看題目問的那一邊該用 + 還是 −"}}, "numberline_read": {"name": "數線讀點：先算一小格多少", "teach": "數線就像一把尺，但兩個整數中間常常又被切成好幾小格。要讀出一個點的坐標，先別急著猜，先數「兩個整數中間被切成幾等分」，再用 1 ÷ 等分數，就知道一小格是多少。像捷運兩站之間插了 4 盞路燈，每一段就是全程的四分之一。算好一小格，再從最靠近的整數一格一格數過去就好。注意：「一大格」不一定是 1。如果兩個標出來的數差 20、中間切成 4 格，一格就是 20÷4＝5。", "recap": "讀數線：一小格＝一大格的量÷等分數（一大格是 1 就用 1÷等分數），再從整數數過去。", "confirm": {"q": "數線上 0 到 1 之間被分成 5 小格，一小格是多少？", "a": "0.2（1÷5）"}, "retest": {"q": "−2 到 −1 之間被分成 4 小格。從 −2 往右數第 1 小格，是哪個數？", "a": "−1.75（−2 + 0.25）"}, "jingle": "先算一小格，再往旁邊數", "alt": "換個方式想：一大格像一塊蛋糕，被切成幾片，一片就是 1 除以幾。切成 4 片，一片 0.25；切成 5 片，一片 0.2。讀點的時候，找一個離它最近、你看得懂的整數當出發點，然後數「走了幾片、往哪邊走」——往右就加、往左就減。", "pre": [{"q": "1 ÷ 4 等於多少？寫成小數是？", "a": "0.25"}, {"q": "數線上往右走，數字是變大還是變小？", "a": "變大（往左變小）。"}], "widget": "", "ask": "我卡在【數線讀點：先算一小格多少】，可以教我嗎？", "signal": {"see": "圖上有數線、有小刻度，題目問「坐標」「哪一點」「表示的數」", "think": "一小格是多少？（一大格的量 ÷ 被分成幾等分）", "do": "先把一小格的值寫在圖旁邊，再從最近的整數往目標點數過去"}}, "abs_distance": {"name": "絕對值＝離 0 的距離", "teach": "絕對值問的是「這個數離 0 有多遠」，不是問它是正是負。就像你說「我家離學校 500 公尺」，不會有人說「負 500 公尺」——距離永遠不會是負的，所以絕對值一定 ≥ 0。也因為是距離，離 0 一樣遠的數通常會有兩個，一個在 0 的左邊、一個在右邊，例如 |−6| 和 |6| 都是 6。只有距離 0 的時候例外——那就是 0 自己，只有一個。", "recap": "絕對值是離 0 的距離，永遠 ≥ 0，左右各一個。", "confirm": {"q": "|−9| 是多少？為什麼不是 −9？", "a": "9。因為絕對值是距離，距離不會是負的。"}, "retest": {"q": "數線上離 0 剛好 6 格遠的數有哪些？", "a": "6 和 −6（左右各一個）"}, "jingle": "絕對值是距離，永遠不負", "alt": "換個方式想：絕對值像「脫掉外套」——把正負號這件外套脫掉，只留下數字本身。|−6|＝6、|6|＝6、|0|＝0。所以有人跟你說「某個數取絕對值之後是 −0.7」，那一定是騙人的，因為距離不可能是負的。 寫成式子就是：a 本來就 ≥ 0 的話，|a|＝a；a 是負的話，|a|＝−a（把負號拿掉）。", "pre": [{"q": "從你家走到便利商店 300 公尺，那從便利商店走回家是幾公尺？", "a": "一樣 300 公尺（距離不分方向）。"}, {"q": "|0| 是多少？", "a": "0（它就站在 0 上，距離是 0）。"}], "widget": "", "ask": "我卡在【絕對值＝離 0 的距離】，可以教我嗎？", "signal": {"see": "題目出現「| |」「絕對值」「與原點相距」「離 0 最近／最遠」", "think": "它在問距離，跟正負無關", "do": "先把每個數的正負號遮起來，只比距離；記得離 0 一樣遠的通常有左右兩個（除非距離是 0）"}}, "opposite_num": {"name": "相反數：換邊、距離一樣", "teach": "a 的相反數是 −a：距離 0 一樣遠，但站在另外一邊。像溫度計上的 +3 度和 −3 度，離 0 度一樣遠，一個在上面、一個在下面。因為一邊一個、距離相同，所以相反數相加一定等於 0（−5 + 5 ＝ 0）。0 很特別，它的相反數就是 0 自己。還有 −(−4)＝4：負號是「換到對面」，換兩次就換回原位了。", "recap": "相反數：a ↔ −a，相加＝0；0 的相反數是 0；−(−a)＝a。", "confirm": {"q": "7 的相反數是多少？它們兩個加起來是多少？", "a": "−7；加起來是 0。"}, "retest": {"q": "−(−12) 等於多少？", "a": "12（換兩次邊，換回原位）"}, "jingle": "兩個相反數，相加等於零", "alt": "換個方式想：相反數就是「照鏡子」，鏡子擺在 0 的位置。你站在 0 右邊 5 步，鏡子裡的你就在 0 左邊 5 步——離鏡子一樣遠、方向相反。站在鏡子上（0）的話，鏡中的你還是在原地，所以 0 的相反數是 0。前面多一個負號就是再照一次鏡子，照兩次就變回自己。", "pre": [{"q": "−3 的相反數是多少？", "a": "3"}, {"q": "0 的相反數是多少？", "a": "0（不是「沒有」，是 0 本身）。"}], "widget": "", "ask": "我卡在【相反數：換邊、距離一樣】，可以教我嗎？", "signal": {"see": "題目出現「相反數」「−(−4)」「甲＋乙＝0」「到原點距離相同但不相等」", "think": "換邊、距離一樣；兩個加起來是 0", "do": "先把 −(−□) 的括號拆掉，再把兩個數標到數線上檢查是不是一左一右"}}, "compare_neg": {"name": "比大小：數線右邊的大", "teach": "比大小最穩的方法是把數標到數線上：站在右邊的就是比較大，不用背任何規則。正數一定比負數大，0 比所有負數大。兩個負數比的時候會有一個「反過來」的感覺：離 0 越遠的反而越小，像欠錢欠越多越慘，欠 100 元比欠 10 元更慘，所以 −100 < −10。有分數或小數就先全部換成小數再比。", "recap": "數線右邊大；兩個負數比，絕對值大的反而小。", "confirm": {"q": "−7 和 −2，哪一個比較大？為什麼？", "a": "−2 比較大，因為它在數線上比較右邊（−7 離 0 更遠，反而更小）。"}, "retest": {"q": "把 −1、−3.5、0.5 由小到大排出來。", "a": "−3.5 < −1 < 0.5"}, "jingle": "數線右邊大，兩負數反著看", "alt": "換個方式想：把數線當成溫度計直著放，上面是正、下面是負。−3 度和 −10 度哪個「比較暖」？當然是 −3 度，因為它比較靠上面。負數就是這樣，數字看起來大（10）反而更冷、更小。比之前先把帶分數、小數統一成小數，會少錯很多。", "pre": [{"q": "數線上 −5 在 −1 的左邊還是右邊？", "a": "左邊。"}, {"q": "0 和 −4，哪一個比較大？", "a": "0（0 比所有負數都大）。"}], "widget": "", "ask": "我卡在【比大小：數線右邊的大】，可以教我嗎？", "signal": {"see": "題目要你填「＞ ＜ ＝」、要你「由小到大排列」，而且數字裡有負數", "think": "標到數線上，右邊的大；負數絕對值大的反而小", "do": "先把每個數換成小數，畫一條簡單數線標上去，再照左右順序寫答案"}}, "count_int": {"name": "數幾個整數：先算邊界再列", "teach": "題目問「有幾個整數」，不要用猜的，先把邊界算出來，再把符合的整數一個一個列出來數。像排隊時要知道「從第 1 個排到第 7 個」有幾個人，數出來最不會錯。要特別注意兩件事：「小於」不包含邊界本身，「小於等於」才包含；還有 0 既不是正整數也不是負整數，數負整數的時候不能把它算進去。", "recap": "先算邊界、看含不含等號，再把整數列出來數。", "confirm": {"q": "比 4 小的正整數有幾個？是哪幾個？", "a": "3 個：1、2、3（4 自己不算，因為是「比 4 小」）。"}, "retest": {"q": "|甲| ＜ 5 的負整數甲有幾個？", "a": "4 個：−1、−2、−3、−4"}, "jingle": "先找邊界，再列出來數", "alt": "換個方式想：這就像「數樓層」。從地下 1 樓數到地下 7 樓有幾層？直接寫下來 −1、−2、−3、−4、−5、−6、−7，數一數是 7 層。與其想公式，不如老實列——國一的題目範圍都不大，列出來最安全。只要記得先確認最遠可以到哪裡（邊界含不含）。", "pre": [{"q": "「小於 8」這句話包含 8 嗎？「小於等於 8」呢？", "a": "小於 8 不包含 8；小於等於 8 才包含。"}, {"q": "0 是正整數還是負整數？", "a": "都不是，0 就是 0。"}], "widget": "", "ask": "我卡在【數幾個整數：先算邊界再列】，可以教我嗎？", "signal": {"see": "題目問「共有幾個」「可能的值有幾個」，並給一個範圍（如 |甲|＜8、甲 ≦ |−5 3/7|）", "think": "先算邊界，再列出來數", "do": "把邊界算成小數寫下來，判斷含不含等號，然後從離 0 最近的整數開始列到邊界"}}};
const mastered = new Set();   // 跨題：前面 ✓ 過的觀念
let NID = 0;


// ---------- 訊號：看到什麼 → 想到什麼 → 做什麼 ----------
function sigCard(c) {
  const g = c.signal; if (!g) return '';
  return `<div class="sig"><div class="sg1">👀 看到　${esc(g.see)}</div>
    <div class="sg2">💡 想到　${esc(g.think)}</div>
    <div class="sg3">✏️ 就做　${esc(g.do)}</div></div>`;
}
function signalTable(keys = null) {
  const rows = (keys || Object.keys(CONCEPTS)).filter(k => CONCEPTS[k] && CONCEPTS[k].signal).map((k, i) => {
    const g = CONCEPTS[k].signal;
    return `<tr data-row="${i}"><td class="see">${esc(g.see)}</td>
      <td class="th"><span class="hid">${esc(g.think)}</span></td>
      <td class="dd"><span class="hid">${esc(g.do)}</span></td></tr>`;
  }).join('');
  const types = (keys ? [] : (GUIDED_C['題型訊號'] || [])).map(g =>
    `<tr class="ty"><td class="see">${esc(g.see)}</td><td class="th"><span class="hid">${esc(g.think)}</span></td><td class="dd"><span class="hid">${esc(g.do)}</span></td></tr>`).join('');
  return `<details class="sigbox"><summary>📌 訊號表：看到什麼 → 想到什麼 → 做什麼</summary>
    <div class="sigtip">右邊兩欄是蓋住的，先自己想，點一下才翻開。<button class="gbtn" data-act="sigall">全部翻開／蓋回去</button></div>
    <table class="sigtb"><thead><tr><th>👀 看到</th><th>💡 想到</th><th>✏️ 就做</th></tr></thead>
    <tbody>${rows}${types ? `<tr class="sep"><td colspan="3">↓ 整題型的訊號（比單一觀念高一層）</td></tr>${types}` : ''}</tbody></table></details>`;
}


// ---------- 觀念總表：第五冊每個觀念都能單獨學（問→看答案→✓/✗→重講三層→念口訣） ----------
const LS_KEY = 'xm_mastered_v1';           // 舊：只記有沒有過
const LS2 = 'xm_mastery_v2';                 // 新：{cid:{n, last, next, st}}  st: once / stable / failed
const DAY = 86400000;
const today = () => new Date(new Date().toDateString()).getTime();
function loadMastery() {
  let m = {}; try { m = JSON.parse(localStorage.getItem(LS2) || '{}') || {}; } catch (e) { m = {}; }
  try { JSON.parse(localStorage.getItem(LS_KEY) || '[]').forEach(cid => { if (!m[cid]) m[cid] = { n: 1, last: today(), next: today() + 2 * DAY, st: 'once' }; }); } catch (e) {}
  return m;
}
const MASTERY = loadMastery();
function saveMastery() { try { localStorage.setItem(LS2, JSON.stringify(MASTERY)); localStorage.setItem(LS_KEY, JSON.stringify(Object.keys(MASTERY).filter(k => MASTERY[k].n >= 1))); } catch (e) {} }
function saveMastered() { saveMastery(); }
const everMastered = { has: cid => !!(MASTERY[cid] && MASTERY[cid].n >= 1) };
// 過關：第 1 次 → 2 天後複習；第 2 次 → 7 天後；第 3 次起 → 21 天後（段考前）
function recordPass(cid) {
  const m = MASTERY[cid] || { n: 0 }; m.n = (m.n || 0) + 1; m.last = today();
  m.next = today() + (m.n === 1 ? 2 : m.n === 2 ? 7 : 21) * DAY; m.st = m.n >= 2 ? 'stable' : 'once';
  MASTERY[cid] = m; saveMastery();
}
// 複習時答錯：退回未過關，明天再來
function recordFail(cid) { MASTERY[cid] = { n: 0, last: today(), next: today() + DAY, st: 'failed' }; saveMastery(); }
function dueList() { const t = today(); return Object.keys(MASTERY).filter(k => CONCEPTS[k] && MASTERY[k].n >= 1 && MASTERY[k].next <= t); }
function stateMark(cid) { const m = MASTERY[cid]; if (!m) return ''; return m.st === 'stable' ? '✓✓' : m.st === 'once' ? '✓' : '✗'; }
function summaryLine() {
  const v = Object.values(MASTERY); const st = v.filter(m => m.st === 'stable').length, on = v.filter(m => m.st === 'once').length, f = v.filter(m => m.st === 'failed').length;
  return `✓✓ 穩 ${st}　✓ 過一次 ${on}　✗ 要重學 ${f}　今天該複習 ${dueList().length}`;
}
function renderReviewBox() {
  const due = dueList(); const el = document.getElementById('review-box'); if (!el) return;
  el.innerHTML = `<div class="rvhead"><b>📅 今天該複習</b><span class="rvsum">${summaryLine()}</span></div>` +
    (due.length ? `<div class="rvtip">過關 2 天、7 天後會再考一次；答對就更穩，答錯退回去重學。</div>` + due.map(cid => conceptNode(cid, esc(CONCEPTS[cid].retest.q), esc(CONCEPTS[cid].retest.a), { tag: '複習・' + CONCEPTS[cid].name, review: true })).join('')
      : `<div class="rvtip">今天沒有到期的。去下面點新的觀念，或看章節旁邊的進度。</div>`);
}
function chapterProgress(ch) {
  const keys = ch.sections.flatMap(sc => sc.keys).filter(k => CONCEPTS[k]);
  const done = keys.filter(k => everMastered.has(k)).length;
  return `${done}／${keys.length}`;
}
function renderConcepts() {
  const chapters = GUIDED_C['章節'] || []; if (!chapters.length) return;
  const tabs = document.getElementById('tabs'), main = document.getElementById('main');
  const t = document.createElement('button'); t.className = 'tab'; t.role = 'tab'; t.id = 'tab-concepts'; t.textContent = '第五冊觀念'; t.setAttribute('aria-selected', 'false'); t.onclick = () => show('concepts'); tabs.appendChild(t);
  const sec = document.createElement('section'); sec.className = 'set'; sec.id = 'set-concepts';
  let h = `<div class="setsub">第五冊（九上）每一個觀念都在這裡。點開一個 → 先自己想 → 看答案 → 答對就念口訣過關；不會就一層一層重講到會。<br>過關會記在這台手機／電腦上，換裝置不會帶過去。</div><div id="review-box" class="rvbox"></div>`;
  chapters.forEach((ch, ci) => {
    h += `<div class="chap" data-ch="${ci}"><h2>${esc(ch.title)} <span class="chprog" data-chprog="${ci}">${chapterProgress(ch)} 過關</span></h2>`;
    ch.sections.forEach(sc => {
      const keys = sc.keys.filter(k => CONCEPTS[k]); if (!keys.length) return;
      h += `<h3 class="secttl">${esc(sc.title)}</h3>`;
      keys.forEach(k => {
        const c = CONCEPTS[k]; const was = everMastered.has(k); const mk = stateMark(k);
        h += `<details class="cbox${was ? ' was' : ''}${mk === '✗' ? ' failed' : ''}" data-cid="${k}"><summary><span class="cname">${esc(c.name)}</span><span class="csee">${c.signal ? '👀 ' + esc(c.signal.see) : ''}</span><span class="cmark">${mk}</span></summary>
          <div class="cbody">${sigCard(c)}${conceptNode(k, esc(c.confirm.q), esc(c.confirm.a))}</div></details>`;
      });
    });
    h += `</div>`;
  });
  sec.innerHTML = h; main.appendChild(sec); renderReviewBox();
  sec.addEventListener('click', onGuidedClick);
  sec.addEventListener('input', e => { const w = e.target.closest('[data-widget]'); if (w) WIDGETS[w.dataset.widget].update(w.closest('.widget'), +w.value); });
}
function markConceptBox(cid) {
  document.querySelectorAll(`.cbox[data-cid="${cid}"]`).forEach(b => { const mk = stateMark(cid); b.classList.toggle('was', mk.startsWith('✓')); b.classList.toggle('failed', mk === '✗'); const m = b.querySelector('.cmark'); if (m) m.textContent = mk; });
  const rs = document.querySelector('.rvsum'); if (rs) rs.textContent = summaryLine();
  const chapters = GUIDED_C['章節'] || [];
  chapters.forEach((ch, ci) => { const e = document.querySelector(`[data-chprog="${ci}"]`); if (e) e.textContent = chapterProgress(ch) + ' 過關'; });
}

// ---------- 三年全部觀念地圖：冊 → 章 → 節 → 觀念；已做好教學的可點過去 ----------

      });

  const visibleNodes = [...stage.querySelectorAll('.node')].filter(n => !n.closest('[hidden]'));
  const allDone = visibleNodes.length > 0 && visibleNodes.every(n => n.classList.contains('done'));
  const nx = q$(stage, '.next'); if (nx) nx.disabled = !allDone;

function onGuidedClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  const act = b.dataset.act; const node = b.closest('.node'); const stage = b.closest('.stage');
  if (b.dataset.next) {

    case 'ng2': { const t = q$(node, '.teach'); showEl(q$(t, '.judge2'), false); q$(t, '[data-act="peek2"]').hidden = false; q$(t, '[data-act="peek2"]').nextElementSibling.hidden = true; t.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    case 'ok2': showEl(q$(node, '.judge2'), false); showEl(q$(node, '.retest-l')); showEl(q$(node, '.retest')); break;

    case 'finalrecite': { const gp = stage.closest('.gp'); if (!gp) break; showEl(b.closest('.recite'), false); showEl(q$(stage, '.finish')); document.getElementById('prog-' + gp.id.slice(3)).textContent = '進度：完成 🎉'; break; }
  }
}

      const inp=document.getElementById('vin'); inp.focus(); inp.onkeydown=e=>{ if(e.key!=='Enter') return; const good=accept(w.en,inp.value); mark(w,good); if(good) ok++; inp.disabled=true; say(w.en); area.querySelector('.fb').innerHTML=`<div class="verdict ${good?'ok':'no ng'}"><span>${good?'✓ 對了':'✗ 是 <b>'+esc(w.en)+'</b>'}</span></div><button class="gbtn" id="vnext">下一個 →</button>`; const nb=document.getElementById('vnext'); nb.focus(); nb.onclick=()=>{ i++; one(); }; }; }; one(); }
  function choose(list,after){ const area=document.getElementById('varea'); let i=0, ok=0; const pool=ALL.length>=4?ALL:BANK; const one=()=>{ if(i>=list.length){ area.innerHTML=`<div class="finish">🎉 選完了：${ok}／${list.length}</div>`; if(after==='done'){ D.done[today]=Object.assign(D.done[today]||{},{drill:true}); save(); setTimeout(home,1500); } return; } const w=list[i]; const others=rnd(pool.filter(x=>x.en!==w.en&&x.zh!==w.zh),dayNo+i).slice(0,3); const opts=rnd([w].concat(others),dayNo*7+i);
      area.innerHTML=`<article class="vq"><div class="num"><span>${i+1}／${list.length}</span></div><div class="stem" style="font-size:22px">${esc(w.en)}${w.pos?` <span class="pt">${esc(w.pos)}</span>`:''} <button class="vsay" data-say="${esc(w.en)}">🔊</button></div><div class="vopts">${opts.map((o,k)=>`<button class="vopt" data-k="${k}">${esc(o.zh)}</button>`).join('')}</div><div class="fb"></div></article>`; say(w.en);
      area.querySelectorAll('.vopt').forEach(b=>b.onclick=()=>{ const good=opts[+b.dataset.k].en===w.en; mark(w,good); if(good) ok++; area.querySelectorAll('.vopt').forEach((x,k)=>{ x.disabled=true; if(opts[k].en===w.en) x.classList.add('right'); else if(x===b) x.classList.add('wrong'); }); area.querySelector('.fb').innerHTML=`<button class="gbtn" id="vnext">下一個 →</button>`; document.getElementById('vnext').onclick=()=>{ i++; one(); }; }); }; one(); }
  function drillList(n){ const nw=(D.done[today]&&D.done[today].newList||[]).map(en=>byEn[en]).filter(Boolean); const due=dueList().filter(w=>!nw.includes(w)); const old=introduced().filter(w=>!nw.includes(w)&&!due.includes(w)); return nw.concat(rnd(due,dayNo), rnd(old,dayNo+3)).slice(0,n); }
  sec.addEventListener('click',e=>{ const s=e.target.closest('[data-say]'); if(s){ say(s.dataset.say); return; } const b=e.target.closest('[data-v]'); if(!b) return; const m=b.dataset.v;
    if(m==='place') place(); else if(m==='new') learn(); else if(m==='newdone'){ D.done[today]=Object.assign(D.done[today]||{},{newDone:true}); save(); spell(drillList(10),'choose'); }
    else if(m==='spell') spell(drillList(10),'choose'); else if(m==='choose') choose(drillList(10),'done'); else if(m==='all') choose(rnd(introduced().concat(UNIT),dayNo).slice(0,40));
    else if(m==='unit'){ const u=rnd(UNIT,dayNo); document.getElementById('varea').innerHTML=`<div class="vlearn">${UNIT.map(w=>`<div class="vcard"><div class="ven">${esc(w.en)} <span class="pt">${esc(w.pos||'')}</span> <button class="vsay" data-say="${esc(w.en)}">🔊</button></div><div class="vzh">${esc(w.zh)}</div></div>`).join('')}</div><button class="gbtn" data-v="unitspell">拼這課 10 個</button> <button class="gbtn" data-v="unitchoose">選這課 10 個</button>`; }
    else if(m==='unitspell') spell(rnd(UNIT,dayNo).slice(0,10)); else if(m==='unitchoose') choose(rnd(UNIT,dayNo+1).slice(0,10));
    else if(m==='list'){ const rows=BANK.filter(w=>D.known[w.en]||D.intro[w.en]); document.getElementById('varea').innerHTML=`<div style="font-size:13px;color:var(--mute);margin:6px 0">認得 ${Object.keys(D.known).length}・學過 ${introduced().length}・到期 ${dueList().length}・連續天數 ${Object.keys(D.done).filter(k=>D.done[k].drill).length} 天有做</div><table class="vt"><thead><tr><th>英文</th><th>中文</th><th>狀態</th></tr></thead><tbody>${rows.slice(-120).reverse().map(w=>{ const s=S[w.en]; return `<tr><td>${esc(w.en)}</td><td>${esc(w.zh)}</td><td>${D.known[w.en]?'認得':(!s?'新':(isDue(w)?'到期':(s.next?'回來中':(s.ok>=2?'畢業':'學過'))))}</td></tr>`; }).join('')}</tbody></table>`; } });
  home();
})();

// ---- 兩層導覽：上層只有科目，下層才是該科的各份內容 ----
(function(){
  const SUBJ = {math:['數學','練習卷'], guided7:['數學','今天的作業'], eng:['英文','練習卷'], eng7np:['英文','補洞'], chi:['國文','練習卷'],
                bio:['生物','練習卷'], bio7a:['生物','動畫'], bio7w:['生物','錯題'], bio7c:['生物','填空卡'],
                emo:['英文','情緒動詞 50'], vocab:['英文','單字'], guided:['數學','引導解題'], concepts:['數學','第五冊觀念'], practice:['數學','獨自練習'], allmap:['數學','三年地圖']};
  const tabs=document.getElementById('tabs'); const old=[...tabs.querySelectorAll('.tab')]; if(old.length<3) return;
  const groups=[]; const byS={};
  old.forEach(t=>{ const key=t.id.slice(4); const [subj,label]=SUBJ[key]||['其他', t.textContent.replace(/^✓ /,'')]; if(!byS[subj]){ byS[subj]={subj, items:[]}; groups.push(byS[subj]); } byS[subj].items.push({key,label,tab:t}); });
  const bar=document.createElement('div'); bar.className='tabs subjbar'; bar.setAttribute('role','tablist');
  const sub=document.createElement('div'); sub.className='tabs subbar'; sub.hidden=true;
  tabs.style.display='none'; const hub=document.querySelector('.hub'); if(hub){ bar.classList.add('inhub'); hub.appendChild(bar); hub.after(sub); } else { tabs.after(bar); bar.after(sub); }
  function renderSub(subj){ const g=byS[subj]; sub.innerHTML=g.items.map(it=>`<button class="tab sub" data-key="${it.key}">${esc(it.label)}${it.tab.dataset.fin?' ✓':''}</button>`).join(''); sub.hidden=false; }
  function mark(key){ const g=groups.find(g=>g.items.some(i=>i.key===key)); if(!g) return; bar.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.subj===g.subj)); if(sub.dataset.subj!==g.subj){ renderSub(g.subj); sub.dataset.subj=g.subj; } sub.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.key===key)); }
  bar.innerHTML=groups.map(g=>`<button class="tab" data-subj="${esc(g.subj)}">${esc(g.subj)}</button>`).join('');
  bar.addEventListener('click',e=>{ const b=e.target.closest('[data-subj]'); if(!b) return; const g=byS[b.dataset.subj]; show(g.items[0].key); });
  sub.addEventListener('click',e=>{ const b=e.target.closest('[data-key]'); if(!b) return; show(b.dataset.key); });
  const _show=window.show; window.show=function(key){ _show(key); mark(key); };
  const cur=document.querySelector('.set.on'); if(cur) mark(cur.id.slice(4));
})();
