.xma{padding:8px 0;border-top:1px dashed var(--line)} .xma .q{font-size:13.5px;color:var(--mute)} .xma .q .t{font-size:11.5px;margin-left:6px} .xma .a{margin-top:4px;white-space:pre-wrap;line-height:1.55} .xma.new .a{background:var(--good-soft);border-radius:8px;padding:6px 8px}
.xme{font-size:13px;color:var(--mute)} .xmup{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);display:grid;gap:6px} .xmup span{font-size:12.5px;color:var(--mute)} .xmup input[type=text]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--tab);color:var(--ink)} .xmm{font-size:12.5px;color:#2E8B57;min-height:1.2em}
.xmtoggle{cursor:pointer;align-items:center} .xmtoggle b{font-size:14px} .xmarw{margin-left:6px;font-size:12px}
.xmpanel .askbox.inpanel{margin:0 0 8px;border:0;padding:0;background:transparent}
.askbox{margin:8px 0;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper)}.askbox .eh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-bottom:6px}.askbox .ar{display:flex;gap:8px}.askbox input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--tab);color:var(--ink)}.askbox .am{font-size:12.5px;color:#2E8B57;margin-top:4px;min-height:1.2em}</style></head><body>
<header><div class="wrap">
<div class="brand"><h1>單字<small>一年 2000 字，一天 6 個</small></h1><div class="score" id="score"></div></div>
<div id="askbox" class="askbox" hidden><div class="eh"><b>🙋 我卡在這題</b><span>打一句就好，隔天早上小咪回妳</span></div><div class="ar"><input id="asktxt" type="text" maxlength="200" placeholder="例：take 和 spend 我一直搞混"><button class="gbtn" id="asksend" type="button">送出</button></div><div id="askmsg" class="am"></div></div>
<div class="tabs" role="tablist" id="tabs"></div>
</div></header>
<main class="wrap" id="main"></main>
<script>
const CIRC = '①②③④⑤⑥⑦⑧';

const DATA = [];
const L = 'ABCD';
const state = {}; // key -> {n: {picked, ok}}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
  const tabs=document.getElementById('tabs'), main=document.getElementById('main');
  DATA.forEach((set,i)=>{
    const t=document.createElement('button'); t.className='tab'; t.role='tab'; t.id='tab-'+set.key; t.textContent=set.title; t.setAttribute('aria-selected', i===0); t.onclick=()=>show(set.key); tabs.appendChild(t);
    const sec=document.createElement('section'); sec.className='set'+(i===0?' on':''); sec.id='set-'+set.key;
    let h=`<div class="setsub">${esc(set.sub)}　·　${set.items.length} 題　<button class="reset" data-reset="${set.key}">重做這份</button></div>`;
    let lastSec='';
    set.items.forEach(q=>{
      if(q.section && q.section!==lastSec){ h+=`<div class="sec">${esc(q.section)}</div>`; lastSec=q.section; }
      if(q.passage){ h+=`<div class="passage">${q.passage}</div>`; }
      const hasOpts=q.opts.length>=3 && q.opts.length<=4;
      h+=`<article class="q" id="q-${set.key}-${q.n}" data-key="${set.key}" data-n="${q.n}"><div class="num"><span>${q.n}</span><span class="src">${esc(q.src)}</span></div>${q.notyet?`<div class="notyet">⏳ ${esc(q.notyet)}</div>`:''}<div class="stem">${q.stem}</div>`;
      if(hasOpts){ h+=`<div class="opts">`+q.opts.map((o,j)=>`<button class="opt" data-k="${L[j]}"><span class="k">${L[j]}</span><span>${o}</span></button>`).join('')+`</div>`; }
      else { h+=`<button class="reveal">看答案</button>`; }
      h+=`<div class="fb"></div></article>`;
    });
    h+=`<div class="done-all">寫完了就往上看分數；想再練一次按「重做這份」🐱</div>`;
    sec.innerHTML=h; main.appendChild(sec);
  });
  main.addEventListener('click',e=>{
    const opt=e.target.closest('.opt'), rev=e.target.closest('.reveal'), rs=e.target.closest('[data-reset]');
    if(rs){ resetSet(rs.dataset.reset); return; }
    const art=e.target.closest('.q'); if(!art) return;
    if(opt && !art.classList.contains('done')) answer(art, opt.dataset.k);
    if(rev && !art.classList.contains('done')) reveal(art);
  });
  updateScore();
  DATA.filter(s=>s.drill).forEach(s=>drillBox(s.key));
}
function getQ(art){ const set=DATA.find(s=>s.key===art.dataset.key); return [set, set.items.find(q=>q.n==art.dataset.n)]; }
function answer(art,k){
  const [set,q]=getQ(art); const ok = k===q.ans;
  art.classList.add('done');
  art.querySelectorAll('.opt').forEach(b=>{ if(b.dataset.k===q.ans) b.classList.add('right'); else if(b.dataset.k===k) b.classList.add('wrong'); });
  art.querySelector('.fb').innerHTML = `<div class="verdict ${ok?'ok':'no'}"><span>${ok?'答對了 ✓':'再想想 ✗'}</span><span class="a">正解 ${esc(q.ans)}</span></div>` + why(q);
  (state[set.key] ||= {})[q.n] = {ok}; logEvent(set.key+':'+q.n, k, ok);
  if(set.drill) drillRecord(set, q, ok, art.dataset.review==='1');
  updateScore();
}
// ---- 補洞練習的「錯題回來」：錯→2 天、對→7 天、連對兩次畢業（localStorage）----
const LSD='xm_drill_wrong_v1', DAYMS=86400000, todayMs=()=>new Date(new Date().toDateString()).getTime();
function drillLoad(){ try{ return JSON.parse(localStorage.getItem(LSD)||'{}')||{}; }catch(e){ return {}; } }
const DRILLW=drillLoad();
function drillSave(){ try{ localStorage.setItem(LSD, JSON.stringify(DRILLW)); }catch(e){} }
function drillRecord(set,q,ok,isReview){
  const id=set.key+':'+q.n; const w=DRILLW[id];
  if(!ok){ DRILLW[id]={key:set.key,n:q.n,streak:0,next:todayMs()+2*DAYMS}; }
  else if(w){ w.streak=(w.streak||0)+1; if(w.streak>=2) delete DRILLW[id]; else w.next=todayMs()+7*DAYMS; }
  drillSave(); drillBox(set.key);
}
function drillBox(key){
  const sec=document.getElementById('set-'+key); if(!sec) return; let box=sec.querySelector('.drillbox');
  if(!box){ box=document.createElement('div'); box.className='drillbox'; sec.insertBefore(box, sec.querySelector('.setsub').nextSibling); }
  const set=DATA.find(s=>s.key===key); const t=todayMs();
  const due=Object.values(DRILLW).filter(w=>w.key===key && w.next<=t).map(w=>set.items.find(q=>q.n==w.n)).filter(Boolean);
  const all=Object.values(DRILLW).filter(w=>w.key===key).length;
  let h=`<div class="rvhead"><b>📅 錯題回來</b><span class="rvsum">名單 ${all} 題・今天到期 ${due.length} 題</span></div>`;
  if(due.length){ h+=due.map(q=>`<article class="q" data-key="${key}" data-n="${q.n}" data-review="1"><div class="num"><span>再考</span><span class="src">${esc(q.section||'')}</span></div><div class="stem">${q.stem}</div>${q.opts.length?`<div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-k="${L[j]}"><span class="k">${L[j]}</span><span>${o}</span></button>`).join('')}</div>`:`<button class="reveal">看答案</button>`}<div class="fb"></div></article>`).join(''); }
  else h+=`<div class="rvtip">${all?'今天沒有到期的，2 天後再來。':'答錯的題會記在這裡，2 天後回來再考一次。'}</div>`;
  box.innerHTML=h;
}

function reveal(art){
  const [set,q]=getQ(art); art.classList.add('done');
  art.querySelector('.reveal').hidden = true;
  art.querySelector('.fb').innerHTML = `<div class="verdict ok"><span>答案</span><span class="a" style="font-family:inherit;font-size:16px">${q.ans}</span></div>` + why(q) + (set.cards ? `<div class="cjudge"><button class="gbtn ok" data-cj="1">✓ 我記得</button><button class="gbtn ng" data-cj="0">✗ 我忘了，2 天後再考我</button></div>` : '');
  (state[set.key] ||= {})[q.n] = {ok:null};
  updateScore();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-cj]'); if (!b) return;
  const art = b.closest('.q'); const [set, q] = getQ(art); const ok = b.dataset.cj === '1';
  (state[set.key] ||= {})[q.n] = {ok}; logEvent(set.key+':'+q.n, ok?'remember':'forgot', ok); b.closest('.cjudge').innerHTML = ok ? '<span class="donemark">✓ 記得</span>' : '<span class="stuck">記下來了，2 天後會回來</span>';
  if (set.drill) drillRecord(set, q, ok, art.dataset.review === '1'); updateScore();

function why(q){ return q.why ? `<div class="why"><b>為什麼：</b>${esc(q.why)}</div>` : ''; }
function updateScore(){
  const cur=document.querySelector('.set.on'); if(!cur) return;
  const key=cur.id.slice(4); const st=state[key]||{}; const set=DATA.find(s=>s.key===key);
  if(!set){ document.getElementById('score').innerHTML='<b>引導</b>模式'; return; }
  const done=Object.keys(st).length, ok=Object.values(st).filter(v=>v.ok===true).length, scored=Object.values(st).filter(v=>v.ok!==null).length;
  document.getElementById('score').innerHTML = `<b>${ok}</b>/${scored} 對　·　${done}/${set.items.length} 已作答`;

function show(key){
  document.querySelectorAll('.set').forEach(s=>s.classList.toggle('on', s.id==='set-'+key));
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.id==='tab-'+key));

}
function resetSet(key){
  state[key]={};
  document.querySelectorAll(`#set-${key} .q`).forEach(a=>{ a.classList.remove('done'); a.querySelectorAll('.opt').forEach(b=>b.classList.remove('right','wrong')); const r=a.querySelector('.reveal'); if(r) r.hidden=false; a.querySelector('.fb').innerHTML=''; });

}

        function slots(){
          return ch.map(function(c, k){
            if(!/[A-Za-z]/.test(c)) return '<span class="xmg-gap">' + (c === ' ' ? '&nbsp;' : esc(c)) + '</span>';
            return '<span class="xmg-sl' + (shown[k] ? ' on' : '') + '">' + (shown[k] ? esc(c) : '') + '</span>';
          }).join('');
        }
        function keys(){
          return ROWS.map(function(r){
            return '<div class="xmg-krow">' + r.split('').map(function(L){
              var s = used[L] ? (' ' + used[L]) : '';
              return '<button type="button" class="xmg-key' + s + '" data-g="key" data-k="' + L + '"'
                   + (used[L] ? ' disabled' : '') + '>' + L + '</button>';
            }).join('') + '</div>';
          }).join('');
        }
        function draw(){
          st.innerHTML = '<div class="xmg-panel">'
            + '<div class="xmg-hd">🔤 猜字　<span>' + (i+1) + '／' + ws.length + '　猜錯沒關係，字母只會變灰</span></div>'
            + '<div class="xmg-zh">' + esc(w.zh) + (w.pos ? ' <i>' + esc(w.pos) + '</i>' : '') + '</div>'
            + '<div class="xmg-slots" id="xmg-slots">' + slots() + '</div>'
            + '<div class="xmg-fb" id="xmg-fb">' + (streak >= 3 ? '<span class="xmg-fire">🔥 連對 ' + streak + '</span>' : '') + '</div>'
            + '<div class="xmg-kb" id="xmg-kb">' + keys() + '</div>'
            + '<div class="xmg-btns"><button type="button" class="xmg-go ghost" data-g="reveal">看答案</button>'
            + '<button type="button" class="xmg-go ghost" data-g="close">先回去</button></div>'
            + '</div>';
        }
        function redraw(){
          var a = st.querySelector('#xmg-slots'); if(a) a.innerHTML = slots();
          var b = st.querySelector('#xmg-kb'); if(b) b.innerHTML = keys();
        }
        function hit(L){
          if(ended) return;
          var got1 = false;
          ch.forEach(function(c, k){
            if(c.toLowerCase() === L && !shown[k]){ shown[k] = true; got1 = true; }
          });
          used[L] = got1 ? 'good' : 'bad';
          redraw();
          if(got1 && full()) win();
        }
        function win(){
          ended = true;
          V.mark(w, true); addXp(2); xp += 2; streak++; if(streak > best) best = streak;
          got.push(w);
          try{ V.say(w.en); }catch(e){}
          var fb = st.querySelector('#xmg-fb');
          if(fb) fb.innerHTML = '<span class="ok">✓ 拼出來了！' + esc(w.en) + '</span>'
            + (streak >= 3 ? '　<span class="xmg-fire">🔥 連對 ' + streak + '</span>' : '')
            + ' <button type="button" class="xmg-go" data-g="next">下一個 →</button>';
          var kb = st.querySelector('#xmg-kb'); if(kb) kb.innerHTML = '';
        }
        function reveal(){
          if(ended) return;
          ended = true;
          shown = shown.map(function(){ return true; });
          streak = 0;
          V.mark(w, false);
          try{ V.say(w.en); }catch(e){}
          redraw();
          var fb = st.querySelector('#xmg-fb');
          if(fb) fb.innerHTML = '<span class="no">答案是 <b>' + esc(w.en) + '</b>，這個字過幾天會再回來喵</span>'
            + ' <button type="button" class="xmg-go" data-g="next">下一個 →</button>';
          var kb = st.querySelector('#xmg-kb'); if(kb) kb.innerHTML = '';
        }
        cur = { hit: hit, reveal: reveal, next: function(){ i++; step(); } };
      }
    }

    // ---------- 我的累積 ----------
    function statsPanel(){
      var g = gradCount(), kn = knownCount(), due = V.dueList().length, days = activeDays(), s = streakDays();
      var h = '<div class="xmg-panel">';
      h += '<div class="xmg-hd">📦 我的累積　<span>慢慢來，這些都是妳自己走出來的</span></div>';
      h += '<div class="xmg-nums">'
         + tile('📅', days, '天有做')
         + tile('🎓', g, '個字畢業')
         + tile('👀', kn, '個字認得')
         + tile('⏰', due, '個字到期')
         + (s >= 2 ? tile('🔥', s, '天連續') : '')
         + '</div>';
      h += '<div class="xmg-wall">' + BADGES.map(function(b){
             var on = G.badges[b.k];
             return '<div class="xmg-bg' + (on ? ' on' : '') + '">'
                  + '<div class="e">' + b.e + '</div>'
                  + '<div class="n">' + esc(b.n) + '</div>'
                  + '<div class="c">' + (on ? esc(on) + ' 拿到' : esc(b.c)) + '</div></div>';
           }).join('') + '</div>';
      h += '<div class="xmg-btns"><button type="button" class="xmg-go ghost" data-g="close">收起來</button></div>';
      h += '</div>';
      stage().innerHTML = h;
    }
    function tile(e, n, t){
      return '<div class="xmg-tile"><div class="e">' + e + '</div><div class="n">' + n + '</div><div class="t">' + t + '</div></div>';
    }

    // ---------- 事件 ----------
    root.addEventListener('click', function(ev){
      var b = ev.target.closest('[data-g]');
      if(!b) return;
      var a = b.dataset.g;
      if(a === 'mem'){ memGame(); }
      else if(a === 'guess'){ guessGame(); }
      else if(a === 'stats'){ statsPanel(); }
      else if(a === 'close'){ stage().innerHTML = ''; refreshHead(); }
      else if(a === 'again'){ if(lastGame) lastGame(); }
      else if(a === 'say'){ try{ V.say(b.dataset.en); }catch(e){} }
      else if(a === 'isle'){
        var idx = +b.dataset.i, g = gradCount(), cur = Math.min(39, Math.floor(g / 50));
        var m = root.querySelector('#xmg-mapmsg');
        if(!m) return;
        if(idx < cur) m.innerHTML = '第 <b>' + (idx+1) + '</b> 座島已經點亮了 ✨';
        else if(idx === cur) m.innerHTML = '這座島還差 <b>' + ((cur+1)*50 - g) + '</b> 個字。';
        else m.innerHTML = '第 <b>' + (idx+1) + '</b> 座島還沒到，先把現在這座走完喵～';
      }
      else if(a === 'key' || a === 'reveal' || a === 'next'){
        if(guessGame.route) guessGame.route(a, b.dataset.k);
      }
    });

    mount();
    render();
  }

  if(window.XMV) boot();
  else document.addEventListener('xmv-ready', function(){ boot(); }, false);
})();
