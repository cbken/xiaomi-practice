[{"concept": "fac_def", "q": "「4x−1 是 12x²＋kx−1 的因式」代表什麼？", "a": "12x²＋kx−1 可以寫成 (4x−1)×(另一個一次式)。"}, {"concept": "fac_cross", "q": "要得到 12x²，(4x−1) 要乘上誰的 x 項？", "a": "乘 3x。因為 4x×3x＝12x²。"}, {"concept": "fac_check", "q": "把 (4x−1)(3x＋1) 乘開是多少？", "a": "12x²＋4x−3x−1＝12x²＋x−1。"}], "steps": [{"concept": "fac_def", "jingle": "是因式就乘得出來", "guide": "👀 先看到什麼：題目說「4x−1 是它的因式」。💡 那想到什麼？這句話等於告訴我們，12x²＋kx−1 一定可以寫成什麼樣子？", "answer": "寫成 (4x−1)(□x＋□)，另一個括號也是一次式，只是還不知道數字。", "why": "因式就是「乘得出來」的零件。既然 4x−1 是零件之一，那一定還有另一個零件，兩個乘起來就是原式。", "quiz": {"q": "另一個括號會是幾次式？", "a": "一次式。因為一次乘一次才會得到二次。"}}, {"concept": "fac_cross", "jingle": "頭對頭，尾對尾", "guide": "把另一個括號猜出來，用「頭對頭、尾對尾」：兩個括號的 x 項相乘要等於 12x²，常數項相乘要等於 −1。先想 x 項，再想常數。", "answer": "x 項：4x × 3x＝12x² → 另一個括號是 3x…；常數：(−1) × (＋1)＝−1 → 所以是 (3x＋1)。合起來 (4x−1)(3x＋1)。", "why": "頭尾是「已知」的，先用它們把另一個括號釘死，剩下的中間項就會自己跑出來。", "quiz": {"q": "常數項可不可以是 (−1)×(−1)？", "a": "不行，(−1)×(−1)＝＋1，但原式的常數是 −1，所以一正一負才對。"}}, {"concept": "fac_check", "jingle": "中間項就是 k", "guide": "把 (4x−1)(3x＋1) 乘開，中間那一項是多少？那個係數就是 k。", "answer": "4x×1＋(−1)×3x＝4x−3x＝x，所以中間項是 ＋1x，k＝1。", "why": "原式中間是 kx，展開之後中間是 1x，兩邊對照就得到 k＝1。", "quiz": {"q": "如果展開得到的中間項是 −5x，那 k 是多少？", "a": "k＝−5。中間項的係數就是 k。"}}], "final": {"concept": "fac_def", "guide": "把 k 的值對到選項的字母。", "answer": "(C) k＝1", "why": "12x²＋kx−1＝(4x−1)(3x＋1)＝12x²＋x−1，對照中間項得 k＝1。", "check": "兩種檢查都可以。一、乘回去：(4x−1)(3x＋1)＝12x²＋x−1 ✓。二、代根：4x−1＝0 時 x＝1/4，把 1/4 代進 12x²＋x−1 得 12×(1/16)＋1/4−1＝3/4＋1/4−1＝0 ✓ 等於 0，代表 4x−1 真的是它的因式。用長除法也會得到同樣的商 3x＋1，兩條路都通。", "concepts": ["fac_def", "fac_cross", "fac_check"]}}, {"id": "u9", "title": "題 9・（分組人數的列式）", "source": "9/16 複習考・第 9 題", "stem": "百達公司共有員工 240 人報名員工旅遊，公司將員工分成若干組，每組人數比組數多 8。若每組人數 x 人，則下列列式何者正確？　(A) x²+8=240　(B) x(x−8)=240　(C) 240/x −8=x　(D) x(x+8)=240", "warmup": [{"concept": "quad_word", "q": "「每組人數比組數多 8」，反過來說，組數比每組人數怎麼樣？", "a": "組數比每組人數少 8。"}, {"concept": "quad_word", "q": "每組 x 人，那組數要用 x 怎麼表示？", "a": "x−8（因為組數比 x 少 8）。"}, {"concept": "quad_word", "q": "每組 20 人、共 12 組，總共幾人？", "a": "20×12＝240 人。每組人數 × 組數 ＝ 總人數。"}], "steps": [{"concept": "quad_word", "jingle": "題目設誰就是 x", "guide": "👀 先看到什麼：題目已經幫我們設好了「每組人數 x 人」。💡 那想到什麼？這一題裡有兩個未知的東西（每組人數、組數），既然 x 被指定給了每組人數，另一個要怎麼辦？", "answer": "另一個（組數）要用 x 寫出來，不能再設一個新字母。", "why": "一元二次方程式只能有一個未知數。題目設誰是 x，其他的量都要翻譯成 x 的式子。", "quiz": {"q": "這一題裡「總人數 240」是已知還是未知？", "a": "已知，它就是最後等號右邊的那個數字。"}}, {"concept": "quad_word", "jingle": "比它多八就減八", "guide": "重點來了：「每組人數比組數多 8」。x 是每組人數，那組數是 x＋8 還是 x−8？慢慢想，這裡最容易反過來。", "answer": "組數 ＝ x−8。因為「每組人數（x）比組數多 8」，所以組數比 x 少 8。", "why": "誰比誰多，多的那個要減回去才會得到少的那個。x 是多的那一方，所以組數是 x−8。", "quiz": {"q": "如果每組有 20 人，組數是幾組？符合「多 8」嗎？", "a": "20−8＝12 組。20 比 12 多 8 ✓ 符合。"}}, {"concept": "quad_word", "jingle": "人數乘組數是總人", "guide": "最後把兩個接起來：每組人數 × 組數 ＝ 總人數。式子寫出來。", "answer": "x(x−8)＝240。", "why": "總人數是固定的 240，所以「每組人數 × 組數」就要等於 240。", "quiz": {"q": "(D) x(x＋8)＝240 是把什麼弄反了？", "a": "把組數寫成 x＋8，等於說組數比每組人數多 8，跟題目相反。"}}], "final": {"concept": "quad_word", "guide": "把對的列式字母寫下來。", "answer": "(B) x(x−8)=240", "why": "每組 x 人，組數 x−8，兩個相乘等於總人數 240。", "check": "解解看順便檢查：x(x−8)＝240 → x²−8x−240＝0 → (x−20)(x＋12)＝0 → x＝20。每組 20 人、組數 20−8＝12 組，20×12＝240 ✓ 而且 20 比 12 剛好多 8 ✓ 兩個條件都對得上，列式就是對的。這一題最關鍵的一步就是把組數寫成 x−8，抓到它整題就通了。", "concepts": ["quad_word"]}}, {"id": "u10", "title": "題 10・（公式解、先算判別式）", "source": "9/16 複習考・第 10 題", "stem": "利用公式解可得一元二次方程式 5x²+13x−2=0 的兩解為 a、b，且 a<0，求 a 值為何？　(A) (−13+√129)/10　(B) (−13−√129)/10　(C) (−13−√209)/10　(D) (13−√209)/10", "warmup": [{"concept": "quad_formula", "q": "5x²＋13x−2＝0 裡面，a、b、c 分別是多少？", "a": "a＝5、b＝13、c＝−2。（注意 c 是負的）"}, {"concept": "quad_formula", "q": "公式解長什麼樣子？", "a": "x＝(−b ± √(b²−4ac)) ÷ 2a。"}, {"concept": "quad_formula", "q": "√209 大概是多少？（提示：14²＝196、15²＝225）", "a": "介於 14 和 15 之間，大約 14.5。"}], "steps": [{"concept": "quad_formula", "jingle": "先認 a、b、c", "guide": "👀 先看到什麼：題目直接寫「利用公式解」。💡 那想到什麼？公式解有固定的三個動作，第一個動作是什麼？先做那一個。", "answer": "第一個動作是認出 a、b、c：a＝5、b＝13、c＝−2。", "why": "沒先把 a、b、c 寫清楚就開始代，最容易把負號吃掉。先寫下來，一秒鐘的事。", "quiz": {"q": "c 是 2 還是 −2？", "a": "−2。式子是 ⋯−2＝0，所以 c 帶著負號。"}}, {"concept": "quad_formula", "jingle": "先算判別式再代", "guide": "第二個動作：單獨把 b²−4ac 算出來，先不要碰大公式。慢慢算，特別小心 −4ac 這裡的正負號。", "answer": "b²−4ac＝13²−4×5×(−2)＝169−(−40)＝169＋40＝209。", "why": "c 是負的，−4ac 就變成 ＋40，所以是相加不是相減。這一步分開算，數字先落地，代進公式就不會亂。", "quiz": {"q": "如果不小心把 c 當成 ＋2，判別式會變成多少？", "a": "169−40＝129，就會跑去選 (A) 或 (B) 了。"}}, {"concept": "quad_formula", "jingle": "分母是 2a", "guide": "第三個動作：把 a、b 和剛剛的 209 代進公式。分母要寫多少？", "answer": "x＝(−13 ± √209) ÷ (2×5)＝(−13 ± √209)/10。", "why": "分母是 2a＝10，分子的 −b 是 −13。兩個根就是 (−13＋√209)/10 和 (−13−√209)/10。", "quiz": {"q": "(D) 寫成 (13−√209)/10，哪裡不一樣？", "a": "分子的 13 前面少了負號。−b＝−13，不是 13。"}}, {"concept": "quad_formula", "jingle": "要負的就取減號", "guide": "題目要的是 a＜0 那一個。兩個根裡，哪一個是負的？用 √209 大約 14.5 去估估看。", "answer": "(−13＋14.5)/10 ≈ 0.15 是正的；(−13−14.5)/10 ≈ −2.75 是負的。所以 a＝(−13−√209)/10。", "why": "＋√209 那個會把 −13 拉回正的，−√209 那個只會更負。要負的就取減號那一個。", "quiz": {"q": "兩個根相加大約是多少？", "a": "0.15＋(−2.75)＝−2.6，剛好等於 −b/a＝−13/5＝−2.6 ✓ 可以當成快速檢查。"}}], "final": {"concept": "quad_formula", "guide": "把答案的字母寫下來。", "answer": "(C) (−13−√209)/10", "why": "a＝5、b＝13、c＝−2，判別式 169＋40＝209，兩根是 (−13±√209)/10；要負的那一個，所以取減號。", "check": "檢查有兩層。一、判別式：c 是負的，−4ac＝＋40，所以是 209 不是 129，這樣就先刷掉 (A)(B)。二、正負：√209 ≈ 14.46，(−13−14.46)/10 ≈ −2.75 ＜ 0 ✓ 是負的。再把 −2.75 代回原式：5×7.56−35.7−2 ≈ 0 ✓。把公式先框起來抄在旁邊再代，是很好的習慣。", "concepts": ["quad_formula"]}}, {"id": "u11", "title": "題 11・（照規則算出幸運數字）", "source": "9/16 複習考・第 11 題", "stem": "【題組：阿俊說「將你的年齡先加 3，再平方，最後減去 20，所出現數字的個位數字就是你今天的幸運數字」；小雯說「我算出的數字是 304，所以幸運數字是 4」；小婷說「我 13 歲」】小婷今天的幸運數字為多少？　(A) 1　(B) 4　(C) 5　(D) 6", "warmup": [{"concept": "quad_word", "q": "把阿俊的規則照順序寫成算式（年齡設 x）。", "a": "(x＋3)²−20。先加 3、再平方、最後減 20。"}, {"concept": "quad_word", "q": "16² 是多少？", "a": "256。"}, {"concept": "quad_word", "q": "236 的個位數字是多少？", "a": "6。個位就是最右邊那一位。"}], "steps": [{"concept": "quad_word", "jingle": "照順序一句一句翻", "guide": "👀 先看到什麼：題目給的是一串「先…再…最後…」的文字規則。💡 那想到什麼？這種題不要用想的，要把每一句翻成算式、照順序排好。先把規則翻成式子（年齡用 x）。", "answer": "(x＋3)²−20。加 3 在裡面，平方套在外面，最後才減 20。", "why": "順序錯了答案就整個不一樣。像 x²＋3 就是「先平方再加 3」，跟題目說的相反。", "quiz": {"q": "「先平方再加 3」會寫成什麼？跟題目一樣嗎？", "a": "x²＋3，跟題目的 (x＋3)² 不一樣。"}}, {"concept": "quad_word", "jingle": "先算括號再平方", "guide": "小婷 13 歲，把 13 代進去。先算括號裡面是多少，再平方。", "answer": "13＋3＝16，16²＝256。", "why": "括號先算，這是運算順序的基本規則。16² 可以拆成 16×16＝256。", "quiz": {"q": "如果代進去先算成 13²＋3，會得多少？跟 256 差多少？", "a": "169＋3＝172，差很多。順序真的會改變答案。"}}, {"concept": "quad_word", "jingle": "最後減二十取個位", "guide": "最後兩個動作：減 20，然後看個位數字。", "answer": "256−20＝236，個位數字是 6。", "why": "題目要的不是 236，是它的「個位數字」。多讀一次題目問什麼，才不會算對了卻答錯。", "quiz": {"q": "如果是 250，個位數字是多少？", "a": "0。"}}], "final": {"concept": "quad_word", "guide": "把幸運數字對應的字母寫下來。", "answer": "(D) 6", "why": "(13＋3)²−20＝256−20＝236，個位數字是 6。", "check": "倒回去檢查：236＋20＝256，√256＝16，16−3＝13 ✓ 剛好是小婷的年齡，整條規則走回去都對得上。另外提醒自己一句：題目問「個位數字」，答案要寫 6，不是 236。", "concepts": ["quad_word"]}}, {"id": "u12", "title": "題 12・（反推年齡・開平方要取 ±）", "source": "9/16 複習考・第 12 題", "stem": "【同上題組：阿俊的規則是「年齡先加 3，再平方，最後減去 20」；小雯說「我算出的數字是 304」】小雯的年齡為多少歲？　(A) 13　(B) 14　(C) 15　(D) 16", "warmup": [{"concept": "quad_word", "q": "小雯算出 304，把規則反過來寫成方程式（年齡設 x）。", "a": "(x＋3)²−20＝304。"}, {"concept": "quad_sqrt", "q": "如果 (x＋3)²＝324，x＋3 可以是多少？", "a": "x＋3＝18 或 x＋3＝−18。開平方要記得取 ±。"}, {"concept": "quad_sqrt", "q": "18² 是多少？", "a": "324。"}], "steps": [{"concept": "quad_word", "jingle": "已知結果就倒著列", "guide": "👀 先看到什麼：這次題目給的是「算出來的結果 304」，要反過來找年齡。💡 那想到什麼？上一題是代進去算，這一題是列方程式再解。先把方程式列出來。", "answer": "(x＋3)²−20＝304。", "why": "規則沒有變，只是這次 x 是未知的、結果是已知的。把規則原封不動寫下來，再解 x。", "quiz": {"q": "上一題和這一題的式子一樣嗎？", "a": "一樣，都是 (x＋3)²−20，只是上一題代 x、這一題解 x。"}}, {"concept": "quad_complete", "jingle": "先把平方孤立出來", "guide": "要開平方之前，等號左邊必須只剩下那個平方。把 −20 移到右邊去。", "answer": "(x＋3)²＝304＋20＝324。", "why": "移項變號：左邊的 −20 移到右邊變成 ＋20。現在左邊乾乾淨淨只剩一個平方，可以開了。", "quiz": {"q": "為什麼不能直接對 (x＋3)²−20 開平方？", "a": "因為開平方只能對「單獨一個平方」做，後面掛著 −20 就不行。"}}, {"concept": "quad_sqrt", "jingle": "開平方要取正負", "guide": "現在 (x＋3)²＝324。開平方，注意——會有幾個答案？", "answer": "兩個：x＋3＝18 或 x＋3＝−18，所以 x＝15 或 x＝−21。", "why": "18²＝324，(−18)² 也是 324，所以一定要取 ±，不然會漏掉一半。", "quiz": {"q": "只寫 x＋3＝18 會漏掉什麼？", "a": "會漏掉 x＝−21 那個根。雖然這題用不到，但別題可能兩個都要。"}}, {"concept": "quad_word", "jingle": "不合理的要丟掉", "guide": "兩個答案 15 和 −21。這題在問年齡，哪一個要丟掉？為什麼？", "answer": "丟掉 −21，因為年齡不可能是負的。所以小雯 15 歲。", "why": "應用題算出來的根要回到題目的情境檢查。長度、人數、年齡、瓶數都不能是負的。", "quiz": {"q": "如果題目問的是「某個整數」而不是年齡，那 −21 要不要留？", "a": "要留，因為整數可以是負的。要不要丟掉，看題目在問什麼。"}}], "final": {"concept": "quad_word", "guide": "把年齡對應的字母寫下來。", "answer": "(C) 15 歲", "why": "(x＋3)²−20＝304 → (x＋3)²＝324 → x＋3＝±18 → x＝15 或 −21，年齡取 15。", "check": "代回去檢查最快：(15＋3)²−20＝18²−20＝324−20＝304 ✓ 跟小雯說的一樣。開平方的那個 ± 一定要寫，很多人在這裡就漏掉一半的答案。", "concepts": ["quad_word", "quad_complete", "quad_sqrt"]}}, {"id": "u13", "title": "題 13・（平方差・甲乙誰對）", "source": "9/16 複習考・第 13 題", "stem": "吳老師在黑板上寫下一道題目：因式分解 8x²−18。以下是甲、乙兩人的作法（見下表），下列判斷何者正確？　(A) 兩人皆正確　(B) 兩人皆錯誤　(C) 甲正確，乙錯誤　(D) 甲錯誤，乙正確", "figure": "<table style='border-collapse:collapse;margin:10px auto;font-size:14px'><tr><td style='border:1px solid #bbb;padding:6px 10px;vertical-align:top'><b>甲</b></td><td style='border:1px solid #bbb;padding:6px 10px'>8x²−18 ＝ 2(4x²−9) ＝ 2(4x−3)(4x＋3)</td></tr><tr><td style='border:1px solid #bbb;padding:6px 10px;vertical-align:top'><b>乙</b></td><td style='border:1px solid #bbb;padding:6px 10px'>8x²−18 ＝ (2x−3)(4x＋6) ＝ 2(2x−3)(2x＋3)<br><span style='color:#666;font-size:13px'>（乙用十字交乘：上列 2x ／ −3，下列 4x ／ ＋6）</span></td></tr></table>", "warmup": [{"concept": "fac_common", "q": "8x²−18 兩項都有什麼公因數？提出來之後剩什麼？", "a": "都有 2，提出來是 2(4x²−9)。"}, {"concept": "fac_formula", "q": "4x²−9 用平方差拆開是什麼？", "a": "(2x−3)(2x＋3)。因為 4x²＝(2x)²、9＝3²。"}, {"concept": "fac_check", "q": "把 (4x−3)(4x＋3) 乘開是多少？", "a": "16x²−9。"}], "steps": [{"concept": "fac_formula", "jingle": "兩項先提公因數", "guide": "👀 先看到什麼：8x²−18 只有兩項、中間是減號。💡 那想到什麼？兩項的式子，第一個動作永遠是先看有沒有公因數可以提；提完之後再看剩下的是不是平方差。先做第一個動作：8 和 18 的公因數是多少？", "answer": "先提公因數 2：8x²−18＝2(4x²−9)。剩下的 4x²−9 是平方減平方，再用平方差 a²−b²＝(a＋b)(a−b) 拆，而且這裡的 a、b 是「平方根」，不是原來的數字。", "why": "兩項的式子先提公因數，數字會變小、平方根才看得出來。這一題提完 2 之後剩 4x²−9，接著的陷阱就在「a 是平方根」：4x² 的平方根是 2x，不是 4x。", "quiz": {"q": "4x² 的平方根是多少？9 呢？", "a": "4x² 的平方根是 2x（因為 (2x)²＝4x²）；9 的平方根是 3。"}}, {"concept": "fac_formula", "jingle": "開根號才是 a、b", "guide": "來檢查甲。他寫 2(4x²−9)＝2(4x−3)(4x＋3)。提出 2 那一步沒問題，問題在後面——4x²−9 的 a 和 b 到底是誰？", "answer": "a＝2x、b＝3，所以應該是 (2x−3)(2x＋3)。甲寫成 (4x−3)(4x＋3)，把「4x²」的 4x 直接搬下來了 ✗。", "why": "平方差要填進去的是開根號之後的東西。4x 沒有開根號，所以甲錯。", "quiz": {"q": "2(4x−3)(4x＋3) 乘回去是多少？", "a": "2(16x²−9)＝32x²−18，跟 8x²−18 差很多 ✗。"}}, {"concept": "fac_check", "jingle": "乘回去對一次", "guide": "再檢查乙。他寫 (2x−3)(4x＋6)，然後再提出 2 變成 2(2x−3)(2x＋3)。兩個都乘回去對對看。", "answer": "(2x−3)(4x＋6)＝8x²＋12x−12x−18＝8x²−18 ✓；2(2x−3)(2x＋3)＝2(4x²−9)＝8x²−18 ✓。兩步都對。", "why": "乙的第一步雖然長得不太一樣，但乘回去確實等於原式；第二步只是把 4x＋6 裡面的 2 提出來，也沒錯。", "quiz": {"q": "4x＋6 提出 2 之後是什麼？", "a": "2(2x＋3)。"}}, {"concept": "fac_check", "jingle": "兩個都查完再判斷", "guide": "兩個人都查完了：甲乘回去得 32x²−18、乙乘回去得 8x²−18。那答案要選哪一個判斷？", "answer": "甲錯、乙對 → 選「甲錯誤，乙正確」。", "why": "判斷題一定要兩個人都檢查完才下結論，不能看到第一個錯就急著選。", "quiz": {"q": "如果只檢查甲就選了「兩人皆錯誤」，會怎樣？", "a": "會錯。乙其實是對的，一定要兩個都算過。"}}], "final": {"concept": "fac_formula", "guide": "把判斷對應的字母寫下來。", "answer": "(D) 甲錯誤，乙正確", "why": "甲把 4x²−9 拆成 (4x−3)(4x＋3)，乘回去是 16x²−9（整個再乘 2 就是 32x²−18），不等於原式；乙的兩個寫法乘回去都是 8x²−18，正確。", "check": "兩邊都乘回去對原式 8x²−18：甲 2(4x−3)(4x＋3)＝32x²−18 ✗；乙 2(2x−3)(2x＋3)＝8x²−18 ✓。也可以代數字更快，代 x＝1：原式 8−18＝−10；甲 2(4−3)(4＋3)＝14 ✗；乙 2(2−3)(2＋3)＝−10 ✓。代一個小數字檢查因式分解，兩秒鐘就知道對不對，很好用。", "concepts": ["fac_formula", "fac_common", "fac_check"]}}, {"id": "u14", "title": "題 14・（式子的值是質數）", "source": "9/16 複習考・第 14 題", "stem": "已知 x 為正整數，且 2x²−7x+3 為質數，則此質數為何？　(A) 11　(B) 7　(C) 3　(D) 1", "warmup": [{"concept": "quad_prime", "q": "質數是什麼？7 可以寫成哪兩個整數相乘？", "a": "質數是大於 1 的正整數，只有 1 和自己兩個因數。7＝1×7，也可以寫成 (−1)×(−7)，但質數本身一定是正的。"}, {"concept": "fac_cross", "q": "把 2x²−7x＋3 因式分解。", "a": "(x−3)(2x−1)。交叉相乘：x×(−1)＋(−3)×2x＝−x−6x＝−7x ✓。"}, {"concept": "quad_prime", "q": "x＝4 的時候，x−3 和 2x−1 各是多少？", "a": "x−3＝1，2x−1＝7。"}], "steps": [{"concept": "quad_prime", "jingle": "質數先分解", "guide": "👀 先看到什麼：題目說「2x²−7x＋3 為質數」，還有一句「x 為正整數」。💡 那想到什麼？質數只能拆成兩個整數相乘的哪幾種樣子？想清楚這件事，整題就通了。", "answer": "先因式分解成兩個括號相乘，然後其中一個括號只能是 1 或 −1。", "why": "一個質數 p 寫成兩個整數相乘，只有 1×p 和 (−1)×(−p) 兩種。所以一定有一個括號是 1 或 −1，沒有別的可能。", "quiz": {"q": "如果兩個括號算出來是 3 和 5，乘積 15 是質數嗎？", "a": "不是。15 有 3、5 兩個因數，所以兩個括號不可以都不是 ±1。"}}, {"concept": "fac_cross", "jingle": "拆常數對中間", "guide": "第一步先分解。2x²−7x＋3 要拆成兩個括號，先想常數 3 怎麼拆（3＝1×3，中間項是負的，所以兩個都取負）。", "answer": "2x²−7x＋3＝(x−3)(2x−1)。", "why": "交叉相乘檢查：x×(−1)＝−x、(−3)×2x＝−6x，加起來 −7x ✓ 跟中間項一樣。", "quiz": {"q": "(x−1)(2x−3) 乘開是多少？為什麼不對？", "a": "2x²−5x＋3，中間項是 −5x 不是 −7x ✗。"}}, {"concept": "quad_prime", "jingle": "括號設一解 x", "guide": "分解完了，關鍵的下一步來了。先試「＝1」的兩個分支：分別令 x−3＝1 和 2x−1＝1，各解出 x，再把 x 代回去算另一個括號、算出乘積。", "answer": "x−3＝1 → x＝4，這時 2x−1＝7，乘積 1×7＝7 ✓ 是質數。2x−1＝1 → x＝1，這時 x−3＝−2，乘積 (−2)×1＝−2 ✗ 不是質數。", "why": "分解完不是終點。要「設括號＝1 → 解 x → 代回去算另一個括號」，那個算出來的乘積才是題目要的值。", "quiz": {"q": "x＝1 代回原式 2x²−7x＋3 是多少？", "a": "2−7＋3＝−2 ✗ 是負數，不是質數。"}}, {"concept": "quad_prime", "jingle": "負一那邊也要試", "guide": "還沒完，「＝−1」的兩個分支也要走一次。令 x−3＝−1 和 2x−1＝−1，各解出 x 看看。", "answer": "x−3＝−1 → x＝2，這時 2x−1＝3，乘積 (−1)×3＝−3 ✗ 是負數，不是質數。2x−1＝−1 → x＝0，但 0 不是正整數 ✗ 不能用。", "why": "括號可以是 −1，所以這兩個分支一定要試過才算討論完整。這一題兩個都不成立，但別題可能就是靠 −1 那邊得到答案。", "quiz": {"q": "為什麼 −3 不算質數？", "a": "質數規定是大於 1 的正整數，負數一律不算。"}}, {"concept": "quad_prime", "jingle": "正整數才算數", "guide": "四個分支都走完了，只有一個活下來。把那個 x 代回原式 2x²−7x＋3，親手算出它的值。順便看一下：如果剛剛沒注意「x 為正整數」這個條件，會多出哪一個答案？", "answer": "只有 x＝4 留下來：2×16−7×4＋3＝32−28＋3＝7 ✓。另外 x＝0 代進去會得到 3，3 也是質數，但題目規定 x 是正整數，0 不是，所以 3 不能選。", "why": "題目給的每個條件都有用處。「x 為正整數」就是專門用來把 x＝0 擋掉的——沒看到它，就會多出一個 3。", "quiz": {"q": "正整數是從幾開始？", "a": "從 1 開始，0 不算正整數。"}}], "final": {"concept": "quad_prime", "guide": "四個分支都走過了，把質數對應的字母寫下來。", "answer": "(B) 7", "why": "2x²−7x＋3＝(x−3)(2x−1)；四個分支裡只有 x−3＝1（x＝4）成立，這時 2x−1＝7，乘積 1×7＝7 是質數。其餘三個分支得到 −2、−3 或 x＝0，都不合。", "check": "直接代回原式最保險：x＝4 → 2×16−28＋3＝7 ✓。再掃一次小的正整數：x＝1 得 −2、x＝2 得 −3、x＝3 得 0、x＝4 得 7 ✓、x＝5 得 18、x＝6 得 33，只有 x＝4 會得到質數。特別注意選項裡的 3：它是 x＝0 的時候算出來的值，但 0 不是正整數，所以不能選。分解只是第一步，真正的關鍵在後面那半步，記成一句話：質數先分解，括號各試 1 和 −1，再挑正整數的那個代回去。", "concepts": ["quad_prime", "fac_cross"]}}, {"id": "u15", "title": "題 15・（解的意義：代進去會成立）", "source": "9/16 複習考・第 15 題", "stem": "已知一元二次方程式 (ax−3)(ax+5)=3x²−x−17 的一個解是 x=2，其中 a 為整數，則 x=2 也是下列哪個一元二次方程式的解？　(A) (ax−3)(ax+5)=17　(B) (ax−3)(ax+5)=7　(C) (ax−3)(ax+5)=−7　(D) (ax−3)(ax+5)=−17", "warmup": [{"concept": "quad_root_def", "q": "「x＝2 是這個方程式的解」是什麼意思？", "a": "把 2 代進去，等號左右兩邊會相等（式子會成立）。"}, {"concept": "quad_root_def", "q": "把 x＝2 代進 3x²−x−17 得到多少？", "a": "3×4−2−17＝12−2−17＝−7。"}, {"concept": "quad_root_def", "q": "四個選項的左邊一不一樣？", "a": "完全一樣，都是 (ax−3)(ax＋5)。只有右邊的數字不同。"}], "steps": [{"concept": "quad_root_def", "jingle": "代進去等號要成立", "guide": "👀 先看到什麼：四個選項左邊長得一模一樣，只有右邊的數字不同；題目又告訴我們 x＝2 是原方程式的解。💡 那想到什麼？「x＝2 是解」這句話，可以幫我們算出什麼東西的值？", "answer": "可以算出「x＝2 時左邊 (ax−3)(ax＋5) 的值」——因為代進去等號要成立，左邊的值就等於右邊的值。", "why": "解的意義就是代進去兩邊相等。所以只要算出右邊在 x＝2 的值，就等於知道左邊的值了。", "quiz": {"q": "需要先把 a 求出來嗎？", "a": "不用。這一題從頭到尾都不必知道 a 是多少。"}}, {"concept": "quad_root_def", "jingle": "右邊好算就先算右邊", "guide": "兩邊比較，哪一邊代 x＝2 比較好算？就算那一邊。", "answer": "右邊好算：3x²−x−17 代 x＝2 得 3×4−2−17＝12−2−17＝−7。", "why": "左邊有 a 不知道，右邊全是數字。先算好算的那一邊，這是解題很重要的習慣。", "quiz": {"q": "3×2² 是 12 還是 36？", "a": "12。先平方再乘 3，不是先乘再平方。"}}, {"concept": "quad_root_def", "jingle": "左邊的值就是負七", "guide": "所以在 x＝2 的時候，左邊 (2a−3)(2a＋5) 等於多少？把這個數字寫下來、圈起來。", "answer": "(2a−3)(2a＋5)＝−7。也就是說，x＝2 代進左邊那個式子，值一定是 −7。", "why": "等號成立就是左邊 ＝ 右邊，右邊算出 −7，左邊在 x＝2 的值就是 −7，不管 a 是多少都一樣。", "quiz": {"q": "如果右邊算出來是 5，左邊在 x＝2 的值會是多少？", "a": "5。左邊的值永遠跟著右邊走。"}}, {"concept": "quad_root_def", "jingle": "右邊等於它就成立", "guide": "現在看四個選項：它們的左邊都是同一個式子，x＝2 代進去都會得 −7。那哪一個選項在 x＝2 的時候等號會成立？", "answer": "右邊寫 −7 的那一個。因為左邊 ＝ −7，右邊也要是 −7，等號才會成立。", "why": "要讓 x＝2 是某個方程式的解，就是要它代進去之後兩邊相等。左邊固定是 −7，所以右邊也必須是 −7。", "quiz": {"q": "(A) 右邊是 17，x＝2 代進去左邊是 −7，等號成立嗎？", "a": "不成立，−7 ≠ 17，所以 x＝2 不是 (A) 的解。"}}], "final": {"concept": "quad_root_def", "guide": "把答案的字母寫下來。", "answer": "(C) (ax−3)(ax+5)=−7", "why": "x＝2 代進原式右邊 3x²−x−17 得 −7，所以左邊 (2a−3)(2a＋5) 也是 −7。四個選項左邊相同，只有右邊是 −7 的那個在 x＝2 時等號成立。", "check": "檢查的方式是回頭問一次「解是什麼意思」：代進去兩邊要相等。左邊在 x＝2 的值是 −7，所以右邊必須是 −7 ✓。順便注意正負號：是 −7 不是 ＋7，12−2−17 先算 12−2＝10，再 10−17＝−7。把算出來的 −7 圈起來再去對選項，是很好的做法。", "concepts": ["quad_root_def"]}}, {"id": "u16", "title": "題 16・（配方法・二次項係數不是 1）", "source": "9/16 複習考・第 16 題", "stem": "利用配方法解一元二次方程式 3x²−12x+1=0，以下是甲、乙兩人配方的部分過程（見下表）。對於甲、乙兩人的作法，下列判斷何者正確？　(A) 兩人皆正確　(B) 兩人皆錯誤　(C) 甲正確，乙錯誤　(D) 甲錯誤，乙正確", "figure": "<table style='border-collapse:collapse;margin:10px auto;font-size:14px'><tr><td style='border:1px solid #bbb;padding:6px 10px'><b>甲</b></td><td style='border:1px solid #bbb;padding:6px 10px'>原式 ⇒ x²−4x＝−1 ⇒ (x−2)²＝3</td></tr><tr><td style='border:1px solid #bbb;padding:6px 10px'><b>乙</b></td><td style='border:1px solid #bbb;padding:6px 10px'>原式 ⇒ 9x²−36x＝−3 ⇒ (3x−6)²＝33</td></tr></table>", "warmup": [{"concept": "quad_complete", "q": "3x²−12x＋1 的每一項都除以 3，各會變成什麼？", "a": "3x²÷3＝x²、−12x÷3＝−4x、1÷3＝1/3。三項都要除，一項都不能漏。"}, {"concept": "fac_formula", "q": "(3x−6)² 展開是多少？", "a": "9x²−36x＋36。"}, {"concept": "quad_sqrt", "q": "配方之後得到 (3x−6)²＝33，那 3x−6 等於多少？", "a": "3x−6＝±√33。開平方一定要取 ±，兩個答案都要。"}], "steps": [{"concept": "quad_complete", "jingle": "整條除，常數也要除", "guide": "👀 先看到什麼：題目寫「配方法」，而且二次項係數是 3，不是 1。💡 那想到什麼？係數不是 1 的時候只有兩條路，想得到哪兩條？先說出來。", "answer": "路一：兩邊整條除以 3（每一項都要除，常數也要）。路二：不除，改成整條乘起來湊成完全平方。甲走路一，乙走路二。", "why": "配方法需要二次項係數是 1（路一），或是讓整個二次項變成某個東西的平方（路二）。兩條路都可以，但每一條都要「整條一起動」。", "quiz": {"q": "如果只把前兩項除以 3、常數不動，會發生什麼？", "a": "等號就不成立了，後面全部會歪掉。"}}, {"concept": "quad_complete", "jingle": "常數項也要除以三", "guide": "檢查甲。他把 3x²−12x＋1＝0 變成 x²−4x＝−1。自己動手除一次：3x²÷3、−12x÷3、1÷3 各是多少？那個常數 1 除以 3 之後應該是多少？", "answer": "x²−4x＋1/3＝0，移項得 x²−4x＝−1/3。甲寫 −1，等於常數項 1 沒有一起除以 3 ✗ 甲錯。", "why": "兩邊同除以 3 是「每一項都除」，常數項 1 也要變成 1/3。這就是這一題唯一的陷阱。發現不對的當下，手要順便回去把答案改掉，不要只在旁邊寫註記。", "quiz": {"q": "甲如果做對，下一步會是 (x−2)² 等於多少？", "a": "(x−2)²＝4−1/3＝11/3，不是 3。"}}, {"concept": "quad_complete", "jingle": "移項再乘也可以", "guide": "檢查乙。他寫 9x²−36x＝−3。看得出來他做了什麼嗎？先把 3x²−12x＋1＝0 移項看看，再想想他乘了多少。", "answer": "先移項：3x²−12x＝−1；再兩邊同乘 3：9x²−36x＝−3 ✓。乙這一步是對的，而且兩邊都乘了，沒有漏。", "why": "乘 3 是為了把 9x² 湊成 (3x)²，這樣就能直接配成 (3x−6)² 的形狀。移項之後只剩兩項，兩邊同乘比較不會漏。", "quiz": {"q": "為什麼乙要乘 3 而不是乘 2？", "a": "因為 3×3x²＝9x²＝(3x)²，剛好是完全平方；乘 2 得 6x² 不是平方。"}}, {"concept": "fac_formula", "jingle": "乘回去對一次", "guide": "乙的最後一步：(3x−6)²＝33。把 (3x−6)² 展開，看看 9x²−36x＝−3 加上什麼之後剛好變成它。", "answer": "(3x−6)²＝9x²−36x＋36。兩邊各加 36：左邊變 (3x−6)²，右邊 −3＋36＝33 ✓ 乙完全正確。", "why": "配方就是「兩邊同加一個數」，把左邊湊成完全平方。乙加的是 36，右邊也加了 36，等號有維持住。", "quiz": {"q": "36 是怎麼決定的？", "a": "把 −36x 看成 2×3x×6，所以要補的是 6²＝36。"}}], "final": {"concept": "quad_complete", "guide": "兩個人都檢查完了，把判斷對應的字母寫下來。", "answer": "(D) 甲錯誤，乙正確", "why": "甲兩邊同除以 3 的時候，常數項 1 沒有一起除，應該是 x²−4x＝−1/3 才對，他寫成 −1；乙先移項再兩邊同乘 3，得 9x²−36x＝−3，再兩邊加 36 配成 (3x−6)²＝33，每一步都對。", "check": "用原式的根對一次就知道了。乙配到 (3x−6)²＝33 之後，接下來就是開平方取 ±：3x−6＝±√33 → x＝(6±√33)/3。原式 3x²−12x＋1＝0 的根約是 3.915 和 0.085；乙算出來的兩個根也是 3.915 和 0.085 ✓ 對得上。甲：(x−2)²＝3 → x＝2±1.732 → 3.732 或 0.268 ✗ 對不上，所以甲確實錯了。最後記住一句：發現哪裡不對的當下，手就順便回去把答案改掉。", "concepts": ["quad_complete", "fac_formula", "quad_sqrt"]}}, {"id": "u17", "title": "題 17・（進貨賣出求獲利）", "source": "9/16 複習考・第 17 題", "stem": "疫情爆發時，佳佳以 4800 元買進酒精乾洗手噴劑 x 瓶，除了留 20 瓶自用外，剩下的放在店鋪販賣，並以每瓶 (x+10) 元賣出。若此次買賣共獲利 600 元，則佳佳原本買進幾瓶酒精乾洗手噴劑？　(A) 60　(B) 70　(C) 75　(D) 80", "warmup": [{"concept": "quad_word", "q": "買進 x 瓶，留 20 瓶自用，拿去賣的有幾瓶？", "a": "(x−20) 瓶。"}, {"concept": "quad_word", "q": "賣出 (x−20) 瓶、每瓶 (x＋10) 元，總共收到多少錢？", "a": "(x−20)(x＋10) 元。"}, {"concept": "quad_word", "q": "獲利 ＝ 收入 − 什麼？", "a": "獲利 ＝ 收入 − 成本。這裡的成本是買進花的 4800 元。"}], "steps": [{"concept": "quad_word", "jingle": "留下的不能算賣掉", "guide": "👀 先看到什麼：題目說「除了留 20 瓶自用」。💡 那想到什麼？這 20 瓶有沒有賺錢？那真正拿去賣的是幾瓶？", "answer": "留下的 20 瓶沒有賣，所以賣出的是 (x−20) 瓶。", "why": "應用題最常掉的分就在這種「扣掉一部分」的句子。看到「留下、自用、破掉、送人」都要先扣掉。", "quiz": {"q": "如果買 100 瓶留 20 瓶，賣幾瓶？", "a": "80 瓶。"}}, {"concept": "quad_word", "jingle": "設 x、乘單價、減成本", "guide": "把三件事翻成式子：賣幾瓶、一瓶多少、成本多少。然後用「收入 − 成本 ＝ 獲利」接起來。", "answer": "(x−20)(x＋10) − 4800 ＝ 600。", "why": "收入是 (賣出瓶數)×(每瓶價錢)，成本是一開始花的 4800，兩者相減就是賺到的 600。", "quiz": {"q": "如果題目說「虧損 600 元」，等號右邊要寫什麼？", "a": "−600。賺是正的，虧是負的。"}}, {"concept": "quad_factor", "jingle": "整理成等於零", "guide": "把式子展開、整理成「＝0」的標準樣子。慢慢乘，四項都要。", "answer": "(x−20)(x＋10)＝x²＋10x−20x−200＝x²−10x−200；所以 x²−10x−200−4800＝600 → x²−10x−5600＝0。", "why": "要用因式分解解方程式，右邊一定要先變成 0。這裡把 −200、−4800、−600 全部收到左邊。", "quiz": {"q": "−200−4800−600 等於多少？", "a": "−5600。"}}, {"concept": "fac_cross", "jingle": "找相乘五千六百", "guide": "現在要找兩個數，相乘 −5600、相加 −10。先想 5600 可以拆成哪兩個差 10 的數（提示：兩個數差 10、乘積 5600，會在 70～80 附近）。", "answer": "−80 和 ＋70：(−80)×70＝−5600 ✓，−80＋70＝−10 ✓。所以 (x−80)(x＋70)＝0 → x＝80 或 x＝−70。", "why": "瓶數不能是負的，所以 x＝80。", "quiz": {"q": "為什麼 −70 要丟掉？", "a": "因為它代表買進 −70 瓶，不合理。應用題的答案要回到情境檢查。"}}], "final": {"concept": "quad_word", "guide": "把買進的瓶數對應到字母。", "answer": "(D) 80 瓶", "why": "(x−20)(x＋10)−4800＝600 → x²−10x−5600＝0 → (x−80)(x＋70)＝0 → x＝80（−70 不合）。", "check": "代回題目情境檢查最踏實：買 80 瓶、留 20 瓶，賣出 60 瓶；每瓶賣 80＋10＝90 元，收入 60×90＝5400 元；5400−4800＝600 ✓ 剛好獲利 600 元。找 5600 的因數要一點耐心，從 70、80 附近往兩邊試最快。", "concepts": ["quad_word", "quad_factor", "fac_cross"]}}, {"id": "u18", "title": "題 18・（湊成完全平方求 k）", "source": "9/16 複習考・第 18 題", "stem": "來自各國的愛樂少年在文化廣場舉辦文化交流露天音樂會，主辦單位將座位排成實心長方形，每排可坐的人數比排數多 12。現因臨時增加 k 位觀眾，故將長方形座位排法調整為正方形排法，則 k 值可能為何？　(A) 36　(B) 40　(C) 48　(D) 49　【原圖：一個實心的長方形點陣，上方標「表演區」】", "warmup": [{"concept": "quad_word", "q": "設排數是 n，每排人數比排數多 12，每排幾人？總共幾人？", "a": "每排 n＋12 人，總共 n(n＋12)＝n²＋12n 人。"}, {"concept": "fac_formula", "q": "(n＋6)² 展開是多少？", "a": "n²＋12n＋36。"}, {"concept": "fac_formula", "q": "「排成正方形」代表總人數是什麼樣的數？", "a": "是某個數的平方（完全平方數），因為正方形的每排人數 ＝ 排數。"}], "steps": [{"concept": "quad_word", "jingle": "先把總人數寫出來", "guide": "👀 先看到什麼：「排成實心長方形」「每排比排數多 12」「加 k 人變正方形」。💡 那想到什麼？先設排數是 n，把「總人數」用 n 寫出來。", "answer": "每排 n＋12 人、共 n 排，總人數 ＝ n(n＋12) ＝ n²＋12n。", "why": "實心長方形的人數就是「每排人數 × 排數」。把它寫成 n 的二次式，後面才有東西可以配。", "quiz": {"q": "如果有 4 排，每排幾人？總共幾人？", "a": "每排 16 人，總共 4×16＝64 人。"}}, {"concept": "fac_formula", "jingle": "正方形就是完全平方", "guide": "加了 k 個人之後要排成正方形。「正方形排法」翻成數學是什麼意思？寫成式子。", "answer": "n²＋12n＋k 必須是一個完全平方式，也就是可以寫成 (n＋某個數)²。", "why": "正方形的排數和每排人數一樣，總人數就是「邊×邊」，所以一定是完全平方。", "quiz": {"q": "64 是完全平方數嗎？", "a": "是，64＝8²，可以排成 8×8 的正方形。"}}, {"concept": "fac_formula", "jingle": "中間項的一半平方", "guide": "n²＋12n＋k＝(n＋?)²。要湊成完全平方，那個「?」是多少？k 又該是多少？記得完全平方的中間項是「2 × n × ?」。", "answer": "中間項 12n＝2×n×6，所以 ?＝6，k＝6²＝36。也就是 n²＋12n＋36＝(n＋6)²。", "why": "完全平方式 (n＋b)²＝n²＋2bn＋b²，中間項的係數一半就是 b，常數項就是 b²。12 的一半是 6，6²＝36。", "quiz": {"q": "n²＋10n＋k 要是完全平方，k 是多少？", "a": "25。因為 10 的一半是 5，5²＝25。"}}, {"concept": "fac_check", "jingle": "其他三個也試一下", "guide": "為什麼 40、48、49 不行？隨便找幾個 n 試試看就知道了。用 n＝3（總人數 3×15＝45）分別加 36、40、48、49，看哪一個會變成完全平方數。", "answer": "45＋36＝81＝9² ✓；45＋40＝85 ✗、45＋48＝93 ✗、45＋49＝94 ✗ 都不是平方數。而 k＝36 對任何 n 都會變成 (n＋6)²。", "why": "k＝36 是唯一不管幾排都成立的；40、48、49 不管代哪個排數都湊不出平方數，隨便試兩三個排數就會發現。", "quiz": {"q": "再用 n＝10 試 k＝36：總人數變多少？是幾的平方？", "a": "10×22＝220，220＋36＝256＝16² ✓。"}}], "final": {"concept": "fac_formula", "guide": "把 k 對應的字母寫下來。", "answer": "(A) 36", "why": "總人數 n²＋12n，加 k 之後要是完全平方；n²＋12n＋36＝(n＋6)²，所以 k＝36。", "check": "檢查方法是代幾個排數進去：n＝3 → 45＋36＝81＝9² ✓；n＝10 → 220＋36＝256＝16² ✓；n＝1 → 13＋36＝49＝7² ✓。三個都成立。反過來試 k＝40：n＝1 得 53、n＝3 得 85、n＝10 得 260，都不是平方數 ✗。記住這個訊號：看到「排成正方形／變成完全平方」，就去看中間項係數的一半，平方起來就是要補的數。", "concepts": ["fac_formula", "quad_word", "fac_check"]}}, {"id": "u19", "title": "題 19・（用面積反推邊長再求周長）", "source": "9/16 複習考・第 19 題", "stem": "右圖的六邊形是由甲、丁兩個矩形、等腰直角三角形乙及直角三角形丙所組成。已知矩形甲的長為 3x−2，三角形乙的一股長為 x+2，三角形丙的面積為 3x²+x−2，則矩形丁的周長為何？　(A) 6x+8　(B) 4x+6　(C) 3x+4　(D) 2x+3　【原圖：六邊形，左邊矩形標甲、右邊矩形標丁、頂端三角形標乙、下方三角形標丙；中央頂點有直角記號；甲的長標 3x−2，乙的一股標 x+2】", "warmup": [{"concept": "poly_area", "q": "直角三角形的面積怎麼算？", "a": "兩股相乘 ÷ 2（兩股就是它的底和高）。"}, {"concept": "fac_cross", "q": "把 3x²＋x−2 因式分解。", "a": "(3x−2)(x＋1)。交叉相乘：3x×1＋(−2)×x＝3x−2x＝x ✓。"}, {"concept": "poly_area", "q": "長方形的周長怎麼算？", "a": "2 × (長 ＋ 寬)。"}], "steps": [{"concept": "poly_area", "jingle": "給面積就找另一股", "guide": "👀 先看到什麼：題目給了三角形丙的「面積」3x²＋x−2，也給了矩形甲的長 3x−2。💡 那想到什麼？面積知道、其中一股也知道，另一股是不是就算得出來？先說說看：丙的直角在哪裡？兩股各是誰？", "answer": "丙是直角三角形，直角在圖形中間那個頂點，兩股就是矩形甲的長 3x−2 和矩形丁的長（設為 y）。", "why": "直角三角形的兩股就是它的底和高。丙的一股貼著甲、一股貼著丁，所以把面積寫成「兩股相乘 ÷ 2」，就能把丁的長解出來。", "quiz": {"q": "面積 12、一股 4 的直角三角形，另一股多長？", "a": "12＝4×另一股÷2 → 另一股＝6。"}}, {"concept": "poly_area", "jingle": "兩股相乘再除二", "guide": "把丙的面積用「兩股相乘 ÷ 2」寫成式子，讓它等於題目給的 3x²＋x−2。", "answer": "(3x−2) × y ÷ 2 ＝ 3x²＋x−2，也就是 (3x−2)y ＝ 2(3x²＋x−2)。", "why": "先把 ÷2 移到右邊變成乘 2，式子比較好處理，也比較不會在後面漏掉那個 2。", "quiz": {"q": "2(3x²＋x−2) 等於多少？", "a": "6x²＋2x−4。"}}, {"concept": "fac_cross", "jingle": "分解才約得掉", "guide": "現在要把 y 解出來，得除以 (3x−2)。直接除很難看，所以先把 3x²＋x−2 因式分解，看看會不會剛好出現 (3x−2)。", "answer": "3x²＋x−2＝(3x−2)(x＋1)。所以 (3x−2)y＝2(3x−2)(x＋1)，兩邊約掉 (3x−2) 得 y＝2(x＋1)＝2x＋2——這就是矩形丁的長。", "why": "面積式子裡通常藏著其中一股。分解之後 (3x−2) 就冒出來了，約掉就得到另一股。", "quiz": {"q": "為什麼可以把 (3x−2) 約掉？", "a": "因為等號兩邊都有這個相同的因式（而且它不是 0）。"}}, {"concept": "poly_area", "jingle": "兩邊相加再乘二", "guide": "丁的長算出來了，還差寬。題目說乙是等腰直角三角形、一股長 x＋2，而乙的兩股分別貼著甲的寬和丁的寬——從這句話可以知道丁的寬是多少？知道之後再求周長。", "answer": "乙是等腰直角三角形，兩股一樣長，都是 x＋2；其中一股貼著丁的寬，所以丁的寬＝x＋2。周長 ＝ 2[(2x＋2)＋(x＋2)] ＝ 2(3x＋4) ＝ 6x＋8。", "why": "丁的另一邊是乙的股長 x＋2：乙是等腰直角三角形，它的兩股分別貼著甲的寬和丁的寬，所以丁的寬就是 x＋2。周長是兩邊相加再乘 2。", "quiz": {"q": "(2x＋2)＋(x＋2) 等於多少？", "a": "3x＋4。同類項相加：2x＋x＝3x、2＋2＝4。"}}], "final": {"concept": "poly_area", "guide": "把周長對應的字母寫下來。", "answer": "(A) 6x+8", "why": "丙的兩股是甲的長 3x−2 和丁的長 y，面積 (3x−2)y÷2＝3x²＋x−2＝(3x−2)(x＋1)，所以 y＝2(x＋1)＝2x＋2 是丁的長；乙是等腰直角三角形、兩股分別貼著甲和丁的寬，所以丁的寬＝x＋2；周長＝2[(2x＋2)＋(x＋2)]＝6x＋8。", "check": "代一個數字驗一次最安心。取 x＝2：丙的面積 3×4＋2−2＝12；兩股是 3x−2＝4 和 y＝2×2＋2＝6，面積 4×6÷2＝12 ✓ 對得上。丁的長 6、寬 x＋2＝4，周長 2(6＋4)＝20；而 6x＋8＝12＋8＝20 ✓ 也對得上。這一題的路線記起來：面積給你，就用因式分解把另一股約出來。", "concepts": ["poly_area", "fac_cross"]}}, {"id": "u20a", "title": "非選 (1)・（磁磚的面積和）", "source": "9/16 複習考・非選第 1 題 (1)", "stem": "小喻到葡萄牙旅遊，深深地被當地的磁磚藝術所吸引，於是她準備了 A、B、C 三種不同的磁磚，包含 1 塊 A、6 塊 B、8 塊 C。【A 磁磚是邊長 x 的正方形；B 磁磚是長 x、寬 1 的長方形；C 磁磚是邊長 1 的正方形】(1) 全部 A 和 B 磁磚的面積和為多少平方單位？（以 x 的多項式表示）", "figure": "<table style='border-collapse:collapse;margin:10px auto;font-size:14px;text-align:center'><tr><th style='border:1px solid #bbb;padding:5px 10px'>磁磚</th><th style='border:1px solid #bbb;padding:5px 10px'>形狀</th><th style='border:1px solid #bbb;padding:5px 10px'>一塊的面積</th><th style='border:1px solid #bbb;padding:5px 10px'>有幾塊</th></tr><tr><td style='border:1px solid #bbb;padding:5px 10px'>A</td><td style='border:1px solid #bbb;padding:5px 10px'>邊長 x 的正方形</td><td style='border:1px solid #bbb;padding:5px 10px'>x × x</td><td style='border:1px solid #bbb;padding:5px 10px'>1 塊</td></tr><tr><td style='border:1px solid #bbb;padding:5px 10px'>B</td><td style='border:1px solid #bbb;padding:5px 10px'>長 x、寬 1 的長方形</td><td style='border:1px solid #bbb;padding:5px 10px'>x × 1</td><td style='border:1px solid #bbb;padding:5px 10px'>6 塊</td></tr><tr><td style='border:1px solid #bbb;padding:5px 10px'>C</td><td style='border:1px solid #bbb;padding:5px 10px'>邊長 1 的正方形</td><td style='border:1px solid #bbb;padding:5px 10px'>1 × 1</td><td style='border:1px solid #bbb;padding:5px 10px'>8 塊</td></tr></table>", "warmup": [{"concept": "poly_area", "q": "邊長 x 的正方形，面積是多少？", "a": "x × x ＝ x²。"}, {"concept": "poly_area", "q": "長 x、寬 1 的長方形，面積是多少？", "a": "x × 1 ＝ x。"}, {"concept": "poly_area", "q": "6 塊一模一樣、每塊面積 x 的磁磚，總面積是多少？", "a": "6 × x ＝ 6x。"}], "steps": [{"concept": "poly_area", "jingle": "一塊乘幾塊再相加", "guide": "👀 先看到什麼：題目問「全部 A 和 B 磁磚的面積和」。💡 那想到什麼？這句話裡有兩個關鍵字——「全部」和「和」。它們各自要我們多做一個動作，是哪兩個動作？", "answer": "「全部」＝ 一塊的面積還要乘上塊數；「和」＝ 最後兩種要相加。所以順序是：一塊多少 → 乘幾塊 → 再相加。", "why": "這一題不難，難在把題目的每個字都用到。少乘塊數、或是忘了相加，算式就不完整。", "quiz": {"q": "題目有沒有要 C 磁磚的面積？", "a": "沒有，這一小題只問 A 和 B。"}}, {"concept": "poly_area", "jingle": "A 是邊長 x 的正方形", "guide": "先算 A：一塊多大？有幾塊？全部加起來是多少？", "answer": "A 一塊是 x×x＝x²，有 1 塊，所以全部 A 的面積是 1×x²＝x²。", "why": "正方形面積是邊長乘邊長。A 只有一塊，所以乘 1 不變。", "quiz": {"q": "如果 A 有 3 塊，全部面積是多少？", "a": "3x²。"}}, {"concept": "poly_area", "jingle": "六塊 B 要乘六", "guide": "再算 B，這裡要特別小心：一塊 B 的面積是多少？題目說有幾塊？兩個都用到才對。", "answer": "B 一塊是 x×1＝x，有 6 塊，所以全部 B 的面積是 6×x＝6x。", "why": "題目第一句就寫「6 塊 B」，那個 6 一定要乘進去。只寫 x 的話，就只算了一塊。", "quiz": {"q": "6 塊、每塊面積 x，總共多少？", "a": "6x。"}}], "final": {"concept": "poly_area", "guide": "最後一步：題目問的是「面積和」，把兩個結果做最後一個動作，然後記得寫單位。", "answer": "x²＋6x 平方單位", "why": "A 全部是 x²、B 全部是 6x，「面積和」就是兩個相加：x²＋6x。", "check": "代一個數字檢查：假設 x＝5，A 是 5×5＝25，B 一塊 5、6 塊就是 30，兩個加起來 55；而 x²＋6x＝25＋30＝55 ✓ 一樣。這一小題的兩個關鍵字再念一次：「全部」要乘塊數、「和」要相加。寫完之後回頭把題目再讀一遍，確認每個條件都用到了，這個動作只要五秒鐘。", "concepts": ["poly_area"]}}, {"id": "u20b", "title": "非選 (2)・（拼成長方形，C 會剩幾塊）", "source": "9/16 複習考・非選第 1 題 (2)", "stem": "（承上題：共有 1 塊 A（邊長 x 的正方形）、6 塊 B（長 x 寬 1 的長方形）、8 塊 C（邊長 1 的正方形））(2) 小喻想將這些磁磚拼成一個大的長方形，並置於訂製茶几的桌面。若 A、B 皆須用完，請討論 C 可能會剩下的數量，並寫出完整解題過程。", "warmup": [{"concept": "poly_area", "q": "拼成一個長方形，它的面積要怎麼用長和寬表示？", "a": "面積 ＝ 長 × 寬。如果長是 (x＋a)、寬是 (x＋b)，面積就是 (x＋a)(x＋b)。"}, {"concept": "fac_cross", "q": "把 x²＋6x＋5 因式分解。", "a": "(x＋1)(x＋5)。兩個數相乘 5、相加 6。"}, {"concept": "fac_cross", "q": "兩個非負整數相加等於 6，有哪些組合？", "a": "(0,6)、(1,5)、(2,4)、(3,3)（順序對調算同一種）。"}], "steps": [{"concept": "poly_area", "jingle": "拼成長方形就能分解", "guide": "👀 先看到什麼：「拼成一個大的長方形」。💡 那想到什麼？拼出來的長方形，它的面積一定可以寫成「長×寬」。那總面積的式子就必須能做什麼？", "answer": "總面積的多項式必須能因式分解成 (x＋a)(x＋b) 的樣子。", "why": "磁磚拼成長方形，長和寬都會是「幾個 x 加幾個 1」的長度。所以面積一定是兩個一次式相乘。", "quiz": {"q": "如果總面積是 x²＋6x＋7，拼得出長方形嗎？", "a": "拼不出來。找不到兩個整數相加 6、相乘 7。"}}, {"concept": "poly_area", "jingle": "用掉幾塊 C 就加幾", "guide": "A、B 都要用完，那面積至少是上一小題的 x²＋6x。再加上用掉的 C（每塊面積 1），設用掉 c 塊，總面積怎麼寫？c 的範圍是多少？", "answer": "總面積 ＝ x²＋6x＋c，而且 0 ≤ c ≤ 8（C 只有 8 塊，可以不用完）。", "why": "C 的每一塊面積是 1，用幾塊就加幾。題目只說 A、B 要用完，沒說 C 要用完，所以 c 可以從 0 開始。", "quiz": {"q": "如果一塊 C 都不用，總面積是多少？", "a": "x²＋6x。"}}, {"concept": "fac_cross", "jingle": "相加六、相乘就是 c", "guide": "把 (x＋a)(x＋b) 展開，跟 x²＋6x＋c 對照。a 和 b 要滿足哪兩個條件？", "answer": "(x＋a)(x＋b)＝x²＋(a＋b)x＋ab，對照得 a＋b＝6、ab＝c。", "why": "中間項的係數就是 a＋b，常數項就是 ab。所以只要列出所有「相加等於 6」的非負整數組合，每一組的乘積就是要用掉的 C 塊數。", "quiz": {"q": "a＝2、b＝4 的時候，c 是多少？", "a": "c＝2×4＝8。"}}, {"concept": "fac_check", "jingle": "四組全部列出來", "guide": "把 a＋b＝6 的所有組合列成一張表，每一組算出 c＝ab，再看 8 塊 C 夠不夠用。四組都要寫。", "answer": "(0,6)→c＝0；(1,5)→c＝5；(2,4)→c＝8；(3,3)→c＝9。前三組的 c 都不超過 8，可以；(3,3) 要 9 塊但只有 8 塊，不夠 ✗ 要排除。", "why": "非選題要「討論」，就是要把所有可能列完，還要說明哪一個被排除、為什麼被排除。漏掉任何一組都會被扣。", "quiz": {"q": "(3,3) 那一組為什麼不行？", "a": "它需要 9 塊 C，但題目只給 8 塊，不夠用。"}}], "final": {"concept": "poly_area", "guide": "把三種可能的「剩下數量」寫出來，記得是問「剩下幾塊」，不是「用掉幾塊」。", "answer": "C 可能剩下 8 塊、3 塊、0 塊（分別對應用掉 0 塊、5 塊、8 塊）", "why": "總面積 x²＋6x＋c 要能拼成長方形，就要 a＋b＝6、ab＝c；(0,6) 用 0 塊剩 8 塊、(1,5) 用 5 塊剩 3 塊、(2,4) 用 8 塊剩 0 塊；(3,3) 需要 9 塊不夠用，排除。", "check": "每一種都乘回去對一次：x(x＋6)＝x²＋6x（用 0 塊 ✓ 剩 8）、(x＋1)(x＋5)＝x²＋6x＋5（用 5 塊 ✓ 剩 3）、(x＋2)(x＋4)＝x²＋6x＋8（用 8 塊 ✓ 剩 0）。三個展開都有 x²＋6x，代表 A、B 真的用完了。最後再確認問句：題目問「剩下」的數量，所以答案是 8、3、0，不是 0、5、8。這種「討論」題要把所有組合列完，還要寫出哪一組被排除、為什麼被排除。", "concepts": ["poly_area", "fac_cross", "fac_check"]}}], "_keys": ["fac_def", "fac_common", "fac_formula", "fac_cross", "fac_check", "quad_root_def", "quad_factor", "quad_complete", "quad_formula", "quad_common_root", "quad_prime", "quad_word"], "_id": "test0916", "_title": "考卷練習 9/16・因式分解與一元二次方程式"}, {"_適用": "這張卷的 20 題，每一題都幫你拆好步驟了。先自己想、念出來，再看答案——不用急，想不出來也沒關係，我們一步一步走。", "problems": [{"id": "t1", "title": "題 1・（逆定理判定不了的條件）", "source": "9/15 階段練習・第 1 題", "stem": "在 △ABC 中，已知 P、Q 兩點分別在 AB、AC 上，試問下列哪一個條件，不能用比例線段的逆定理判定 PQ ∥ BC？　(A) BP＝5，AB＝10，CQ＝7，AC＝14　(B) AP＝1.5，AB＝2.5，PQ＝3，BC＝5　(C) AP＝4，BP＝5，AQ＝12，CQ＝15　(D) AP＝8，AB＝18，AQ＝16，AC＝36", "figure": "<svg viewBox='0 0 300 210' width='300' style='max-width:100%;display:block;margin:8px auto'><line x1='150' y1='20' x2='40' y2='180' stroke='#222' stroke-width='1.6'/><line x1='150' y1='20' x2='260' y2='180' stroke='#222' stroke-width='1.6'/><line x1='40' y1='180' x2='260' y2='180' stroke='#222' stroke-width='1.6'/><line x1='100.5' y1='87.5' x2='199.5' y2='87.5' stroke='#C0392B' stroke-width='1.8' stroke-dasharray='6 4'/><circle cx='100.5' cy='87.5' r='3.2' fill='#C0392B'/><circle cx='199.5' cy='87.5' r='3.2' fill='#C0392B'/><text x='144' y='15' font-size='13' fill='#222' font-style='italic'>A</text><text x='26' y='196' font-size='13' fill='#222' font-style='italic'>B</text><text x='264' y='196' font-size='13' fill='#222' font-style='italic'>C</text><text x='82' y='84' font-size='13' fill='#C0392B' font-style='italic'>P</text><text x='206' y='84' font-size='13' fill='#C0392B' font-style='italic'>Q</text><text x='118' y='106' font-size='14' fill='#C0392B' font-style='italic'>?</text></svg>", "warmup": [{"concept": "par_prop_conv", "q": "△ABC 中 P 在 AB 上、Q 在 AC 上，若 AP：PB＝2：3、AQ：QC＝2：3，PQ 和 BC 平行嗎？", "a": "平行。兩邊切出的比一樣，逆定理就成立。"}, {"concept": "par_prop", "q": "「上比全」和「上比下」差在哪裡？AP：AB 是哪一種？", "a": "AP：AB 是上比全（AB 是整條）；AP：PB 才是上比下。"}, {"concept": "collinear", "q": "AB＝10、BP＝5，那 AP 是多少？", "a": "AP＝10−5＝5（同一條線上，線段能加減）。"}], "steps": [{"concept": "par_prop_conv", "jingle": "比一樣，就平行", "guide": "👀 先看到什麼：四個選項都在給「兩條線段的比」，題目問的是「哪一組不能用逆定理判定」。💡 那想到什麼？逆定理要的比，必須長在哪兩條邊上？先說出來再往下。", "answer": "要長在「從 A 出發的兩條邊」AB 和 AC 上面。", "why": "P 住在 AB 上、Q 住在 AC 上，逆定理就是在講這兩條邊被切出的比一不一樣。", "quiz": {"q": "逆定理可以寫成哪兩種比？", "a": "AP：AB＝AQ：AC（上比全），或 AP：PB＝AQ：QC（上比下）。"}}, {"concept": "par_prop_conv", "jingle": "比一樣，就平行", "guide": "那我們一個一個檢查，先從 (A) 開始。它給 BP、AB、CQ、AC，你先把 AP 和 AQ 算出來，再寫成上比全比比看。", "answer": "AP＝10−5＝5，AQ＝14−7＝7；AP：AB＝5：10＝1：2，AQ：AC＝7：14＝1：2，兩邊一樣 → (A) 可以用逆定理判定平行。", "why": "兩條邊的上比全相等，逆定理直接成立，所以 (A) 判定得出來，不是答案。", "quiz": {"q": "(D) 給 AP＝8、AB＝18、AQ＝16、AC＝36，兩個比相等嗎？", "a": "相等（8：18＝4：9，16：36＝4：9）→ (D) 也判定得出來。"}}, {"concept": "par_prop_conv", "jingle": "比一樣，就平行", "guide": "再看 (C)：AP＝4、BP＝5、AQ＝12、CQ＝15。這一組給的是上比全還是上比下？相等嗎？", "answer": "是上比下：4：5 和 12：15＝4：5，相等 → (C) 也判定得出來。", "why": "上比下相等也是逆定理認得的條件，一樣判定得出平行。", "quiz": {"q": "上比下 4：5 換成上比全是多少？", "a": "4：9（全＝4＋5＝9）。"}}, {"concept": "par_prop_conv", "jingle": "比一樣，就平行", "guide": "剩下 (B)：AP＝1.5、AB＝2.5、PQ＝3、BC＝5。慢慢來，把這四條線段一條一條用手指在圖上比一次——PQ 和 BC 長在哪裡？它們是從 A 出發的邊嗎？", "answer": "PQ 和 BC 都不是「從 A 出發的兩邊」上面的線段。AC 這一邊上，題目什麼都沒給。", "why": "逆定理只認「同一個頂點 A 出發的兩條邊」上的比。第三邊的比不在條件裡，所以拿它判定不了。", "quiz": {"q": "(B) 裡面真正有用的比只有哪一個？", "a": "只有 AP：AB＝1.5：2.5＝3：5；AQ、QC 完全沒給。"}}], "final": {"concept": "par_prop_conv", "guide": "所以哪一個選項「不能用逆定理判定」？先把理由講出來，再選字母。", "answer": "(B)（AP＝1.5、AB＝2.5、PQ＝3、BC＝5 那一組）", "why": "(B) 給的是 PQ：BC（第三邊）的比，不是 AB、AC 這兩條邊上的比，逆定理用不上；(A)(C)(D) 三個都能直接套逆定理判定平行。", "check": "檢查的方法很簡單：把每個選項的四條線段指指看，是不是都長在 AB 和 AC 上。(A)(C)(D) 都是；(B) 有兩條長在 PQ 和 BC 上，一看就知道不對。還有一個小提醒——這種「刪去法」的題最可惜的是刪到最後填錯字母。刪掉的打叉，剩下的那個圈起來，再抄進答案欄，會少掉很多冤枉。", "concepts": ["par_prop_conv", "par_prop", "collinear"]}}, {"id": "t2", "title": "題 2・（中點連線＋梯形中線）", "source": "9/15 階段練習・第 2 題", "stem": "如圖，△ABC 中，D、E 分別為 AB、AC 的中點，F、G 分別為 BD、CE 的中點，若 DE＋FG＝150，求 BC 的長度為多少？　(A) 120　(B) 130　(C) 140　(D) 150", "figure": "<svg viewBox='0 0 300 215' width='300' style='max-width:100%;display:block;margin:8px auto'><line x1='150' y1='20' x2='30' y2='190' stroke='#222' stroke-width='1.6'/><line x1='150' y1='20' x2='270' y2='190' stroke='#222' stroke-width='1.6'/><line x1='30' y1='190' x2='270' y2='190' stroke='#1B7F79' stroke-width='2'/><line x1='90' y1='105' x2='210' y2='105' stroke='#C0392B' stroke-width='1.8'/><line x1='60' y1='147.5' x2='240' y2='147.5' stroke='#C0392B' stroke-width='1.8'/><circle cx='90' cy='105' r='3.2' fill='#C0392B'/><circle cx='210' cy='105' r='3.2' fill='#C0392B'/><circle cx='60' cy='147.5' r='3.2' fill='#C0392B'/><circle cx='240' cy='147.5' r='3.2' fill='#C0392B'/><text x='144' y='15' font-size='13' fill='#222' font-style='italic'>A</text><text x='16' y='206' font-size='13' fill='#222' font-style='italic'>B</text><text x='274' y='206' font-size='13' fill='#222' font-style='italic'>C</text><text x='74' y='102' font-size='13' fill='#C0392B' font-style='italic'>D</text><text x='216' y='102' font-size='13' fill='#C0392B' font-style='italic'>E</text><text x='44' y='152' font-size='13' fill='#C0392B' font-style='italic'>F</text><text x='246' y='152' font-size='13' fill='#C0392B' font-style='italic'>G</text></svg>", "warmup": [{"concept": "midseg", "q": "△ABC 中 D、E 分別是 AB、AC 的中點，若 BC＝20，DE 是多少？", "a": "10（中點連線是第三邊的一半）。"}, {"concept": "par_equal", "q": "一個梯形的上底是 6、下底是 10，兩腰中點連起來的那條中線多長？", "a": "8（(6＋10)÷2＝8）。"}, {"concept": "collinear", "q": "D 是 AB 的中點、F 是 BD 的中點，那 BF 是 AB 的幾分之幾？", "a": "1/4（BD 是 1/2，再一半就是 1/4）。"}], "steps": [{"concept": "midseg", "jingle": "中點連中點，平行又一半", "guide": "👀 圖上看到什麼？D、E 是中點，F、G 也是中點，兩條線都跟 BC 看起來平行。💡 看到「中點連中點」，想到哪一個定理？", "answer": "中點連線定理：DE ∥ BC，而且 DE 是 BC 的一半。", "why": "兩個中點連起來，一定平行第三邊、長度剛好一半，這是它同時給你的兩件事。", "quiz": {"q": "若 BC＝80，DE 是多少？", "a": "40。"}}, {"concept": "midseg", "jingle": "中點連中點，平行又一半", "guide": "這題沒給 BC 的數字，那我們就先用 BC 把 DE 表示出來。不要急著填數字，寫成 BC 的式子就好。", "answer": "DE＝BC/2。", "why": "題目要求的就是 BC，所有東西都用 BC 表示，最後才好解一條方程式。", "quiz": {"q": "那反過來，BC 等於幾倍的 DE？", "a": "2 倍（BC＝2DE）。"}}, {"concept": "par_equal", "jingle": "等距平行線，切出等長段", "guide": "現在看下面那條 FG。因為 DE ∥ BC，DECB 圍出來是什麼形狀？F 和 G 又分別是哪兩條邊的中點？", "answer": "DECB 是梯形（DE ∥ BC），F、G 分別是兩腰 DB、EC 的中點，所以 FG 是梯形的中線。", "why": "認出「梯形中線」是這題的關鍵。它不是三角形中點連線，是梯形的中線，公式不一樣。", "quiz": {"q": "梯形中線的長度公式是什麼？", "a": "(上底＋下底)÷2。"}}, {"concept": "par_equal", "jingle": "等距平行線，切出等長段", "guide": "梯形中線＝(上底＋下底)÷2。這裡上底是 DE＝BC/2、下底是 BC。把它們代進去，FG 用 BC 表示是多少？", "answer": "FG＝(BC/2＋BC)÷2＝3BC/4。", "why": "BC/2＋BC＝3BC/2，再除以 2 就是 3BC/4。", "quiz": {"q": "若 BC＝40，FG 是多少？", "a": "30（(20＋40)÷2＝30）。"}}], "final": {"concept": "ratio_split", "guide": "兩條都用 BC 表示好了：DE＝BC/2、FG＝3BC/4，而且它們加起來是 150。自己把 BC 解出來。", "answer": "(A) 120", "why": "BC/2＋3BC/4＝5BC/4＝150，所以 BC＝150×4/5＝120。", "check": "代回去檢查一次：BC＝120 → DE＝60、FG＝(60＋120)÷2＝90，60＋90＝150 ✓ 跟題目一樣。合理性也對得上：DE 和 FG 都比 BC 短，兩條加起來比 BC 大一點點，很正常。最容易掉的坑是把 FG 也當成中點連線寫成 BC/2——FG 是梯形中線，不是三角形中線。", "concepts": ["midseg", "par_equal", "ratio_split"]}}, {"id": "t3", "title": "題 3・（三平行線・兩組不同頂點）", "source": "9/15 階段練習・第 3 題", "stem": "如圖，AB ∥ CD ∥ EF，若 AG：AF＝2：7，AC＝6，GD＝10，則 AB＋CE＝?　(A) 15　(B) 21　(C) 29　(D) 35", "figure": "<svg viewBox='0 0 360 272' width='340' style='max-width:100%;display:block;margin:8px auto'><line x1='8' y1='30' x2='352' y2='30' stroke='#1B7F79' stroke-width='1.8'/><line x1='8' y1='90' x2='352' y2='90' stroke='#1B7F79' stroke-width='1.8'/><line x1='8' y1='240' x2='352' y2='240' stroke='#1B7F79' stroke-width='1.8'/><line x1='230' y1='30' x2='20' y2='240' stroke='#222' stroke-width='1.6'/><line x1='230' y1='30' x2='280' y2='240' stroke='#222' stroke-width='1.6'/><line x1='320' y1='30' x2='280' y2='240' stroke='#222' stroke-width='1.6'/><circle cx='230' cy='30' r='3.2' fill='#C0392B'/><circle cx='320' cy='30' r='3.2' fill='#C0392B'/><circle cx='170' cy='90' r='3.2' fill='#C0392B'/><circle cx='244.29' cy='90' r='3.2' fill='#C0392B'/><circle cx='308.57' cy='90' r='3.2' fill='#C0392B'/><circle cx='20' cy='240' r='3.2' fill='#C0392B'/><circle cx='280' cy='240' r='3.2' fill='#C0392B'/><text x='226' y='22' font-size='13' fill='#222' font-style='italic'>A</text><text x='322' y='22' font-size='13' fill='#222' font-style='italic'>B</text><text x='154' y='84' font-size='13' fill='#222' font-style='italic'>C</text><text x='228' y='78' font-size='13' fill='#222' font-style='italic'>G</text><text x='313' y='84' font-size='13' fill='#222' font-style='italic'>D</text><text x='10' y='260' font-size='13' fill='#222' font-style='italic'>E</text><text x='284' y='260' font-size='13' fill='#222' font-style='italic'>F</text><text x='184' y='58' font-size='12' fill='#C0392B'>6</text><text x='268' y='106' font-size='12' fill='#C0392B'>10</text></svg>", "warmup": [{"concept": "par_prop", "q": "三條平行線被兩條截線切，一邊切出 2：5，另一邊上面那段是 4，下面那段是多少？", "a": "10（4：10＝2：5）。"}, {"concept": "collinear", "q": "AC＝6、AE＝21，那 CE 是多少？", "a": "15（AE−AC＝21−6）。"}, {"concept": "par_prop", "q": "若 AG：AF＝2：7，那 GF：AF 是多少？", "a": "5：7（GF＝AF−AG，7−2＝5）。"}], "steps": [{"concept": "par_prop", "jingle": "平行一刀切，兩邊比相等", "guide": "👀 看到三條平行線 AB ∥ CD ∥ EF，還有好幾條截線交來交去，有點眼花對不對～💡 先做一件事就會清楚：找出「從同一個點出發」的兩條截線。從 A 出發的是哪兩條？", "answer": "從 A 出發的是 A→C→E 和 A→G→F 這兩條。", "why": "從同一點出發的兩條截線被同一組平行線切，切出來的比一定一樣，這是最好用的一組。", "quiz": {"q": "那從 F 出發的是哪兩條截線？", "a": "F→G→A 和 F→D→B。"}}, {"concept": "par_prop", "jingle": "平行一刀切，兩邊比相等", "guide": "先用 A 這一組。中間那條線 CD 平行 EF，所以 A→C→E 和 A→G→F 被切出的比相等。題目給 AG：AF＝2：7，那 AC：AE 是多少？AE 呢？", "answer": "AC：AE＝2：7；AC＝6 → AE＝21。", "why": "同一個頂點 A 出發、被同一組平行線切，兩條截線上的比一定一樣，直接搬過來用。", "quiz": {"q": "那 CE 是多少？", "a": "15（21−6＝15）。"}}, {"concept": "par_prop", "jingle": "平行一刀切，兩邊比相等", "guide": "第一個答案有了。換另一組——這次站在 F 這個點看：F→G→A 和 F→D→B，中間被 CD 切。G 和 D 都在 CD 上、A 和 B 都在 AB 上，所以 GD 跟 AB 平行。那 FG：FA 是多少？", "answer": "GD ∥ AB，而 FG：FA＝(7−2)：7＝5：7。", "why": "AG 佔 AF 的 2 份，剩下的 FG 就是 5 份，所以從 F 量過去是 5：7。", "quiz": {"q": "若 AG：AF＝3：8，FG：FA 是多少？", "a": "5：8。"}}, {"concept": "propseg_def", "jingle": "四線成比例，交叉相乘看", "guide": "現在把比例式寫出來：FG：FA＝GD：AB。GD＝10，把 AB 解出來（四線成比例，交叉相乘看）。", "answer": "AB＝14。", "why": "5：7＝10：AB，交叉相乘得 5AB＝70，所以 AB＝14。", "quiz": {"q": "5：7＝20：? 是多少？", "a": "28。"}}], "final": {"concept": "par_prop", "guide": "AB 和 CE 都有了，題目問的是 AB＋CE。自己加起來。", "answer": "(C) 29", "why": "AB＝14、CE＝15，14＋15＝29。", "check": "檢查合理性：AC＝6 只佔 AE＝21 的 2/7，剩下的 CE 是 5/7＝15 ✓；GD＝10 那一段離 F 比較近（5 份），比 AB＝14（7 份）短，也合理。最容易掉的坑是把 AC：AE 寫成 AC：CE——AE 是整條、CE 只是下半段，代數字前先看清楚是「全」還是「半」。", "concepts": ["par_prop", "collinear", "propseg_def"]}}, {"id": "t4", "title": "題 4・（梯形內平行線＋依比例分配）", "source": "9/15 階段練習・第 4 題", "stem": "如圖，在梯形 ABCD 中，PQ 分別與 AD、BC 兩底平行，若 AB：DC＝3：4，AP：PB＝3：2，QC＝24，則 AP＝?　(A) 27　(B) 36　(C) 45　(D) 60", "figure": "<svg viewBox='0 0 360 210' width='320' style='max-width:100%;display:block;margin:8px auto'><line x1='80' y1='30' x2='240' y2='30' stroke='#1B7F79' stroke-width='2'/><line x1='30' y1='180' x2='320' y2='180' stroke='#1B7F79' stroke-width='2'/><line x1='80' y1='30' x2='30' y2='180' stroke='#222' stroke-width='1.6'/><line x1='240' y1='30' x2='320' y2='180' stroke='#222' stroke-width='1.6'/><line x1='50' y1='120' x2='288' y2='120' stroke='#C0392B' stroke-width='1.8'/><circle cx='50' cy='120' r='3.2' fill='#C0392B'/><circle cx='288' cy='120' r='3.2' fill='#C0392B'/><text x='66' y='25' font-size='13' fill='#222' font-style='italic'>A</text><text x='244' y='25' font-size='13' fill='#222' font-style='italic'>D</text><text x='14' y='197' font-size='13' fill='#222' font-style='italic'>B</text><text x='324' y='197' font-size='13' fill='#222' font-style='italic'>C</text><text x='30' y='124' font-size='13' fill='#C0392B' font-style='italic'>P</text><text x='294' y='124' font-size='13' fill='#C0392B' font-style='italic'>Q</text><text x='272' y='152' font-size='12' fill='#C0392B'>24</text></svg>", "warmup": [{"concept": "par_prop", "q": "梯形 ABCD 中 AD ∥ PQ ∥ BC，若 AP：PB＝2：3，那 DQ：QC 是多少？", "a": "2：3（兩腰被切出一樣的比）。"}, {"concept": "propseg_def", "q": "3：2＝DQ：24，DQ 是多少？", "a": "36（交叉相乘 2DQ＝72）。"}, {"concept": "inner_pt", "q": "一條長 60 的線段被分成前：後＝3：2，前段多長？", "a": "36（60×3/5）。"}], "steps": [{"concept": "par_prop", "jingle": "平行一刀切，兩邊比相等", "guide": "👀 看到梯形裡有一條 PQ，跟上底 AD、下底 BC 都平行。💡 想到什麼？現在有三條平行線，而兩條腰 AB、DC 就是被它們切過的截線——那兩腰上的比會怎樣？", "answer": "兩腰被切出相同的比：AP：PB＝DQ：QC。", "why": "AD ∥ PQ ∥ BC 是三條平行線，AB 和 DC 是兩條截線，平行一刀切，兩邊比相等。", "quiz": {"q": "若 AP：PB＝5：1，那 DQ：QC 是多少？", "a": "5：1。"}}, {"concept": "propseg_def", "jingle": "四線成比例，交叉相乘看", "guide": "題目給 AP：PB＝3：2，所以 DQ：QC 也是 3：2，而 QC＝24。DQ 是多少？", "answer": "DQ＝36。", "why": "3：2＝DQ：24，交叉相乘 2DQ＝72，DQ＝36。", "quiz": {"q": "3：2＝?：10 是多少？", "a": "15。"}}, {"concept": "collinear", "jingle": "同一條線上，線段能加減", "guide": "有 DQ 和 QC 了，那整條腰 DC 多長？", "answer": "DC＝36＋24＝60。", "why": "Q 在 DC 上，兩段加起來就是整條。", "quiz": {"q": "若 DQ＝18、QC＝12，DC 是多少？", "a": "30。"}}, {"concept": "ratio_split", "jingle": "份數先加總，一份是多少", "guide": "⚠️ 這裡要小心：題目問的是 AP，不是 DQ。題目還給了一個條件 AB：DC＝3：4，而 DC＝60。先把 AB 算出來。", "answer": "AB＝45。", "why": "3：4＝AB：60，交叉相乘 4AB＝180，AB＝45。兩條腰不一樣長，所以一定要先換到 AB 這一邊。", "quiz": {"q": "3：4＝?：80 是多少？", "a": "60。"}}], "final": {"concept": "inner_pt", "guide": "最後一步：AB＝45，而 AP：PB＝3：2。AP 佔整條 AB 的幾分之幾？自己算出 AP。", "answer": "(A) 27", "why": "AP：PB＝3：2，所以 AP 佔 3/(3＋2)＝3/5；45×3/5＝27。", "check": "驗一次：AP＝27 → PB＝45−27＝18，27：18＝3：2 ✓。最常掉的坑是算出 DC＝60 就直接乘 3/5 得到 36——那算的是 DQ 不是 AP。要先用 AB：DC＝3：4 換到 AB＝45，再乘 3/5。算完回頭看一眼題目問誰，這一步最省分。", "concepts": ["par_prop", "propseg_def", "inner_pt", "collinear", "ratio_split"]}}, {"id": "t5", "title": "題 5・（三平行線最基本型）", "source": "9/15 階段練習・第 5 題", "stem": "如圖，直線 L1 ∥ L2 ∥ L3，若 AB＝x，BC＝4，DE＝3，EF＝8，則 x＝?　(A) 1.5　(B) 2.5　(C) 5　(D) 6", "figure": "<svg viewBox='0 0 360 238' width='330' style='max-width:100%;display:block;margin:8px auto'><line x1='40' y1='30' x2='345' y2='30' stroke='#1B7F79' stroke-width='1.8'/><line x1='40' y1='79' x2='345' y2='79' stroke='#1B7F79' stroke-width='1.8'/><line x1='40' y1='210' x2='345' y2='210' stroke='#1B7F79' stroke-width='1.8'/><line x1='80' y1='30' x2='100' y2='210' stroke='#222' stroke-width='1.6'/><line x1='200' y1='30' x2='310' y2='210' stroke='#222' stroke-width='1.6'/><circle cx='80' cy='30' r='3.2' fill='#C0392B'/><circle cx='85' cy='79' r='3.2' fill='#C0392B'/><circle cx='100' cy='210' r='3.2' fill='#C0392B'/><circle cx='200' cy='30' r='3.2' fill='#C0392B'/><circle cx='230' cy='79' r='3.2' fill='#C0392B'/><circle cx='310' cy='210' r='3.2' fill='#C0392B'/><text x='10' y='34' font-size='13' fill='#1B7F79'>L₁</text><text x='10' y='83' font-size='13' fill='#1B7F79'>L₂</text><text x='10' y='214' font-size='13' fill='#1B7F79'>L₃</text><text x='70' y='24' font-size='13' fill='#222' font-style='italic'>A</text><text x='62' y='84' font-size='13' fill='#222' font-style='italic'>B</text><text x='88' y='228' font-size='13' fill='#222' font-style='italic'>C</text><text x='196' y='24' font-size='13' fill='#222' font-style='italic'>D</text><text x='236' y='74' font-size='13' fill='#222' font-style='italic'>E</text><text x='314' y='228' font-size='13' fill='#222' font-style='italic'>F</text><text x='64' y='60' font-size='12' fill='#C0392B' font-style='italic'>x</text><text x='80' y='150' font-size='12' fill='#C0392B'>4</text><text x='206' y='60' font-size='12' fill='#C0392B'>3</text><text x='258' y='150' font-size='12' fill='#C0392B'>8</text></svg>", "warmup": [{"concept": "par_prop", "q": "L1 ∥ L2 ∥ L3 被兩條截線切，一邊是 2：6，另一邊上段是 3，下段是多少？", "a": "9（3：9＝2：6）。"}, {"concept": "propseg_def", "q": "比例式 x：4＝3：8，交叉相乘之後是什麼式子？", "a": "8x＝12。"}, {"concept": "propseg_def", "q": "8x＝12，x 是多少？", "a": "1.5。"}], "steps": [{"concept": "par_prop", "jingle": "平行一刀切，兩邊比相等", "guide": "👀 看到三條平行線 L1 ∥ L2 ∥ L3，加兩條截線。💡 想到「平行一刀切，兩邊比相等」。那先說出來：左邊被切成哪兩段？右邊呢？", "answer": "左邊是 AB：BC，右邊是 DE：EF，這兩個比相等。", "why": "A、B、C 在同一條截線上，D、E、F 在另一條；平行線把兩條截線切成一樣的比。", "quiz": {"q": "「上：下＝上：下」，這題的「上」是哪兩段？", "a": "AB 和 DE。"}}, {"concept": "propseg_def", "jingle": "四線成比例，交叉相乘看", "guide": "把數字代進去：AB＝x、BC＝4、DE＝3、EF＝8。比例式長什麼樣子？", "answer": "x：4＝3：8。", "why": "左邊的上比下，等於右邊的上比下，直接對著寫就好。", "quiz": {"q": "如果題目改成問 BC，比例式會怎麼寫？", "a": "x：BC＝3：8。"}}, {"concept": "propseg_def", "jingle": "四線成比例，交叉相乘看", "guide": "四線成比例，交叉相乘看。自己交叉相乘一次。", "answer": "8x＝4×3＝12。", "why": "a：b＝c：d 就是 ad＝bc，外項乘外項、內項乘內項。", "quiz": {"q": "2：5＝6：y，交叉相乘是什麼？", "a": "2y＝30。"}}], "final": {"concept": "propseg_def", "guide": "8x＝12，x 是多少？", "answer": "(A) 1.5", "why": "x＝12÷8＝1.5。", "check": "代回去檢查：1.5：4 上下同乘 2 就是 3：8 ✓ 跟右邊一樣。再看合理性：右邊的 3 比 8 小很多（不到一半），左邊的 x 當然也要比 4 小很多，1.5 很合理。如果算出來是 6 或 5（比 4 還大），就要馬上警覺是不是比寫顛倒了。", "concepts": ["par_prop", "propseg_def"]}}, {"id": "t6", "title": "題 6・（相似面積比＝相似比平方）", "source": "9/15 階段練習・第 6 題", "stem": "△ABC 中，已知 D、E 分別為 AB、AC 的中點，若 △ABC 的面積為 20 平方單位，試求 △ADE 的面積為多少平方單位？　(A) 4　(B) 5　(C) 8　(D) 80", "figure": "<svg viewBox='0 0 300 205' width='300' style='max-width:100%;display:block;margin:8px auto'><line x1='150' y1='20' x2='40' y2='180' stroke='#222' stroke-width='1.6'/><line x1='150' y1='20' x2='260' y2='180' stroke='#222' stroke-width='1.6'/><line x1='40' y1='180' x2='260' y2='180' stroke='#1B7F79' stroke-width='2'/><line x1='95' y1='100' x2='205' y2='100' stroke='#C0392B' stroke-width='1.8'/><circle cx='95' cy='100' r='3.2' fill='#C0392B'/><circle cx='205' cy='100' r='3.2' fill='#C0392B'/><text x='144' y='15' font-size='13' fill='#222' font-style='italic'>A</text><text x='26' y='196' font-size='13' fill='#222' font-style='italic'>B</text><text x='264' y='196' font-size='13' fill='#222' font-style='italic'>C</text><text x='77' y='97' font-size='13' fill='#C0392B' font-style='italic'>D</text><text x='211' y='97' font-size='13' fill='#C0392B' font-style='italic'>E</text></svg>", "warmup": [{"concept": "midseg", "q": "D、E 是 AB、AC 的中點，那 AD：AB 是多少？", "a": "1：2。"}, {"concept": "sim_area", "q": "兩個相似三角形的邊長比是 1：3，面積比是多少？", "a": "1：9（3 的平方）。"}, {"concept": "sim_area", "q": "兩個相似三角形的面積比是 1：4，邊長比是多少？", "a": "1：2（開根號）。"}], "steps": [{"concept": "midseg", "jingle": "中點連中點，平行又一半", "guide": "👀 看到 D、E 是兩邊的中點。💡 想到中點連線 → DE ∥ BC。看到平行線，就找相似三角形——哪兩個三角形相似？", "answer": "△ADE ∽ △ABC。", "why": "DE ∥ BC 給同位角相等，再加上共用的 ∠A，兩角相等就相似。", "quiz": {"q": "相似要照順序寫，△ADE 的 D 對到 △ABC 的哪個字母？", "a": "B。"}}, {"concept": "sim_ratio", "jingle": "相似三角形，對應邊成比例", "guide": "相似比是多少？用 AD：AB 算算看。", "answer": "相似比 1：2。", "why": "D 是 AB 的中點，所以 AD 是 AB 的一半。", "quiz": {"q": "AE：AC 也是 1：2 嗎？", "a": "是，因為 E 也是中點。"}}, {"concept": "sim_area", "jingle": "邊 k 倍，面積 k 平方倍", "guide": "這是最關鍵的一步，慢慢想：邊長比是 1：2，那面積比是多少？（提醒一下，不是 1：2 喔）", "answer": "面積比是 1：4。", "why": "邊變 k 倍，面積變 k 的平方倍。1²：2²＝1：4。", "quiz": {"q": "邊長比 2：5，面積比是多少？", "a": "4：25。"}}], "final": {"concept": "sim_area", "guide": "△ABC 的面積是 20，△ADE 佔其中的幾分之幾？自己算出來。", "answer": "(B) 5", "why": "面積比 1：4，所以 △ADE＝20×1/4＝5。", "check": "看合理性：△ADE 只是整個三角形靠近 A 的那一小角，一定比 20 小很多，5 合理。最常掉的坑是寫 20÷2＝10——那是直接拿邊長比去除面積。面積要用平方，這句要記牢。", "concepts": ["midseg", "sim_ratio", "sim_area"]}}, {"id": "t7", "title": "題 7・（連比合併・對齊公用項）", "source": "9/15 階段練習・第 7 題", "stem": "設 y：x＝3：7，y：z＝3：4，則 x：y：z＝?　(A) 9：21：28　(B) 12：28：21　(C) 7：3：4　(D) 4：3：7", "warmup": [{"concept": "ratio3_def", "q": "3：7 和 7：3 是一樣的比嗎？", "a": "不一樣，順序不能隨便換。"}, {"concept": "ratio3_merge", "q": "x：y＝2：3、y：z＝3：5，那 x：y：z 是多少？", "a": "2：3：5（y 本來就都是 3，直接接）。"}, {"concept": "ratio3_merge", "q": "y：x＝4：9 反過來寫成 x：y 是多少？", "a": "9：4（數字跟著字一起換邊）。"}], "steps": [{"concept": "ratio3_merge", "jingle": "中間那個字，化成一樣大", "guide": "👀 看到兩個比，而且兩個都有 y。💡 想到「中間那個字，化成一樣大」就能接起來。但先等一下——題目問的是 x：y：z，可是第一個比寫成 y：x，順序對嗎？", "answer": "不對，要先把 y：x＝3：7 反過來寫成 x：y＝7：3。", "why": "題目問 x 在前面，所以先把比的順序調成 x：y，數字要跟著字一起換邊。", "quiz": {"q": "z：y＝5：2 換成 y：z 是多少？", "a": "2：5。"}}, {"concept": "ratio3_merge", "jingle": "中間那個字，化成一樣大", "guide": "現在有 x：y＝7：3 和 y：z＝3：4。看看兩個式子裡的 y，數字一樣大嗎？", "answer": "一樣，都是 3，不用調。", "why": "公用的那個字必須一樣大才接得起來。這題運氣好，兩邊的 y 剛好都是 3。", "quiz": {"q": "如果是 x：y＝7：3、y：z＝6：8，y 要化成多少？", "a": "6（第一個比同乘 2 變成 14：6）。"}}, {"concept": "ratio3_def", "jingle": "三個量一起比，份數對得起", "guide": "y 已經對齊了，直接把三個接起來。x：y：z 是多少？", "answer": "7：3：4。", "why": "x 是 7 份、y 是 3 份、z 是 4 份，三個量一起比，份數對得起來。", "quiz": {"q": "x：y＝2：5、y：z＝5：9，x：y：z 是多少？", "a": "2：5：9。"}}], "final": {"concept": "ratio3_def", "guide": "對照選項，選出 x：y：z。", "answer": "(C) 7：3：4", "why": "y：x＝3：7 反過來是 x：y＝7：3；配上 y：z＝3：4，y 都是 3，接起來就是 7：3：4。", "check": "拆回去檢查最保險：7：3：4 裡面，y：x＝3：7 ✓、y：z＝3：4 ✓，兩個條件都對得上。最容易掉的坑是看到 3：7 就直接寫 3：7：4——忘了題目問的順序是 x 在前面。寫答案前先把題目問的順序抄一次。", "concepts": ["ratio3_merge", "ratio3_def"]}}, {"id": "t8", "title": "題 8・（連比合併・先把分數化整數）", "source": "9/15 階段練習・第 8 題", "stem": "設 x：y＝1/2：3/4，x：z＝6：7，則 x：y：z＝?　(A) 4：6：7　(B) 6：9：7　(C) 4：3：7　(D) 3：4：7", "warmup": [{"concept": "ratio3_def", "q": "1/2：3/4 化成最簡整數比是多少？", "a": "2：3（兩邊同乘 4）。"}, {"concept": "ratio3_merge", "q": "x：y＝2：3、x：z＝6：7，公用的 x 要化成多少？", "a": "6（2 和 6 的最小公倍數）。"}, {"concept": "ratio3_merge", "q": "2：3 兩邊同乘 3 是多少？", "a": "6：9。"}], "steps": [{"concept": "ratio3_merge", "jingle": "中間那個字，化成一樣大", "guide": "👀 看到一個比裡面有分數，而且兩個比都有 x。💡 想到兩件事：先把分數比化成整數比，再把 x 對齊。先做第一件——1/2：3/4 怎麼化？", "answer": "兩邊同乘 4 → 2：3。", "why": "比的每一項同乘一個數，比值不會變；乘上分母的最小公倍數 4，分數就全部消掉了。", "quiz": {"q": "1/3：2/5 化成整數比是多少？", "a": "5：6（同乘 15）。"}}, {"concept": "ratio3_merge", "jingle": "中間那個字，化成一樣大", "guide": "現在有 x：y＝2：3 和 x：z＝6：7。⚠️ 注意這次公用的字是 x，不是中間的 y。兩個式子裡的 x 一個是 2、一個是 6，要化成多少？", "answer": "化成 6。", "why": "公用的那個字必須一樣大才能接。2 和 6 的最小公倍數是 6，所以把第一個比放大。", "quiz": {"q": "x：y＝3：4、x：z＝5：2，x 要化成多少？", "a": "15（3 和 5 的最小公倍數）。"}}, {"concept": "ratio3_merge", "jingle": "中間那個字，化成一樣大", "guide": "把 x：y＝2：3 兩邊同乘 3，變成多少？", "answer": "6：9。", "why": "同乘 3 比值不變，x 就對齊成 6 了。", "quiz": {"q": "2：3 同乘 5 是多少？", "a": "10：15。"}}], "final": {"concept": "ratio3_def", "guide": "x：y＝6：9、x：z＝6：7，x 都是 6 了，接成 x：y：z。", "answer": "(B) 6：9：7", "why": "x 對齊成 6，y＝9、z＝7，接起來就是 6：9：7。", "check": "拆回去檢查：6：9 約分是 2：3，而 1/2：3/4 同乘 4 也是 2：3 ✓；6：7 ✓。最容易掉的坑是懶得化分數，直接把 1/2、3/4 和 7 寫在一起變成怪怪的式子。看到比裡有分數，第一個動作永遠是「同乘分母的最小公倍數」。", "concepts": ["ratio3_merge", "ratio3_def"]}}, {"id": "t9", "title": "題 9・（連比合併＋設 k 代總和）", "source": "9/15 階段練習・第 9 題", "stem": "設 x：y＝2：3，y：z＝4：5，已知 x＋y＋2z＝150，則 y＝?　(A) 24　(B) 30　(C) 36　(D) 42", "warmup": [{"concept": "ratio3_merge", "q": "x：y＝2：3、y：z＝4：5，公用的 y 要化成多少？", "a": "12（3 和 4 的最小公倍數）。"}, {"concept": "ratio3_k", "q": "x：y：z＝8：12：15，一份設成 k，z 是多少？", "a": "15k。"}, {"concept": "ratio3_k", "q": "50k＝150，k 是多少？", "a": "3。"}], "steps": [{"concept": "ratio3_merge", "jingle": "中間那個字，化成一樣大", "guide": "👀 看到兩個比 x：y、y：z，再加一條等式 x＋y＋2z＝150。💡 想到兩步：先把兩個比接成一條連比，再設 k 把三個未知數變成一個。先接——y 在兩邊分別是 3 和 4，要化成多少？", "answer": "化成 12（3 和 4 的最小公倍數）。", "why": "中間那個字化成一樣大，兩個比才接得起來。", "quiz": {"q": "如果 y 分別是 2 和 5，要化成多少？", "a": "10。"}}, {"concept": "ratio3_merge", "jingle": "中間那個字，化成一樣大", "guide": "把 x：y＝2：3 同乘 4、y：z＝4：5 同乘 3，接起來 x：y：z 是多少？", "answer": "8：12：15。", "why": "2：3 乘 4 是 8：12；4：5 乘 3 是 12：15；y 都是 12，接成 8：12：15。", "quiz": {"q": "8：12：15 裡面 x 佔幾份？", "a": "8 份。"}}, {"concept": "ratio3_k", "jingle": "一份設成 k，三個變一個", "guide": "一份設成 k，三個變一個。x、y、z 各是多少？", "answer": "x＝8k、y＝12k、z＝15k。", "why": "連比講的就是「幾份」，一份是 k，各自乘上自己的份數。", "quiz": {"q": "若 k＝2，y 是多少？", "a": "24。"}}, {"concept": "ratio3_k", "jingle": "一份設成 k，三個變一個", "guide": "代進 x＋y＋2z＝150。⚠️ z 前面有個 2，別漏掉。式子會變成什麼？", "answer": "8k＋12k＋30k＝50k＝150。", "why": "2z＝2×15k＝30k，三項加起來是 50k。", "quiz": {"q": "如果式子是 x＋y＋z，會是幾 k？", "a": "35k。"}}], "final": {"concept": "ratio3_k", "guide": "50k＝150，k 是多少？⚠️ 算出 k 先別停，題目問的是 y。", "answer": "(C) 36", "why": "k＝3，y＝12k＝12×3＝36。", "check": "代回去驗：x＝24、y＝36、z＝45，24＋36＋2×45＝24＋36＋90＝150 ✓。這題最容易停的地方就是算出 k＝3 就填 3。k 只是「一份」，不是答案。算完先回頭把題目問的那個字圈起來，再寫。", "concepts": ["ratio3_merge", "ratio3_k", "ratio3_def"]}}, {"id": "t10", "title": "題 10・（由方程式轉成連比）", "source": "9/15 階段練習・第 10 題", "stem": "已知 x、y、z 皆不等於 0，且 x−3z＝0，4y＝7z，則 x：y：z＝?　(A) 12：7：4　(B) 4：21：12　(C) 21：7：4　(D) 7：21：12", "warmup": [{"concept": "ratio3_def", "q": "x＝3z，那 x：z 是多少？", "a": "3：1。"}, {"concept": "ratio3_def", "q": "4y＝7z，y：z 是多少？", "a": "7：4（係數交叉過去）。"}, {"concept": "ratio3_merge", "q": "x：z＝3：1 和 y：z＝7：4，公用的 z 要化成多少？", "a": "4。"}], "steps": [{"concept": "ratio3_def", "jingle": "三個量一起比，份數對得起", "guide": "👀 看到的不是比，是兩條等式 x−3z＝0 和 4y＝7z。💡 想到什麼？等式可以換成比。先整理第一條：x 等於什麼？", "answer": "x＝3z。", "why": "x−3z＝0 移項就變成 x＝3z，馬上看得出 x 是 z 的 3 倍。", "quiz": {"q": "y−5z＝0 整理後 y 等於什麼？", "a": "y＝5z。"}}, {"concept": "ratio3_def", "jingle": "三個量一起比，份數對得起", "guide": "這種題有一招最快：讓 z 當基準，自己幫 z 設一個好算的數字。看 4y＝7z，z 設成多少才不會冒出分數？", "answer": "設 z＝4。", "why": "4y＝7z，z＝4 時 4y＝28 → y＝7，剛好是整數。設成 y 前面的係數 4 最省事。", "quiz": {"q": "如果是 3y＝5z，z 要設成多少？", "a": "3。"}}, {"concept": "ratio3_k", "jingle": "一份設成 k，三個變一個", "guide": "z＝4 代進兩條式子，x 和 y 各是多少？", "answer": "x＝12、y＝7。", "why": "x＝3z＝3×4＝12；4y＝7×4＝28 → y＝7。", "quiz": {"q": "如果改設 z＝8，x 和 y 是多少？比值會變嗎？", "a": "x＝24、y＝14；比值一樣，還是 12：7：4。"}}], "final": {"concept": "ratio3_def", "guide": "三個數都有了，照題目問的順序 x：y：z 寫出來。", "answer": "(A) 12：7：4", "why": "x＝12、y＝7、z＝4，所以 x：y：z＝12：7：4。", "check": "代回原式驗一次：x−3z＝12−12＝0 ✓；4y＝28、7z＝28，相等 ✓。還有一個很快的刷選項法：4y＝7z 表示 y：z＝7：4，也就是 y 一定比 z 大。選項裡只要 y 比 z 小的，看都不用看就刪掉。", "concepts": ["ratio3_def", "ratio3_merge", "ratio3_k"]}}, {"id": "t11", "title": "題 11・（2x＝3y＝5z 型）", "source": "9/15 階段練習・第 11 題", "stem": "若 xyz ≠ 0 且 2x＝3y＝5z，則 x：y：z 與下列何者相同？　(A) 2：3：5　(B) 1/2：1/3：1/5　(C) 3：2：5　(D) 1/5：1/3：1/2", "warmup": [{"concept": "ratio3_def", "q": "2x＝3y，那 x：y 是多少？", "a": "3：2（係數交叉過去）。"}, {"concept": "ratio3_k", "q": "若 2x＝3y＝5z＝30，x、y、z 各是多少？", "a": "x＝15、y＝10、z＝6。"}, {"concept": "ratio3_def", "q": "1/2：1/3：1/5 化成整數比是多少？", "a": "15：10：6（三項同乘 30）。"}], "steps": [{"concept": "ratio3_k", "jingle": "一份設成 k，三個變一個", "guide": "👀 看到三個東西被等號串成一串：2x＝3y＝5z。💡 想到什麼？一串東西相等，就給它設一個值。你覺得設成哪個數字最省事？", "answer": "設 2x＝3y＝5z＝30（也就是 2、3、5 的最小公倍數）。", "why": "設成公倍數，三個數除下去都會是整數，完全不用碰分數。", "quiz": {"q": "如果是 3x＝4y＝6z，設成多少最省事？", "a": "12。"}}, {"concept": "ratio3_k", "jingle": "一份設成 k，三個變一個", "guide": "設成 30 了，x、y、z 各是多少？", "answer": "x＝15、y＝10、z＝6。", "why": "2x＝30 → x＝15；3y＝30 → y＝10；5z＝30 → z＝6。", "quiz": {"q": "如果改設成 60，x 是多少？比值會變嗎？", "a": "x＝30；比值一樣，還是 15：10：6。"}}, {"concept": "ratio3_def", "jingle": "三個量一起比，份數對得起", "guide": "所以 x：y：z＝15：10：6。現在看選項 (B) 是 1/2：1/3：1/5，把它化成整數比，看看跟 15：10：6 一不一樣。", "answer": "1/2：1/3：1/5 三項同乘 30 ＝ 15：10：6，一模一樣。", "why": "比的每一項同乘 30，比值不變，而 30 剛好把三個分母全部消掉。", "quiz": {"q": "1/3：1/4 化成整數比是多少？", "a": "4：3（同乘 12）。"}}], "final": {"concept": "ratio3_def", "guide": "選出跟 15：10：6 相同的那個選項，順便講一句你是怎麼看出來的。", "answer": "(B) 1/2：1/3：1/5", "why": "2x＝3y＝5z 時，x：y：z 就是係數的倒數比 1/2：1/3：1/5，化成整數是 15：10：6。", "check": "來看 (A) 2：3：5 為什麼是陷阱：它只是把係數直接抄下來。可是想想看，x 前面的係數 2 最小，代表 x 要最大才乘得到同一個數——係數大的反而小，所以要取倒數。記住這一句就不會錯：係數大的，本人就小。", "concepts": ["ratio3_k", "ratio3_def", "ratio3_merge"]}}, {"id": "t12", "title": "題 12・（同一個比在兩個三角形裡傳遞）", "source": "9/15 階段練習・第 12 題", "stem": "如圖，△ABC 中，DE ∥ BC，EF ∥ CD，若 AF＝8，DF＝4，則 AB＝?　(A) 10　(B) 16　(C) 18　(D) 22", "figure": "<svg viewBox='0 0 340 226' width='320' style='max-width:100%;display:block;margin:8px auto'><line x1='150' y1='20' x2='40' y2='200' stroke='#222' stroke-width='1.6'/><line x1='150' y1='20' x2='280' y2='200' stroke='#222' stroke-width='1.6'/><line x1='40' y1='200' x2='280' y2='200' stroke='#1B7F79' stroke-width='2'/><line x1='76.67' y1='140' x2='236.67' y2='140' stroke='#C0392B' stroke-width='1.8'/><line x1='76.67' y1='140' x2='280' y2='200' stroke='#1B7F79' stroke-width='1.6'/><line x1='101.11' y1='100' x2='236.67' y2='140' stroke='#C0392B' stroke-width='1.6'/><circle cx='101.11' cy='100' r='3.2' fill='#C0392B'/><circle cx='76.67' cy='140' r='3.2' fill='#C0392B'/><circle cx='236.67' cy='140' r='3.2' fill='#C0392B'/><text x='144' y='15' font-size='13' fill='#222' font-style='italic'>A</text><text x='26' y='216' font-size='13' fill='#222' font-style='italic'>B</text><text x='284' y='216' font-size='13' fill='#222' font-style='italic'>C</text><text x='84' y='97' font-size='13' fill='#C0392B' font-style='italic'>F</text><text x='56' y='144' font-size='13' fill='#C0392B' font-style='italic'>D</text><text x='242' y='144' font-size='13' fill='#C0392B' font-style='italic'>E</text><text x='118' y='64' font-size='12' fill='#C0392B'>8</text><text x='78' y='122' font-size='12' fill='#C0392B'>4</text></svg>", "warmup": [{"concept": "par_prop", "q": "△ACD 中 EF ∥ CD，AF＝8、FD＝4，那 AE：EC 是多少？", "a": "2：1（8：4 化簡）。"}, {"concept": "collinear", "q": "AF＝8、FD＝4，那 AD 是多少？", "a": "12（同一條線上加起來）。"}, {"concept": "par_prop", "q": "AD：DB＝2：1 且 AD＝12，DB 是多少？", "a": "6。"}], "steps": [{"concept": "par_prop", "jingle": "平行一刀切，兩邊比相等", "guide": "👀 看到兩組平行：DE ∥ BC、EF ∥ CD。💡 想到每一組平行都會在「某一個三角形」裡切出比。先問自己：EF ∥ CD 這一組，切的是哪一個三角形？", "answer": "是 △ACD（F 在 AD 上、E 在 AC 上）。", "why": "要用平行截比例線段，第一件事永遠是先認出「這條平行線切的是哪個三角形」。認錯三角形，後面全錯。", "quiz": {"q": "那 DE ∥ BC 這一組，切的是哪個三角形？", "a": "△ABC。"}}, {"concept": "par_prop", "jingle": "平行一刀切，兩邊比相等", "guide": "在 △ACD 裡用 EF ∥ CD。題目給 AF＝8、FD＝4，這會告訴你哪一段的比？", "answer": "AE：EC＝AF：FD＝8：4＝2：1。", "why": "平行一刀切，兩邊比相等：AD 邊上切出 8：4，AC 邊上就切出一樣的 2：1。", "quiz": {"q": "若 AF＝6、FD＝2，AE：EC 是多少？", "a": "3：1。"}}, {"concept": "par_prop", "jingle": "平行一刀切，兩邊比相等", "guide": "關鍵來了：AE：EC＝2：1 這個比，換到第二個三角形 △ABC 裡（DE ∥ BC），可以用來求誰？", "answer": "可以求 AD：DB，因為 AD：DB＝AE：EC＝2：1。", "why": "AE：EC 這個比被兩組平行線共用，比就這樣從一個三角形「傳」到另一個三角形。這是這題唯一的難點。", "quiz": {"q": "若 AE：EC＝3：2，那 AD：DB 是多少？", "a": "3：2。"}}, {"concept": "collinear", "jingle": "同一條線上，線段能加減", "guide": "AD 是多少？（看圖：A→F→D 這兩段加起來）算出來以後，再用 AD：DB＝2：1 求 DB。", "answer": "AD＝8＋4＝12，DB＝6。", "why": "AD＝AF＋FD＝12；AD：DB＝2：1，所以 DB＝12÷2＝6。", "quiz": {"q": "若 AD＝20、AD：DB＝2：1，DB 是多少？", "a": "10。"}}], "final": {"concept": "collinear", "guide": "AB 是整條邊，等於哪兩段相加？自己算出來。", "answer": "(C) 18", "why": "AB＝AD＋DB＝12＋6＝18。", "check": "驗一次：AD：DB＝12：6＝2：1 ✓，跟 AE：EC＝2：1 一致。這題最容易掉的坑是把 AF：FD＝8：4 直接當成 AD：DB——那是 AC 邊上傳過來的比，中間要繞一圈。另一個坑是把 AD 看成 8（那是 AF），畫圖時把 A→F→D→B 的順序標清楚就不會混。", "concepts": ["par_prop", "collinear", "propseg_def"]}}, {"id": "t13", "title": "題 13・（梯形補成三角形・高的坑）", "source": "9/15 階段練習・第 13 題", "stem": "如圖，小峻先將海報紙裁製成一張三角形（△ECD），再剪去 △EAB，使得剩下的紙張是一個梯形。已知 AB ∥ CD，AB＝4，CD＝12，若梯形 ABDC 的高為 6，則 △EAB 的面積為多少平方單位？　(A) 3　(B) 6　(C) 8　(D) 12", "figure": "<svg viewBox='0 0 300 236' width='300' style='max-width:100%;display:block;margin:8px auto'><line x1='150' y1='30' x2='110' y2='90' stroke='#8a8a8a' stroke-width='1.5' stroke-dasharray='5 4'/><line x1='150' y1='30' x2='190' y2='90' stroke='#8a8a8a' stroke-width='1.5' stroke-dasharray='5 4'/><line x1='110' y1='90' x2='190' y2='90' stroke='#C0392B' stroke-width='2'/><line x1='30' y1='210' x2='270' y2='210' stroke='#C0392B' stroke-width='2'/><line x1='110' y1='90' x2='30' y2='210' stroke='#222' stroke-width='1.6'/><line x1='190' y1='90' x2='270' y2='210' stroke='#222' stroke-width='1.6'/><line x1='150' y1='90' x2='150' y2='210' stroke='#8a8a8a' stroke-width='1.2' stroke-dasharray='3 3'/><line x1='145' y1='90' x2='155' y2='90' stroke='#8a8a8a' stroke-width='1.2'/><line x1='145' y1='210' x2='155' y2='210' stroke='#8a8a8a' stroke-width='1.2'/><text x='144' y='24' font-size='13' fill='#222' font-style='italic'>E</text><text x='96' y='86' font-size='13' fill='#222' font-style='italic'>B</text><text x='196' y='86' font-size='13' fill='#222' font-style='italic'>A</text><text x='16' y='226' font-size='13' fill='#222' font-style='italic'>C</text><text x='276' y='226' font-size='13' fill='#222' font-style='italic'>D</text><text x='144' y='84' font-size='12' fill='#C0392B'>4</text><text x='142' y='204' font-size='12' fill='#C0392B'>12</text><text x='158' y='156' font-size='12' fill='#8a8a8a'>6</text></svg>", "warmup": [{"concept": "sim_ratio", "q": "AB ∥ CD，AB＝4、CD＝12，△EAB 和 △ECD 的相似比是多少？", "a": "1：3（4：12 化簡）。"}, {"concept": "sim_height", "q": "兩個相似三角形的相似比是 1：3，它們的高的比是多少？", "a": "也是 1：3（高、中線、角平分線都跟邊同比）。"}, {"concept": "collinear", "q": "大三角形的高是 3h、小三角形的高是 h，中間梯形的高是多少？", "a": "2h（3h−h）。"}], "steps": [{"concept": "sim_ratio", "jingle": "相似接相似，比要乘到底", "guide": "👀 看到 AB ∥ CD，小三角形疊在大三角形裡面，兩個共用頂點 E。💡 看到平行線，就找相似三角形——哪兩個相似？相似比多少？（題 13、14、15、18 是同一型：相似接相似，比要乘到底。）", "answer": "△EAB ∽ △ECD，相似比 AB：CD＝4：12＝1：3。", "why": "AB ∥ CD 給同位角相等，加上共用的 ∠E，兩角相等就相似。", "quiz": {"q": "若 AB＝5、CD＝15，相似比是多少？", "a": "1：3。"}}, {"concept": "sim_height", "jingle": "相似接相似，比要乘到底", "guide": "相似比 1：3。那兩個三角形「從 E 量下來的高」，比是多少？", "answer": "高的比也是 1：3。", "why": "相似三角形的對應高、對應中線、對應角平分線，比值都跟邊長比一樣。", "quiz": {"q": "相似比 2：5，高的比是多少？", "a": "2：5。"}}, {"concept": "sim_height", "jingle": "相似接相似，比要乘到底", "guide": "⚠️ 這裡是這題最大的坑，慢慢看清楚。題目給的 6 是「梯形的高」。設小三角形 △EAB 的高是 h，那大三角形 △ECD 的高就是 3h。那梯形 ABDC 的高，是 h？是 3h？還是別的？", "answer": "梯形的高 ＝ 3h − h ＝ 2h，不是 h，也不是 3h。", "why": "梯形是大三角形「剪掉」小三角形之後剩下的那一塊，所以它的高是大高減小高。題目給的 6 是這個「差」，直接當成小三角形的高就會算錯。", "quiz": {"q": "若相似比是 1：4，梯形的高用 h 表示是多少？", "a": "3h（4h−h）。"}}, {"concept": "sim_height", "jingle": "相似接相似，比要乘到底", "guide": "所以 2h＝6。小三角形 △EAB 的高 h 是多少？", "answer": "h＝3。", "why": "2h＝6 → h＝3。△EAB 的高只有 3，不是 6。", "quiz": {"q": "若梯形的高是 10、相似比 1：3，h 是多少？", "a": "5（2h＝10）。"}}], "final": {"concept": "sim_height", "guide": "△EAB 的底是 AB＝4、高是 3。自己算面積。", "answer": "(B) 6", "why": "△EAB＝½×4×3＝6。", "check": "換一條路再驗一次：梯形面積＝(4＋12)÷2×6＝48；大三角形 △ECD＝½×12×9＝54；54−48＝6 ✓ 兩條路答案一樣，可以放心。如果不小心把高當成 6，會得到 ½×4×6＝12。那就檢查看看：高 6 代表大三角形高 18、梯形高 12，跟題目給的 6 對不上，馬上就知道錯在哪。", "concepts": ["sim_ratio", "sim_height", "sim_area", "collinear"]}}, {"id": "t14", "title": "題 14・（X 形相似＋面積比一路乘到底）", "source": "9/15 階段練習・第 14 題", "stem": "如圖，有一平行四邊形 ABCD，E 在 BC 上，AE 與對角線 BD 交於 F。若 DF：FB＝3：2，則 △BEF 是平行四邊形 ABCD 面積的幾分之幾？　(A) 2/5　(B) 1/10　(C) 1/15　(D) 2/15", "figure": "<svg viewBox='0 0 320 216' width='320' style='max-width:100%;display:block;margin:8px auto'><polygon points='20,190 166.67,190 124,130' fill='rgba(192,57,43,0.18)' stroke='none' stroke-width='1'/><line x1='60' y1='40' x2='280' y2='40' stroke='#1B7F79' stroke-width='2'/><line x1='20' y1='190' x2='240' y2='190' stroke='#1B7F79' stroke-width='2'/><line x1='60' y1='40' x2='20' y2='190' stroke='#222' stroke-width='1.6'/><line x1='280' y1='40' x2='240' y2='190' stroke='#222' stroke-width='1.6'/><line x1='60' y1='40' x2='166.67' y2='190' stroke='#222' stroke-width='1.5'/><line x1='20' y1='190' x2='280' y2='40' stroke='#222' stroke-width='1.5'/><line x1='280' y1='40' x2='166.67' y2='190' stroke='#8a8a8a' stroke-width='1.4'/><circle cx='166.67' cy='190' r='3.2' fill='#C0392B'/><circle cx='124' cy='130' r='3.2' fill='#C0392B'/><text x='46' y='34' font-size='13' fill='#222' font-style='italic'>A</text><text x='284' y='36' font-size='13' fill='#222' font-style='italic'>D</text><text x='6' y='206' font-size='13' fill='#222' font-style='italic'>B</text><text x='244' y='206' font-size='13' fill='#222' font-style='italic'>C</text><text x='160' y='207' font-size='13' fill='#C0392B' font-style='italic'>E</text><text x='128' y='126' font-size='13' fill='#C0392B' font-style='italic'>F</text><text x='196' y='96' font-size='12' fill='#222'>3</text><text x='50' y='172' font-size='12' fill='#222'>2</text></svg>", "warmup": [{"concept": "x_sim", "q": "AD ∥ BC，AE 和 BD 交於 F，哪兩個三角形相似？", "a": "△AFD ∽ △EFB（X 形相似）。"}, {"concept": "sim_ratio", "q": "△AFD ∽ △EFB 且 DF：FB＝3：2，那 AD：EB 是多少？", "a": "3：2。"}, {"concept": "inner_pt", "q": "F 在 BD 上且 DF：FB＝3：2。若 D 離 BC 的距離是 h，F 離 BC 有多高？", "a": "(2/5)h（F 離 B 只有全長的 2/5）。"}], "steps": [{"concept": "x_sim", "jingle": "相似接相似，比要乘到底", "guide": "👀 看到平行四邊形（所以 AD ∥ BC），還有 AE 和 BD 交叉在 F。💡 平行加交叉，想到什麼？（題 13、14、15、18 是同一型：相似接相似，比要乘到底。）", "answer": "X 形相似：△AFD ∽ △EFB。", "why": "AD ∥ BE 給內錯角相等，再加上對頂角 ∠AFD＝∠EFB，兩角相等就相似。", "quiz": {"q": "X 形相似時，AF 對應到哪一段？", "a": "EF。"}}, {"concept": "sim_ratio", "jingle": "相似接相似，比要乘到底", "guide": "題目給 DF：FB＝3：2。用相似把它換成邊長的比：AD：EB 是多少？", "answer": "AD：EB＝3：2。", "why": "相似三角形對應邊成比例，DF 和 FB 是一組對應邊，AD 和 EB 是另一組，比值一樣。", "quiz": {"q": "若 DF：FB＝5：1，AD：EB 是多少？", "a": "5：1。"}}, {"concept": "sim_ratio", "jingle": "相似接相似，比要乘到底", "guide": "為了好算，我們自己設數字：設 AD＝3（那 BC 也是 3，平行四邊形對邊相等）、EB＝2，平行四邊形的高是 h。先把平行四邊形的面積寫下來。", "answer": "平行四邊形面積＝底×高＝3h。", "why": "設一個好算的數字，最後算比值的時候 h 會自己消掉，不用真的知道 h 是多少。", "quiz": {"q": "若 AD＝6、高是 h，平行四邊形面積是多少？", "a": "6h。"}}, {"concept": "inner_pt", "jingle": "相似接相似，比要乘到底", "guide": "要算 △BEF 的面積。底很好找，就是 BE＝2。可是高呢？⚠️ F 不在 AD 上也不在 BC 上，它在 BD 中間。DF：FB＝3：2，從 BC 往上量，F 有多高？", "answer": "F 到 BC 的距離＝(2/5)h。", "why": "D 離 BC 是 h、B 離 BC 是 0；F 把 BD 分成 DF：FB＝3：2，F 離 B 只佔全長的 2/5，所以高只有 h 的 2/5。", "quiz": {"q": "若 DF：FB＝1：4，F 到 BC 的距離是多少？", "a": "(4/5)h。"}}, {"concept": "inner_pt", "jingle": "相似接相似，比要乘到底", "guide": "材料齊了：△BEF 的底是 2、高是 (2/5)h。算出它的面積，再跟平行四邊形的 3h 放在一起。", "answer": "△BEF＝½×2×(2/5)h＝(2/5)h。", "why": "三角形面積＝½×底×高，代進去就好。", "quiz": {"q": "底 4、高 (1/5)h 的三角形，面積是多少？", "a": "(2/5)h。"}}], "final": {"concept": "inner_pt", "guide": "最後一步：(2/5)h 是 3h 的幾分之幾？自己除一次。", "answer": "(D) 2/15", "why": "(2/5)h ÷ 3h ＝ 2/15（h 自己消掉了）。", "check": "⚠️ 這題最大的坑是「算到中間比就停」。△BEF：△ABE ＝ FE：AE ＝ 2：5，很多人算到 2/5 就填答案了——但 2/5 比的是 △ABE，不是整個平行四邊形。還要再乘一層 △ABE：平行四邊形 ＝ 1：3，2/5 × 1/3 ＝ 2/15 才是答案。算完先問自己一句：我這個比的「分母」，是題目問的那個嗎？", "concepts": ["x_sim", "sim_ratio", "inner_pt"]}}, {"id": "t15", "title": "題 15・（面積相等定出 D 的高）", "source": "9/15 階段練習・第 15 題", "stem": "如圖，是 △ABC 與 △DEC 重疊的情形，其中 E 在 BC 上，AC 交 DE 於 F 點，且 AB ∥ DE。若 △ABC 與 △CDE 的面積相等，且 EF＝3，AB＝4，則 DF＝?　(A) 1.5　(B) 7/3　(C) 6　(D) 7.5", "figure": "<svg viewBox='0 0 340 246' width='330' style='max-width:100%;display:block;margin:8px auto'><line x1='60' y1='70' x2='30' y2='220' stroke='#C0392B' stroke-width='2'/><line x1='30' y1='220' x2='300' y2='220' stroke='#222' stroke-width='1.6'/><line x1='300' y1='220' x2='60' y2='70' stroke='#222' stroke-width='1.6'/><line x1='137.5' y1='20' x2='97.5' y2='220' stroke='#C0392B' stroke-width='2'/><line x1='97.5' y1='220' x2='300' y2='220' stroke='#222' stroke-width='1.6'/><line x1='300' y1='220' x2='137.5' y2='20' stroke='#222' stroke-width='1.6'/><circle cx='97.5' cy='220' r='3.2' fill='#C0392B'/><circle cx='120' cy='107.5' r='3.2' fill='#C0392B'/><text x='44' y='64' font-size='13' fill='#222' font-style='italic'>A</text><text x='16' y='238' font-size='13' fill='#222' font-style='italic'>B</text><text x='304' y='238' font-size='13' fill='#222' font-style='italic'>C</text><text x='140' y='16' font-size='13' fill='#222' font-style='italic'>D</text><text x='88' y='238' font-size='13' fill='#222' font-style='italic'>E</text><text x='124' y='103' font-size='13' fill='#C0392B' font-style='italic'>F</text><text x='24' y='148' font-size='12' fill='#C0392B'>4</text><text x='96' y='172' font-size='12' fill='#C0392B'>3</text></svg>", "warmup": [{"concept": "par_sim", "q": "AB ∥ DE，E 在 BC 上、F 在 AC 上，哪兩個三角形相似？", "a": "△CEF ∽ △CBA（共用 ∠C）。"}, {"concept": "sim_ratio", "q": "△CEF ∽ △CBA 且 EF：AB＝3：4，那 CE：CB 是多少？", "a": "3：4。"}, {"concept": "propseg_def", "q": "兩個三角形的底都在同一條線上、面積相等。一個底是 4、另一個底是 3，它們的高的比是多少？", "a": "3：4（底小的那個，高要大）。"}], "steps": [{"concept": "par_sim", "jingle": "相似接相似，比要乘到底", "guide": "👀 看到 AB ∥ DE，兩個三角形疊在一起，E 在 BC 上、F 是 AC 和 DE 的交點。💡 看到平行線，就找相似三角形——哪兩個？（題 13、14、15、18 是同一型：相似接相似，比要乘到底。）", "answer": "△CEF ∽ △CBA。", "why": "E 在 CB 上、F 在 CA 上，DE ∥ AB，這是「小三角形疊在大三角形上」的標準相似（共用 ∠C ＋ 同位角）。", "quiz": {"q": "相似比可以從哪兩段直接看出來？", "a": "EF：AB＝3：4。"}}, {"concept": "sim_ratio", "jingle": "相似接相似，比要乘到底", "guide": "相似比 3：4，所以 CE：CB 和 CF：CA 各是多少？", "answer": "CE：CB＝3：4，CF：CA＝3：4。", "why": "相似三角形的每一組對應邊都是同一個比。", "quiz": {"q": "若 EF：AB＝2：5，CE：CB 是多少？", "a": "2：5。"}}, {"concept": "propseg_def", "jingle": "相似接相似，比要乘到底", "guide": "現在用題目最後那個條件：△ABC 和 △CDE 面積相等。這兩個三角形的底（BC 和 CE）都躺在同一條線上。設 A 離 BC 的高是 h，那 D 離 BC 的高是多少？", "answer": "D 的高 ＝ (4/3)h。", "why": "面積相等 → BC×h ＝ CE×(D 的高)。CE 只有 BC 的 3/4，底變小了，高就要放大成 4/3 倍才補得回來。（注意：這裡是「反比」——底縮小幾倍，高就要放大幾倍，跟相似的「同比」不一樣。）", "quiz": {"q": "若 CE：CB＝1：2 且面積相等，D 的高是 A 的幾倍？", "a": "2 倍。"}}, {"concept": "sim_height", "jingle": "相似接相似，比要乘到底", "guide": "F 在 CA 上而且 CF：CA＝3：4，所以 F 離 BC 多高？算出來以後，跟 D 的高比一比，EF：ED 是多少？", "answer": "F 的高＝(3/4)h；EF：ED＝(3/4)h ：(4/3)h＝9：16。", "why": "E 躺在 BC 上（高是 0）、D 的高是 (4/3)h。F 在 ED 這條線上，F 的高佔 D 的高多少，EF 就佔 ED 多少。", "quiz": {"q": "若 F 的高剛好是 D 的高的一半，EF：ED 是多少？", "a": "1：2。"}}], "final": {"concept": "ratio_split", "guide": "EF：ED＝9：16，而 EF＝3。先求 ED，再求 DF。⚠️ ED 不是答案，題目問的是 DF。", "answer": "(B) 7/3", "why": "9：16＝3：ED → ED＝16/3；DF＝ED−EF＝16/3−3＝7/3。", "check": "檢查一下份數對不對：DF：FE＝(7/3)：3＝7：9，7＋9＝16 ✓ 剛好是 ED 的 16 份。這題最容易停的地方，是算出 CE：CB＝3：4 之後就想直接用簡單比去猜 DF。中間比不是答案——「面積相等」是這題唯一能定出 D 位置的條件，一定要用它把 D 的高先求出來。", "concepts": ["par_sim", "sim_ratio", "sim_height", "ratio_split", "propseg_def"]}}, {"id": "t16", "title": "題 16・（比值相等就設 t）", "source": "9/15 階段練習・第 16 題", "stem": "若 (x＋3)/x ＝ (y＋5)/y ＝ (z＋7)/z，則 (x＋3)：2(y＋5)：3(z＋7)＝?　(A) 無法判定　(B) 3：5：7　(C) 3：10：14　(D) 3：10：21", "warmup": [{"concept": "ratio3_k", "q": "若 (x＋3)/x ＝ 2，x 是多少？", "a": "3（x＋3＝2x → x＝3）。"}, {"concept": "propseg_def", "q": "若 3＝x(t−1)，x 用 t 表示是多少？", "a": "x＝3/(t−1)。"}, {"concept": "ratio3_def", "q": "3：5：7 的第二項乘 2、第三項乘 3，會變成多少？", "a": "3：10：21。"}], "steps": [{"concept": "ratio3_k", "jingle": "一份設成 k，三個變一個", "guide": "👀 看到三個分式被等號串在一起：(x＋3)/x ＝ (y＋5)/y ＝ (z＋7)/z。💡 想到什麼？一串東西相等，就給它取個名字。我們設這個共同的比值是 t。第一個式子會變成什麼？", "answer": "(x＋3)/x ＝ t。", "why": "比值相等就設 t——這一招把「三個未知數」變成「一個 t 加三條長得一樣的式子」，馬上好處理。這是這張卷最新的一招，記起來。", "quiz": {"q": "同樣做法，(y＋5)/y ＝ t 去掉分母是什麼？", "a": "y＋5＝ty。"}}, {"concept": "ratio3_k", "jingle": "一份設成 k，三個變一個", "guide": "把 (x＋3)/x ＝ t 去分母，再把 x 全部移到同一邊、提出來，看看 x 等於什麼。", "answer": "x＋3＝tx → 3＝tx−x＝x(t−1) → x＝3/(t−1)。", "why": "把 x 提出來變成 x(t−1)，就能直接把 x 解出來。", "quiz": {"q": "用同樣的做法，y 等於什麼？", "a": "y＝5/(t−1)。"}}, {"concept": "ratio3_def", "jingle": "三個量一起比，份數對得起", "guide": "三條式子長得一模一樣，x＝3/(t−1)、y＝5/(t−1)、z＝7/(t−1)。分母都一樣，那 x：y：z 是多少？", "answer": "x：y：z＝3：5：7。", "why": "分母都是同一個 (t−1)，比起來就只剩分子。這就是為什麼設 t 這麼好用。", "quiz": {"q": "若分子換成 2、4、6，x：y：z 是多少？", "a": "2：4：6＝1：2：3。"}}, {"concept": "ratio3_def", "jingle": "三個量一起比，份數對得起", "guide": "但題目問的不是 x：y：z，是 (x＋3)：(y＋5)：(z＋7)。這三個又是多少？（提示：x＋3 其實就等於 tx）", "answer": "(x＋3)：(y＋5)：(z＋7)＝3：5：7，跟剛剛一樣。", "why": "x＋3＝tx＝3t/(t−1)，同理 y＋5＝5t/(t−1)、z＋7＝7t/(t−1)。t 和分母都一樣，比還是 3：5：7。", "quiz": {"q": "x＋3 用 t 表示是多少？", "a": "3t/(t−1)。"}}], "final": {"concept": "ratio3_def", "guide": "最後看清楚題目在問什麼：(x＋3)：2(y＋5)：3(z＋7)，第二項前面有 2、第三項前面有 3。自己乘上去。", "answer": "(D) 3：10：21", "why": "3：5：7 → 第二項 5×2＝10、第三項 7×3＝21，所以是 3：10：21。", "check": "找一個 t 代真數字驗一次：設 t＝5/2，則 x＝2、y＝10/3、z＝14/3；x＋3＝5、y＋5＝25/3、z＋7＝35/3；5 : 2×(25/3) : 3×(35/3) ＝ 5 : 50/3 : 35，三項同乘 3/5 就是 3：10：21 ✓。這題最容易掉的坑是算出 3：5：7 就選 (B)——忘了題目前面還掛著 2 和 3 兩個係數。這題是整張卷最難的一題，能走到這裡已經很厲害了。", "concepts": ["ratio3_k", "ratio3_def", "propseg_def"]}}, {"id": "t17", "title": "題 17・（加常數要先求出實際值）", "source": "9/15 階段練習・第 17 題", "stem": "若 x：y：z＝5：7：8，且 x＋y＋z＝40，則 (x＋1)：(y＋1)：(z＋1)＝?　(A) 無法判定　(B) 6：8：9　(C) 11：15：17　(D) 13：15：17", "warmup": [{"concept": "ratio3_k", "q": "x：y：z＝5：7：8，一份設成 k，三個各是多少？", "a": "x＝5k、y＝7k、z＝8k。"}, {"concept": "ratio3_k", "q": "5k＋7k＋8k＝40，k 是多少？", "a": "2（20k＝40）。"}, {"concept": "ratio3_def", "q": "10：14：16 三項各加 1 之後是多少？", "a": "11：15：17。"}], "steps": [{"concept": "ratio3_k", "jingle": "一份設成 k，三個變一個", "guide": "👀 看到一條連比 5：7：8、一個總和 40，問的是「每個都加 1」之後的比。💡 想到一件很重要的事：加常數之後比值會不會變？所以能不能直接在 5：7：8 上面加 1？", "answer": "會變，不能直接加。要先用總和求出 x、y、z 的實際數字。", "why": "比只告訴你「幾份」，不是真實大小。加 1 這種動作一定要在真實數字上做。直接寫 6：8：9 是錯的。", "quiz": {"q": "2：3 兩項各加 1 變成 3：4，比值有變嗎？", "a": "變了（2：3 不等於 3：4）。"}}, {"concept": "ratio3_k", "jingle": "一份設成 k，三個變一個", "guide": "一份設成 k，x、y、z 各是多少？總和的式子怎麼寫？", "answer": "x＝5k、y＝7k、z＝8k；5k＋7k＋8k＝20k＝40。", "why": "連比就是份數，總共 5＋7＋8＝20 份，全部加起來是 20k。", "quiz": {"q": "若總和改成 60，20k＝60，k 是多少？", "a": "3。"}}, {"concept": "ratio3_k", "jingle": "一份設成 k，三個變一個", "guide": "k 是多少？把 x、y、z 的真實數字算出來。", "answer": "k＝2；x＝10、y＝14、z＝16。", "why": "20k＝40 → k＝2，再各自乘回自己的份數。", "quiz": {"q": "驗算一下：10＋14＋16 是多少？", "a": "40 ✓ 跟題目一樣。"}}], "final": {"concept": "ratio3_def", "guide": "真實數字有了，每個都加 1，再寫成比。", "answer": "(C) 11：15：17", "why": "10＋1＝11、14＋1＝15、16＋1＝17，所以是 11：15：17。", "check": "檢查能不能再約分：11 是質數，15 和 17 跟它都沒有公因數，所以 11：15：17 已經是最簡 ✓。這題最容易掉的坑是直接在 5：7：8 上面加 1 得到 6：8：9——選項 (B) 就是特地放來抓這個的。另外這題跟第 9 題是同一招（設 k ＋ 用總和求 k），認出來就不難。", "concepts": ["ratio3_k", "ratio3_def", "ratio_split"]}}, {"id": "t18", "title": "題 18・（兩組平行→兩次相似→交叉相乘）", "source": "9/15 階段練習・第 18 題", "stem": "如圖，△ABC 中，DE ∥ BC，EF ∥ AB，若 AE＝4，DE＝4.2，EF＝10，則 AD × CF＝?　(A) 無法判定　(B) 16.8　(C) 40　(D) 42", "figure": "<svg viewBox='0 0 360 226' width='340' style='max-width:100%;display:block;margin:8px auto'><polygon points='120,80 40,200 133.33,200 213.33,80' fill='rgba(27,127,121,0.13)' stroke='none' stroke-width='1'/><line x1='160' y1='20' x2='40' y2='200' stroke='#222' stroke-width='1.6'/><line x1='160' y1='20' x2='320' y2='200' stroke='#222' stroke-width='1.6'/><line x1='40' y1='200' x2='320' y2='200' stroke='#1B7F79' stroke-width='2'/><line x1='120' y1='80' x2='213.33' y2='80' stroke='#C0392B' stroke-width='1.8'/><line x1='213.33' y1='80' x2='133.33' y2='200' stroke='#1B7F79' stroke-width='1.8'/><circle cx='120' cy='80' r='3.2' fill='#C0392B'/><circle cx='213.33' cy='80' r='3.2' fill='#C0392B'/><circle cx='133.33' cy='200' r='3.2' fill='#C0392B'/><text x='154' y='15' font-size='13' fill='#222' font-style='italic'>A</text><text x='24' y='217' font-size='13' fill='#222' font-style='italic'>B</text><text x='324' y='217' font-size='13' fill='#222' font-style='italic'>C</text><text x='102' y='77' font-size='13' fill='#C0392B' font-style='italic'>D</text><text x='219' y='77' font-size='13' fill='#C0392B' font-style='italic'>E</text><text x='128' y='218' font-size='13' fill='#1B7F79' font-style='italic'>F</text><text x='160' y='74' font-size='12' fill='#C0392B'>4.2</text><text x='180' y='148' font-size='12' fill='#1B7F79'>10</text><text x='184' y='46' font-size='12' fill='#222'>4</text></svg>", "warmup": [{"concept": "par_sim", "q": "△ABC 中 DE ∥ BC，哪兩個三角形相似？", "a": "△ADE ∽ △ABC。"}, {"concept": "par_sim", "q": "△ABC 中 EF ∥ AB（E 在 AC 上、F 在 BC 上），哪兩個三角形相似？", "a": "△EFC ∽ △ABC。"}, {"concept": "sim_order", "q": "若 △ADE ∽ △EFC，那 AD 的對應邊是哪一條？", "a": "EF。"}], "steps": [{"concept": "par_sim", "jingle": "相似接相似，比要乘到底", "guide": "👀 看到兩組平行：DE ∥ BC、EF ∥ AB，而且 DBFE 圍成一個平行四邊形。💡 看到平行線，就找相似三角形——這題可以找到幾個？（題 13、14、15、18 是同一型：相似接相似，比要乘到底。）", "answer": "兩個：△ADE ∽ △ABC（因為 DE ∥ BC）、△EFC ∽ △ABC（因為 EF ∥ AB）。", "why": "每一組平行線各生出一個跟 △ABC 相似的小三角形。找到兩個就是這題的第一個關卡。", "quiz": {"q": "兩個小三角形都跟 △ABC 相似，那它們彼此相似嗎？", "a": "相似（都跟同一個三角形相似，彼此當然也相似）。"}}, {"concept": "sim_order", "jingle": "相似接相似，比要乘到底", "guide": "關鍵一步：△ADE 和 △EFC 彼此相似。把對應順序寫清楚——△ADE ∽ △EFC 時，A 對到誰、D 對到誰、E 對到誰？", "answer": "A↔E、D↔F、E↔C。", "why": "△ADE ∽ △ABC 是 A↔A、D↔B、E↔C；△EFC ∽ △ABC 是 E↔A、F↔B、C↔C。把兩邊都對回 △ABC，就得到 A↔E、D↔F、E↔C。相似照順序，字母對字母，這一步千萬不能憑感覺。", "quiz": {"q": "那 DE 的對應邊是哪一條？", "a": "FC。"}}, {"concept": "sim_ratio", "jingle": "相似接相似，比要乘到底", "guide": "照這個對應寫比例式：AD 比 EF ＝ DE 比 FC。自己寫一次。", "answer": "AD：EF＝DE：FC。", "why": "相似三角形對應邊成比例，AD 對 EF、DE 對 FC。", "quiz": {"q": "AD：EF＝AE：EC 也對嗎？", "a": "對，那是第三組對應邊（AE 對 EC）。"}}, {"concept": "propseg_def", "jingle": "相似接相似，比要乘到底", "guide": "題目問的是 AD × CF，是一個乘積。比例式交叉相乘看看，會跑出什麼？", "answer": "AD × FC ＝ EF × DE。", "why": "AD：EF＝DE：FC，交叉相乘就是 AD×FC＝EF×DE——剛好就是題目要的那個乘積，完全不用分別求 AD 和 CF。", "quiz": {"q": "a：b＝c：d 交叉相乘是什麼？", "a": "ad＝bc。"}}], "final": {"concept": "propseg_def", "guide": "DE＝4.2、EF＝10，自己乘起來。⚠️ 順便想一下：AE＝4 這個條件，你有用到嗎？", "answer": "(D) 42", "why": "AD × CF ＝ DE × EF ＝ 4.2 × 10 ＝ 42。", "check": "AE＝4 是誘餌，這題根本用不到。可以自己編一組數字驗：假設 AD：AB＝1：3，則 AD＝5、DB＝EF＝10 ✓、BF＝DE＝4.2、FC＝8.4，AD×CF＝5×8.4＝42 ✓ 一樣。記住一件事：題目給的條件不一定每個都要用。先看清楚它問什麼，再回頭挑需要的條件。", "concepts": ["par_sim", "sim_order", "sim_ratio", "propseg_def"]}}, {"id": "t19", "title": "題 19・（兩組比用總量倍數對齊）", "source": "9/15 階段練習・第 19 題", "stem": "勤義村辦理村長選舉，共有甲、乙、丙 3 名候選人參選，且有 2 個投開票所進行開票。已知第一投開票所甲、乙、丙三人的票數比為 3：2：1，第二投開票所甲、乙、丙三人的票數比為 4：5：6，且兩投開票所皆沒有無效票。若第一投開票所的總票數是第二投開票所的 2 倍，則甲、乙、丙三人得票數，誰的得票數最低？　(A) 無法判定　(B) 甲　(C) 乙　(D) 丙", "figure": "<svg viewBox='0 0 340 152' width='320' style='max-width:100%;display:block;margin:8px auto'><text x='4' y='50' font-size='12' fill='#222'>第一所</text><rect x='60' y='30' width='120' height='30' fill='#C0392B' fill-opacity='0.22' stroke='#C0392B' stroke-width='1.2'/><text x='114' y='50' font-size='13' fill='#C0392B'>甲</text><rect x='180' y='30' width='80' height='30' fill='#1B7F79' fill-opacity='0.22' stroke='#1B7F79' stroke-width='1.2'/><text x='214' y='50' font-size='13' fill='#1B7F79'>乙</text><rect x='260' y='30' width='40' height='30' fill='#B7791F' fill-opacity='0.22' stroke='#B7791F' stroke-width='1.2'/><text x='274' y='50' font-size='13' fill='#B7791F'>丙</text><text x='4' y='110' font-size='12' fill='#222'>第二所</text><rect x='60' y='90' width='32' height='30' fill='#C0392B' fill-opacity='0.22' stroke='#C0392B' stroke-width='1.2'/><text x='70' y='110' font-size='13' fill='#C0392B'>甲</text><rect x='92' y='90' width='40' height='30' fill='#1B7F79' fill-opacity='0.22' stroke='#1B7F79' stroke-width='1.2'/><text x='106' y='110' font-size='13' fill='#1B7F79'>乙</text><rect x='132' y='90' width='48' height='30' fill='#B7791F' fill-opacity='0.22' stroke='#B7791F' stroke-width='1.2'/><text x='150' y='110' font-size='13' fill='#B7791F'>丙</text><text x='60' y='140' font-size='11' fill='#8a8a8a'>第一所總票數 ＝ 第二所的 2 倍（長條長度也是 2 倍）</text><text x='306' y='50' font-size='11' fill='#222'>3:2:1</text><text x='186' y='110' font-size='11' fill='#222'>4:5:6</text></svg>", "warmup": [{"concept": "ratio3_def", "q": "3：2：1 總共是幾份？", "a": "6 份。"}, {"concept": "ratio3_def", "q": "4：5：6 總共是幾份？", "a": "15 份。"}, {"concept": "ratio3_k", "q": "若第二所的總票數是 15b，而第一所是它的 2 倍，第一所總票數是多少？", "a": "30b。"}], "steps": [{"concept": "ratio3_merge", "jingle": "中間那個字，化成一樣大", "guide": "👀 看到兩個投開票所、各有一組比（3：2：1 和 4：5：6），還有一句「第一所總票是第二所的 2 倍」。💡 想到什麼？這招跟第 7 題完全一樣——要把兩組比接起來，就要找「公用的那個量」把它化成一樣大。這題公用的是什麼？", "answer": "公用的是兩所的「總票數」，用它們的 2 倍關係來對齊。", "why": "兩組比各用各的份數，第一所的一份跟第二所的一份不一樣大，所以不能直接把數字相加。要先換成同一把尺。", "quiz": {"q": "直接把兩組比相加（3＋4、2＋5、1＋6）對嗎？", "a": "不對，因為兩邊的「一份」不一樣大。"}}, {"concept": "ratio3_k", "jingle": "一份設成 k，三個變一個", "guide": "先設第二所。4：5：6 總共 15 份，一份設成 b，第二所總票數是多少？", "answer": "15b。", "why": "一份設成 b，三個變一個；總票就是 15 份，也就是 15b。", "quiz": {"q": "第二所的甲有幾票？", "a": "4b。"}}, {"concept": "ratio3_k", "jingle": "一份設成 k，三個變一個", "guide": "第一所的總票是第二所的 2 倍，也就是多少？第一所 3：2：1 共 6 份，一份設成 a，那 6a 等於多少？a 又等於幾個 b？", "answer": "第一所總票＝2×15b＝30b；6a＝30b → a＝5b。", "why": "把第一所的一份 a 換算成 b，兩個所就用同一把尺了，這一步就是「對齊」。", "quiz": {"q": "若第一所是第二所的 3 倍，a 等於幾 b？", "a": "7.5b（6a＝45b）。"}}, {"concept": "ratio3_def", "jingle": "三個量一起比，份數對得起", "guide": "現在兩所都能用 b 表示了。把三個人的票數各自加起來（第一所＋第二所），用 b 寫出來。", "answer": "甲＝3a＋4b＝15b＋4b＝19b；乙＝2a＋5b＝10b＋5b＝15b；丙＝a＋6b＝5b＋6b＝11b。", "why": "a＝5b 代進去，三個人都變成 b 的倍數，就能直接比大小了。", "quiz": {"q": "驗算：19b
