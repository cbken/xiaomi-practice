 和 DG 交於 H，∠AHD 和 ∠FHG 相等嗎？為什麼？", "a": "相等，對頂角。"}, "jingle": "交叉對面角，永遠一樣大", "alt": "兩條線交叉會做出一個 X，切出四個角。「對頂角」就是 X 上下那一對、或左右那一對——彼此正對面、只共用一個頂點。它們一定一樣大，因為它們各自跟旁邊那個角湊成一直線的 180°，被減掉的是同一個數。", "pre": [{"q": "一直線是幾度？", "a": "180°。"}, {"q": "∠1＋∠2＝180°、∠3＋∠2＝180°，∠1 和 ∠3 什麼關係？", "a": "相等（都等於 180°－∠2）。"}], "widget": "vert", "ask": "我卡在【對頂角相等】，可以教我嗎？", "signal": {"see": "兩條線交叉成一個 X", "think": "對面那一對角（對頂角）相等", "do": "把這組相等的角記下來，它常是相似的第二個條件"}}, "AA": {"name": "AA 相似：兩個角相等就相似", "teach": "要判斷兩個三角形相似，不用三個角都檢查——三角形三個角加起來 180°，兩個角相等，第三個自動相等。所以「找到兩組相等的角」就可以說它們相似，這叫 AA 相似。常見來源：共用的角、對頂角、同位角、直角。", "recap": "兩組角相等 → 相似（AA）。", "confirm": {"q": "為什麼只要兩個角相等就夠了？", "a": "第三個角＝180° 減前兩個，一定也相等。"}, "retest": {"q": "△甲有角 50°、60°；△乙有角 60°、70°。它們相似嗎？", "a": "相似（甲的第三角是 70°，兩組角都對上）。"}, "jingle": "兩角相等，就是相似", "alt": "為什麼只比兩個角就夠？因為三角形三個角加起來是 180°，前兩個角一樣，第三個角用減的也一定一樣——三個角全部相同，形狀就一模一樣，只差大小。這叫 AA 相似（Angle-Angle）。實戰上，相等的角常來自：共用的角、對頂角、平行線的同位角／內錯角、兩個直角。", "pre": [{"q": "三角形三個角加起來幾度？", "a": "180°。"}, {"q": "甲有 50°、60°，乙有 50°、60°，乙的第三個角是幾度？", "a": "70°（跟甲一樣）。"}], "widget": "AA", "ask": "我卡在【AA 相似：兩個角相等就相似】，可以教我嗎？", "signal": {"see": "要判斷兩個三角形相不相似", "think": "只要找到兩組相等的角就成立（AA）", "do": "從共用角、對頂角、同位角、直角這四個地方去找"}}, "x_sim": {"name": "X 形相似", "teach": "兩條平行線被兩條斜線交叉成一個 X，交叉點上下（或左右）兩個三角形一定相似：因為對頂角相等、平行線的內錯角相等 → AA。對應點要照「相對」的位置對：上面的左點對下面的右點。", "recap": "平行線 + 交叉 → X 兩邊三角形相似。", "confirm": {"q": "X 形相似的兩組相等的角是哪兩組？", "a": "交叉點的對頂角、平行線的內錯角。"}, "retest": {"q": "AD ∥ FG，AF 與 DG 交於 H。哪兩個三角形相似？", "a": "△ADH ∼ △FGH"}, "jingle": "平行加交叉，X 兩邊相似", "alt": "兩條平行線被兩條斜線交叉，中間會形成一個 X，X 的上下各有一個三角形——它們一定相似。理由：交叉點是對頂角（相等），平行線給出內錯角（相等），兩組角相等就是 AA。對應點要照「正對面」配：上面的左點對下面的右點。", "pre": [{"q": "對頂角相等嗎？", "a": "相等。"}, {"q": "兩條平行線被一條斜線切，內錯角相等嗎？", "a": "相等。"}], "widget": "x_sim", "ask": "我卡在【X 形相似】，可以教我嗎？", "signal": {"see": "兩條平行線被兩條線交叉出一個 X", "think": "X 上下兩個三角形一定相似", "do": "對應點照「正對面」配：上面的左點對下面的右點"}}, "ratio_split": {"name": "把一段依比例分開", "teach": "一段長 6 要分成 3：1，就是分成 4 份，一份＝6÷4＝1.5，大的拿 3 份＝4.5，小的 1 份＝1.5。做法：先把比例的數字加起來當「總份數」，再算一份多少。", "recap": "分 a：b → 總份數 a＋b，一份＝全長÷(a＋b)。", "confirm": {"q": "把 6 分成 3：1，為什麼要除以 4 而不是除以 3？", "a": "3 份加 1 份共 4 份。"}, "retest": {"q": "把 20 分成 2：3，大的那份多少？", "a": "12（一份 4，3 份 12）。"}, "jingle": "份數先加總，一份是多少", "alt": "比例分配就是「分份數」。要把 12 分成 3：1，先問總共幾份——3＋1＝4 份；再問一份多少——12÷4＝3；最後大的拿 3 份＝9、小的拿 1 份＝3。最常錯的是直接除以 3（比例裡的數字），要除的是「總份數」。", "pre": [{"q": "分成 3：1，總共幾份？", "a": "4 份。"}, {"q": "12 分成 4 份，一份多少？", "a": "3。"}], "widget": "ratio_split", "ask": "我卡在【把一段依比例分開】，可以教我嗎？", "signal": {"see": "題目給「a：b」又給整段的長度", "think": "先算總份數 a＋b，再算一份多少", "do": "一份 ＝ 全長 ÷(a＋b)，再乘回各自的份數"}}, "right_acute": {"name": "直角三角形：兩個銳角相加 90°", "teach": "三角形三個角加起來 180°。直角三角形已經有一個 90°，剩下兩個角只能分 90°。所以知道一個銳角，另一個就是 90° 減它。", "recap": "直角三角形：銳角 + 銳角 = 90°。", "confirm": {"q": "為什麼直角三角形的兩個銳角加起來剛好 90°？", "a": "180° 扣掉直角 90°。"}, "retest": {"q": "∠A＝28°，另一個銳角幾度？", "a": "62°"}, "jingle": "直角三角形，兩銳角湊九十", "alt": "三角形三個角加起來 180°。直角三角形已經有一個角把 90° 用掉了，剩下兩個銳角只能去分剩下的 90°。所以只要知道一個銳角，另一個就是 90° 減它——不用再看圖。", "pre": [{"q": "三角形三個角共幾度？", "a": "180°。"}, {"q": "180° 減掉直角 90°，剩幾度？", "a": "90°。"}], "widget": "right_acute", "ask": "我卡在【直角三角形：兩個銳角相加 90°】，可以教我嗎？", "signal": {"see": "題目出現「直角三角形」或 ∠B＝90°", "think": "兩個銳角加起來一定是 90°", "do": "知道一個銳角就把另一個寫出來，不用再看圖"}}, "cofunc": {"name": "同角的餘角相等", "teach": "兩個角都「跟同一個角湊成 90°」，那這兩個角一定一樣大。例：∠x＋∠C＝90°，∠y＋∠C＝90° → ∠x＝∠y（都是 90°－∠C）。這招在「直角三角形裡放正方形」的題目裡幾乎每題都用到。", "recap": "跟同一個角湊 90° 的兩個角相等。", "confirm": {"q": "∠A 和 ∠QRC 都跟 ∠C 湊成 90°，所以？", "a": "∠A＝∠QRC。"}, "retest": {"q": "∠1＋∠3＝90°、∠2＋∠3＝90°，∠1 和 ∠2 的關係？", "a": "相等"}, "jingle": "跟同一角湊九十，兩個角相等", "alt": "如果 ∠x 和 ∠C 湊成 90°，∠y 和 ∠C 也湊成 90°，那 ∠x 和 ∠y 一定一樣大——因為它們都等於「90° 減同一個 ∠C」。這招在「直角三角形裡塞一個正方形」的題目幾乎每題都用得到：正方形給你一堆直角，讓好幾個角都跟同一個角湊成 90°。", "pre": [{"q": "「餘角」是什麼？", "a": "兩個角加起來 90°，彼此互為餘角。"}, {"q": "∠C＝40°，它的餘角幾度？", "a": "50°。"}], "widget": "cofunc", "ask": "我卡在【同角的餘角相等】，可以教我嗎？", "signal": {"see": "直角三角形裡面又塞了正方形或垂線", "think": "同角的餘角相等", "do": "找出兩個「跟同一個角湊成 90°」的角，它們相等 → 相似的第二個條件"}}, "sim_order": {"name": "相似要照對應順序寫", "teach": "寫 △APS ∼ △RQC 的時候，字母的順序就是對應：A 對 R、P 對 Q、S 對 C。對的方法：直角對直角、相等的銳角對相等的銳角、剩下的對剩下的。順序寫對，比例式就是把對應的邊照順序放：AP：RQ＝PS：QC＝AS：RC。", "recap": "相似的字母順序＝對應關係，比例照順序寫。", "confirm": {"q": "△APS ∼ △RQC，P 對到誰？為什麼？", "a": "Q，因為兩個都是直角。"}, "retest": {"q": "△ABC ∼ △DEF，AB 對哪一邊？BC 對哪一邊？", "a": "AB 對 DE，BC 對 EF。"}, "jingle": "相似照順序，字母對字母", "alt": "寫 △ABC ∼ △DEF 的時候，字母的位置就是在講對應：A 配 D、B 配 E、C 配 F。所以邊也照順序配：AB 對 DE、BC 對 EF、AC 對 DF。配對的方法是先找「一定對得上」的角——直角對直角、相等的銳角對相等的銳角、共用的角對共用的角，剩下的就是最後一組。順序寫反，比例式整個顛倒，答案就會錯。", "pre": [{"q": "△ABC ∼ △DEF，B 對到哪一點？", "a": "E。"}, {"q": "那 AB 對到哪一邊？", "a": "DE。"}], "widget": "sim_order", "ask": "我卡在【相似要照對應順序寫】，可以教我嗎？", "signal": {"see": "要寫 △ ∼ △ 這個式子", "think": "字母順序就是對應關係", "do": "先配直角對直角、再配相等的銳角，剩下的是最後一組；比例式照這個順序寫"}}, "collinear": {"name": "先看哪些點在同一條線上", "teach": "寫比例前要先確定「哪幾個點在同一條直線上」，線段才能加減。例：D、H、G、C 都在 DC 這條邊上，所以 DG＝DC－CG，DH＋HG＝DG。", "recap": "同一直線上的點，線段可以加減。", "confirm": {"q": "G 在 DC 上、CG＝3、DC＝9，DG 多長？", "a": "6"}, "retest": {"q": "B、C、D 在一直線上，BC＝8、CD＝5，BD 多長？", "a": "13"}, "jingle": "同一條線上，線段能加減", "alt": "只有「在同一條直線上」的點，線段才能直接加減。所以寫比例式之前，第一件事是看圖確認哪幾個點排在同一條線上，把每一小段的長度標在圖上。像 B、C、D 在一直線上，BD 就是 BC＋CD——最常錯的是把 BD 當成 BC 或 CD 其中一段。", "pre": [{"q": "B、C、D 在同一條線上，BC＝8、CD＝5，BD 多長？", "a": "13（8＋5）。"}, {"q": "G 在 DC 上，DC＝9、CG＝3，DG 多長？", "a": "6（9－3）。"}], "widget": "collinear", "ask": "我卡在【先看哪些點在同一條線上】，可以教我嗎？", "signal": {"see": "圖上有三個以上的點排在同一條線上", "think": "線段可以加減（整段 ＝ 兩小段相加）", "do": "先把每一小段的長度標到圖上，再寫比例式"}}, "ratio3_def": {"name": "連比 a：b：c 的意思", "teach": "連比就是「三個量一起比」。像調飲料：紅茶：牛奶：糖漿＝2：3：5，意思是每次都照這個份數倒——2 杯紅茶配 3 杯牛奶配 5 杯糖漿。不是只比兩個，是三個同時對得起來。所以 2：3：5 也可以是 4：6：10、20：30：50，只要三個一起同倍放大就行。", "recap": "連比＝三個量同時比，可以三個一起同倍放大縮小。", "confirm": {"q": "紅：黃：藍＝2：3：5，一共 30 顆珠子，藍色幾顆？", "a": "15 顆（總份數 2＋3＋5＝10，一份 3 顆，藍 5 份＝15）。"}, "retest": {"q": "a：b：c＝1：2：4，已知 a＝3，那 b 和 c 各是多少？", "a": "b＝6、c＝12（三個一起乘 3）。"}, "jingle": "三個量一起比，份數對得起", "alt": "換個角度看：連比是把兩個比「黏」成一串。a：b：c 這一串裡面，同時藏著 a：b、b：c、a：c 三個比，你要哪個就從裡面抽哪兩個出來。例如 2：3：5 裡，a：b＝2：3、b：c＝3：5、a：c＝2：5。而且整串同時乘同一個數，三個關係都不會壞掉。", "pre": [{"q": "2：3 是什麼意思？", "a": "第一個量有 2 份時，第二個量有 3 份。"}, {"q": "2：3 跟 4：6 一樣嗎？", "a": "一樣，兩邊同時乘 2 比值不變。"}], "signal": {"see": "題目出現三個東西的比，中間有兩個冒號，像「2：3：5」", "think": "這是三個量同時比，可以三個一起同倍放大", "do": "先把三個數字加起來當總份數，再算一份是多少"}, "widget": "ratio3_def", "ask": "我卡在【連比 a：b：c 的意思】，可以教我嗎？"}, "ratio3_merge": {"name": "兩個比合併成連比", "teach": "題目給你 a：b＝2：3、b：c＝4：5，兩句話都提到 b，但一個說 b 是 3 份、一個說 b 是 4 份——單位不一樣，不能直接串起來。做法跟通分一模一樣：把 b 化成 3 和 4 的最小公倍數 12。第一個比整組乘 4 變成 8：12，第二個比整組乘 3 變成 12：15，b 對齊了，就串成 a：b：c＝8：12：15。", "recap": "把兩個比裡共同的那個字化成一樣大（取最小公倍數），再串起來。", "confirm": {"q": "a：b＝2：3、b：c＝4：5，為什麼要把 b 化成 12？", "a": "因為 3 和 4 的最小公倍數是 12，b 兩邊一樣大才能串成一串。"}, "retest": {"q": "a：b＝3：4、b：c＝6：7，合併成連比是多少？", "a": "9：12：14（b 化成 12：前面乘 3 得 9：12，後面乘 2 得 12：14）。"}, "jingle": "中間那個字，化成一樣大", "alt": "把它想成兩張齒輪圖要接在一起。左邊那組寫著「a 轉 2 圈、b 轉 3 圈」，右邊那組寫著「b 轉 4 圈、c 轉 5 圈」。b 是同一個齒輪，卻被記成兩種圈數，所以要找一個 b 兩邊都能達到的圈數——12。左邊整組放大 4 倍、右邊整組放大 3 倍，b 都變成 12，三個齒輪就接起來了：8：12：15。重點：放大時「整組一起乘」，不能只乘 b。", "pre": [{"q": "3 和 4 的最小公倍數是多少？", "a": "12。"}, {"q": "2：3 兩邊同時乘 4，變成什麼？", "a": "8：12。"}], "signal": {"see": "題目給兩個比，而且同一個字母（或同一個東西）在兩個比裡都出現", "think": "共同的那個要先化成一樣的數字才能串起來", "do": "找共同項兩邊數字的最小公倍數，各自整組乘上去，再串成三個數"}, "widget": "ratio3_merge", "ask": "我卡在【兩個比合併成連比】，可以教我嗎？"}, "ratio3_k": {"name": "連比例式設 k", "teach": "看到 a：b：c＝2：3：5，最好用的一招是「設一份是 k」：a＝2k、b＝3k、c＝5k。這樣三個未知數瞬間變成一個未知數 k，題目給的條件（總和多少、相差多少）就能直接列成一條方程式。例如總和是 60，就是 2k＋3k＋5k＝10k＝60，k＝6，馬上得 a＝12、b＝18、c＝30。", "recap": "設一份為 k，a＝2k、b＝3k、c＝5k，三個未知數變一個。", "confirm": {"q": "a：b：c＝2：3：5 且 a＋b＋c＝60，求 b。", "a": "b＝18（10k＝60，k＝6，b＝3k＝18）。"}, "retest": {"q": "x：y：z＝1：3：4，且 z－x＝12，求 y。", "a": "y＝12（4k－1k＝3k＝12，k＝4，y＝3k＝12）。"}, "jingle": "一份設成 k，三個變一個", "alt": "k 就是「一份有多大」。比例只告訴你「誰是幾份」，沒告訴你「一份多少」，缺的就是 k。所以先把三個量都寫成份數乘 k，再用題目那句多出來的話（總和是…、差是…、其中一個是…）把 k 解出來。解出 k 之後不要停——題目問誰，就把誰的份數乘回 k。最常見的錯就是算出 k＝6 就交卷，忘了乘回去。", "pre": [{"q": "如果一份是 4，3 份是多少？", "a": "12。"}, {"q": "2k＋3k＋5k 合併同類項等於多少？", "a": "10k。"}], "signal": {"see": "題目給一個比，又給「總和是…」「相差…」「其中一個是…」這種一句話", "think": "設一份為 k，把每個量寫成幾 k", "do": "列出含 k 的方程式解 k，再把 k 乘回題目問的那一份"}, "widget": "ratio3_k", "ask": "我卡在【連比例式設 k】，可以教我嗎？"}, "propseg_def": {"name": "比例線段（四條線段成比例）", "teach": "四條線段 a、b、c、d，如果 a：b＝c：d，就說這四條線段「成比例」。比例線段最好用的性質是交叉相乘：a：b＝c：d 等價於 ad＝bc。例如 2：3＝4：6，交叉相乘 2×6＝12、3×4＝12，相等所以真的成比例。以後看到比例式要解未知數，通通用交叉相乘變成方程式。", "recap": "a：b＝c：d ⟺ ad＝bc（交叉相乘）。", "confirm": {"q": "2：3 和 4：6 成比例嗎？用交叉相乘檢查。", "a": "成比例（2×6＝12，3×4＝12，兩邊相等）。"}, "retest": {"q": "3：x＝6：10，求 x。", "a": "x＝5（交叉相乘 3×10＝6x，30＝6x，x＝5）。"}, "jingle": "四線成比例，交叉相乘看", "alt": "把比例式想成一個天平。a：b＝c：d 的意思是「a 對 b 的胖瘦程度」和「c 對 d 的胖瘦程度」一模一樣。要檢查有沒有一樣，最快的方法不是算除法（常常除不盡），而是把外側兩個相乘、內側兩個相乘，看兩個乘積等不等。外×外＝內×內，就是成比例；有一個是未知數，這條式子就變成你要解的方程式。", "pre": [{"q": "1：2＝3：6 對嗎？", "a": "對，兩邊比值都是 1/2。"}, {"q": "2x＝10，x 是多少？", "a": "5。"}], "signal": {"see": "題目列出一條有冒號（或分數）的等式，裡面有一個未知數", "think": "交叉相乘可以把比例式變成方程式", "do": "外側兩個相乘等於內側兩個相乘，解出未知數"}, "widget": "propseg_def", "ask": "我卡在【比例線段（四條線段成比例）】，可以教我嗎？"}, "par_prop": {"name": "平行線截比例線段", "teach": "△ABC 裡，D 在 AB 上、E 在 AC 上，只要 DE ∥ BC，就有 AD：DB＝AE：EC。可以想成一把平行的刀橫切三角形：刀切得高，左右兩邊被切掉的比例一樣多；刀往下移，兩邊的比例還是同步變。左右永遠同進同退，這就是「平行線截出比例線段」。", "recap": "DE ∥ BC → 左右兩邊被切成一樣的比：AD：DB＝AE：EC。", "confirm": {"q": "△ABC 中 DE ∥ BC，AD＝4、DB＝2、AE＝6，求 EC。", "a": "EC＝3（AD：DB＝4：2＝2：1，所以 6：EC＝2：1，EC＝3）。"}, "retest": {"q": "△ABC 中 DE ∥ BC，AD＝3、DB＝6、AE＝2，求 EC。", "a": "EC＝4（3：6＝1：2，所以 2：EC＝1：2，EC＝4）。"}, "jingle": "平行一刀切，兩邊比相等", "alt": "另一種看法是相似三角形。DE ∥ BC 會讓 ∠ADE＝∠ABC（同位角），再加上共用的 ∠A，所以 △ADE ∼ △ABC，對應邊成比例 AD：AB＝AE：AC。這個叫「上比全」。而 AD：DB＝AE：EC 叫「上比下」。兩種都對，但要小心別混：AB 是整條，DB 只是下半段，代數字前先看清楚題目給的是整條還是半條。", "pre": [{"q": "DE ∥ BC 時，∠ADE 和 ∠ABC 是什麼角？", "a": "同位角，所以相等。"}, {"q": "AD＝4、DB＝2，AD：DB 化簡是多少？", "a": "2：1。"}], "signal": {"see": "三角形圖裡有一條線跟底邊畫成平行（標「∥」或看起來平行）", "think": "被切開的左右兩邊比例一樣", "do": "寫 AD：DB＝AE：EC，代入已知數字交叉相乘求未知邊"}, "widget": "par_prop", "ask": "我卡在【平行線截比例線段】，可以教我嗎？"}, "par_prop_conv": {"name": "比例線段逆定理（比相等就平行）", "teach": "上一招是「先平行，才有比相等」。逆定理反過來走：如果 D 在 AB 上、E 在 AC 上，而且 AD：DB＝AE：EC，那 DE 一定平行 BC。用途是「證明平行」——題目要你證某兩條線平行時，不用去量角度，只要算出兩邊被切的比一樣就好了。", "recap": "AD：DB＝AE：EC → DE ∥ BC（比相等就平行）。", "confirm": {"q": "△ABC 中 D 在 AB 上、E 在 AC 上，AD：DB＝2：1，AE＝6、EC＝3。DE 和 BC 是什麼關係？", "a": "平行（AE：EC＝6：3＝2：1，和 AD：DB 相等，由逆定理得 DE ∥ BC）。"}, "retest": {"q": "AB＝10、AD＝4；AC＝15、AE＝6。DE 和 BC 平行嗎？", "a": "平行（DB＝6、EC＝9，AD：DB＝4：6＝2：3，AE：EC＝6：9＝2：3，兩比相等）。"}, "jingle": "比一樣，就平行", "alt": "把它想成「兩個人爬樓梯」。D 沿著 AB 爬、E 沿著 AC 爬，只要兩個人爬的「進度百分比」一樣，他們手上拉的那條繩子 DE 就會保持水平（平行 BC）。有一個人爬快了，繩子就歪掉。所以要證平行，就是證兩人進度相同——算出兩個比，化到最簡看是不是同一個比。注意兩個比要「同方向」：都寫成上：下，或都寫成上：全，不能一個上：下、一個上：全。", "pre": [{"q": "AB＝10、AD＝4，DB 是多少？", "a": "6。"}, {"q": "4：6 和 6：9 化到最簡各是多少？", "a": "都是 2：3。"}], "signal": {"see": "題目給了四段長度，要你「判斷」或「證明」兩條線平不平行", "think": "算兩邊被切的比，一樣就平行", "do": "兩個比都化成最簡，相同就寫「由平行線截比例線段的逆定理，DE ∥ BC」"}, "widget": "par_prop_conv", "ask": "我卡在【比例線段逆定理（比相等就平行）】，可以教我嗎？"}, "midseg": {"name": "三角形中點連線定理", "teach": "△ABC 裡，D 是 AB 的中點、E 是 AC 的中點，把 D、E 連起來，會得到兩件事：DE ∥ BC，而且 DE＝BC 的一半。這是上一個定理的特例——中點就是把兩邊都切成 1：1，比相等所以平行；長度則剛好縮一半。不管三角形被拉成什麼奇怪的形狀，這兩件事都不會變。", "recap": "兩邊中點連起來：平行第三邊，長度是它的一半。", "confirm": {"q": "△ABC 中 D、E 分別是 AB、AC 的中點，BC＝10，求 DE，並說 DE 和 BC 的關係。", "a": "DE＝5，且 DE ∥ BC。"}, "retest": {"q": "D、E 是 AB、AC 的中點，DE＝7，求 BC。", "a": "BC＝14（中點連線是第三邊的一半，所以第三邊是它的兩倍）。"}, "jingle": "中點連中點，平行又一半", "alt": "反過來想比較有感覺：△ADE 就是 △ABC 縮小一半的版本。因為 AD 是 AB 的一半、AE 是 AC 的一半，兩邊都縮一半又共用 ∠A，所以 △ADE ∼ △ABC，相似比 1：2。相似比 1：2 代表「每一條對應邊都是一半」，DE 當然也是 BC 的一半。考題常反過來給你 DE 問 BC，這時要乘 2，不是除 2——先確認題目給的是小的還是大的。", "pre": [{"q": "D 是 AB 的中點，AD：DB 是多少？", "a": "1：1。"}, {"q": "10 的一半是多少？7 的兩倍是多少？", "a": "5；14。"}], "signal": {"see": "圖上兩條邊的正中間各有一個點（或題目寫「中點」），兩點被連起來", "think": "中點連線平行第三邊，而且是第三邊的一半", "do": "給第三邊就除以 2，給連線就乘以 2；要證平行直接引中點連線定理"}, "widget": "midseg", "ask": "我卡在【三角形中點連線定理】，可以教我嗎？"}, "par_equal": {"name": "平行線截等長線段", "teach": "好幾條互相平行、而且間距都相等的線（像筆記本的橫線），拿任何一條斜線去穿過它們，被切出來的每一段都一樣長。斜線畫得越斜，每一段都會一起變長，但彼此還是相等。這就是為什麼老師教「把一條線段五等分」時，會先畫一排等距的平行線去截它。", "recap": "等距平行線截任何一條直線，切出來的各段等長。", "confirm": {"q": "三條等距的平行線截一條斜線，上面那段長 5，下面那段多長？", "a": "5（等距平行線截出的各段等長）。"}, "retest": {"q": "四條等距平行線截一條斜線，切成 3 段，全長 18，每段多長？", "a": "6（三段等長，18÷3＝6）。"}, "jingle": "等距平行線，切出等長段", "alt": "換個角度：這是「平行線截比例線段」的等份版。平行線本來就會讓被截的兩條線按同樣的比例分開，現在其中一條線被分成 1：1：1，那另一條也一定是 1：1：1。所以重點不是線有多斜，而是平行線之間「等距」這件事。如果平行線間距不相等，同一條斜線上切出來的各段就不相等了；但換另一條斜線去截，兩條斜線上被切出的比例還是一樣的——這是最常被考的陷阱。", "pre": [{"q": "筆記本的橫線彼此是什麼關係？", "a": "平行，而且間距相等。"}, {"q": "18 平分成 3 段，一段多長？", "a": "6。"}], "signal": {"see": "圖上好幾條平行線，而且相鄰的間隔畫得一樣寬，有一條斜線穿過去", "think": "被切出來的每一段都一樣長", "do": "把總長除以段數，或直接把已知的那一段抄到其他段"}, "widget": "par_equal", "ask": "我卡在【平行線截等長線段】，可以教我嗎？"}, "inner_pt": {"name": "內分點", "teach": "P 在線段 AB 上（在 A、B 之間），把 AB 分成 AP：PB＝m：n，就說 P 是 AB 的「m：n 內分點」。算法就是分份數：總份數 m＋n，AP 拿走前面 m 份，所以 AP＝AB×m/(m＋n)。例如 AB＝12、要 1：2 內分，總份數 3，AP＝12×1/3＝4，P 就落在離 A 四格的地方。", "recap": "AP＝AB×m/(m＋n)，前面幾份就乘幾，分母是總份數。", "confirm": {"q": "數線上 A＝0、B＝12，P 是 AB 的 1：2 內分點，P 的座標是多少？", "a": "4（AP＝12×1/3＝4，從 A＝0 走 4 格）。"}, "retest": {"q": "數線上 A＝2、B＝14，P 把 AB 分成 AP：PB＝1：3，P 的座標是多少？", "a": "5（AB＝12，AP＝12×1/4＝3，座標 2＋3＝5）。"}, "jingle": "全長乘上：前面幾份÷總份數", "alt": "把它想成走路。你從 A 走到 B，全程被分成 m＋n 步的份量，P 就是你走完「前 m 份」停下來的位置。所以先問「全長多少」，再問「總共幾份」，最後「走幾份」。最容易錯兩個地方：一是分母寫成 m（要寫 m＋n），二是忘了 P 的座標不是 AP，要從 A 的座標加上去——A 不是 0 的時候特別容易漏。", "pre": [{"q": "把 12 分成 1：2，前面那份是多少？", "a": "4（總共 3 份，一份 4）。"}, {"q": "數線上 A＝2、B＝14，AB 的長度是多少？", "a": "12（14－2）。"}], "signal": {"see": "題目說某個點在線段「上」（在兩端點之間），並給一個比像「AP：PB＝1：3」", "think": "分份數：全長除以總份數，再乘前面的份數", "do": "AP＝AB×m/(m＋n)，再從 A 的座標加上 AP 得到 P"}, "widget": "inner_pt", "ask": "我卡在【內分點】，可以教我嗎？"}, "sim_def": {"name": "相似的定義", "teach": "兩個圖形相似，就是「形狀一樣、大小可以不一樣」——像同一張照片印成大張和小張。數學上要同時滿足兩件事：對應角都相等（形狀沒歪），對應邊成比例（每條邊都放大同樣的倍數）。符號寫 △ABC ∼ △DEF，字母的順序就是對應關係：A 對 D、B 對 E、C 對 F。", "recap": "相似＝對應角相等＋對應邊成比例，寫的時候字母要對齊。", "confirm": {"q": "△ABC ∼ △DEF，AB＝4、DE＝6、BC＝6，求 EF。", "a": "EF＝9（相似比 AB：DE＝4：6＝2：3，所以 6：EF＝2：3，EF＝9）。"}, "retest": {"q": "△ABC ∼ △PQR，∠B＝70°、AB＝3、PQ＝9。∠Q 幾度？相似比多少？", "a": "∠Q＝70°，相似比 1：3。"}, "jingle": "角要一樣，邊要成比例", "alt": "跟「全等」比較就清楚了：全等是形狀一樣、大小也一樣（影印 100%）；相似是形狀一樣、大小可以縮放（影印 200%）。影印放大時，角度不會跑掉，每條邊卻都乘同一個倍數——這個倍數就是相似比。所以拿到相似題，第一件事是找出相似比（用一組已知的對應邊算），第二件事是把相似比套到題目問的那一組邊上。", "pre": [{"q": "△ABC ∼ △DEF 時，AB 的對應邊是哪一條？", "a": "DE（字母順序對字母順序）。"}, {"q": "4：6 化到最簡是多少？", "a": "2：3。"}], "signal": {"see": "題目出現「∼」符號，或圖上兩個一大一小、長得一樣的圖形", "think": "對應角相等、對應邊成比例", "do": "照字母順序配對，用已知的一組對應邊算出相似比，再套到要求的邊"}, "widget": "sim_def", "ask": "我卡在【相似的定義】，可以教我嗎？"}, "sim_area": {"name": "相似比、周長比、面積比", "teach": "兩個相似圖形的相似比是 k，那周長比也是 k，但面積比是 k²。想想影印放大 2 倍：每條邊變 2 倍，一圈繞下來的周長當然也是 2 倍；可是面積是「長×寬」，兩個方向都變 2 倍，所以變 4 倍。邊長 ×k 兩次，面積就 ×k²。", "recap": "邊 k 倍、周長 k 倍、面積 k² 倍。", "confirm": {"q": "兩個相似三角形相似比 2：3，小的面積 8，大的面積多少？", "a": "18（面積比 2²：3²＝4：9，8：x＝4：9，x＝18）。"}, "retest": {"q": "兩個相似三角形面積比 9：25，相似比是多少？", "a": "3：5（面積比開平方，√9：√25＝3：5）。"}, "jingle": "邊 k 倍，面積 k 平方倍", "alt": "用格子紙最好懂。畫一個 1×1 的小正方形，面積 1 格；放大 3 倍變成 3×3，數一數是 9 格，不是 3 格。因為長也變 3 倍、寬也變 3 倍，3×3＝9。反過來，如果題目給的是面積比要你回推相似比，就要「開平方」：面積比 9：25 → 相似比 3：5。記住方向——邊到面積是平方，面積到邊是開根號。", "pre": [{"q": "邊長 3 的正方形面積多少？邊長 6 呢？", "a": "9 和 36（面積變 4 倍，不是 2 倍）。"}, {"q": "√9 和 √25 各是多少？", "a": "3 和 5。"}], "signal": {"see": "題目同時提到「相似」和「面積」（或周長），給其中一個要另一個", "think": "周長跟邊同比，面積是比的平方", "do": "邊比求面積比就平方；面積比求邊比就開平方；周長直接用邊比"}, "widget": "sim_area", "ask": "我卡在【相似比、周長比、面積比】，可以教我嗎？"}, "SAS_sim": {"name": "SAS 相似", "teach": "不用量三個角也不用量三條邊，只要「兩組對應邊成比例，而且它們夾的那個角相等」，兩個三角形就相似。關鍵字是「夾」——那個角必須被那兩條邊夾在中間，不能是旁邊的角。像是用兩根固定角度的筷子擺 V 字，兩根同時放大同樣倍數、夾角不動，擺出來的形狀就一模一樣。", "recap": "兩邊成比例＋夾角相等 → 相似（SAS）。", "confirm": {"q": "△ABC 中 AB＝4、AC＝6、∠A＝50°；△DEF 中 DE＝6、DF＝9、∠D＝50°。兩個三角形相似嗎？為什麼？", "a": "相似（AB：DE＝4：6＝2：3，AC：DF＝6：9＝2：3，兩比相等且夾角 ∠A＝∠D＝50°，符合 SAS 相似）。"}, "retest": {"q": "△ABC 中 AB＝3、AC＝5、∠A＝60°；△DEF 中 DE＝6、DF＝10、∠D＝60°。相似嗎？相似比多少？", "a": "相似，相似比 1：2（3：6＝5：10＝1：2，夾角都是 60°）。"}, "jingle": "兩邊成比例，夾角要相等", "alt": "想像一把剪刀。剪刀的兩片就是那兩條邊，中間的轉軸就是夾角。只要角度卡在 50° 不動，把兩片同時換成 1.5 倍長的，剪刀張開的形狀完全一樣，只是變大——這就是相似。反過來，如果只有兩邊成比例但角度不同，剪刀張開的樣子就變了，兩個三角形就不相似。所以寫證明時一定要指明「夾角」相等，光說有一個角相等不夠。", "pre": [{"q": "4：6 和 6：9 化到最簡各是多少？", "a": "都是 2：3。"}, {"q": "AB 和 AC 這兩條邊夾住的角是哪一個？", "a": "∠A。"}], "signal": {"see": "題目給兩個三角形各兩條邊的長度，還給一個角度（而且這角剛好在那兩條邊中間）", "think": "兩邊成比例、夾角相等就相似", "do": "算兩組邊的比化到最簡，確認相等，再確認相等的角是被夾的那個，寫 SAS 相似"}, "widget": "SAS_sim", "ask": "我卡在【SAS 相似】，可以教我嗎？"}, "SSS_sim": {"name": "SSS 相似", "teach": "如果兩個三角形的三組對應邊都成比例，完全不用管角度，它們就一定相似。因為三邊的長度比一旦固定，形狀就被鎖死了，角度只能跟著長那樣。例如 3、4、5 和 6、8、10：3：6＝4：8＝5：10＝1：2，三個比都一樣，所以相似，相似比 1：2。", "recap": "三組對應邊都成比例 → 相似（SSS）。", "confirm": {"q": "三邊 3、4、5 的三角形和三邊 6、8、10 的三角形相似嗎？相似比多少？", "a": "相似，相似比 1：2（3：6、4：8、5：10 都等於 1：2）。"}, "retest": {"q": "三邊 4、6、8 和三邊 6、9、12 的兩個三角形相似嗎？", "a": "相似（4：6、6：9、8：12 都等於 2：3）。"}, "jingle": "三邊同比例，形狀就一樣", "alt": "用三根吸管做實驗就懂了。拿 3、4、5 公分的吸管接成三角形，形狀是唯一的，你怎麼扳都扳不成別的樣子。換成 6、8、10 公分，也是唯一的形狀，而且剛好是前面那個的放大版。所以三邊比例一確定，角度就沒有選擇了。做題時的重點是「對應」：要先把兩個三角形的邊各自從小排到大，再一組一組去比，不能照題目給的順序亂配。", "pre": [{"q": "3：6、4：8、5：10 化到最簡各是多少？", "a": "都是 1：2。"}, {"q": "比較兩個三角形的邊時，該怎麼配對？", "a": "各自從小排到大，最小配最小、最大配最大。"}], "signal": {"see": "題目給兩個三角形的三條邊長，一個角度都沒給", "think": "沒角度就比三組邊的比", "do": "兩組邊各自由小排到大配對，算三個比化到最簡，全部相同就是 SSS 相似"}, "widget": "SSS_sim", "ask": "我卡在【SSS 相似】，可以教我嗎？"}, "sim_height": {"name": "對應高、中線、角平分線的比", "teach": "兩個三角形相似、相似比是 k，那不只三條邊是 k 倍，「裡面畫出來的線」也全都是 k 倍——對應的高、對應的中線、對應的角平分線都一樣。道理很簡單：整張圖是同一個放大鏡放大出來的，圖上每一條線段都被放大同樣的倍數，沒有東西會例外。", "recap": "相似比 k → 對應高、對應中線、對應角平分線的比也都是 k。", "confirm": {"q": "兩個相似三角形相似比 2：3，小三角形某條高是 4，大三角形對應的高多長？", "a": "6（4：x＝2：3，x＝6）。"}, "retest": {"q": "兩個相似三角形的對應中線是 5 和 15，它們的相似比和面積比各是多少？", "a": "相似比 1：3，面積比 1：9。"}, "jingle": "高中線角平分，都跟邊同比", "alt": "另一個想法：把相似比想成「地圖的比例尺」。一張 1：3 的地圖上，主要道路縮 3 倍，小巷子也縮 3 倍，連路口到路口的距離都縮 3 倍——地圖上任何兩點的距離都照同一個比例尺。三角形也是這樣，高、中線、角平分線都是「圖上的某兩點距離」，所以全部照同一個 k。唯一不照 k 走的是面積（照 k²）。", "pre": [{"q": "什麼是三角形的高？", "a": "從一個頂點垂直畫到對邊的線段。"}, {"q": "5：15 化到最簡是多少？", "a": "1：3。"}], "signal": {"see": "題目在相似三角形裡又提到「高」「中線」或「角平分線」的長度", "think": "這些線的比跟邊的比一樣，都是相似比", "do": "用已知的一組對應邊（或已知的高）求出相似比，再直接套到要求的那條線"}, "widget": "sim_height", "ask": "我卡在【對應高、中線、角平分線的比】，可以教我嗎？"}, "mother_child": {"name": "母子相似", "teach": "直角三角形 ABC（∠A＝90°），從直角頂點 A 往斜邊 BC 拉一條垂直的高 AD。這一刀下去，原本的大三角形被切成兩個小三角形，而這三個三角形——大的 △ABC 和兩個小的 △DBA、△DAC——彼此都相似！像媽媽生出兩個孩子，長得一模一樣，只是大小不同，所以叫「母子相似」。原因是每個三角形都有一個直角，而且小的跟大的還共用一個銳角，兩角相等就相似（AA）。", "recap": "直角三角形拉斜邊上的高 → 大小三個三角形全部相似。", "confirm": {"q": "∠A＝90°、AD ⊥ BC。△ABD 和 △CBA 為什麼相似？", "a": "兩個都有直角（∠ADB＝∠BAC＝90°），又共用 ∠B，兩角相等所以相似（AA）。"}, "retest": {"q": "∠A＝90°、AD ⊥ BC 於 D，圖中一共有幾個互相相似的三角形？分別是哪些？", "a": "3 個：△ABC、△DBA、△DAC，三個互相相似。"}, "jingle": "斜邊拉條高，三兄弟全像", "alt": "換個方式找對應：三個三角形都是直角三角形，把每個三角形的角照「直角、大銳角、小銳角」排好，就能一一對上。△ABC 的直角在 A，△DBA 的直角在 D，△DAC 的直角也在 D。共用 ∠B 的是 △ABC 和 △DBA；共用 ∠C 的是 △ABC 和 △DAC。所以寫的時候要照對應順序：△ABC ∼ △DBA ∼ △DAC，字母排錯就會算錯邊。", "pre": [{"q": "兩個三角形有兩組角相等，是什麼關係？", "a": "相似（AA）。"}, {"q": "AD ⊥ BC，∠ADB 是幾度？", "a": "90°。"}], "signal": {"see": "圖上一個直角三角形，從直角那個頂點又往斜邊畫了一條垂線（有兩個直角符號）", "think": "母子相似，三個三角形互相相似", "do": "照「直角、共用的銳角」把三個三角形配對，寫成 △ABC ∼ △DBA ∼ △DAC 再列比例式"}, "widget": "mother_child", "ask": "我卡在【母子相似】，可以教我嗎？"}, "mc_formula": {"name": "母子相似的公式", "teach": "直角三角形 ABC（∠A＝90°），AD 是斜邊 BC 上的高，D 把 BC 切成 BD 和 DC 兩段。相似關係會生出三條公式：AB²＝BD×BC、AC²＝CD×CB、AD²＝BD×DC。前兩條的記法是「邊的平方＝它靠著的那一小段 × 整條斜邊」；第三條是「高的平方＝左右兩小段相乘」。例：BD＝9、DC＝16 → AD²＝144，AD＝12；BC＝25，AB²＝9×25＝225，AB＝15；AC²＝16×25＝400，AC＝20。", "recap": "AB²＝BD×BC、AC²＝CD×CB、AD²＝BD×DC。", "confirm": {"q": "∠A＝90°、AD ⊥ BC，BD＝9、DC＝16，求 AD。", "a": "AD＝12（AD²＝BD×DC＝9×16＝144，AD＝12）。"}, "retest": {"q": "∠A＝90°、AD ⊥ BC，BD＝4、BC＝25，求 AB。", "a": "AB＝10（AB²＝BD×BC＝4×25＝100，AB＝10）。"}, "jingle": "斜邊兩段相乘，等於高的平方", "alt": "這三條公式其實都是從相似的比例式來的，背不起來就現推。以 AB 為例：△DBA ∼ △ABC，對應邊 BD：BA＝BA：BC，交叉相乘就得到 AB²＝BD×BC。看得出來嗎？AB 在比例式裡出現兩次（一次當後項、一次當前項），這種「自己跟自己相乘」的比例叫比例中項，平方就是這樣冒出來的。AD 也一樣：△DBA ∼ △DAC，得 BD：AD＝AD：DC，所以 AD²＝BD×DC。分不清用哪條的時候，就看題目問的那條線「兩端接著誰」。", "pre": [{"q": "9×16 是多少？它的平方根是多少？", "a": "144；12。"}, {"q": "BD＝4、BC＝25，DC 是多少？", "a": "21（25－4）。"}], "signal": {"see": "直角三角形加一條畫到斜邊上的高，題目給斜邊上被切出的兩小段長度", "think": "母子相似公式，出現平方", "do": "求高用 AD²＝BD×DC；求斜邊，用那條邊靠著的小段乘整條斜邊再開根號"}, "widget": "mc_formula", "ask": "我卡在【母子相似的公式】，可以教我嗎？"}, "shadow": {"name": "測量應用（影長、鏡子、縮尺）", "teach": "太陽很遠，同一時間照下來的光線可以看成平行，所以人和影子、樹和影子會做出兩個相似的直角三角形。既然相似，就有「人高：人影＝樹高：樹影」。量得到的是人高、人影、樹影三個數，用比例式就能算出量不到的樹高。鏡子題、縮尺題原理完全一樣，都是拿量得到的去推量不到的。", "recap": "同一時間，高：影長 是固定的比，用比例式算出高度。", "confirm": {"q": "小美身高 1.6 m、影長 2 m，同一時間旁邊的樹影長 5 m，樹高多少？", "a": "4 m（1.6：2＝x：5，2x＝8，x＝4）。"}, "retest": {"q": "一根 2 m 的竿子影長 3 m，同一時間大樓的影長 30 m，大樓多高？", "a": "20 m（2：3＝x：30，3x＝60，x＝20）。"}, "jingle": "同時量影子，高影成比例", "alt": "把它想成「影子的放大倍率」。那一天那個時刻，太陽把每樣東西的影子都用同一個倍率拉長：小美 1.6 m 拉出 2 m 的影子，倍率是 2÷1.6＝1.25 倍。樹的影子 5 m，也是被同一個 1.25 倍拉出來的，所以樹高＝5÷1.25＝4 m。兩種做法答案一樣，選你順手的。注意單位——公分和公尺混在一起要先統一，這是這類題最常見的失分點。", "pre": [{"q": "為什麼人和樹的影子問題可以用相似？", "a": "因為人和樹都跟地面垂直，所以兩個都是直角三角形（第一組角相等）；太陽光是平行的，照下來的仰角也一樣（第二組角相等）。兩組角相等，由 AA 得到相似。"}, {"q": "1.6：2＝x：5，交叉相乘後的式子是什麼？", "a": "2x＝8，所以 x＝4。"}], "signal": {"see": "題目出現「同一時間」「影子長」「鏡子」「比例尺」這些字，還有量不到的高度", "think": "兩個相似三角形，高和影長成比例", "do": "列「已知高：已知影＝未知高：已知影」，交叉相乘解出來（先統一單位）"}, "widget": "shadow", "ask": "我卡在【測量應用（影長、鏡子、縮尺）】，可以教我嗎？"}, "trig_def": {"name": "sin、cos、tan 的定義", "teach": "在直角三角形裡盯著一個銳角 ∠A：正對著它的那條邊叫「對邊」，貼著它的那條（不是斜邊）叫「鄰邊」，直角對面最長的叫「斜邊」。三角比就是三種邊的比值：sin A＝對邊/斜邊、cos A＝鄰邊/斜邊、tan A＝對邊/鄰邊。只要角度不變，三角形放大縮小都沒差，這三個比值永遠一樣——這就是三角比好用的原因。", "recap": "sin＝對/斜、cos＝鄰/斜、tan＝對/鄰。", "confirm": {"q": "直角三角形中對 ∠A 而言，對邊 3、鄰邊 4、斜邊 5。sin A、cos A、tan A 各是多少？", "a": "sin A＝3/5、cos A＝4/5、tan A＝3/4。"}, "retest": {"q": "對 ∠A 而言對邊 5、鄰邊 12、斜邊 13，求 sin A、cos A、tan A。", "a": "sin A＝5/13、cos A＝12/13、tan A＝5/12。"}, "jingle": "正對斜、餘鄰斜、切對鄰", "alt": "三角比可以想成「這個角的身分證」。同一個 30° 角，不管畫成小三角形還是大三角形，對邊除以斜邊永遠是 0.5——因為放大時對邊和斜邊一起變 k 倍，比值上下約掉就不變了。所以 sin、cos、tan 是「角度的函數」，給我角度我就能查出比值，給我比值也能反推角度。認邊的口訣：先找直角，直角對面是斜邊；再看你盯的那個角，正對面是對邊，剩下那條就是鄰邊。角換了，對邊和鄰邊就對調，這是最常錯的地方。", "pre": [{"q": "直角三角形裡，哪一條邊是斜邊？", "a": "直角正對面那條，也是最長的那條。"}, {"q": "對 ∠A 來說，「對邊」是哪一條？", "a": "∠A 正對面的那一條邊。"}], "signal": {"see": "圖是直角三角形，題目給一個角度和一條邊，要求另一條邊", "think": "看已知和未知是哪兩種邊，決定用 sin、cos 還是 tan", "do": "先標出對邊、鄰邊、斜邊，再挑「剛好連接已知和未知」的那個三角比列式"}, "widget": "trig_def", "ask": "我卡在【sin、cos、tan 的定義】，可以教我嗎？"}, "trig_special": {"name": "30°、45°、60° 的三角比", "teach": "只要記住兩個三角形，特殊角就全拿到了。第一個是 30-60-90，三邊比 1：√3：2（短邊對 30°、長邊對 60°、斜邊 2）。第二個是 45-45-90，三邊比 1：1：√2（兩股一樣長）。把邊套進定義就得到：sin 30°＝1/2、cos 30°＝√3/2、tan 30°＝√3/3；sin 45°＝cos 45°＝√2/2、tan 45°＝1；sin 60°＝√3/2、cos 60°＝1/2、tan 60°＝√3。", "recap": "30-60-90 是 1：√3：2，45-45-90 是 1：1：√2，套定義就出來。", "confirm": {"q": "sin 30°、cos 30°、tan 30° 各是多少？", "a": "sin 30°＝1/2、cos 30°＝√3/2、tan 30°＝√3/3。"}, "retest": {"q": "直角三角形中 ∠A＝30°，斜邊長 8，∠A 的對邊多長？", "a": "4（對邊＝斜邊×sin 30°＝8×1/2＝4）。"}, "jingle": "一根三二，一一根二", "alt": "不想背表就用「畫圖現推」。把一個邊長 2 的正三角形對半切，就得到 30-60-90：斜邊 2、短邊 1（被切一半）、長邊用畢氏定理算出 √3。把一個邊長 1 的正方形沿對角線切，就得到 45-45-90：兩股都是 1、斜邊 √2。圖畫好，sin 就是對邊除斜邊，當場讀出來，不會記錯。檢查小技巧：角度越大，sin 越大、cos 越小，所以 sin 30° 一定比 sin 60° 小——1/2 < √3/2，對得起來。", "pre": [{"q": "邊長 2 的正三角形對半切，短邊多長？", "a": "1（底邊的一半）。"}, {"q": "兩股都是 1 的直角三角形，斜邊多長？", "a": "√2（1²＋1²＝2）。"}], "signal": {"see": "題目的角度剛好是 30°、45° 或 60°，沒有給計算機也沒給表", "think": "這是特殊角，三邊比是 1：√3：2 或 1：1：√2", "do": "在旁邊畫出那個標準三角形，標上三邊，再照 sin、cos、tan 的定義讀出比值"}, "widget": "trig_special", "ask": "我卡在【30°、45°、60° 的三角比】，可以教我嗎？"}, "circle_terms": {"name": "圓的名詞", "teach": "把圓想成一個披薩。正中間那一點是圓心；從圓心切到邊邊一刀是半徑；穿過圓心從這邊切到那邊是直徑（＝兩條半徑接起來，所以直徑＝2×半徑）。圓上任兩點連起來的直線段叫弦，最長的那條弦就是直徑；圓周上被截下來那一段彎彎的線叫弧。從圓心切兩刀夾住一塊 → 扇形；直接用一條弦切下來的那塊 → 弓形。", "recap": "圓心、半徑、直徑、弦、弧、扇形、弓形，七個名詞先認位置。", "confirm": {"q": "弦和直徑有什麼關係？", "a": "直徑是通過圓心的弦，也是圓裡最長的弦。"}, "retest": {"q": "一個圓的半徑是 7，直徑多少？兩條半徑和一段弧圍起來的那一塊叫什麼？", "a": "直徑＝14；那一塊叫扇形。"}, "jingle": "圓心半徑弦和弧，名詞先認清", "alt": "換個方式分類：先問「這是線還是面？」半徑、直徑、弦都是直直的線段（弦連圓上兩點，直徑是最特別的那條弦），弧是彎的、是圓周的一部分。面的只有兩種：扇形是兩條半徑加一段弧圍出來的（像披薩），弓形是一條弦加一段弧圍出來的（像缺一角的月亮）。認名詞時先問直的還是彎的、線還是面，就不會混。", "pre": [{"q": "半徑 5 的圓，直徑多少？", "a": "10。"}, {"q": "圓上每一個點到圓心的距離都一樣嗎？", "a": "一樣，都等於半徑。"}], "signal": {"see": "題目裡出現「弦」「弧」「扇形」這些字，或圖上畫了一個圓和幾條線", "think": "先分清楚哪條是半徑、哪條是弦、哪一段是弧", "do": "在圖上把圓心 O 和半徑 r 標出來，再標出題目講的那條弦或那段弧"}, "widget": "circle_terms", "ask": "我卡在【圓的名詞】，可以教我嗎？"}, "pt_circle": {"name": "點與圓的位置", "teach": "要判斷一個點在圓的裡面、上面還是外面，只要比一件事：這個點到圓心的距離 d，跟半徑 r 誰大。d＜r → 點躲在圓裡面；d＝r → 剛好站在圓周上；d＞r → 跑到圓外面去了。像操場的跑道：你離中心比跑道半徑近，你就在場內。", "recap": "比 d 和 r：小在內、等在上、大在外。", "confirm": {"q": "圓 O 的半徑是 5，OP＝3，點 P 在圓內、圓上還是圓外？", "a": "d＝3＜r＝5，P 在圓內。"}, "retest": {"q": "圓心 O 在原點、半徑 5，點 P 的座標是 (3, 4)，P 在圓內、圓上還是圓外？", "a": "OP＝√(3²＋4²)＝5＝r，P 在圓上。"}, "jingle": "比半徑小在圓內，大在外", "alt": "反過來想：圓本來就是「離圓心剛好 r 遠」的那些點連成的線。所以一個點只有三種命運——離得不夠遠（d＜r，在裡面）、剛剛好（d＝r，在線上）、太遠（d＞r，在外面）。題目要你判斷位置，一定會給你算得出 d 的資料（座標或長度），第一個動作就是把 d 算出來，再跟 r 比。", "pre": [{"q": "(0, 0) 到 (3, 4) 的距離是多少？", "a": "5。"}, {"q": "半徑就是圓心到圓上任一點的距離，對嗎？", "a": "對。"}], "signal": {"see": "題目給一個點到圓心的長度（或給座標），問這個點「在圓內、圓上還是圓外」", "think": "這是在比 d 和 r 誰大", "do": "先算出 d，再跟 r 比大小，寫出內／上／外"}, "widget": "pt_circle", "ask": "我卡在【點與圓的位置】，可以教我嗎？"}, "line_circle": {"name": "直線與圓的位置", "teach": "一條直線跟圓的關係只有三種，看的還是同一件事：圓心到直線的距離 d 跟半徑 r 比大小。d＞r → 離太遠碰不到，叫相離，0 個交點；d＝r → 剛好擦過一點，叫相切，1 個交點；d＜r → 直接切進圓裡穿過去，叫相交，2 個交點。想像一把尺慢慢靠近圓：還沒碰到 → 剛好碰到 → 切進去。", "recap": "d＞r 相離、d＝r 相切、d＜r 相交，交點 0、1、2 個。", "confirm": {"q": "圓的半徑是 5，圓心到某直線的距離是 3，這條直線和圓有幾個交點？", "a": "d＝3＜r＝5，相交，有 2 個交點。"}, "retest": {"q": "圓的半徑是 4，圓心到直線的距離也是 4，兩者是什麼關係？有幾個交點？", "a": "d＝r，相切，只有 1 個交點（切點）。"}, "jingle": "小相交、等相切、大相離", "alt": "最容易錯的是 d 抓錯：d 一定是「圓心到直線的垂直距離」，不能隨便抓一段斜的。所以做法固定三步：從圓心往直線畫一條垂線 → 那段垂線長就是 d → 拿 d 跟 r 比。比 r 大代表圓還沒碰到它，一樣大代表剛好貼著，比 r 小代表直線已經插進圓裡了。", "pre": [{"q": "點到直線的距離要怎麼量？", "a": "從點作垂線到那條直線，那段垂線的長度。"}, {"q": "d＝r 的時候，點在圓的哪裡？", "a": "在圓上。"}], "signal": {"see": "圖上有一個圓，旁邊一條直線，可能碰到圓也可能沒碰到", "think": "量圓心到那條直線的垂直距離，拿來跟半徑比", "do": "從圓心作垂線量出 d，跟 r 比大小，判斷相離／相切／相交"}, "widget": "line_circle", "ask": "我卡在【直線與圓的位置】，可以教我嗎？"}, "chord_perp": {"name": "弦心距垂直平分弦", "teach": "從圓心往一條弦畫垂線，那段垂線叫弦心距。它有一個超好用的性質：一定會把這條弦切成一模一樣的兩半。原因很直覺——圓是左右對稱的，圓心正對著弦的正中間。另外還有一句，但只在同一個圓（或一樣大的圓）裡才算數：弦愈長就愈靠近圓心，弦心距愈短；同一個圓裡最長的弦是直徑，它的弦心距是 0。不同大小的兩個圓不能這樣比。", "recap": "圓心到弦的垂線會平分那條弦；弦愈長、弦心距愈短。", "confirm": {"q": "圓心 O 作 OM⊥弦 AB 於 M，弦 AB 長 10，AM 多長？", "a": "AM＝5（弦心距平分弦，AM＝MB＝10÷2）。"}, "retest": {"q": "同一個圓裡，弦 AB＝12、弦 CD＝8，哪一條的弦心距比較短？為什麼？", "a": "AB 的比較短。弦愈長離圓心愈近，弦心距愈短。"}, "jingle": "圓心垂弦，一定平分", "alt": "想成摺紙：沿著「圓心到弦的那條垂線」把圓對摺，弦的左半段會剛好蓋住右半段，所以兩半一樣長。這也代表三件事會綁在一起出現——垂直、平分、通過圓心，知道其中兩個就能推出第三個。所以看到圖上從圓心畫到弦的那條垂線，第一個動作就是把弦長除以 2。", "pre": [{"q": "「垂直平分一條線段」是什麼意思？", "a": "垂直，而且把它切成相等的兩段。"}, {"q": "一個圓裡最長的弦是哪一條？", "a": "直徑。"}], "signal": {"see": "圖上從圓心畫一條線到弦，交點那裡有個小小的直角記號", "think": "這條線會把弦切成相等的兩半", "do": "把弦長除以 2 得到半弦長，直接標在圖上"}, "widget": "chord_perp", "ask": "我卡在【弦心距垂直平分弦】，可以教我嗎？"}, "chord_pyth": {"name": "半徑、弦心距、半弦的畢氏關係", "teach": "從圓心往弦畫垂線之後，圖上會冒出一個直角三角形：圓心 O、垂足 M、弦的端點 A。三個邊分別是弦心距 d（OM）、半弦長 L/2（AM），還有半徑 r（OA）——r 對著直角，所以 r 是斜邊。因此 r²＝d²＋(L/2)²。這個題型幾乎都是給你其中兩個、要你算第三個，直接套畢氏就好。", "recap": "半徑是斜邊：r²＝d²＋(半弦長)²。", "confirm": {"q": "圓的半徑 5，弦心距 3，這條弦多長？", "a": "半弦長＝√(5²−3²)＝√16＝4，弦長＝4×2＝8。"}, "retest": {"q": "圓的半徑 13，弦長 24，弦心距多少？", "a": "半弦長＝24÷2＝12，弦心距＝√(13²−12²)＝√25＝5。"}, "jingle": "半徑當斜邊，畢氏來救援", "alt": "記一個畫面就夠：「r 是斜邊，d 和半弦是兩隻腳。」最常出現的兩組數字是 3-4-5 和 5-12-13：r＝5、d＝3 → 半弦 4（弦長 8）；r＝13、d＝5 → 半弦 12（弦長 24）。有兩個陷阱要特別小心：（1）題目給的是「整條弦」，要先除以 2 才能丟進畢氏；（2）算出來的是「半弦」，要再乘回 2 才是弦長。", "pre": [{"q": "直角三角形兩股是 3 和 4，斜邊多長？", "a": "5。"}, {"q": "圓心到弦的垂線會把弦怎麼樣？", "a": "平分成相等的兩段。"}], "signal": {"see": "題目同時給了半徑，還有弦長或圓心到弦的距離", "think": "這裡藏了一個直角三角形，半徑是斜邊", "do": "弦長先除以 2，套 r²＝d²＋(L/2)² 解出未知的那一個，最後看要不要乘回 2"}, "widget": "chord_pyth", "ask": "我卡在【半徑、弦心距、半弦的畢氏關係】，可以教我嗎？"}, "tangent": {"name": "切線的性質", "teach": "切線就是只碰到圓一次的那條直線，碰到的那一點叫切點。第一個性質：切線一定垂直過切點的那條半徑，所以圖上會出現一個直角。第二個性質：從圓外一點 P 往圓拉兩條切線，兩條切線長 PA、PB 一定相等——因為 △OAP 和 △OBP 共用斜邊 OP、半徑又一樣長，兩個直角三角形完全一樣。", "recap": "切線⊥過切點的半徑；圓外一點拉出的兩條切線長相等。", "confirm": {"q": "圓 O 半徑 6，圓外一點 P 使 OP＝10，PA 是切線、A 是切點，PA 多長？", "a": "∠OAP＝90°，PA＝√(10²−6²)＝√64＝8。"}, "retest": {"q": "圓 O 半徑 5，OP＝13，從 P 作兩條切線分別切於 A、B，PA 和 PB 各多長？", "a": "PA＝√(13²−5²)＝√144＝12，PB 也是 12（兩切線長相等）。"}, "jingle": "切線垂半徑，雙切線等長", "alt": "想像拿一根棍子去碰一顆球，剛好只碰到一點——那個碰點和球心的連線，一定跟棍子垂直。這個直角就是解題的鑰匙：把切點和圓心連起來之後，O、A、P 變成直角三角形，半徑、切線長、圓心到 P 的距離三者就能用畢氏互相算。「兩條切線一樣長」這件事，在內切圓、切線圍出的三角形周長這類題幾乎每題都用到。", "pre": [{"q": "直角三角形斜邊 10、一股 6，另一股多長？", "a": "8。"}, {"q": "直線和圓只有一個交點時叫什麼？", "a": "相切。"}], "signal": {"see": "圖上有一條線碰到圓、而且只碰到一個點，或題目寫「切於 A 點」", "think": "把切點和圓心連起來就有直角，可以用畢氏", "do": "連 OA 畫直角，用 半徑²＋切線長²＝OP² 求未知的邊"}, "widget": "tangent", "ask": "我卡在【切線的性質】，可以教我嗎？"}, "two_circles": {"name": "兩圓的位置關係", "teach": "兩個圓的關係，就看「兩個圓心的距離 d」跟「兩半徑的和 R＋r、差 R−r」比大小。把兩個圓從很遠慢慢推近：碰不到（d＞R＋r，外離）→ 剛好碰到一點（d＝R＋r，外切）→ 疊出兩個交點（R−r＜d＜R＋r，相交）→ 小圓縮進大圓、內側剛好貼一點（d＝R−r，內切）→ 完全躲進去碰不到（d＜R−r，內離）。", "recap": "拿 d 跟 R＋r、R−r 比：大於和是外離、等於和是外切、夾在中間是相交、等於差是內切、小於差是內離。", "confirm": {"q": "兩圓半徑 5 和 3，圓心距 d＝8，是什麼位置關係？", "a": "R＋r＝8＝d，所以外切（只有 1 個交點）。"}, "retest": {"q": "兩圓半徑 7 和 3，圓心距 d＝4，是什麼位置關係？", "a": "R−r＝4＝d，所以內切。"}, "jingle": "圓心距比和差，位置就知道", "alt": "也可以用交點個數來對答案：外離 0 個、外切 1 個、相交 2 個、內切 1 個、內離 0 個。但光數交點分不出外離和內離、外切和內切，還是要靠 d 跟 R＋r、R−r 比，才知道是「在外面」還是「一個包住另一個」。做題順序固定：先把 R＋r 和 R−r 這兩個門檻算出來，再看 d 掉在哪一段。", "pre": [{"q": "兩圓半徑 6 和 2，R＋r 和 R−r 各是多少？", "a": "R＋r＝8、R−r＝4。"}, {"q": "兩個圓心之間的距離叫什麼？", "a": "圓心距 d。"}], "signal": {"see": "題目給兩個圓的半徑，還有兩個圓心之間的距離，問位置關係或交點幾個", "think": "先算兩半徑的和與差，再看 d 落在哪一段", "do": "算出 R＋r 和 R−r，把 d 跟這兩個數比，對出外離／外切／相交／內切／內離"}, "widget": "two_circles", "ask": "我卡在【兩圓的位置關係】，可以教我嗎？"}, "common_tangent": {"name": "公切線長", "teach": "同時跟兩個圓都相切的直線叫公切線：兩個圓在同一側的是外公切線，從兩圓中間穿過去的是內公切線。求長度的招式一樣——把半徑平移，湊出一個直角三角形，斜邊永遠是圓心距 d。外公切線的另一股是 R−r，長＝√(d²−(R−r)²)；內公切線的另一股是 R＋r，長＝√(d²−(R＋r)²)。", "recap": "外公切線配 R−r、內公切線配 R＋r，都拿 d 當斜邊開根號。", "confirm": {"q": "兩圓半徑 5 和 2，圓心距 d＝5，外公切線長多少？", "a": "R−r＝3，長＝√(5²−3²)＝√16＝4。"}, "retest": {"q": "兩圓半徑 4 和 2，圓心距 d＝10，內公切線長多少？", "a": "R＋r＝6，長＝√(10²−6²)＝√64＝8。"}, "jingle": "外減內加，畢氏開根號", "alt": "為什麼外公切線用「減」、內公切線用「加」？外公切線的兩條半徑指向同一邊，把小圓的半徑平移貼到大圓上，剩下的高度差就是 R−r；內公切線的兩條半徑指向相反邊，接起來就是 R＋r。兩種情況剩下的都是直角三角形、斜邊都是 d，所以公式都是「d² 減掉那一段的平方再開根號」。存在條件也要記：外公切線長要 d＞R−r 才是正數（d＝R−r 是內切，兩個切點重合、長度 0）；內公切線長要 d＞R＋r（兩圓外離才有）。", "pre": [{"q": "√(10²−6²) 等於多少？", "a": "8。"}, {"q": "直角三角形斜邊 5、一股 3，另一股多長？", "a": "4。"}], "signal": {"see": "題目說有一條直線同時和兩個圓相切，問這條線切點之間有多長", "think": "圓心距當斜邊，另一股是 R−r（外）或 R＋r（內）", "do": "先判斷是內還是外公切線，再套 √(d²−(R−r)²) 或 √(d²−(R＋r)²)"}, "widget": "common_tangent", "ask": "我卡在【公切線長】，可以教我嗎？"}, "central_angle": {"name": "圓心角、弧長與扇形面積", "teach": "圓心角就是頂點在圓心的角。它張開幾度，對到的那段弧就是幾度——角和弧是同一個數字。整個圓是 360°，所以一個 θ 度的圓心角，等於拿走整個圓的 θ/360 這麼多。弧長＝2πr×θ/360（整圈周長的 θ/360），扇形面積＝πr²×θ/360（整個圓面積的 θ/360）。就像切披薩，切走幾分之幾，餅皮邊和面積就都是幾分之幾。", "recap": "圓心角幾度弧就幾度；弧長和扇形面積都乘上 θ/360。", "confirm": {"q": "半徑 6 的圓，圓心角 60°，弧長和扇形面積各多少？", "a": "60/360＝1/6。弧長＝2π×6×1/6＝2π；扇形面積＝π×6²×1/6＝6π。"}, "retest": {"q": "半徑 4 的圓，圓心角 90°，弧長和扇形面積各多少？", "a": "90/360＝1/4。弧長＝2π×4×1/4＝2π；扇形面積＝π×4²×1/4＝4π。"}, "jingle": "圓心角幾度，弧就幾度", "alt": "與其背公式，不如先算「佔幾分之幾」再乘。看到 90° 就想 1/4、120° 想 1/3、60° 想 1/6、45° 想 1/8。整圈的周長是 2πr、整個面積是 πr²，把它們各乘上這個分數就得到答案。要注意兩個東西單位不同：弧長是長度，配 2πr；扇形面積是面積，配 πr²，千萬別拿錯。", "pre": [{"q": "120° 佔整個圓的幾分之幾？", "a": "120/360＝1/3。"}, {"q": "半徑 6 的圓，周長和面積各多少？", "a": "周長 12π、面積 36π。"}], "signal": {"see": "圖上塗色的是一塊披薩形狀，題目給了半徑和圓心那個角的度數", "think": "這個角佔整圈的幾分之幾", "do": "先算 θ/360，再乘 2πr 得弧長、乘 πr² 得扇形面積"}, "widget": "central_angle", "ask": "我卡在【圓心角、弧長與扇形面積】，可以教我嗎？"}, "inscribed_half": {"name": "圓周角＝弧的一半", "teach": "頂點在圓周上、兩邊各是一條弦的角，叫圓周角。它有一條鐵則：圓周角＝它所對的那段弧的一半，也等於同一段弧的圓心角的一半。弧 AB 是 100°，只要 P 落在另外那一段弧上（隔著弦 AB、跟弧 AB 對面的那一側），∠APB 永遠是 50°。P 在那段弧上滑來滑去角度都不會變，因為它只跟「所對的那段弧」有關，跟 P 停在哪裡無關。要小心：如果 P 跑到弧 AB 自己那一段上去，它對到的就變成另一段 260° 的弧，角度會變成 130°，不是 50°。", "recap": "圓周角是它所對弧的一半，也是圓心角的一半。", "confirm": {"q": "弧 AB 的度數是 100°，P 在圓周上，∠APB 幾度？", "a": "50°（100÷2）。"}, "retest": {"q": "P 在圓周上、∠APB＝35°，它所對的弧 AB 幾度？圓心角 ∠AOB 幾度？", "a": "弧 AB＝35×2＝70°，∠AOB＝70°。"}, "jingle": "圓周角，弧一半", "alt": "用「誰離弧比較近」來記：圓心角的頂點在圓心，離弧近、張得比較開；圓周角的頂點退到圓周上，離弧遠、張得比較小，剛好是一半。所以同一段弧會配兩種角：圓心角＝弧，圓周角＝弧÷2。做題時先確定「這個角對到哪一段弧」，再決定方向：從角推弧就 ×2，從弧推角就 ÷2。", "pre": [{"q": "圓心角 80°，它所對的弧幾度？", "a": "80°。"}, {"q": "一個角的頂點在圓周上、兩邊都是弦，這叫什麼角？", "a": "圓周角。"}], "signal": {"see": "角的尖端點在圓的邊上，兩條邊往圓裡連到另外兩個點", "think": "這個角是它對到的那段弧的一半", "do": "先圈出角對到的那段弧，弧÷2 得角；反過來角×2 得弧"}, "widget": "inscribed_half", "ask": "我卡在【圓周角＝弧的一半】，可以教我嗎？"}, "same_arc": {"name": "同弧圓周角相等、半圓 90°", "teach": "既然圓周角＝弧的一半，那對著「同一段弧」的圓周角，算出來一定一樣大。所以 P、Q 兩點都在圓周上，只要 P、Q 在弦 AB 的同一側（同在另一段弧上）、對的是同一段弧 AB，就有 ∠APB＝∠AQB。如果 P、Q 分在弦的兩側，兩個角是互補（加起來 180°），不是相等。最常考的特例：如果 AB 是直徑，弧 AB 就是半圓 180°，圓周角＝180÷2＝90°——直徑所對的圓周角永遠是直角。", "recap": "同一段弧的圓周角都相等；直徑所對的圓周角＝90°。", "confirm": {"q": "P、Q 都在圓周上、在弦 AB 的同一側、都對著弧 AB，已知 ∠APB＝40°，∠AQB 幾度？", "a": "40°（同弧圓周角相等）。"}, "retest": {"q": "AB 是圓的直徑、C 在圓上，∠ACB 幾度？若 ∠A＝35°，∠B 幾度？", "a": "∠ACB＝90°（直徑對的圓周角）；∠B＝180°−90°−35°＝55°。"}, "jingle": "同弧角相等，半圓九十度", "alt": "反過來用也很好用：看到圖上有兩個角「站在同一條弦的同一側」，先懷疑它們相等，這常常就是 AA 相似的第一個條件。看到題目寫「直徑」，就在圓周上那個頂點補一個直角記號——直角一出現，畢氏定理和相似三角形都能接著用。這是圓這一章跟前面章節接起來的橋。", "pre": [{"q": "圓周角是它所對弧的幾分之幾？", "a": "一半。"}, {"q": "半圓的弧是幾度？", "a": "180°。"}], "signal": {"see": "圖上兩個角的尖端都在圓邊上，而且都連到同樣的那兩個點；或題目寫「AB 是直徑」", "think": "同一段弧的圓周角一樣大；直徑對的角是 90°", "do": "把相等的兩個角標上同樣的記號，或在直徑所對的頂點畫上直角"}, "widget": "same_arc", "ask": "我卡在【同弧圓周角相等、半圓 90°】，可以教我嗎？"}, "tan_chord": {"name": "弦切角＝弧的一半", "teach": "一條切線和一條弦在切點交出來的角，叫弦切角。它跟圓周角一樣講理：弦切角＝它所夾的那段弧的一半。弧 AB 是 80°，弦切角就是 40°。可以這樣想：把圓周角的頂點一路滑到跟 A 重合，它的其中一邊就變成切線了，規則沒變，還是弧的一半。", "recap": "弦切角＝它夾住的那段弧的一半，和同一段弧的圓周角一樣大。", "confirm": {"q": "切線和弦 AB 在切點 A 夾出一個弦切角，所夾的弧 AB 是 80°，這個弦切角幾度？", "a": "40°（80÷2）。"}, "retest": {"q": "弦切角是 65°，它所夾的弧幾度？這段弧所對的圓周角幾度？", "a": "弧＝65×2＝130°；圓周角＝130÷2＝65°，和弦切角一樣大。"}, "jingle": "弦切角，也是弧一半", "alt": "一個切點其實會生出兩個弦切角（弦的左邊一個、右邊一個），它們各自夾住一段弧，兩段弧加起來 360°，所以兩個弦切角加起來 180°。判斷「夾住哪一段」很簡單：角的開口朝哪一邊，就夾那一邊的弧。算法永遠只有一句：角＝弧÷2、弧＝角×2。", "pre": [{"q": "圓周角 50°，它所對的弧幾度？", "a": "100°。"}, {"q": "切線和過切點的半徑夾幾度？", "a": "90°。"}], "signal": {"see": "圖上一條線只碰圓一個點，從那個點又拉一條線到圓上另一點，中間夾出一個角", "think": "這是弦切角，等於它夾住那段弧的一半", "do": "找出它夾住的那段弧除以 2；或反過來把角乘 2 得到弧"}, "widget": "tan_chord", "ask": "我卡在【弦切角＝弧的一半】，可以教我嗎？"}, "cyclic_quad": {"name": "圓內接四邊形", "teach": "四個頂點都在同一個圓上的四邊形，叫圓內接四邊形。它的招牌性質是：一組對角加起來 180°，也就是 ∠A＋∠C＝180°、∠B＋∠D＝180°。理由是 ∠A 和 ∠C 分別對到兩段弧，兩段弧合起來剛好整個圓 360°，各取一半就是 180°。再延伸一條：某個角的外角＝它的內對角（因為外角＝180°−這個角＝它的對角）。", "recap": "圓內接四邊形對角互補（和 180°），一個角的外角＝它的內對角。", "confirm": {"q": "圓內接四邊形 ABCD 中 ∠A＝110°，∠C 幾度？", "a": "∠C＝180°−110°＝70°。"}, "retest": {"q": "圓內接四邊形 ABCD 中 ∠B＝85°，∠D 幾度？∠D 的外角幾度？", "a": "∠D＝180°−85°＝95°；∠D 的外角＝180°−95°＝85°，剛好等於內對角 ∠B。"}, "jingle": "對角湊一八０，外角等內對", "alt": "要提醒的是：「對角互補」只有在四個點都在圓上時才成立，普通四邊形沒有這條（普通四邊形只保證四個角加起來 360°）。題目也常反過來考：如果一個四邊形有一組對角加起來 180°，那這四個點就共圓。所以看到 180° 想共圓、看到共圓想 180°，兩邊互推。", "pre": [{"q": "四邊形的內角和是幾度？", "a": "360°。"}, {"q": "和一個角加起來 180° 的角叫什麼？", "a": "補角。"}], "signal": {"see": "圖上一個四邊形，四個頂點剛好都點在圓的邊上", "think": "隔著對面的兩個角加起來一定是 180°", "do": "用 180° 減掉已知的那個角，得到它的對角"}, "widget": "cyclic_quad", "ask": "我卡在【圓內接四邊形】，可以教我嗎？"}, "power_pt": {"name": "圓冪（相交弦、切割線）", "teach": "從一個點 P 拉兩條直線去穿過圓，每條線都會被圓截出兩段。圓冪說的是：這兩段相乘的結果，兩條線一定一樣，PA·PB＝PC·PD。P 在圓內（兩弦相交）成立，P 在圓外（兩條割線）也成立。理由是連起來會生出一對相似三角形，對應邊成比例、交叉相乘就是這個式子。如果其中一條是切線 PT，兩段重合成同一段，就變成 PT²＝PA·PB。", "recap": "同一點拉出去的兩條線，各自兩段的乘積相等；切線那條是 PT²。", "confirm": {"q": "圓內兩弦 AB、CD 交於 P，PA＝4、PB＝6、PC＝3，PD 多長？", "a": "PA·PB＝4×6＝24，所以 PD＝24÷3＝8。"}, "retest": {"q": "圓外一點 P，切線長 PT＝6，一條割線穿過圓交於 A、B（A 比較靠近 P），PA＝4，PB 多長？", "a": "PT²＝PA·PB → 6²＝4×PB → 36＝4×PB，PB＝9。"}, "jingle": "兩段乘積，兩邊一樣", "alt": "用相似來記比較不會忘：把交點連起來會出現兩個相似三角形（同弧圓周角相等 → AA 相似），對應邊 PA/PC＝PD/PB，交叉相乘就得到 PA·PB＝PC·PD。最常錯的是量錯段：兩段都要「從 P 量到圓上的交點」，不是隨便抓弦被切出來的兩段。切線版本 PT²＝PA·PB 記成「切線是中項」——切線長自己乘自己。", "pre": [{"q": "4×6 等於多少？", "a": "24。"}, {"q": "a/b＝c/d 可以交叉相乘變成什麼？", "a": "ad＝bc。"}], "signal": {"see": "同一個點有兩條線往圓連出去，題目給了好幾段長度、剛好少一段", "think": "兩條線各自兩段的乘積會相等", "do": "寫下 PA·PB＝PC·PD（有切線就寫 PT²＝PA·PB），把已知代進去解未知"}, "widget": "power_pt", "ask": "我卡在【圓冪（相交弦、切割線）】，可以教我嗎？"}, "proof_format": {"name": "證明的寫法：已知→求證→證明", "teach": "證明不是算答案，是「說服別人」。格式固定三段：已知（題目已經給你的條件）、求證（題目要你說明的那一句話）、證明（一步一步從已知走到求證）。每一步後面都要用括號補上理由，像「（SSS 全等）」，沒寫理由的那一步等於沒說服力。把它想成帶朋友走一條路：每個轉彎都要說出「因為這裡有招牌」，人家才跟得上。", "recap": "已知 → 求證 → 證明，每一步都補上理由。", "confirm": {"q": "題目：「△ABC 中 AB＝AC，D 是 BC 的中點，求證 AD⊥BC」。哪些要寫在「已知」、哪一句是「求證」？", "a": "已知：AB＝AC、BD＝CD（D 是 BC 中點）；求證：AD⊥BC（也就是 ∠ADB＝90°）。"}, "retest": {"q": "△ABC 中 AB＝AC，∠B 的平分線交 AC 於 D、∠C 的平分線交 AB 於 E，要證明 BD＝CE。第一步要證哪兩個三角形全等？括號裡的理由寫什麼？", "a": "證 △BCD ≅ △CBE：∠DBC＝∠ECB（等腰底角的一半，因為 ∠ABC＝∠ACB 且各被平分）、BC＝CB（共用邊）、∠DCB＝∠EBC（等腰兩底角相等）→ ASA。全等後對應邊 BD＝CE。"}, "jingle": "已知求證加理由，一步一句", "alt": "換個畫面：證明像上法庭。「已知」是手上已經有的證據，「求證」是你要讓法官相信的那句話，「證明」是一句一句的推論。法官不接受「我覺得」，每一句都要說出根據哪一條法律 —— 在數學裡就是括號裡的理由（全等、相似、平行線角、等腰…）。所以寫證明卡住的時候，先回頭看「已知」還有哪個條件沒用到，那個沒用到的條件通常就是下一步的鑰匙。", "pre": [{"q": "等腰三角形的兩個底角有什麼關係？", "a": "相等。"}, {"q": "兩個三角形三邊分別相等，可以說它們全等嗎？用哪一個判別？", "a": "可以，SSS。"}], "signal": {"see": "題目最後不是問數字，而是出現「求證」、「試說明」這種字", "think": "這題要我寫理由，不是算答案", "do": "先把題目的條件抄成「已知」、要證的那句抄成「求證」，再想哪一個工具（全等／相似／平行線角／等腰）可以把兩邊接起來"}, "widget": "proof_format", "ask": "我卡在【證明的寫法：已知→求證→證明】，可以教我嗎？"}, "proof_tools": {"name": "證明常用的幾把工具（全等五招）", "teach": "證明題其實只有幾把工具，看到圖先問「我手上有哪一把」。最常用的是全等五招：SSS（三邊）、SAS（兩邊夾角）、ASA（兩角夾邊）、AAS（兩角和其中一邊）、RHS（直角三角形：直角＋斜邊＋一股）。另外三把是相似（AA，兩角相等）、平行線的同位角／內錯角相等、等腰三角形兩底角相等。要小心：AAA 只能得到相似、不能全等；SSA（角沒夾在中間）也不算工具——唯一的例外是直角三角形的 RHS，因為直角把那個模稜兩可的狀況鎖死了，所以才特別開放。", "recap": "全等五招 SSS、SAS、ASA、AAS、RHS；AAA 只給相似。", "confirm": {"q": "兩個三角形：AB＝DE＝8、AC＝DF＝6、∠A＝∠D＝50°。它們全等嗎？用哪一招？", "a": "全等，SAS（∠A 正好夾在 AB、AC 之間）。"}, "retest": {"q": "兩個直角三角形，斜邊都是 13、其中一股都是 5。全等嗎？用哪一招？", "a": "全等，RHS（直角＋斜邊 13＋一股 5）。"}, "jingle": "三邊、兩邊夾角、兩角一邊", "alt": "換一種記法：全等要湊「三個條件」，而且不能三個都是角。SSS 是三條邊；SAS 是兩邊夾一角、ASA 是兩角夾一邊、AAS 是兩角配旁邊那條邊；RHS 是直角三角形的特別優惠。最關鍵的一個字是「夾」—— SAS 的角一定要夾在那兩條邊中間，如果角沒夾著（SSA），同樣的條件可以畫出兩個不一樣的三角形，所以不能用。判題時我習慣先數：題目給了幾個邊、幾個角、角有沒有夾在中間。", "pre": [{"q": "「全等」和「相似」差在哪裡？", "a": "全等是形狀和大小都一樣；相似只有形狀一樣，大小可以不同。"}, {"q": "三個角都相等的兩個三角形，一定全等嗎？", "a": "不一定，只能保證相似。"}], "signal": {"see": "圖上兩個三角形，有些邊畫了一樣的小橫槓、有些角畫了一樣的弧線", "think": "先數一數：給了幾條邊、幾個角，角有沒有夾在兩邊中間", "do": "對照五招挑一招寫下來（三邊→SSS、兩邊夾角→SAS、兩角一邊→ASA/AAS、直角＋斜邊＋一股→RHS）"}, "widget": "proof_tools", "ask": "我卡在【證明常用的幾把工具（全等五招）】，可以教我嗎？"}, "quad_props": {"name": "平行四邊形、菱形、等腰梯形的性質", "teach": "這幾種四邊形是同一家人，差別只在「多加了什麼條件」。平行四邊形（兩組對邊平行）：對邊等長、對角相等、鄰角互補、兩條對角線互相平分。菱形（平行四邊形再加四邊等長）：對角線除了互相平分，還互相垂直，而且平分內角。等腰梯形（只有一組對邊平行、兩腰等長）：同一底上的兩個底角相等，兩條對角線等長。", "recap": "平四：對邊等、對角等、對角線互相平分；菱形再加垂直；等腰梯形兩對角線等長。", "confirm": {"q": "平行四邊形 ABCD 中，∠A＝70°。∠B 和 ∠C 各是幾度？為什麼？", "a": "∠B＝110°（鄰角互補，70°＋110°＝180°）、∠C＝70°（對角相等）。"}, "retest": {"q": "菱形 ABCD 的兩條對角線長 6 和 8，邊長是多少？", "a": "5。對角線互相垂直平分，半對角線是 3 和 4，畢氏定理 3²＋4²＝25 → 邊長 5。"}, "jingle": "對角線平分，菱形再垂直", "alt": "換個角度：用「對角線」一句話就能分家族。兩條對角線：互相平分 → 平行四邊形；平分＋垂直 → 菱形；平分＋等長 → 矩形；平分＋垂直＋等長 → 正方形。梯形是另外一支，只有一組對邊平行，所以對角線不會互相平分；但等腰梯形的兩條對角線會一樣長。判別題就是反過來走：題目給你哪一條對角線的性質，你就對回這張清單挑名字。", "pre": [{"q": "平行四邊形的對邊有什麼關係？", "a": "既平行又等長。"}, {"q": "「互相平分」是什麼意思？", "a": "兩條線段的交點，剛好是兩條線段各自的中點。"}], "signal": {"see": "圖上是四邊形，而且標了「對邊平行」的箭頭、或四邊都畫了一樣的小橫槓、或畫出了兩條對角線", "think": "先分家族：兩組對邊平行？四邊都一樣長？只有一組平行？", "do": "查對應的性質清單（對邊、對角、鄰角、對角線）把要用的那一條寫成式子"}, "widget": "quad_props", "ask": "我卡在【平行四邊形、菱形、等腰梯形的性質】，可以教我嗎？"}, "circumcenter": {"name": "外心：到三個頂點一樣遠", "teach": "先問一個生活問題：三個同學家在 A、B、C，要找一個地方蓋便利商店，讓三家走過去「一樣遠」，蓋在哪？先只看 A、B 兩家 —— 到 A、B 一樣遠的點，全部排在 AB 的中垂線上。同樣地，到 B、C 一樣遠的點排在 BC 的中垂線上。兩條中垂線一交，那個交點就同時滿足兩件事，於是到三家都一樣遠 —— 這個點叫外心 O。以 O 為圓心、OA 為半徑畫圓，圓會剛好穿過三個頂點，就是外接圓。", "recap": "三邊中垂線的交點＝外心，OA＝OB＝OC＝外接圓半徑。", "confirm": {"q": "銳角三角形 ABC 的外心是 O，∠A＝40°、OA＝6。(1) ∠BOC 幾度？(2) OB 多長？", "a": "(1) ∠BOC＝2∠A＝80°（同一段弧 BC，圓心角是圓周角的兩倍）。(2) OB＝6（外心到三個頂點等距）。"}, "retest": {"q": "△ABC 中 ∠C＝90°、AB＝10。外心在哪裡？外接圓半徑多少？", "a": "外心就在斜邊 AB 的中點；半徑＝10÷2＝5。"}, "jingle": "中垂線交外心，三頂點等距", "alt": "反過來想會更好懂：如果有一個圓剛好通過 A、B、C 三個點，那圓心到三個頂點的距離都等於半徑 —— 所以那個圓心就是外心。三角形的形狀不同，外心會躲在不同地方：銳角三角形的外心在裡面，直角三角形的外心剛好落在斜邊的中點（因為斜邊就是直徑），鈍角三角形的外心跑到三角形外面去。這三種位置常常單獨考一題選擇題，記「銳內、直中、鈍外」。另外要注意：∠BOC＝2∠A 這條只在 ∠A 不是鈍角時能直接用；∠A 是鈍角時，∠BOC＝360°－2∠A。", "pre": [{"q": "到 A、B 兩點距離相等的所有點，會排在哪一條線上？", "a": "線段 AB 的中垂線上。"}, {"q": "什麼是中垂線？", "a": "通過線段中點、而且垂直這條線段的直線。"}], "signal": {"see": "題目說某一點到三角形三個頂點的距離相等，或說「畫一個圓通過三個頂點」", "think": "那個點是三邊中垂線的交點，它到三個頂點一樣遠", "do": "把 OA＝OB＝OC 寫下來當方程式，或直接用它是外接圓半徑；先判斷三角形是銳角、直角還是鈍角來確定外心位置"}, "widget": "circumcenter", "ask": "我卡在【外心：到三個頂點一樣遠】，可以教我嗎？"}, "incenter": {"name": "內心：到三個邊一樣遠", "teach": "這次換一個問題：在一塊三角形的地裡蓋一座燈塔，要讓它到「三面牆」一樣遠，蓋在哪？到一個角的兩邊一樣遠的點，全部排在那個角的角平分線上。所以畫 ∠B 的角平分線（到 AB、BC 一樣遠）和 ∠C 的角平分線（到 BC、CA 一樣遠），兩條一交的那個點 I，就到三個邊都一樣遠。以 I 為圓心、那個距離為半徑畫圓，圓會剛好碰到三個邊，這叫內切圓，I 就是內心。", "recap": "三角平分線的交點＝內心，到三邊等距＝內切圓半徑；∠BIC＝90°＋∠A/2。", "confirm": {"q": "△ABC 的內心是 I，∠A＝50°。∠BIC 幾度？", "a": "115°。∠BIC＝90°＋∠A/2＝90°＋25°＝115°。"}, "retest": {"q": "△ABC 的內心是 I，∠A＝80°，而且 I 到 AB 的距離是 3。(1) ∠BIC 幾度？(2) I 到 BC、到 CA 的距離各是多少？", "a": "(1) ∠BIC＝90°＋40°＝130°。(2) 都是 3（內心到三邊等距，這個距離就是內切圓半徑）。"}, "jingle": "角平分交內心，三邊等距", "alt": "換個角度看：內心就是「內切圓的圓心」，所以它永遠在三角形裡面，不管銳角還是鈍角都一樣（這點和外心很不同）。常考的 ∠BIC＝90°＋∠A/2 其實可以自己推一次：在 △BIC 裡，∠IBC 和 ∠ICB 分別是 ∠B、∠C 的一半，兩個加起來＝(∠B＋∠C)÷2＝(180°−∠A)÷2＝90°−∠A/2；再用三角形內角和，∠BIC＝180°−(90°−∠A/2)＝90°＋∠A/2。另外把內心連到三個頂點，三角形會被切成三塊，每一塊的高都是 r，所以三角形面積＝r × 半周長。", "pre": [{"q": "角平分線上的點有什麼特別的性質？", "a": "它到這個角的兩邊距離相等。"}, {"q": "∠A＝80°，∠A 的一半是幾度？", "a": "40°。"}], "signal": {"see": "題目說某一點到三角形三個邊的距離相等，或圖上有一個圓剛好碰到三個邊", "think": "那是三條角平分線的交點，到三邊一樣遠", "do": "把三邊的距離都設成 r；要算角度就套 ∠BIC＝90°＋∠A/2；要算 r 就用 面積＝r × 半周長"}, "widget": "incenter", "ask": "我卡在【內心：到三個邊一樣遠】，可以教我嗎？"}, "centroid": {"name": "重心：中線交點，分 2:1", "teach": "拿一塊三角形紙板，用一根手指頂住某個點它剛好不會掉下來 —— 那個平衡點就是重心。找法：從每個頂點畫一條線到「對邊的中點」（這叫中線），三條中線一定交在同一個點 G。最常考的是這個交點把每條中線分成 2:1：靠頂點的那一段，是靠中點那一段的兩倍。所以中線長 9 的話，頂點到 G 是 6、G 到中點是 3。", "recap": "三條中線交於重心，靠頂點那段 : 靠中點那段＝2:1。", "confirm": {"q": "△ABC 的重心是 G，中線 AM 長 9（M 是 BC 中點）。AG 和 GM 各多長？", "a": "AG＝6、GM＝3（分成 3 份，AG 佔 2 份、GM 佔 1 份）。"}, "retest": {"q": "△ABC 的面積是 36，三條中線把它切成六個小三角形。每一個小三角形面積多少？", "a": "6（三條中線把面積六等分，36÷6＝6）。"}, "jingle": "重心分中線，二比一", "alt": "用「份數」來想比較不會弄反：把一條中線切成 3 等份，重心站在「從頂點數過來第 2 份結束的地方」，所以 AG 佔 2 份、GM 佔 1 份、整條 AM 是 3 份。題目給 GM＝4，整條 AM 就是 4×3＝12、AG 是 4×2＝8；題目給 AM，就先除以 3 再乘 2 得到 AG。另外一個常考的：三條中線會把三角形切成六個小三角形，六塊面積完全一樣，所以面積題只要拿總面積除以 6。", "pre": [{"q": "什麼是三角形的中線？", "a": "從一個頂點連到對邊中點的線段。"}, {"q": "一條線段被分成 2:1，總共是幾份？", "a": "3 份。"}], "signal": {"see": "圖上從頂點畫線到對邊的中點（邊上有中點記號），三條線交在一點", "think": "那個交點是重心，它把每條中線分成 2:1", "do": "把中線當成 3 份：靠頂點 2 份、靠中點 1 份，代進題目給的數字；問面積就除以 6"}, "widget": "centroid", "ask": "我卡在【重心：中線交點，分 2:1】，可以教我嗎？"}, "incircle_r": {"name": "直角三角形的內切圓半徑", "teach": "直角三角形的內切圓半徑有一條很好用的捷徑：兩股加起來、減掉斜邊，再除以 2，也就是 r＝(a＋b−c)/2。例如 3-4-5 的直角三角形，r＝(3＋4−5)/2＝1。為什麼可以這樣？因為內切圓碰到兩股的兩個切點，和直角頂點圍出一個邊長剛好是 r 的正方形，把三邊拆開整理就會得到這個式子。另外還有一條所有三角形都通用的：面積＝r × 半周長，3-4-5 的面積是 6、半周長也是 6，剛好 6＝1×6，可以用來檢查答案。", "recap": "直角△：r＝(兩股和 − 斜邊)÷2；通用：面積＝r × 半周長。", "confirm": {"q": "三邊 3、4、5 的直角三角形，內切圓半徑 r 是多少？", "a": "r＝(3＋4−5)/2＝2/2＝1。"}, "retest": {"q": "三邊 5、12、13 的直角三角形，內切圓半徑是多少？再用「面積＝r × 半周長」檢查一次。", "a": "r＝(5＋12−13)/2＝4/2＝2。檢查：面積＝5×12÷2＝30，半周長＝(5＋12＋13)/2＝15，r×半周長＝2×15＝30 ✓。"}, "jingle": "兩股相加減斜邊，再除以二", "alt": "自己推一次就不會背錯順序。用「圓外一點畫出的兩條切線一樣長」：設從 A 出發的切線長是 x、從 B 出發是 y；直角頂點 C 出發的兩段都等於 r（因為那個角落是邊長 r 的正方形）。於是兩股 b＝x＋r、a＝y＋r，斜邊 c＝x＋y。把 a＋b−c 算開：(y＋r)＋(x＋r)−(x＋y)＝2r，所以 r＝(a＋b−c)/2。重點是「被減掉的一定是斜邊」，順序寫反答案會變成負數，一看就知道錯了。", "pre": [{"q": "直角三角形 6、8、10，兩股加起來再減斜邊是多少？", "a": "6＋8−10＝4。"}, {"q": "三邊 3、4、5 的三角形，半周長是多少？", "a": "(3＋4＋5)÷2＝6。"}], "signal": {"see": "直角三角形裡畫了一個剛好碰到三個邊的圓，題目又給了三邊長", "think": "有直角就直接用 r＝(兩股和 − 斜邊)÷2", "do": "代公式算出 r，再用「面積＝r × 半周長」對一次答案"}, "widget": "incircle_r", "ask": "我卡在【直角三角形的內切圓半徑】，可以教我嗎？"}, "circum_r_right": {"name": "直角三角形的外接圓半徑＝斜邊的一半", "teach": "直角三角形的外接圓半徑最好記：就是斜邊的一半。理由來自圓的性質 —— 半圓的圓周角是 90°。反過來說，一個三角形如果有一個 90° 的角，那這個角對面的邊（斜邊）一定就是直徑，所以外接圓的圓心剛好落在斜邊中點，半徑＝斜邊 ÷ 2。例如 3-4-5 的直角三角形，外接圓半徑＝5÷2＝2.5。", "recap": "直角△的外心在斜邊中點，外接圓半徑＝斜邊 ÷ 2。", "confirm": {"q": "兩股 3、4，斜邊 5 的直角三角形，外接圓半徑是多少？", "a": "2.5（斜邊 5 就是直徑，半徑＝5÷2＝2.5）。"}, "retest": {"q": "△ABC 中 ∠C＝90°，外接圓半徑是 6.5。(1) AB 多長？(2) 若 BC＝5，AC 多長？", "a": "(1) AB＝6.5×2＝13（斜邊是直徑）。(2) AC＝12（13²−5²＝169−25＝144，√144＝12）。"}, "jingle": "直角對斜邊，斜邊是直徑", "alt": "換一個畫面：拿一條直徑 AB，在圓周上隨便挑一點 C 連過去，∠C 永遠是 90°，不管 C 跑到圓周的哪裡。所以「直角三角形的外接圓」其實就是「以斜邊為直徑畫的圓」。這也代表直角頂點 C 到斜邊中點 O 的距離 OC 一定等於半徑，也就是斜邊的一半 —— 這個結論（直角三角形斜邊上的中線＝斜邊的一半）本身也很常單獨考，看到就直接用。", "pre": [{"q": "半圓的圓周角是幾度？", "a": "90°。"}, {"q": "直徑是半徑的幾倍？", "a": "2 倍。"}], "signal": {"see": "題目說直角三角形的外接圓，或圖上三角形的斜邊剛好穿過圓心", "think": "斜邊就是直徑，圓心在斜邊中點", "do": "半徑＝斜邊 ÷ 2；反過來給半徑就乘 2 得斜邊，再用畢氏定理補另一邊"}, "widget": "circum_r_right", "ask": "我卡在【直角三角形的外接圓半徑＝斜邊的一半】，可以教我嗎？"}, "fac_def": {"name": "因式與倍式", "teach": "把一個式子拆成兩個東西「相乘」，那兩個東西就是它的因式，它就是那兩個的倍式。像 12＝3×4，3 和 4 是 12 的因數；式子也一樣：5x²−7x−6＝(5x＋3)(x−2)，所以 5x＋3 和 x−2 是因式，5x²−7x−6 是倍式。記法：拆出來的小零件叫因式，整台組好的叫倍式。", "recap": "A＝B×C → B、C 是因式，A 是倍式。", "confirm": {"q": "(x＋3)(x−5)＝x²−2x−15。這裡誰是誰的因式？", "a": "x＋3 和 x−5 是 x²−2x−15 的因式；x²−2x−15 是它們兩個的倍式。"}, "retest": {"q": "下列哪一個是 2x＋9 的倍式？(A) 2x²＋9　(B) 2x²＋9x　(C) 2x＋18", "a": "(B)。2x²＋9x＝x(2x＋9)，拆得出 2x＋9，所以它是 2x＋9 的倍式。"}, "jingle": "拆出來是因式，整個是倍式", "alt": "換個角度想「誰住在誰裡面」。5x＋3 住在 5x²−7x−6 裡面（因為它是被乘進去的零件之一），所以 5x＋3 是因式。反過來，5x²−7x−6 是由 5x＋3 「長大」來的，所以它是倍式。判斷題目給的那個式子是不是因式，最快的方法就是把括號乘開看看，或是用長除法除除看有沒有餘數；除得盡就是因式。", "pre": [{"q": "6＝2×3，2 是 6 的什麼？6 是 2 的什麼？", "a": "2 是 6 的因數；6 是 2 的倍數。"}, {"q": "(x＋1)(x＋2) 展開是多少？", "a": "x²＋3x＋2。"}], "signal": {"see": "題目寫「…是…的因式」「…是…的倍式」，或給你一個等號兩邊，一邊是乘起來的括號", "think": "誰被拆開誰就是倍式，拆出來的括號是因式", "do": "先把括號乘開對一次，確定等號成立，再判斷哪一邊是因式、哪一邊是倍式"}, "widget": "fac_def", "ask": "我卡在【因式與倍式】，可以教我嗎？"}, "fac_common": {"name": "提公因式（剩下的 1 不能漏）", "teach": "提公因式就是把每一項都有的東西搬到括號外面。四項的時候先兩兩分組，各自提完之後會冒出一樣的括號，再把那個括號提一次。最容易掉分的地方：如果某一項「整項就等於公因式」，它被提走之後留下的是 1，不是 0。像 5x(x−2)＋(x−2)，第二項就是 (x−2) 本人，提走後它留下 1，答案是 (x−2)(5x＋1)。就像每個袋子都拿走一顆糖，原本只有一顆糖的袋子不是消失，是變成空袋子還在那裡。", "recap": "整項就是公因式時，提走之後留下的是 1。", "confirm": {"q": "把 5x(x−2)＋(x−2) 提出公因式 (x−2)，另一個括號裡是什麼？", "a": "(5x＋1)。整個寫出來是 (x−2)(5x＋1)，後面那一項留下的是 1，不是 0。"}, "retest": {"q": "因式分解 4x²−4x−x＋1。", "a": "(x−1)(4x−1)。前兩項提 4x 得 4x(x−1)，後兩項提 −1 得 −1(x−1)，所以括號外是 4x−1。"}, "jingle": "提完剩一，不是剩零", "alt": "用乘法反過來想就不會漏。(6x＋1)(x−1) 乘開是 6x²−6x＋x−1，中間那個 x 是 1 乘進去的。所以反過來因式分解時，那個 1 一定要留在括號裡。檢查方法很簡單：提完之後把答案乘回去，如果少了一項或多了一項，通常就是某個「1」被吃掉了。", "pre": [{"q": "6x²＋x 提出公因式 x 之後是什麼？", "a": "x(6x＋1)。"}, {"q": "(6x＋1) 裡面有幾個 (6x＋1)？", "a": "1 個，所以提出去之後留下 1。"}], "signal": {"see": "式子裡有一項「長得跟括號一模一樣」，例如 x(6x＋1)−(6x＋1)", "think": "那一項被提走之後會留下 1", "do": "把它寫成 −1·(6x＋1) 再提，答案是 (6x＋1)(x−1)，最後乘回去對一次"}, "widget": "fac_common", "ask": "我卡在【提公因式（剩下的 1 不能漏）】，可以教我嗎？"}, "fac_formula": {"name": "用乘法公式因式分解", "teach": "有兩種長相看到就可以直接拆，不用十字交乘。第一種是平方差 a²−b²＝(a＋b)(a−b)，像 x²−49＝(x＋7)(x−7)。第二種是完全平方 a²±2ab＋b²＝(a±b)²，像 4x²−12x＋9＝(2x−3)²。只有兩項的時候要先看有沒有公因數，提掉之後再開根號：8x²−18＝2(4x²−9)＝2(2x＋3)(2x−3)。判斷方法：兩項且是「平方減平方」→ 平方差；三項而且頭尾都是平方數、中間剛好是頭尾平方根乘積的兩倍 → 完全平方。", "recap": "兩項先提公因數再拆成和乘差；三項頭尾平方、中間兩倍就是完全平方。", "confirm": {"q": "因式分解 x²−49。", "a": "(x＋7)(x−7)。"}, "retest": {"q": "因式分解 4x²−12x＋9。", "a": "(2x−3)²。因為 4x²＝(2x)²、9＝3²，中間 2×2x×3＝12x 剛好對上。"}, "jingle": "平方減平方，和乘差", "alt": "平方差可以用面積看：一個邊長 x 的大正方形，挖掉角落邊長 b 的小正方形，剩下的面積就是 x²−b²。把剩下的 L 形剪一刀重拼，會變成一個長 (x＋b)、寬 (x−b) 的長方形，面積當然還是一樣，所以 x²−b²＝(x＋b)(x−b)。完全平方則相反：(x−b)² 拆開是 x²−2bx＋b²，所以看到中間項剛好是「兩個平方根相乘再乘 2」，就可以直接收成一個括號的平方。", "pre": [{"q": "(x＋5)(x−5) 展開是多少？", "a": "x²−25。"}, {"q": "9 和 4x² 分別是誰的平方？", "a": "9＝3²，4x²＝(2x)²。"}], "signal": {"see": "只有兩項而且中間是減號（像 x²−49、8x²−18），或三項頭尾都是平方數", "think": "先想公式，不要急著十字交乘", "do": "兩項 → 先提公因數，再開根號寫成 (a＋b)(a−b)（8x²−18＝2(4x²−9)＝2(2x＋3)(2x−3)）；三項 → 檢查中間是不是 2ab，是就寫成 (a±b)²"}, "widget": "fac_formula", "ask": "我卡在【用乘法公式因式分解】，可以教我嗎？"}, "fac_cross": {"name": "十字交乘法", "teach": "二次項係數不是 1 的時候用這招。四個動作：①把二次項拆成兩個（2x²＝x×2x）寫在左邊上下；②把常數拆成兩個（−5＝1×(−5)）寫在右邊上下；③交叉相乘再相加；④看加起來是不是等於中間那一項，是就對了，不是就換一組再試。以 2x²−3x−5 為例：左邊 x、2x，右邊 ＋1、−5，交叉得 x×(−5)＝−5x 與 2x×1＝2x，加起來 −3x ✓，所以答案是 (x＋1)(2x−5)。", "recap": "左拆二次項、右拆常數、交叉相乘相加要等於中間項。", "confirm": {"q": "用十字交乘分解 2x²−3x−5，兩個括號是什麼？", "a": "(x＋1)(2x−5)。交叉相乘 x×(−5)＝−5x、2x×(＋1)＝2x，相加得 −3x，和中間項一樣。"}, "retest": {"q": "用十字交乘分解 3x²＋5x−2。", "a": "(3x−1)(x＋2)。交叉相乘 3x×2＝6x、(−1)×x＝−x，相加 5x ✓。"}, "jingle": "上下拆好，交叉相加對中間", "alt": "十字交乘其實是「乘開來」的逆操作。(x＋1)(2x−5) 乘開時，中間項是由兩組交叉相乘（x×(−5) 和 2x×1）加起來的，所以反過來找因式時，才要去湊那兩個交叉乘積的和。試的時候有順序：先固定二次項的拆法（2x² 通常只有 x×2x），再把常數的所有拆法一組一組試過去，每試一組就加一次，對不上就換正負號或換一組，不要跳著亂猜。", "pre": [{"q": "2x² 可以拆成哪兩個相乘？", "a": "x×2x。"}, {"q": "(x＋1)(2x−5) 乘開後，中間那一項是多少？", "a": "−5x＋2x＝−3x。"}], "signal": {"see": "三項，而且 x² 前面的數字不是 1（像 2x²−3x−5、3x²＋5x−2），又不是完全平方", "think": "十字交乘：左邊拆二次項、右邊拆常數", "do": "畫十字寫上下四個數，交叉相乘相加對中間項；對上了就把左右各一行讀成一個括號"}, "widget": "fac_cross", "ask": "我卡在【十字交乘法】，可以教我嗎？"}, "fac_check": {"name": "分解完要乘回去驗算", "teach": "因式分解做完一定要把括號乘回去對一次，這是最便宜的保險。做法：兩個括號逐項相乘（前×前、前×後、後×前、後×後），再合併同類項，跟原式比對。最重要的是：驗算發現不一樣，要「回去把答案改掉」，不是在旁邊寫個註記就算了——考卷上只看括號裡填的那個字母。", "recap": "乘回去對一次；不一樣就立刻回去改答案。", "confirm": {"q": "把 (2x−5)(x＋1) 乘回去，結果是什麼？", "a": "2x²＋2x−5x−5＝2x²−3x−5。"}, "retest": {"q": "有人把 x²−5x＋6 分解成 (x−2)(x−4)。乘回去檢查，對嗎？對的答案是什麼？", "a": "不對。(x−2)(x−4)＝x²−6x＋8，中間項和常數都不對。正確是 (x−2)(x−3)。"}, "jingle": "乘回去對一次，錯了就改", "alt": "驗算不用整個乘完也可以先篩掉錯的：先看常數項（兩個括號的後面相乘）對不對，不對就直接淘汰；再看中間項（交叉相乘相加）。這樣選擇題四個選項通常兩步就能刷掉三個。做完驗算養成一個固定動作：把驗算出來的結果圈起來，立刻回頭把括號裡的答案填好或改好，再往下一題。", "pre": [{"q": "(x−2)(x−3) 的常數項是多少？", "a": "(−2)×(−3)＝6。"}, {"q": "驗算發現和原式不一樣，下一步要做什麼？", "a": "回去把答案改掉。"}], "signal": {"see": "你剛寫完一個因式分解的答案，或選擇題四個括號要挑一個", "think": "乘回去比對，最快也最準", "do": "先比常數項、再比中間項；對不上就換選項，並且立刻把括號裡的答案改成對的那個"}, "widget": "fac_check", "ask": "我卡在【分解完要乘回去驗算】，可以教我嗎？"}, "quad_root_def": {"name": "一元二次方程式的根", "teach": "「根」就是「代進去會讓式子等於 0 的數」，沒有別的意思。x²−6x−16＝0 問的是：x 放什麼進去，左邊算出來剛好是 0？代 8 進去：64−48−16＝0，成立，所以 8 是一個根；代 2 進去：4−12−16＝−24，不是 0，所以 2 不是根。題目問「哪一個是它的解」時，最保險的做法就是一個一個代進去算。", "recap": "代進去等於 0 的那個數，就是根。", "confirm": {"q": "x＝8 是不是 x²−6x−16＝0 的根？算給我看。", "a": "是。64−48−16＝0，等號成立。"}, "retest": {"q": "x＝2 是不是 x²−6x−16＝0 的根？", "a": "不是。4−12−16＝−24，不等於 0。"}, "jingle": "代進去等於零，就是根", "alt": "把 x²−6x−16 想成一台機器：你丟一個數字進去，它吐一個數字出來。丟 0 出 −16、丟 3 出 −25、丟 5 出 −21、丟 8 出 0。只有吐出 0 的那些輸入才叫「根」。一元二次方程式最多有兩個根，這題是 8 和 −2。所以選擇題問「下列哪個是解」，直接代四個選項比解方程還快。", "pre": [{"q": "x＝3 代進 x²−1 是多少？", "a": "9−1＝8。"}, {"q": "「方程式的解」是什麼意思？", "a": "代進去會讓等號成立的數。"}], "signal": {"see": "題目說「x＝? 是…的解（根）」「下列哪一個是方程式的解」", "think": "解的定義就是代進去等於 0", "do": "把那個數代進左邊算一次，等於 0 就是，不等於 0 就不是"}, "widget": "quad_root_def", "ask": "我卡在【一元二次方程式的根】，可以教我嗎？"}, "quad_factor": {"name": "用因式分解解方程式", "teach": "兩個數相乘等於 0，一定至少有一個是 0——這是解方程最好用的一句話。所以先把式子整理成「＝0」，左邊因式分解成兩個括號相乘，再讓每個括號各等於 0，就解出兩個答案。例：x²−6x−16＝0 → (x−8)(x＋2)＝0 → x−8＝0 或 x＋2＝0 → x＝8 或 x＝−2。注意右邊一定要先變成 0 才能這樣拆。", "recap": "先整理成＝0，分解，再讓每個括號＝0。", "confirm": {"q": "(x−8)(x＋2)＝0，x 可以是哪些數？", "a": "x＝8 或 x＝−2。"}, "retest": {"q": "解 x²＋2x−15＝0。", "a": "(x＋5)(x−3)＝0 → x＝−5 或 x＝3。"}, "jingle": "積等於零，各自等零", "alt": "為什麼右邊一定要是 0？因為只有 0 有這個特權：兩數相乘等於 0 就一定有一個是 0。如果寫成 (x−8)(x＋2)＝6，你不能說某個括號等於 6，因為 2×3 也是 6、1×6 也是 6，可能性太多。所以看到 x²−6x＝16 這種，第一件事是把 16 移過去變成 x²−6x−16＝0，再分解。", "pre": [{"q": "兩個數相乘等於 0，可以知道什麼？", "a": "至少有一個是 0。"}, {"q": "x²＋2x−15 因式分解是什麼？", "a": "(x＋5)(x−3)。"}], "signal": {"see": "式子是二次的、而且右邊是 0（或可以移到只剩 0）", "think": "分解成兩個括號，積為 0 → 各自為 0", "do": "先移項成＝0 → 因式分解 → 每個括號各等於 0 解出兩個答案"}, "widget": "quad_factor", "ask": "我卡在【用因式分解解方程式】，可以教我嗎？"}, "quad_complete": {"name": "配方法（每一項都要動到）", "teach": "配方法是把式子湊成 (x−?)²＝? 再開根號。二次項係數不是 1 的時候，要先讓它變成 1——整條除以 a，這時候常數項也要一起除，不能只除前面兩項。例：3x²−12x＋1＝0，兩邊同除以 3 得 x²−4x＋1/3＝0，那個 1 變成 1/3；移項成 x²−4x＝−1/3，兩邊加 4，得 (x−2)²＝4−1/3＝11/3；最後開根號 x−2＝±√(11/3) → x＝2±√33/3。整條除就是整條除，一項都不能漏。", "recap": "係數不是 1 先整條除以 a，常數項也要除。", "confirm": {"q": "用配方法解 3x²−12x＋1＝0：兩邊先除以 3 之後長什麼樣？配到最後 x 是多少？", "a": "x²−4x＋1/3＝0（常數項 1 也要除，不能留 1）→ x²−4x＝−1/3 → (x−2)²＝11/3 → x＝2±√33/3。"}, "retest": {"q": "用配方法把 2x²−8x＋3＝0 整理成 (x−?)²＝? 的樣子。", "a": "先除以 2：x²−4x＋3/2＝0 → x²−4x＝−3/2 → 兩邊加 4 → (x−2)²＝4−3/2＝5/2 → x−2＝±√(5/2) → x＝2±√10/2。"}, "jingle": "整條除，常數也要除", "alt": "另一條路是「不除、改乘」：3x²−12x＋1＝0 先移項成 3x²−12x＝−1，兩邊同乘 3 得 9x²−36x＝−3，因為 9x²−36x＋36＝(3x−6)²，所以兩邊加 36 得 (3x−6)²＝33。這條路完全不用分數。不管走哪條，判斷對錯的方法只有一個：檢查等號兩邊「每一項」是不是都被乘或被除到了。只動一半的那個人就是錯的那個。", "pre": [{"q": "x²−4x 要加多少才會變成完全平方？", "a": "加 4，變成 (x−2)²。"}, {"q": "3x²−12x＋1 每一項都除以 3 是多少？", "a": "x²−4x＋1/3。"}], "signal": {"see": "題目寫「配方法」，而且二次項係數不是 1（像 3x²、2x²）", "think": "要嘛整條除以 a（常數也要除），要嘛整條乘起來湊完全平方", "do": "先把每一項都除（或乘）一次，再逐項檢查有沒有漏掉常數項，最後才配方"}, "widget": "quad_complete", "ask": "我卡在【配方法（每一項都要動到）】，可以教我嗎？"}, "quad_formula": {"name": "公式解與判別式", "teach": "分解不出來的時候用公式解：x＝(−b±√(b²−4ac))／(2a)。固定順序是先認 a、b、c，再單獨算 b²−4ac（叫判別式），最後才代進公式。先算判別式有兩個好處：數字先算出來就不會在大公式裡算錯，而且它會先告訴你有幾個根——大於 0 有兩個、等於 0 只有一個（重根）、小於 0 沒有實數解。", "recap": "先認 a、b、c → 先算 b²−4ac → 再代公式。", "confirm": {"q": "x²−6x＋5＝0，先算 b²−4ac 是多少？", "a": "b²−4ac＝(−6)²−4×1×5＝36−20＝16。"}, "retest": {"q": "用公式解解 2x²＋3x−2＝0。", "a": "b²−4ac＝9＋16＝25，√25＝5，x＝(−3±5)/4 → x＝1/2 或 x＝−2。"}, "jingle": "先算判別式，再套公式", "alt": "判別式可以想成「根號裡面夠不夠」。b²−4ac 是要被開根號的那一塊：夠大（正的）就開得出來、±會分出兩個答案；剛好是 0 就只剩 −b／(2a) 一個答案；變成負的就開不出來，實數範圍內無解。所以很多題目根本不用解完，問「有幾個解」「有沒有解」時算判別式就結束了。代 b 的時候記得連負號一起代，(−6)² 是 36 不是 −36。", "pre": [{"q": "x²−6x＋5 裡的 a、b、c 各是多少？", "a": "a＝1、b＝−6、c＝5。"}, {"q": "√16 是多少？", "a": "4。"}], "signal": {"see": "式子分解不出來、或題目直接問「有幾個實數解」「判別式」", "think": "公式解 x＝(−b±√(b²−4ac))／(2a)，先算根號裡面那一塊", "do": "寫下 a、b、c → 算 b²−4ac → 正數兩根、0 一根、負數無解 → 再代公式算答案"}, "widget": "quad_formula", "ask": "我卡在【公式解與判別式】，可以教我嗎？"}, "quad_common_root": {"name": "兩個方程式的共同解", "teach": "「共同解」就是同一個數字代進兩個式子都會等於 0。所以做法很直接：挑比較好解的那個先解出根，再把根一個一個代到另一個式子（或四個選項）裡試。例：x²−2x−3＝0 的根是 3 和 −1；把 3 代進 2x²−3x−9 得 18−9−9＝0 ✓，代 −1 得 2＋3−9＝−4 ✗，所以它們的共同解只有 3。", "recap": "先解好解的那個，再把根代進另一個試。", "confirm": {"q": "x²−2x−3＝0 的兩個根是多少？", "a": "(x−3)(x＋1)＝0 → x＝3 或 x＝−1。"}, "retest": {"q": "x²−2x−3＝0 和 2x²−3x−9＝0 的共同解是哪一個？怎麼確認？", "a": "x＝3。把 3 代進 2x²−3x−9 得 18−9−9＝0；代 −1 得 2＋3−9＝−4，不是 0，所以只有 3 是共同解。"}, "jingle": "先解一邊，再代另一邊", "alt": "另一個角度：共同解就是「兩邊的因式裡有同一個括號」。x²−2x−3＝(x−3)(x＋1)，2x²−3x−9＝(x−3)(2x＋3)，兩邊都有 (x−3)，所以共同解是 x＝3。如果題目問「恰有一個共同解」，就要確認只有一個括號一樣，兩個都一樣的話那就是同一個方程式的倍數了。選擇題時代數字比因式分解快，但因式分解看得比較清楚。", "pre": [{"q": "把 x＝3 代進 2x²−3x−9 是多少？", "a": "18−9−9＝0。"}, {"q": "「共同解」是什麼意思？", "a": "同一個數代進兩個方程式，兩個都會成立。"}], "signal": {"see": "題目說「與…有一個共同解」「兩個方程式同時成立」", "think": "先把好解的那個解出來，再拿根去試另一個", "do": "解出根 → 一個一個代進選項 → 算出來是 0 的那個就是答案"}, "widget": "quad_common_root", "ask": "我卡在【兩個方程式的共同解】，可以教我嗎？"}, "quad_prime": {"name": "式子的值是質數", "teach": "質數只能拆成 1 乘它自己。題目一定會先說「x 是正整數」——這句很重要，因為只有整數相乘才逃不掉這個限制。整數相乘要得到質數，一定有一個括號是 1 或 −1。做法：先因式分解，兩個括號輪流設 ＝1、＝−1，解出 x，不合條件的丟掉，再代回去把乘積算出來，乘積是正的質數才算數。例：2x²−7x＋3＝(x−3)(2x−1)，x−3＝1 → x＝4 → 2x−1＝7 → 1×7＝7 ✓。", "recap": "先分解，讓一個括號＝1，解 x 再代回去算值。", "confirm": {"q": "2x²−7x＋3 因式分解是什麼？", "a": "(x−3)(2x−1)。"}, "retest": {"q": "x 是正整數且 (x−3)(2x−1) 的值是質數，這個質數是多少？", "a": "7。x−3＝1 → x＝4 → 2x−1＝7 → 1×7＝7 是質數 ✓。其他三種：x−3＝−1 → x＝2 → 2x−1＝3 → (−1)×3＝−3，是負的不合；2x−1＝1 → x＝1 → x−3＝−2 → 乘積 −2，不合；2x−1＝−1 → x＝0，不是正整數，不合。所以只有 x＝4，質數是 7。"}, "jingle": "質數先分解，括號設±1", "alt": "兩個整數相乘等於質數 p，只有四種組合：1×p、p×1、(−1)×(−p)、(−p)×(−1)。所以一定有一個括號是 1 或 −1；兩個括號都 ≥2 或都 ≤−2 的話，乘積至少有兩個真因數，不可能是質數。所以四種都要試一次，解出來的 x 要符合題目條件（正整數），乘積還要是正的。最後別忘了：題目問的是「這個質數是多少」，不是「x 是多少」，要把 x 代回去算出值。", "pre": [{"q": "質數只能拆成哪兩個數相乘？", "a": "1 和它自己。"}, {"q": "x−3＝1 時 x 是多少？", "a": "x＝4。"}], "signal": {"see": "題目出現「…的值是質數」「為質數」，而且那個式子是二次式", "think": "先因式分解，再讓其中一個括號等於 1", "do": "兩個括號各試 ＝1 和 ＝−1（共四種），解出來的 x 要合題目條件，再代回去把乘積算出來"}, "widget": "quad_prime", "ask": "我卡在【式子的值是質數】，可以教我嗎？"}, "quad_word": {"name": "應用問題列式", "teach": "應用題不要急著算，先把題目的句子一句一句翻成式子。三個固定問題：設什麼是 x？賣掉幾個？一個多少錢？例：4800 元買了 x 瓶，留 20 瓶不賣 → 賣出 (x−20) 瓶；每瓶賣 (x＋10) 元 → 收入 ＝ (x−20)(x＋10)；獲利＝收入−成本 → (x−20)(x＋10)−4800＝600。列完式再整理成＝0 去解，答案是 x＝80。", "recap": "設 x → 賣幾個 → 一個多少 → 收入減成本＝獲利。", "confirm": {"q": "4800 元買了 x 瓶飲料，留下 20 瓶不賣，賣出幾瓶？", "a": "(x−20) 瓶。"}, "retest": {"q": "承上題：賣出的每瓶賣 (x＋10) 元，成本 4800 元，共獲利 600 元。請列式並解出 x。", "a": "(x−20)(x＋10)−4800＝600 → x²−10x−200−4800＝600 → x²−10x−5600＝0 → (x−80)(x＋70)＝0 → x＝80（瓶數是正的，−70 不合）。"}, "jingle": "設 x、乘單價、減成本", "alt": "把它想成一張收據：上面一行是「買進」，下面一行是「賣出」，最後一行是「賺多少」。買進那行就是成本 4800；賣出那行是「幾瓶 × 每瓶多少」，也就是 (x−20)(x＋10)；賺多少就是下面減上面。列式的時候每寫一個括號，就回頭指一下題目那句話，確認括號裡的東西真的是題目說的（例如「留 20 瓶」是減不是加）。列完式先代一個好算的數字進去感覺一下合不合理，再開始解。", "pre": [{"q": "每瓶 30 元賣 40 瓶，收入多少？", "a": "30×40＝1200 元。"}, {"q": "獲利＝收入減什麼？", "a": "減成本。"}], "signal": {"see": "題目在講買賣、分組、年齡這種文字情境，最後問「列式」或「求 x」", "think": "設 x → 數量怎麼變 → 單價怎麼變 → 兩個相乘", "do": "一句一句翻成式子（留 20 瓶就寫 x−20），列出方程式，整理成＝0 再解，最後檢查答案合不合理"}, "widget": "quad_word", "ask": "我卡在【應用問題列式】，可以教我嗎？"}, "quad_sqrt": {"name": "平方根解法（開平方）", "teach": "式子如果已經長成「某個東西的平方 ＝ 一個數」，就不用配方也不用公式，直接開平方。x²＝49 → x＝±7，正負兩個都要。(x−2)²＝3 也一樣，只是平方的是 (x−2) 這一整包：x−2＝±√3 → x＝2±√3。兩件事要記住：答案永遠是一對（± 不能漏）；右邊是負數（像 x²＝−4）就沒有實數解，因為平方不可能是負的。", "recap": "平方等於 k → x＝±√k；k 是負的就沒有實數解。", "confirm": {"q": "解 x²＝49。", "a": "x＝7 或 x＝−7（±7 兩個都要）。"}, "retest": {"q": "解 (x−3)²＝5。", "a": "x−3＝±√5 → x＝3＋√5 或 x＝3−√5。"}, "jingle": "平方開根號，正負都要", "alt": "想成「誰的平方是 9」——3 和 −3 都是，所以答案永遠是一對。遇到 (x−2)²＝3，先把 (x−2) 當成一整包，讓這一包等於 ±√3，再把 −2 移過去變成 x＝2±√3。這一招和配方法是同一條路的前後段：配方法負責把式子湊成這個樣子，開平方是最後收尾那一步。右邊如果是負數就可以直接停筆寫「無實數解」，不用再算下去。", "pre": [{"q": "√25 是多少？", "a": "5。"}, {"q": "x²＝9 的 x 有幾個？", "a": "兩個：3 和 −3。"}], "signal": {"see": "式子已經是「(…)² ＝ 一個數」或「x² ＝ 一個數」", "think": "直接開平方，別忘了 ±", "do": "兩邊開根號寫成 ±√k，再把括號裡的移項；k 是負的就直接寫沒有實數解"}, "widget": "quad_sqrt", "ask": "我卡在【平方根解法（開平方）】，可以教我嗎？"}, "poly_area": {"name": "用式子表示面積和周長", "teach": "長方形面積＝長×寬，周長＝(長＋寬)×2，邊長換成含 x 的式子也一樣用。邊長是式子就直接乘開：長 x＋6、寬 x−2 → 面積 (x＋6)(x−2)＝x²＋4x−12。反過來，面積是式子時就因式分解拆回邊長：x²＋6x＝x(x＋6)，一邊是 x、另一邊是 x＋6。好幾塊拼在一起的圖形，先把每一段長度都用同一個 x 寫出來，再一塊一塊算面積相加（或用大的減掉小的）。", "recap": "邊長是式子就乘開；面積是式子就分解拆回邊長。", "confirm": {"q": "一個長方形的長是 x＋6、寬是 x−2，面積是多少？", "a": "(x＋6)(x−2)＝x²＋4x−12。"}, "retest": {"q": "一個長方形的面積是 x²＋6x，寬是 x，長是多少？周長是多少？", "a": "提出公因式 x：x²＋6x＝x(x＋6)，所以長是 x＋6；周長＝[(x＋6)＋x]×2＝4x＋12。"}, "jingle": "邊長乘開，面積拆回", "alt": "把長方形切開來看就懂了：長 x＋6 可以切成 x 和 6 兩段，面積就變成 x·x 加上 6·x，也就是 x²＋6x——所以「提公因式」和「把面積拆成兩塊」根本是同一件事。拼起來的圖形（幾塊磁磚、六邊形拆成矩形加三角形）做法一樣：一塊一塊算再相加，或先算大的再減掉缺角。唯一的規矩是所有邊長都要用同一個 x 寫，算完可以隨便代一個數字（例如 x＝4）進去檢查兩種算法的答案一不一樣。", "pre": [{"q": "長 8、寬 5 的長方形，面積和周長各是多少？", "a": "面積 8×5＝40；周長 (8＋5)×2＝26。"}, {"q": "x(x＋6) 乘開是多少？", "a": "x²＋6x。"}], "signal": {"see": "題目出現「面積」「周長」「邊長」「拼成」「剩下」，而且邊長或面積裡有 x", "think": "先把每一段長度都用 x 寫出來，再乘或加", "do": "邊長知道 → 乘開算面積；面積知道 → 提公因式或十字交乘拆回兩個邊長；拼起來的圖 → 一塊一塊算面積再相加"}, "widget": "poly_area", "ask": "我卡在【用式子表示面積和周長】，可以教我嗎？"}};

// ---------- 訊號：看到什麼 → 想到什麼 → 做什麼 ----------
function sigCard(c) {
  const g = c.signal; if (!g) return '';
  return `<div class="sig"><div class="sg1">👀 看到　${esc(g.see)}</div>
    <div class="sg2">💡 想到　${esc(g.think)}</div>
    <div class="sg3">✏️ 就做　${esc(g.do)}</div></div>`;
}
function signalTable(keys = null) {
  const rows = (keys || Object.keys(CONCEPTS)).filter(k => CONCEPTS[k] && CONCEPTS[k].signal).map((k, i) => {
    const g = CONCEPTS[k].signal;
    return `<tr data-row="${i}"><td class="see">${esc(g.see)}</td>
      <td class="th"><span class="hid">${esc(g.think)}</span></td>
      <td class="dd"><span class="hid">${esc(g.do)}</span></td></tr>`;
  }).join('');
  const types = (keys ? [] : (GUIDED_C['題型訊號'] || [])).map(g =>
    `<tr class="ty"><td class="see">${esc(g.see)}</td><td class="th"><span class="hid">${esc(g.think)}</span></td><td class="dd"><span class="hid">${esc(g.do)}</span></td></tr>`).join('');
  return `<details class="sigbox"><summary>📌 訊號表：看到什麼 → 想到什麼 → 做什麼</summary>
    <div class="sigtip">右邊兩欄是蓋住的，先自己想，點一下才翻開。<button class="gbtn" data-act="sigall">全部翻開／蓋回去</button></div>
    <table class="sigtb"><thead><tr><th>👀 看到</th><th>💡 想到</th><th>✏️ 就做</th></tr></thead>
    <tbody>${rows}${types ? `<tr class="sep"><td colspan="3">↓ 整題型的訊號（比單一觀念高一層）</td></tr>${types}` : ''}</tbody></table></details>`;
}


// ---------- 觀念總表：第五冊每個觀念都能單獨學（問→看答案→✓/✗→重講三層→念口訣） ----------
const LS_KEY = 'xm_mastered_v1';           // 舊：只記有沒有過
const LS2 = 'xm_mastery_v2';                 // 新：{cid:{n, last, next, st}}  st: once / stable / failed
const DAY = 86400000;
const today = () => new Date(new Date().toDateString()).getTime();
function loadMastery() {
  let m = {}; try { m = JSON.parse(localStorage.getItem(LS2) || '{}') || {}; } catch (e) { m = {}; }
  try { JSON.parse(localStorage.getItem(LS_KEY) || '[]').forEach(cid => { if (!m[cid]) m[cid] = { n: 1, last: today(), next: today() + 2 * DAY, st: 'once' }; }); } catch (e) {}
  return m;
}
const MASTERY = loadMastery();
function saveMastery() { try { localStorage.setItem(LS2, JSON.stringify(MASTERY)); localStorage.setItem(LS_KEY, JSON.stringify(Object.keys(MASTERY).filter(k => MASTERY[k].n >= 1))); } catch (e) {} }
function saveMastered() { saveMastery(); }
const everMastered = { has: cid => !!(MASTERY[cid] && MASTERY[cid].n >= 1) };
// 過關：第 1 次 → 2 天後複習；第 2 次 → 7 天後；第 3 次起 → 21 天後（段考前）
function recordPass(cid) {
  const m = MASTERY[cid] || { n: 0 }; m.n = (m.n || 0) + 1; m.last = today();
  m.next = today() + (m.n === 1 ? 2 : m.n === 2 ? 7 : 21) * DAY; m.st = m.n >= 2 ? 'stable' : 'once';
  MASTERY[cid] = m; saveMastery();
}
// 複習時答錯：退回未過關，明天再來
function recordFail(cid) { MASTERY[cid] = { n: 0, last: today(), next: today() + DAY, st: 'failed' }; saveMastery(); }
function dueList() { const t = today(); return Object.keys(MASTERY).filter(k => CONCEPTS[k] && MASTERY[k].n >= 1 && MASTERY[k].next <= t); }
function stateMark(cid) { const m = MASTERY[cid]; if (!m) return ''; return m.st === 'stable' ? '✓✓' : m.st === 'once' ? '✓' : '✗'; }
function summaryLine() {
  const v = Object.values(MASTERY); const st = v.filter(m => m.st === 'stable').length, on = v.filter(m => m.st === 'once').length, f = v.filter(m => m.st === 'failed').length;
  return `✓✓ 穩 ${st}　✓ 過一次 ${on}　✗ 要重學 ${f}　今天該複習 ${dueList().length}`;
}
function renderReviewBox() {
  const due = dueList(); const el = document.getElementById('review-box'); if (!el) return;

    // 總複習

function q$(el, s) { return el.querySelector(s); }
function msgTip(stage, t) { let e = stage.querySelector('.tip'); if (!e) { e = document.createElement('div'); e.className = 'tip stuck'; stage.appendChild(e); } e.textContent = t; }
function showEl(el, on = true) { if (el) el.hidden = !on; }
function nodeDone(node) {
  node.classList.add('done'); showEl(q$(node, '.donemark'));
  mastered.add(node.dataset.cid); recordPass(node.dataset.cid); markConceptBox(node.dataset.cid); if (typeof logEvent === 'function') logEvent('concept:' + node.dataset.cid, 'pass', true);
  const stage = node.closest('.stage'); checkStage(stage);
  const gt = node.closest('.gteach'); if (gt) { showEl(gt, false); showEl(q$(gt.parentElement, '.review')); }
}
function checkStage(stage) {
  if (!stage) return;
  const nodes = [...stage.querySelectorAll('.node')].filter(n => !n.closest('.gteach') || n.closest('.gteach').hidden === false);
  const visibleNodes = [...stage.querySelectorAll('.node')].filter(n => !n.closest('[hidden]'));
  const allDone = visibleNodes.length > 0 && visibleNodes.every(n => n.classList.contains('done'));
  const nx = q$(stage, '.next'); if (nx) nx.disabled = !allDone;
  if (stage.querySelector('[data-final]') && allDone) showEl(stage.querySelector('[data-final]'));
}
function onGuidedClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  const act = b.dataset.act; const node = b.closest('.node'); const stage = b.closest('.stage');
  if (b.dataset.next) {
    const art = document.getElementById('gp-' + b.dataset.next); const i = +b.dataset.i;
    const st = art.querySelector(`.stage[data-stage="${i}"]`); if (st) { st.classList.remove('locked'); b.hidden = true; st.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    const total = art.querySelectorAll('.stage').length; const prog = document.getElementById('prog-' + b.dataset.next);
    prog.textContent = i < total - 2 ? `進度：引導 ${i}／${total - 3}` : (i === total - 2 ? '進度：收尾' : '進度：總複習');
    return;
  }
  if (!act) return;
  switch (act) {
    // 觀念節點
    case 'peek': showEl(b, false); showEl(q$(node, ':scope > .gans')); showEl(q$(node, '.judge')); break;
    case 'ok': showEl(q$(node, '.judge'), false); showEl(q$(node, '.recite')); break;
    case 'ng': case 'ng3': {
      if (act === 'ng' && node.dataset.review === '1' && !node.dataset.failed) { node.dataset.failed = '1'; recordFail(node.dataset.cid); markConceptBox(node.dataset.cid); if (typeof logEvent === 'function') logEvent('concept:' + node.dataset.cid, 'review-fail', false); }
      showEl(q$(node, '.judge'), false); const t = q$(node, '.teach'); showEl(t);
      const n = +node.dataset.attempts + 1; node.dataset.attempts = n;
      // reset inner
      showEl(q$(t, '.judge2'), false); showEl(q$(t, '.judge3'), false); showEl(q$(t, '.retest'), false); showEl(q$(t, '.retest-l'), false);
      t.querySelectorAll('.gans').forEach(g => g.hidden = true); t.querySelectorAll('[data-act="peek2"],[data-act="peek3"]').forEach(x => x.hidden = false);
      if (n >= 2) showEl(q$(t, '.stuck'));
      t.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    }
    case 'peek2': showEl(b, false); showEl(b.nextElementSibling); showEl(q$(node, '.judge2')); break;
    case 'ng2': { const t = q$(node, '.teach'); showEl(q$(t, '.judge2'), false); q$(t, '[data-act="peek2"]').hidden = false; q$(t, '[data-act="peek2"]').nextElementSibling.hidden = true; t.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    case 'ok2': showEl(q$(node, '.judge2'), false); showEl(q$(node, '.retest-l')); showEl(q$(node, '.retest')); break;
    case 'peek3': showEl(b, false); showEl(b.nextElementSibling); showEl(q$(node, '.judge3')); break;
    case 'ok3': showEl(q$(node, '.teach'), false); showEl(q$(node, '.recite')); break;
    case 'recited': showEl(q$(node, '.recite'), false); nodeDone(node); break;
    case 'layer2': case 'layer3': { showEl(b, false); const layer = b.closest('.teach').querySelector(`.layer[data-layer="${act === 'layer2' ? 2 : 3}"]`); showEl(layer); if (layer) { const w = layer.querySelector('[data-widget]'); if (w) WIDGETS[w.dataset.widget].update(w.closest('.widget'), +w.value); layer.scrollIntoView({ behavior: 'smooth', block: 'start' }); } break; }
    case 'prepeek': showEl(b, false); showEl(b.nextElementSibling); break;
    // 引導步
    case 'gate': showEl(b.closest('.gate'), false); showEl(q$(stage, '.guide')); break;
    case 'gpeek': showEl(b, false); showEl(b.nextElementSibling); showEl(q$(stage, '.gjudge')); break;
    case 'gok': showEl(q$(stage, '.gjudge'), false); showEl(q$(stage, '.review')); checkStage(stage); break;
    case 'gng': showEl(q$(stage, '.gjudge'), false); showEl(q$(stage, '.gteach')); q$(stage, '.gteach').scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'finalrecite': { const gp = stage.closest('.gp'); if (!gp) break; showEl(b.closest('.recite'), false); showEl(q$(stage, '.finish')); document.getElementById('prog-' + gp.id.slice(3)).textContent = '進度：完成 🎉'; break; }
  }
}

function seededShuffle(arr, seed) { const a = arr.slice(); let s = seed; for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

itle": "題 2・（哪一個是它的倍式）", "source": "9/16 複習考・第 2 題", "stem": "下列四個多項式，哪一個是 2x+9 的倍式？　(A) 2x²−81　(B) 2x²+9x　(C) 2x²+18x　(D) 4x²+81", "warmup": [{"concept": "fac_def", "q": "「某個式子是 2x＋9 的倍式」，換成白話是什麼意思？", "a": "它可以寫成 (2x＋9) × (另一個式子)，也就是除以 2x＋9 會整除、沒有餘數。"}, {"concept": "fac_common", "q": "把 2x²＋9x 提出公因式 x，括號裡會是什麼？", "a": "x(2x＋9)。兩項都有 x，提走之後剩 2x 和 9。"}, {"concept": "quad_root_def", "q": "2x＋9 在 x＝−9/2 的時候等於多少？", "a": "2×(−9/2)＋9＝−9＋9＝0。"}], "steps": [{"concept": "fac_def", "jingle": "倍式就是乘得出來", "guide": "👀 先看到什麼：題目問「哪一個是 2x＋9 的倍式」。💡 那想到什麼？「是它的倍式」代表我要在四個選項裡找到誰可以寫成「(2x＋9) 乘上某個東西」。先說說看，四個選項裡哪一個看起來「藏著 2x＋9」？", "answer": "(B) 2x²＋9x。因為它的係數剛好就是 2 和 9，很像 2x＋9 被乘了什麼。", "why": "倍式一定要能整個拆出 (2x＋9) 這個括號，所以先找係數對得上的那一個最快。", "quiz": {"q": "(C) 2x²＋18x 提出 x 之後是什麼？", "a": "x(2x＋18)，括號是 2x＋18，不是 2x＋9 ✗。"}}, {"concept": "fac_common", "jingle": "提公因式看括號", "guide": "光用看的不算數，把 (B) 提一次公因式。兩項 2x² 和 9x 都有什麼？提走之後括號裡剩什麼？", "answer": "2x²＋9x＝x(2x＋9)，括號裡剛好是 2x＋9 ✓ 所以 (B) 是 2x＋9 的倍式。", "why": "寫成 (2x＋9)×x 就完全符合倍式的定義了——它真的是 2x＋9 乘上某個東西。", "quiz": {"q": "(A) 2x²−81 能提出 2x＋9 嗎？", "a": "不能。2x²−81 兩項沒有共同的 x，而且它也不是平方減平方的標準長相（2x² 不是完全平方）。"}}, {"concept": "quad_root_def", "jingle": "代根進去該是零", "guide": "再學一招又快又準的檢查法：如果 (2x＋9) 是它的因式，那把「讓 2x＋9＝0 的那個 x」代進去，整個式子應該會變成 0。那個 x 是多少？代進 (B) 看看。", "answer": "x＝−9/2。代進 (B)：2×(81/4)＋9×(−9/2)＝81/2−81/2＝0 ✓。", "why": "因式等於 0 的時候，整個乘積就是 0。所以「代進去等於 0」就是最快的倍式檢查。", "quiz": {"q": "把 x＝−9/2 代進 (D) 4x²＋81 會得到多少？", "a": "4×(81/4)＋81＝81＋81＝162，不是 0，所以 (D) 不是 ✗。"}}], "final": {"concept": "fac_def", "guide": "兩種方法都走過了，把答案的字母寫下來。", "answer": "(B) 2x²+9x", "why": "2x²＋9x＝x(2x＋9)，可以整個拆出 (2x＋9)，所以它是 2x＋9 的倍式。", "check": "代 x＝−9/2 進四個選項對一次：(A) 得 −81/2、(B) 得 0 ✓、(C) 得 −81/2、(D) 得 162。只有 (B) 是 0。這一招（代進去看是不是 0）在選擇題特別好用；長除法也做得出來，只是比較花時間。", "concepts": ["fac_def", "fac_common", "quad_root_def"]}}, {"id": "u3", "title": "題 3・（提公因式，剩下的 1 不能漏）", "source": "9/16 複習考・第 3 題", "stem": "小瑀因式分解 6x²+x−6x−1 的過程如下表。關於小瑀因式分解的過程，下列敘述何者正確？　(A) 第一步驟發生錯誤，正確應為 (6x²+x)−(x−1)　(B) 第二步驟發生錯誤，正確應為 x[(6x+1)−(6+1)]　(C) 第三步驟發生錯誤，正確應為 (6x+1)(x−1)　(D) 因式分解過程、步驟皆正確", "figure": "<table style='border-collapse:collapse;margin:10px auto;font-size:14px'><tr><td style='border:1px solid #bbb;padding:5px 10px'>原式</td><td style='border:1px solid #bbb;padding:5px 10px'>＝(6x²＋x)−(6x＋1)</td><td style='border:1px solid #bbb;padding:5px 10px'>……第一步驟</td></tr><tr><td style='border:1px solid #bbb;padding:5px 10px'></td><td style='border:1px solid #bbb;padding:5px 10px'>＝x(6x＋1)−(6x＋1)</td><td style='border:1px solid #bbb;padding:5px 10px'>……第二步驟</td></tr><tr><td style='border:1px solid #bbb;padding:5px 10px'></td><td style='border:1px solid #bbb;padding:5px 10px'>＝(6x＋1)x</td><td style='border:1px solid #bbb;padding:5px 10px'>……第三步驟</td></tr></table>", "warmup": [{"concept": "fac_common", "q": "把 5x(x−2)＋(x−2) 提出公因式 (x−2)，答案是什麼？", "a": "(x−2)(5x＋1)。第二項整項就是 (x−2) 本人，提走之後留下的是 1，不是 0。"}, {"concept": "fac_check", "q": "把 (6x＋1)(x−1) 乘開是多少？", "a": "6x²−6x＋x−1＝6x²−5x−1。"}, {"concept": "fac_def", "q": "6x²＋x−6x−1 先合併同類項，會變成什麼？", "a": "x−6x＝−5x，所以是 6x²−5x−1。"}], "steps": [{"concept": "fac_common", "jingle": "提完剩一，不是零", "guide": "👀 先看到什麼：第二步是 x(6x＋1)−(6x＋1)，後面那一項「整項就等於括號本人」。💡 那想到什麼？把 (6x＋1) 提走的時候，後面那一項會留下什麼？是 0 還是 1？先說出來，這一題全部的關鍵就在這裡。", "answer": "留下 1（而且前面是減號，所以是 −1）。因為 (6x＋1)＝(6x＋1)×1，提走括號之後，1 還在。", "why": "就像每個袋子都拿走一顆糖，原本只有一顆糖的袋子不是消失，是變成「空袋子」還站在那裡——那個空袋子就是 1。", "quiz": {"q": "7a(b＋2)＋(b＋2) 提出 (b＋2) 之後是什麼？", "a": "(b＋2)(7a＋1)。"}}, {"concept": "fac_def", "jingle": "先算出標準答案", "guide": "要判斷別人對不對，最好先自己手上有一個「標準答案」。把原式 6x²＋x−6x−1 的同類項先合併起來，算出它到底等於什麼。", "answer": "6x²−5x−1。（x−6x＝−5x）", "why": "有了 6x²−5x−1 當標準，後面每一步只要乘回去跟它對，就知道誰跑掉了。", "quiz": {"q": "為什麼要先合併同類項？", "a": "因為題目原本寫成四項，看起來很亂；整理成三項才看得出它是 6x²−5x−1。"}}, {"concept": "fac_check", "jingle": "乘回去對一次", "guide": "現在檢查第一步和第二步。第一步 (6x²＋x)−(6x＋1) 拆開之後是多少？第二步 x(6x＋1)−(6x＋1) 乘開又是多少？各自跟 6x²−5x−1 對一下。", "answer": "第一步：6x²＋x−6x−1＝6x²−5x−1 ✓ 對。第二步：x(6x＋1)＝6x²＋x，減掉 (6x＋1) 還是 6x²−5x−1 ✓ 對。", "why": "前兩步都跟標準答案一樣，代表小瑀前面沒問題，問題一定出在第三步。", "quiz": {"q": "(A) 說第一步該改成 (6x²＋x)−(x−1)，對嗎？", "a": "不對。那樣拆開會變成 6x²＋x−x＋1＝6x²＋1，跟原式不一樣。"}}, {"concept": "fac_common", "jingle": "那個 1 不能漏", "guide": "重點來了：第三步他寫成 (6x＋1)x。把它乘開看看等於多少？跟我們剛剛算好的標準答案 6x²−5x−1 對得上嗎？對不上的話，是少了什麼？", "answer": "(6x＋1)x＝6x²＋x ✗，跟 6x²−5x−1 對不上。少的就是後面那一項留下來的 −1。正確應該寫成 x(6x＋1)−1·(6x＋1)＝(6x＋1)(x−1)。", "why": "提公因式的時候，(6x＋1) 那一項留下的是 −1，不是不見。括號外面要寫 x−1，不是只有 x。", "quiz": {"q": "(6x＋1)(x−1) 乘回去是多少？", "a": "6x²−6x＋x−1＝6x²−5x−1 ✓ 跟原式一樣。"}}], "final": {"concept": "fac_common", "guide": "所以錯在第幾步？正確答案應該是什麼？把選項字母寫下來。", "answer": "(C) 第三步驟發生錯誤，正確應為 (6x+1)(x−1)", "why": "第一、二步都對，第三步把 (6x＋1) 提出來的時候漏掉了後面那一項留下的 −1，寫成 (6x＋1)x＝6x²＋x，跟原式 6x²−5x−1 不一樣。", "check": "代回去檢查：(6x＋1)(x−1)＝6x²−5x−1 ✓ 等於原式；(6x＋1)x＝6x²＋x ✗ 不等於。也可以代一個數字更快，代 x＝1：原式 6＋1−6−1＝0，(6＋1)(1−1)＝0 ✓，而 (6＋1)×1＝7 ✗。以後看到「其中一項整項就是公因式」，心裡先大聲念一次「提完剩一，不是剩零」。", "concepts": ["fac_common", "fac_def", "fac_check"]}}, {"id": "u4", "title": "題 4・（解出兩根再代進去算）", "source": "9/16 複習考・第 4 題", "stem": "一元二次方程式 x²−6x−2×8=0 的兩根為 a、b，且 a>b，則 a+2b=？　(A) 4　(B) 12　(C) 18　(D) −14", "warmup": [{"concept": "quad_factor", "q": "兩個東西相乘等於 0，你可以確定什麼？", "a": "至少有一個是 0。所以 (x−8)(x＋2)＝0 就表示 x−8＝0 或 x＋2＝0。"}, {"concept": "fac_cross", "q": "把 (x−8)(x＋2) 乘開是多少？", "a": "x²＋2x−8x−16＝x²−6x−16。"}, {"concept": "quad_root_def", "q": "兩根 a、b 且 a＞b，代表 a 是比較大的還是比較小的那個？", "a": "a 是比較大的那一個，b 是比較小的。"}], "steps": [{"concept": "quad_factor", "jingle": "先把數字算乾淨", "guide": "👀 先看到什麼：常數項寫成 −2×8，還沒乘起來。💡 那想到什麼？分解之前，式子裡的數字要先算乾淨，不然拆常數的時候會拆錯。先把它算好。", "answer": "−2×8＝−16，所以式子是 x²−6x−16＝0。", "why": "十字交乘要拆的是「−16」。如果眼睛只看到 2 和 8 就開始拆，整題都會歪掉。", "quiz": {"q": "如果不小心把 −2×8 看成 −(2＋8)，式子會變成什麼？", "a": "x²−6x−10＝0，那是另一題了，分解不出整數解。"}}, {"concept": "fac_cross", "jingle": "兩數相乘負十六", "guide": "接下來要找兩個數字，相乘是 −16、相加是 −6。你先列幾組相乘等於 −16 的看看（一正一負才會是負的）。", "answer": "−8 和 ＋2：(−8)×2＝−16 ✓，(−8)＋2＝−6 ✓。所以 x²−6x−16＝(x−8)(x＋2)。", "why": "二次項係數是 1 的時候最好拆：只要找「相乘等於常數、相加等於中間項」的兩個數。", "quiz": {"q": "為什麼不能取 8 和 −2？", "a": "8×(−2)＝−16 沒錯，但 8＋(−2)＝＋6，中間項會變成 ＋6x，不對。"}}, {"concept": "quad_factor", "jingle": "積等於零各自零", "guide": "分解好了：(x−8)(x＋2)＝0。兩個根各是多少？誰是 a、誰是 b？", "answer": "x−8＝0 → x＝8；x＋2＝0 → x＝−2。a＞b 所以 a＝8、b＝−2。", "why": "兩個東西相乘是 0，就讓每個括號各自等於 0，這是解一元二次方程式最快的路。", "quiz": {"q": "如果題目改成 a＜b，那 a 是多少？", "a": "a＝−2、b＝8，算出來的答案就會不一樣，所以大小關係一定要看清楚。"}}], "final": {"concept": "quad_factor", "guide": "最後一步是代進去算。題目要的不是 x，是 a＋2b，慢慢代、不要急。", "answer": "(A) 4（a＋2b＝8＋2×(−2)＝8−4＝4）", "why": "a＝8、b＝−2，代進 a＋2b 得 8−4＝4。題目問什麼就答什麼，這裡問的是 a＋2b，不是 x。", "check": "先檢查兩根對不對：代 8 進原式 64−48−16＝0 ✓，代 −2 進去 4＋12−16＝0 ✓，兩個都是根。再檢查 a＋2b：8＋2×(−2)，那個 2 要乘進去，−2×2＝−4，8−4＝4 ✓。算到一半發現數字不對就劃掉重寫，那是好習慣，不要怕改。", "concepts": ["quad_factor", "fac_cross", "quad_root_def"]}}, {"id": "u5", "title": "題 5・（恰有一個共同解）", "source": "9/16 複習考・第 5 題", "stem": "下列哪一個一元二次方程式與 x²−2x−3=0，恰有一個共同的解？　(A) 2x²+x−3=0　(B) 2x²−3x−9=0　(C) x²+4x−5=0　(D) x²+x−6=0", "warmup": [{"concept": "quad_common_root", "q": "「共同解」是什麼意思？", "a": "同一個數字代進兩個方程式，兩邊都會等於 0。"}, {"concept": "quad_factor", "q": "解 x²−2x−3＝0。", "a": "(x−3)(x＋1)＝0 → x＝3 或 x＝−1。"}, {"concept": "fac_cross", "q": "把 2x²−3x−9 因式分解。", "a": "(2x＋3)(x−3)。交叉相乘：2x×(−3)＝−6x、3×x＝＋3x，−6x＋3x＝−3x ✓ 剛好是中間項。"}], "steps": [{"concept": "quad_common_root", "jingle": "先解一邊再代另一邊", "guide": "👀 先看到什麼：題目說「與 x²−2x−3＝0 恰有一個共同的解」。💡 那想到什麼？五個式子全部解一遍太慢了，聰明的做法是先解哪一個？", "answer": "先解題目給的那一個 x²−2x−3＝0，把它的根拿到手，再拿去試四個選項。", "why": "題目給的那一個最好解，解出來的兩個數字就是「鑰匙」，拿鑰匙去開四扇門比每扇門都撬開快多了。", "quiz": {"q": "x²−2x−3 分解成什麼？", "a": "(x−3)(x＋1)，兩個數相乘 −3、相加 −2。"}}, {"concept": "quad_factor", "jingle": "積等於零各自零", "guide": "把鑰匙拿出來：x²−2x−3＝0 的兩個根是多少？", "answer": "x＝3 和 x＝−1。", "why": "(x−3)(x＋1)＝0，讓每個括號各自等於 0 就得到 3 和 −1。", "quiz": {"q": "代 3 進 x²−2x−3 真的是 0 嗎？", "a": "9−6−3＝0 ✓ 是。"}}, {"concept": "quad_root_def", "jingle": "代進去等於零", "guide": "現在拿 3 去試四個選項（代進去看是不是 0）。一個一個來，先算 (A) 和 (B)。", "answer": "(A) 2×9＋3−3＝18 ✗；(B) 2×9−9−9＝18−18＝0 ✓。所以 3 是 (B) 的解。", "why": "代進去等於 0 就代表它是那個方程式的根，也就是兩個式子的共同解。", "quiz": {"q": "再把 3 代進 (C) x²＋4x−5 和 (D) x²＋x−6 看看。", "a": "(C) 9＋12−5＝16 ✗；(D) 9＋3−6＝6 ✗，兩個都不是 0。"}}, {"concept": "quad_common_root", "jingle": "恰好一個要再確認", "guide": "先別急著填。題目說的是「恰有一個」共同解，所以還要確認另一把鑰匙 −1 不會也打開 (B)。把 −1 代進 (B) 算算看。", "answer": "(B) 代 x＝−1：2×1＋3−9＝2＋3−9＝−4 ✗，不是 0。所以 (B) 和原式只共用 3 這一個解，剛好一個 ✓。", "why": "「恰有一個」是兩個條件：有一個共同、而且只有一個。兩個都確認過才算真的做完。", "quiz": {"q": "(B) 分解之後的兩個根是多少？", "a": "(2x＋3)(x−3)＝0 → x＝−3/2 或 x＝3。跟 3、−1 只重疊一個 3 ✓。"}}], "final": {"concept": "quad_common_root", "guide": "確認完了，把答案的字母寫下來。", "answer": "(B) 2x²−3x−9=0", "why": "x²−2x−3＝0 的根是 3、−1；(B) 的根是 −3/2、3，兩邊只共用 3 這一個，剛好符合「恰有一個共同解」。", "check": "把四個選項都分解一次對答案：(A)(2x＋3)(x−1)→−3/2、1；(B)(2x＋3)(x−3)→−3/2、3 ✓；(C)(x＋5)(x−1)→−5、1；(D)(x＋3)(x−2)→−3、2。只有 (B) 的根裡面有 3。這一題的關鍵是「恰有一個」要分兩層確認：有一個共同，而且只有一個。", "concepts": ["quad_common_root", "quad_factor", "fac_cross", "quad_root_def"]}}, {"id": "u6", "title": "題 6・（十字交乘誰做對了）", "source": "9/16 複習考・第 6 題", "stem": "以下是阿明、阿容、阿梓、阿凱利用十字交乘法分解 2x²−3x−5 的過程（見下表），請問誰的作法正確？　(A) 阿明　(B) 阿容　(C) 阿梓　(D) 阿凱", "figure": "<table style='border-collapse:collapse;margin:10px auto;font-size:14px;text-align:center'><tr><th style='border:1px solid #bbb;padding:5px 10px'></th><th style='border:1px solid #bbb;padding:5px 10px'>上列</th><th style='border:1px solid #bbb;padding:5px 10px'>下列</th><th style='border:1px solid #bbb;padding:5px 10px'>拆成兩個括號</th></tr><tr><td style='border:1px solid #bbb;padding:5px 10px'>(A) 阿明</td><td style='border:1px solid #bbb;padding:5px 10px'>x ／ ＋5</td><td style='border:1px solid #bbb;padding:5px 10px'>2x ／ −1</td><td style='border:1px solid #bbb;padding:5px 10px'>(x＋5)(2x−1)</td></tr><tr><td style='border:1px solid #bbb;padding:5px 10px'>(B) 阿容</td><td style='border:1px solid #bbb;padding:5px 10px'>x ／ ＋1</td><td style='border:1px solid #bbb;padding:5px 10px'>2x ／ −5</td><td style='border:1px solid #bbb;padding:5px 10px'>(x＋1)(2x−5)</td></tr><tr><td style='border:1px solid #bbb;padding:5px 10px'>(C) 阿梓</td><td style='border:1px solid #bbb;padding:5px 10px'>x ／ −5</td><td style='border:1px solid #bbb;padding:5px 10px'>2x ／ ＋1</td><td style='border:1px solid #bbb;padding:5px 10px'>(x−5)(2x＋1)</td></tr><tr><td style='border:1px solid #bbb;padding:5px 10px'>(D) 阿凱</td><td style='border:1px solid #bbb;padding:5px 10px'>x ／ −1</td><td style='border:1px solid #bbb;padding:5px 10px'>2x ／ ＋5</td><td style='border:1px solid #bbb;padding:5px 10px'>(x−1)(2x＋5)</td></tr></table>", "warmup": [{"concept": "fac_cross", "q": "十字交乘寫好之後，兩個因式怎麼讀出來？", "a": "橫著讀：上面那一列是一個括號 (x＋上面的數)，下面那一列是另一個括號 (2x＋下面的數)。"}, {"concept": "fac_check", "q": "把 (x＋1)(2x−5) 乘開是多少？", "a": "2x²−5x＋2x−5＝2x²−3x−5。"}, {"concept": "fac_cross", "q": "分解 2x²−3x−5 的時候，交叉相乘加起來要等於哪一項？", "a": "要等於中間項 −3x。"}], "steps": [{"concept": "fac_cross", "jingle": "交叉相加對中間", "guide": "👀 先看到什麼：四個人都在分解同一個式子 2x²−3x−5，只差在正負號和數字的位置。💡 那想到什麼？要判斷誰對，不必重新想一次十字交乘，只要做一件事——你覺得是哪一件？", "answer": "把四組括號各自「乘回去」，看誰乘出來剛好是 2x²−3x−5。", "why": "十字交乘的驗收標準只有一個：交叉相乘加起來要等於中間項 −3x。乘回去對中間項最快也最不會錯。", "quiz": {"q": "四個選項乘出來的第一項和最後一項會不會不一樣？", "a": "都一樣（都是 2x² 和 −5），所以差別只在中間那一項，看中間項就好。"}}, {"concept": "fac_check", "jingle": "乘回去對一次", "guide": "先算 (A) 和 (B)。(x＋5)(2x−1) 的中間項是多少？(x＋1)(2x−5) 的中間項又是多少？兩個都算出來再往下。", "answer": "(A)：x×(−1)＋5×2x＝−x＋10x＝＋9x → 2x²＋9x−5 ✗。(B)：x×(−5)＋1×2x＝−5x＋2x＝−3x → 2x²−3x−5 ✓。", "why": "(B) 的中間項剛好是 −3x，跟原式一樣，所以阿容的作法是對的。", "quiz": {"q": "(A) 錯在哪裡？", "a": "數字擺反了。5 和 1 的位置對調，交叉相乘就從 −3x 變成 ＋9x。"}}, {"concept": "fac_check", "jingle": "剩下兩個也要算", "guide": "再把 (C) 和 (D) 也算完，確定沒有第二個對的。", "answer": "(C)：x×1＋(−5)×2x＝x−10x＝−9x → 2x²−9x−5 ✗。(D)：x×5＋(−1)×2x＝5x−2x＝＋3x → 2x²＋3x−5 ✗。", "why": "(C) 的中間項是 −9x、(D) 是 ＋3x，都不是 −3x。所以只有 (B) 正確。", "quiz": {"q": "(C) 和 (B) 的正負號有什麼不同？", "a": "(B) 是 ＋1 和 −5，(C) 是 −5 和 ＋1，位置對調了，中間項就從 −3x 變成 −9x。"}}, {"concept": "fac_check", "jingle": "算完馬上回去改", "guide": "最後一步是一個「動作」，不是計算。算出 (B) 是對的之後，請把 (B) 圈起來，然後立刻回到答案的括號裡，把字母寫成 B。大部分人掉在這裡：旁邊算對了，括號沒有改。", "answer": "圈出 (B) → 回到括號 → 填 B。驗算的結論一定要回到答案欄，不然等於沒驗。", "why": "考卷只看括號裡填的那個字母。旁邊算得再漂亮，沒填回去就拿不到。養成「圈起來 → 馬上改」這個兩秒鐘的動作就好。", "quiz": {"q": "如果驗算到一半發現跟原本填的字母不一樣，要做什麼？", "a": "立刻回去把括號裡的字母改掉，不要只在旁邊寫註記。"}}], "final": {"concept": "fac_cross", "guide": "把最後的字母寫進括號裡——記得，寫進去才算數。", "answer": "(B) 阿容（(x+1)(2x−5)）", "why": "只有 (x＋1)(2x−5) 乘回去等於 2x²−3x−5，交叉相乘 x×(−5)＋1×2x＝−3x 剛好對上中間項。", "check": "四個都乘回去對一次：(A) 2x²＋9x−5、(B) 2x²−3x−5 ✓、(C) 2x²−9x−5、(D) 2x²＋3x−5。然後最重要的一步：驗算完就回去把括號裡的字母改成答案。旁邊算得再漂亮，括號沒改就等於沒算。寫完驗算跟自己說一句「回去改」，再往下一題。", "concepts": ["fac_cross", "fac_check"]}}, {"id": "u7", "title": "題 7・（買東西找零的列式）", "source": "9/16 複習考・第 7 題", "stem": "阿愷帶 1000 元去買每個 x 元的麵包，共買了 (x+5) 個，並找回 76 元。依題意可列出下列哪一個方程式？　(A) x(x+5)=1000−76　(B) x(x−5)=1000−76　(C) x(x+5)=1000+76　(D) x(x−5)=1000+76", "warmup": [{"concept": "quad_word", "q": "一個 x 元，買了 (x＋5) 個，總共花了多少錢？", "a": "x(x＋5) 元。單價 × 個數 ＝ 總價。"}, {"concept": "quad_word", "q": "帶 1000 元去買東西，找回 76 元，花掉多少？", "a": "1000−76＝924 元。"}, {"concept": "quad_word", "q": "「買了 (x＋5) 個」是比 x 多 5 個還是少 5 個？", "a": "多 5 個，所以括號裡是 ＋5。"}], "steps": [{"concept": "quad_word", "jingle": "帶的減找的是花的", "guide": "👀 先看到什麼：題目出現「找回 76 元」。💡 那想到什麼？「找回」代表錢沒花完，那真正花掉的錢要怎麼算？用帶去的錢做什麼？", "answer": "花掉的錢 ＝ 帶去的 − 找回的 ＝ 1000−76。", "why": "找回來的錢還在口袋裡，不算花掉。所以是減，不是加。", "quiz": {"q": "那什麼情況下會是 1000＋76？", "a": "錢不夠、還要再補 76 元的時候。但題目說「找回」，所以是減。"}}, {"concept": "quad_word", "jingle": "單價乘個數是總價", "guide": "另一邊：一個 x 元，買了 (x＋5) 個，花掉的錢用式子寫出來。", "answer": "x(x＋5)。", "why": "總價永遠是「一個多少 × 買幾個」，這裡就是 x 乘 (x＋5)。", "quiz": {"q": "如果改成「買了比 x 少 5 個」，式子會變成什麼？", "a": "x(x−5)。所以 ＋5 還是 −5 一定要看清楚題目怎麼說。"}}, {"concept": "quad_word", "jingle": "兩邊講同一件事", "guide": "現在兩邊都有了：一邊是「花掉的錢 x(x＋5)」，一邊是「花掉的錢 1000−76」。它們在講同一件事，所以中間放什麼？", "answer": "放等號：x(x＋5)＝1000−76。", "why": "列方程式就是找到「同一個量的兩種說法」，再用等號把它們接起來。", "quiz": {"q": "1000−76 等於多少？", "a": "924。所以方程式也可以寫成 x(x＋5)＝924。"}}], "final": {"concept": "quad_word", "guide": "把對應的字母寫下來。", "answer": "(A) x(x+5)=1000−76", "why": "買了 (x＋5) 個，所以是 ＋5；找回 76 元表示花掉 1000−76，所以是減。兩個條件都符合的只有 (A)。", "check": "代數字回去檢查：x(x＋5)＝924 → x²＋5x−924＝0 → (x−28)(x＋33)＝0 → x＝28。也就是一個麵包 28 元、買了 33 個，28×33＝924，1000−924＝76 ✓ 找回 76 元，完全對得上。", "concepts": ["quad_word"]}}, {"id": "u8", "title": "題 8・（已知一個因式求係數）", "source": "9/16 複習考・第 8 題", "stem": "若 4x−1 是 12x²+kx−1 的因式，則 k 之值為何？　(A) −3　(B) −1　(C) 1　(D) 2", "warmup":
