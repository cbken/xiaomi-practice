 8 位學生的平均分數是多少？", "opts": [], "src": "居仁113 非選題", "ans": "(1) 72－(－5)＝77 分　(2) 77＋12＝89 分　(3) 甲 97、庚 70，相差 27 分　(4) 差的總和 32 → 77＋32÷8＝81 分", "why": "(1) 丁 72 分＝平均－5 → 平均 77。(2) 戊＝77＋12＝89。(3) 甲 97 最高、庚 70 最低，差 27。(4) 差的總和 32 → 77＋32÷8＝81。"}]}, {"key": "eng", "title": "妹妹・英文", "sub": "康軒 B1 L1  Who's That Young Man?", "items": [{"n": 1, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "The book on my table ______ not thin（薄的）.", "opts": ["is", "are", "am", "be"], "src": "康軒L1講義", "ans": "A", "why": "主詞是 The book（單數）→ is。"}, {"n": 2, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "Amy: ______ the books on the table great?　Cindy: Yes.", "opts": ["Isn't", "Aren't", "What are", "How are"], "src": "康軒L1講義", "ans": "B", "why": "主詞 the books 複數 → Aren't。"}, {"n": 3, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "Ella: Is that boy your friend?　Cindy: Yes, ______.", "opts": ["you are", "it is", "he is", "he's"], "src": "康軒L1講義", "ans": "C", "why": "that boy → he；肯定簡答不能縮寫，所以不選 (D)。"}, {"n": 4, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "Lucy is ______ girl. She's beautiful.", "opts": ["tall", "a tall", "tall a", "tall the"], "src": "康軒L1講義", "ans": "B", "why": "形容詞放名詞前要加冠詞：a tall girl。"}, {"n": 5, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "A: Are you a farmer?　B: ______ I'm a doctor.", "opts": ["Yes, I am.", "Yes, you are.", "No, I'm not.", "No, it isn't."], "src": "康軒L1講義", "ans": "C", "why": "後面說「我是醫生」→ 否定簡答。"}, {"n": 6, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "______ doctor is tall. Her name is Lisa.", "opts": ["An", "The", "A", "╳"], "src": "康軒L1講義", "ans": "B", "why": "已知是誰的 doctor → 用 the。"}, {"n": 7, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "A: Is John a good student?　B: ______ He's a good student.", "opts": ["Yes, he is.", "Yes, it is.", "No, he isn't.", "He is."], "src": "康軒L1講義", "ans": "A", "why": "後面接著說「他是好學生」→ 肯定簡答 Yes, he is."}, {"n": 8, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "A: Who's the boy?　B: He's ______.", "opts": ["Ms. Jones", "friend", "a student", "my classmate"], "src": "康軒L1講義", "ans": "D", "why": "Who 問「姓名或關係」，不能只回答職業，(C) a student 是職業。"}, {"n": 9, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "Hank: Isn't your sister tall?　Jerry: ______", "opts": ["Yes, she is short.", "No, she is tall.", "No, the tall girl is my sister.", "Yes, she is tall."], "src": "康軒L1講義", "ans": "D", "why": "Isn't...? 回答仍看事實：她高 → Yes, she is tall."}, {"n": 10, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "Kate: ______ John your brother or cousin?　Gina: ______ is my brother.", "opts": ["Is; No, he", "Are; No, he", "Is; He", "Are; He"], "src": "康軒L1講義", "ans": "C", "why": "John 單數 → Is；答句主詞用 He。"}, {"n": 11, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "Fred: Are you a cook?　Lily: Yes, ______.", "opts": ["we are", "I'm", "I am", "we're"], "src": "康軒L1講義", "ans": "C", "why": "問 you 用 I 答；肯定簡答不能縮寫 → Yes, I am."}, {"n": 12, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "Sara: ______ the toy in the box red?　Bill: Yes.", "opts": ["╳", "Are", "Is", "Be"], "src": "康軒L1講義", "ans": "C", "why": "主詞 the toy（單數）→ Is。in the box 只是修飾。"}, {"n": 13, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "The man with glasses（戴眼鏡） ______ tall.", "opts": ["╳", "are", "is", "be"], "src": "康軒L1講義", "ans": "C", "why": "主詞是 The man（單數），with glasses 是修飾 → is。"}, {"n": 14, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "Emma: Aren't your cars new?　Danny: ______, they are old.", "opts": ["Yes", "No", "Right", "╳"], "src": "康軒L1講義", "ans": "B", "why": "事實是舊的 → No。"}, {"n": 15, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "Lei: ______?　Jay: No, my pen is red.", "opts": ["Is this your pen", "Is this a pen", "Is this a red pen", "Is your pen red"], "src": "康軒L1講義", "ans": "D", "why": "答句說「我的筆是紅的」→ 問的是顏色。"}, {"n": 16, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "Claire: ______ is the girl in the classroom?　Peter: She is Tom's friend Lily.", "opts": ["Where", "Who", "What", "How"], "src": "康軒L1講義", "ans": "B", "why": "問「是誰」用 Who。"}, {"n": 17, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "Vicky: ______?　Sam: He is my brother, John.", "opts": ["Who is the tall boy", "What is your brother's name", "How old is your brother", "Is the tall boy your brother"], "src": "康軒L1講義", "ans": "A", "why": "答句「他是我哥哥 John」是回答姓名/關係 → 問 Who is the tall boy?"}, {"n": 18, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "The new clerk is ______. He is twenty-two years old.", "opts": ["hard", "more", "young", "clean"], "src": "中正114", "ans": "C", "why": "young 年輕的（22 歲）。"}, {"n": 19, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "Betty: ______ happy?　Kenny: No, I'm not. I am angry.", "opts": ["Is he", "Is she", "Are they", "Are you"], "src": "中正114", "ans": "D", "why": "答句 No, I'm not. → 問句主詞是 you → Are you happy?"}, {"n": 20, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "May: What is that in your hand?　Oliver: ______ my key.", "opts": ["This is", "They're", "These are", "Those are"], "src": "中正114", "ans": "A", "why": "一把鑰匙（單數）、在手上（近）→ This is my key."}, {"n": 21, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "Mike: Is that your frog?　Stella: No, ______.", "opts": ["it is", "it isn't", "that is", "they aren't"], "src": "中正114", "ans": "B", "why": "that 在答句換成 it。"}, {"n": 22, "section": "一、文法選擇（每題 3 分）", "passage": "", "stem": "I am a(n) ______ student in Dongshan（東山）.", "opts": ["India", "father", "late", "junior high school"], "src": "中正114改", "ans": "D", "why": "a(n) 後面要接名詞：junior high school student 國中生。"}, {"n": 23, "section": "二、克漏字（每題 3 分）", "passage": "<div class=\"stem\">Hello, my name <b>(23)</b> Eddie. I am a junior high school student. This is my <b>(24)</b>. Joe is my father. He is <b>(25)</b>. Kim is my mother. She is a police officer. Tim is <b>(26)</b> brother. He is twelve years old. Rita is my sister. She is only <b>(27)</b>. She is cute.<br><span style=\"font-size:9.5pt;color:#555\">police officer 警察　only 只有</span></div>", "stem": "", "opts": ["be", "is", "am", "are"], "src": "康軒L1講義", "ans": "B", "why": "My name ______ Eddie：主詞 name 單數 → is。"}, {"n": 24, "section": "二、克漏字（每題 3 分）", "passage": "", "stem": "", "opts": ["problem", "school", "family", "name"], "src": "康軒L1講義", "ans": "C", "why": "後面在介紹爸爸、媽媽、哥哥、妹妹 → This is my family."}, {"n": 25, "section": "二、克漏字（每題 3 分）", "passage": "", "stem": "", "opts": ["teach", "teacher", "teachers", "a teacher"], "src": "康軒L1講義", "ans": "D", "why": "職業要加 a：a teacher。"}, {"n": 26, "section": "二、克漏字（每題 3 分）", "passage": "", "stem": "", "opts": ["your", "my", "our", "his"], "src": "康軒L1講義", "ans": "B", "why": "Tim 是「我的」哥哥 → my brother。"}, {"n": 27, "section": "二、克漏字（每題 3 分）", "passage": "", "stem": "", "opts": ["five-year-old girl", "girl of five", "five years old", "five years"], "src": "康軒L1講義", "ans": "C", "why": "be 動詞後接「數字 years old」；five-year-old 只能放名詞前。"}, {"n": 28, "section": "三、填空（每格 2 分）", "passage": "", "stem": "填入 a 或 an：(1) This is ____ book.　(2) He is not ____ English teacher.　(3) Is this ____ apple?　(4) Are you ____ doctor?　(5) ____ mouse　(6) ____ egg", "opts": [], "src": "康軒L1講義", "ans": "a book／an English teacher／an apple／a doctor／a mouse／an egg", "why": "（看「第一個音」是不是母音）"}, {"n": 29, "section": "三、填空（每格 2 分）", "passage": "", "stem": "寫出縮略語：(1) you are ＝ ______　(2) I am ＝ ______　(3) are not ＝ ______　(4) he is not ＝ ______ 或 ______", "opts": [], "src": "康軒L1講義", "ans": "you're／I'm／aren't／he isn't 或 he's not", "why": "you are→you're、I am→I'm、are not→aren't、he is not→he isn't 或 he's not（am not 不能縮寫）。"}, {"n": 30, "section": "三、填空（每格 2 分）", "passage": "", "stem": "引導式翻譯：我是一位護士，我也是一位學生。<br>I'm a ________, and I'm a student, ________.", "opts": [], "src": "康軒L1講義", "ans": "nurse, too", "why": "「也」用 too，放句尾、前面加逗號。"}, {"n": 31, "section": "三、填空（每格 2 分）", "passage": "", "stem": "A：Ivy，你是一位英文老師嗎？　B：不，我不是。我是一位廚師。<br>A: Ivy, ________ you ________ English teacher?　B: No, I'm not. I'm ________ ________.", "opts": [], "src": "康軒L1講義", "ans": "are, an／a cook", "why": "English 母音開頭 → an English teacher；cook 子音開頭 → a cook。"}, {"n": 32, "section": "三、填空（每格 2 分）", "passage": "", "stem": "那個高高的男人是你的數學老師嗎？<br>Is the ________ ________ your math teacher?", "opts": [], "src": "康軒L1講義", "ans": "tall man", "why": "形容詞 tall 放在名詞 man 前面：the tall man。"}, {"n": 33, "section": "三、填空（每格 2 分）", "passage": "", "stem": "Ed 是我們的寵物狗。<br>Ed is ________ ________ dog.", "opts": [], "src": "康軒L1講義", "ans": "our pet", "why": "「我們的」our ＋ pet dog。"}, {"n": 34, "section": "三、填空（每格 2 分）", "passage": "", "stem": "A：Peter 是誰？　B：他是我的朋友。<br>A: ________ ________ Peter?　B: He is ________ friend.", "opts": [], "src": "康軒L1講義", "ans": "Who is (Who's)／my", "why": "問人用 Who is…?；「我的朋友」my friend。"}, {"n": 35, "section": "四、依提示作答（每題 4 分）", "passage": "", "stem": "nurse. / is / beautiful / Amy / a（重組句子）<br><span class=\"blank\">＿＿＿＿</span>", "opts": [], "src": "康軒L1講義", "ans": "Amy is a beautiful nurse.", "why": "冠詞 a ＋ 形容詞 beautiful ＋ 名詞 nurse：Amy is a beautiful nurse."}, {"n": 36, "section": "四、依提示作答（每題 4 分）", "passage": "", "stem": "be / Emily / tall / girl（完成句子）<br><span class=\"blank\">＿＿＿＿</span>", "opts": [], "src": "康軒L1講義", "ans": "Emily is a tall girl.", "why": "be 動詞用 is；a tall girl。"}, {"n": 37, "section": "四、依提示作答（每題 4 分）", "passage": "", "stem": "Yes, <u>she is a math teacher</u>.（依畫線部分造原問句）<br><span class=\"blank\">＿＿＿＿</span>", "opts": [], "src": "康軒L1講義", "ans": "Is she a math teacher?", "why": "畫線部分是「a math teacher」→ 用 Is she a math teacher? 來問。"}, {"n": 38, "section": "四、依提示作答（每題 4 分）", "passage": "", "stem": "Is Jason a cook?（先否定簡答，再以「農夫」詳答）<br><span class=\"blank\">＿＿＿＿</span>", "opts": [], "src": "康軒L1講義", "ans": "No, he isn't. He is a farmer.", "why": "否定簡答 No, he isn't. 再詳答 He is a farmer."}, {"n": 39, "section": "四、依提示作答（每題 4 分）", "passage": "", "stem": "Who is that man at the door?（用「我的叔叔」作答）<br><span class=\"blank\">＿＿＿＿</span>", "opts": [], "src": "康軒L1講義", "ans": "He is my uncle.", "why": "Who 問人 → 用關係回答：He is my uncle."}, {"n": 40, "section": "四、依提示作答（每題 4 分）", "passage": "", "stem": "整句翻譯：Anne 是我的朋友。Logan 也是我的朋友。<br><span class=\"blank\">＿＿＿＿</span>", "opts": [], "src": "康軒L1講義", "ans": "Anne is my friend. Logan is my friend, too.", "why": "第二句用 too 表示「也」：Logan is my friend, too."}]}, {"key": "chi", "title": "妹妹・國文", "sub": "L1〈夏夜〉＋ 語一 標點符號", "items": [{"n": 1, "section": "一、選擇題（每題 4 分）", "passage": "", "stem": "下列各組「」中的注音寫成國字後，何組字形兩兩相同？", "opts": ["「ㄏㄨˊ」蝶飛舞／做事「ㄏㄨˊ」塗", "甜言「ㄇㄧˋ」語／「ㄇㄧˋ」切相關", "「ㄒㄧㄚˊ」不掩瑜／好整以「ㄒㄧㄚˊ」", "大排長「ㄌㄨㄥˊ」／「ㄌㄨㄥˊ」飛鳳舞"], "src": "中正114", "ans": "D", "why": "龍／龍相同；蝴／糊、蜜／密、瑕／暇 不同。"}, {"n": 2, "section": "一、選擇題（每題 4 分）", "passage": "", "stem": "閱讀新詩，要能領會詩中的情感，下列有關〈夏夜〉情境感覺的敘述何者正確？", "opts": ["「綠色的小河」與「夜風」，都給人夏夜豐富美麗的感覺", "「只有窗外瓜架上的南瓜還醒著，伸長了藤蔓輕輕地往屋頂上爬」呈現出寧靜中的生機", "「小弟弟夢見他變做一條魚在藍色的大海裡游水」凸顯小弟弟緊張不安的情緒", "「羊隊和牛群告別了田野回家了」代表動物的傷感不捨之情"], "src": "中正114", "ans": "B", "why": "南瓜「還醒著」「往屋頂上爬」＝寧靜中的生機。"}, {"n": 3, "section": "一、選擇題（每題 4 分）", "passage": "", "stem": "下列成語皆與「星」或「月」有關，何者使用正確？", "opts": ["此處的海域中，到處都是「星羅棋布」的珊瑚礁，令人目不暇給", "那位偶像歌手在眾多歌迷的簇擁下走出會場，形成一幅「物換星移」的畫面", "在「月黑風高」的夜晚獨自漫步，欣賞月色，真是愜意的事", "小時候去玩耍的空地如今已蓋了高樓，真是「披星戴月」，人事已非"], "src": "中正114", "ans": "A", "why": "星羅棋布＝分布眾多；物換星移是時光變遷；月黑風高是險惡之夜；披星戴月是早出晚歸。"}, {"n": 4, "section": "一、選擇題（每題 4 分）", "passage": "", "stem": "「撒了滿天的珍珠和一枚又大又亮的銀幣」這段詩句描寫的時間點，與下列何者相同？", "opts": ["太陽像一團火，晒在河面上，連流動著的河水，都給晒得熱氣蒸人", "皎潔的月，光芒萬丈，似乎有將整個天空照亮的雄心壯志", "旭日披著烈烈的酒氣上升，將一種無限的醉意朝田野上面遼闊的天空，酣暢的播散開", "在那太陽沉下去的水天交界的地方，卻還殘留著一抹淡淡的紅暈"], "src": "中正114", "ans": "B", "why": "珍珠＝星星、銀幣＝月亮 → 夜晚，只有 (B) 寫月亮。"}, {"n": 5, "section": "一、選擇題（每題 4 分）", "passage": "", "stem": "「蝴蝶和蜜蜂們帶著花朵的蜜糖回來了，／羊隊和牛群告別了田野回家了，／火紅的太陽也滾著火輪子回家了。」這段詩句在景物的呈現上，是採「由近到遠」的作法，下列何者與之相同？", "opts": ["那冰屑就像雪花一般，一片一片飛落盤中，俄頃堆積成一座小冰山", "來了！來了！／從山坡上輕輕地爬下來了。／來了！來了！／從椰子樹梢上輕輕地爬下來了", "書齋外面是陽臺，陽臺外面是海，是山，海是碧湛湛的一彎，山是青鬱鬱的連環", "微風拂過，稻浪一波波起伏，從遠遠的天邊，簇擁到操場上的青草，教室的玻璃上也染上了一層綠意"], "src": "中正114", "ans": "C", "why": "由近到遠：書齋→陽臺→海→山。(D) 是由遠到近。"}, {"n": 6, "section": "一、選擇題（每題 4 分）", "passage": "", "stem": "「來了！來了！／從山坡上輕輕地爬下來了。」詩中「爬下來」的是誰？", "opts": ["小弟弟", "夜風", "夏夜", "螢火蟲"], "src": "小咪自編", "ans": "C", "why": "「來了」的是夏夜本身（擬人）。"}, {"n": 7, "section": "一、選擇題（每題 4 分）", "passage": "", "stem": "〈夏夜〉後半反覆出現「只有……還醒著」，這種寫法最主要的效果是？", "opts": ["突顯夜深人靜中仍有生機與動態", "表示夏夜很吵鬧", "說明大家都失眠了", "強調時間過得很快"], "src": "小咪自編", "ans": "A", "why": "大家都睡了，只有南瓜、小河、夜風「還醒著」→ 用對比突顯夜深人靜中仍有生機。"}, {"n": 8, "section": "一、選擇題（每題 4 分）", "passage": "", "stem": "「小妹妹夢見她變做蝴蝶在大花園裡忽東忽西地飛」，「忽東忽西」是在形容？", "opts": ["蝴蝶飛得很慢", "飛行方向不定、自由自在", "蝴蝶迷路了", "蝴蝶很害怕"], "src": "小咪自編", "ans": "B", "why": "「忽東忽西」＝一下往東一下往西，寫蝴蝶飛得自由、方向不定。"}, {"n": 9, "section": "一、選擇題（每題 4 分）", "passage": "", "stem": "下列文句中的標點符號，何者使用正確？", "opts": ["每一刻都是一個新起點、每一次與人握手都是一個承諾、一個表示內心平和的記號。", "鯨魚是獸類，不是魚類；蝙蝠是獸類，不是鳥類。", "我不是跟你說過嗎、要得到好成績，不用功是不行的。為何你總是置若罔聞？", "文明的現代：戰爭仍然層出不窮，不禁令人懷疑—歷史是前進的，抑或倒退的。"], "src": "中正114（語一，改自108會考）", "ans": "B", "why": "(A) 頓號應改逗號；(C) 「嗎」後要問號；(D) 冒號用錯。"}, {"n": 10, "section": "一、選擇題（每題 4 分）", "passage": "", "stem": "下列何者是「長揚」在邀約「子舒」一起去運動場打籃球？", "opts": ["長揚、子舒打球去，你去不去？", "長揚，子舒打球去，你去不去？", "長揚：「子舒打球去，你去不去？」", "長揚：「子舒，打球去，你去不去？」"], "src": "中正114（語一）", "ans": "D", "why": "稱呼後用逗號，說話內容用冒號＋引號：長揚：「子舒，打球去……」。"}, {"n": 11, "section": "一、選擇題（每題 4 分）", "passage": "", "stem": "下列句子的標點符號，何者使用正確？", "opts": ["媽媽問我：「今天功課寫完了嗎？」", "媽媽問我，「今天功課寫完了嗎」？", "媽媽問我：「今天功課寫完了嗎」？", "媽媽問我「今天功課寫完了嗎？」"], "src": "小咪自編（語一）", "ans": "A", "why": "問句在引號內，問號放引號裡。"}, {"n": 12, "section": "一、選擇題（每題 4 分）", "passage": "", "stem": "下列「頓號」的用法，何者正確？", "opts": ["我喜歡蘋果、香蕉、芒果。", "我喜歡蘋果、和香蕉。", "我喜歡、蘋果香蕉。", "我喜歡蘋果，香蕉，芒果。"], "src": "小咪自編（語一）", "ans": "A", "why": "頓號用在並列的詞語之間（蘋果、香蕉、芒果）；(B) 有「和」就不用頓號。"}, {"n": 13, "section": "一、選擇題（每題 4 分）", "passage": "", "stem": "下列句子的空格，何者最適合填入「分號」？", "opts": ["天氣冷了＿記得多穿衣服。", "鯨魚是獸類，不是魚類＿蝙蝠是獸類，不是鳥類。", "你叫什麼名字＿", "這裡的風景太美了＿"], "src": "小咪自編（語一）", "ans": "B", "why": "分號用在並列的兩個分句之間。"}, {"n": 14, "section": "二、題組（每題 4 分）", "passage": "<div class=\"stem\"><div class=\"poem\">接到了太陽國王的大掃除的命令，\n小雨點們就都坐上飛跑著的烏雲，\n賽跑著離開了天上的宮廷。\n\n他們給稻田和小河加足了水，\n他們給骯髒的山谷洗過了澡，\n就又來洗淨了清道夫永遠也掃不完的城市，\n也洗淨了悶熱的飛滿了塵土的天空。\n\n太陽國王為了獎賞他們真能幹，\n就送給他們一條美麗的長彩帶，\n那就是掛在明亮的雨後的天空中的\n紅、橙、黃、綠、青、藍、紫的七彩的虹。</div><div style=\"text-align:right\">（楊喚〈七彩的虹〉）</div></div>", "stem": "根據本詩，下列敘述何者正確？", "opts": ["「美麗的長彩帶」是用擬人法描繪彩虹", "本詩所呈現的氣氛是悠閒、靜態的", "首節「飛跑著的烏雲」是指放晴的徵兆", "次節描寫雨水能夠滋潤萬物、洗淨大地"], "src": "中正114", "ans": "D", "why": "「長彩帶」是比喻不是擬人；氣氛是熱鬧動態；烏雲是下雨不是放晴。"}, {"n": 15, "section": "二、題組（每題 4 分）", "passage": "", "stem": "關於這首詩的寫作手法，下列敘述何者正確？", "opts": ["以擬人手法描寫自然現象，增添詩意與趣味", "運用對話呈現轉折的戲劇張力", "採用反諷手法，暗喻人們對髒亂城市的無力感", "以第一人稱觀點出發，表達雨後美麗彩虹的讚嘆"], "src": "中正114", "ans": "A", "why": "小雨點「坐上」烏雲、「賽跑」、太陽「國王」→ 擬人。"}, {"n": 16, "section": "二、題組（每題 4 分）", "passage": "", "stem": "這首詩和〈夏夜〉同樣是楊喚的作品，兩首詩最明顯的共同寫法是？", "opts": ["大量使用文言句法", "把自然景物當成人來寫（擬人）", "以對話推動情節", "用第一人稱「我」敘述"], "src": "小咪自編", "ans": "B", "why": "兩首詩都把景物當人寫：夏夜「輕輕地爬下來」、小雨點「坐上烏雲、賽跑」→ 擬人。"}, {"n": 17, "section": "三、國字注音（每題 2 分）", "passage": "", "stem": "「闔」上雙眼：闔 ＿＿＿＿（寫注音）", "opts": [], "src": "中正114", "ans": "ㄏㄜˊ", "why": "闔：ㄏㄜˊ，關上。"}, {"n": 18, "section": "三、國字注音（每題 2 分）", "passage": "", "stem": "星光閃「爍」：爍 ＿＿＿＿（寫注音）", "opts": [], "src": "中正114", "ans": "ㄕㄨㄛˋ", "why": "爍：ㄕㄨㄛˋ，光閃動。"}, {"n": 19, "section": "三、國字注音（每題 2 分）", "passage": "", "stem": "「沁」涼暢快：沁 ＿＿＿＿（寫注音）", "opts": [], "src": "中正114", "ans": "ㄑㄧㄣˋ", "why": "沁：ㄑㄧㄣˋ，滲入。"}, {"n": 20, "section": "三、國字注音（每題 2 分）", "passage": "", "stem": "「撒」嬌賣萌：撒 ＿＿＿＿（寫注音）", "opts": [], "src": "中正114", "ans": "ㄙㄚ", "why": "撒：ㄙㄚ，撒嬌。"}, {"n": 21, "section": "三、國字注音（每題 2 分）", "passage": "", "stem": "心情「沮」喪：沮 ＿＿＿＿（寫注音）", "opts": [], "src": "中正114", "ans": "ㄐㄩˇ", "why": "沮：ㄐㄩˇ，沮喪。"}, {"n": 22, "section": "三、國字注音（每題 2 分）", "passage": "", "stem": "山「ㄌㄨㄢˊ」：＿＿＿＿（寫國字）", "opts": [], "src": "小咪自編", "ans": "巒", "why": "山巒：連綿的山。"}, {"n": 23, "section": "三、國字注音（每題 2 分）", "passage": "", "stem": "「ㄇㄥˊ ㄌㄨㄥˊ」地，山巒靜靜地睡了：＿＿＿＿（寫國字）", "opts": [], "src": "小咪自編", "ans": "朦朧", "why": "朦朧：模糊不清。"}, {"n": 24, "section": "三、國字注音（每題 2 分）", "passage": "", "stem": "伸長了「ㄊㄥˊ」蔓：＿＿＿＿（寫國字）", "opts": [], "src": "小咪自編", "ans": "藤", "why" "ans": "C", "why": "Y 是直接穿過細胞膜（磷脂雙層）的方式，只有水、氧氣這種小分子可以。"}, {"n": 27, "section": "三、細胞的構造與物質進出（1-2～1-4、實驗1-2）", "passage": "<div class=\"stem\">◎(甲)濃食鹽水 (乙)生理食鹽水 (丙)蒸餾水，請根據這三瓶溶液回答下列問題：</div>", "stem": "放在何種溶液可觀察到紅血球的雙凹圓盤狀？", "opts": ["甲", "乙", "丙", "三者皆不可能"], "src": "南一 1-4", "ans": "B", "why": "生理食鹽水（等張）→ 正常雙凹狀。"}, {"n": 28, "section": "三、細胞的構造與物質進出（1-2～1-4、實驗1-2）", "passage": "", "stem": "放在何種溶液可觀察到植物細胞脹破的情形？", "opts": ["甲", "乙", "丙", "三者皆不可能"], "src": "南一 1-4", "ans": "D", "why": "植物細胞有細胞壁，在蒸餾水中只會膨脹不會破 → D。"}, {"n": 29, "section": "三、細胞的構造與物質進出（1-2～1-4、實驗1-2）", "passage": "", "stem": "媽媽用鹽巴醃蘿蔔時，發現容器中的水分越來越多，其原因為何？", "opts": ["食鹽吸收空氣中的水分", "蘿蔔細胞內的水分自細胞膜滲出", "食鹽破壞蘿蔔的構造，使水滲出", "蘿蔔本來就會滲出水分，和食鹽無關"], "src": "南一 1-4", "ans": "B", "why": "外面鹽濃度高，水從細胞滲出。"}, {"n": 30, "section": "四、生物體的組成層次・尺度（1-5、1-6）", "passage": "", "stem": "有關草履蟲與瓢蟲的比較，何者正確？", "opts": ["草履蟲和瓢蟲的細胞皆有分工合作現象", "瓢蟲的單一細胞功能比草履蟲多", "草履蟲和瓢蟲皆有「器官」層次", "瓢蟲個體的細胞數目比草履蟲多"], "src": "南一 1-5", "ans": "D", "why": "草履蟲是單細胞、沒有器官層次；瓢蟲多細胞 → D。"}, {"n": 31, "section": "四、生物體的組成層次・尺度（1-5、1-6）", "passage": "", "stem": "乃川到餐廳吃飯時，看到菜單上有四道主廚推薦的料理，請問哪道菜的食材皆為生物體的器官層次？", "opts": ["薑絲豬肝湯", "蛤蜊炒絲瓜", "蔥爆牛肉", "竹筍炒肉絲"], "src": "南一 1-5", "ans": "A", "why": "薑（根莖）、豬肝（器官）都是器官；絲瓜是果實(器官)但蛤蜊肉是組織級；肉絲、牛肉是肌肉組織。"}, {"n": 32, "section": "四、生物體的組成層次・尺度（1-5、1-6）", "passage": "", "stem": "甲、白血球；乙、小腸；丙、表皮；丁、循環系統；戊、豬。請將上述生物構造的層次「由低到高」排列？", "opts": ["甲丙乙丁戊", "戊丁乙丙甲", "戊丙乙丁甲", "丁戊甲丙乙"], "src": "南一 1-5", "ans": "A", "why": "細胞(甲)→組織(丙)→器官(乙)→器官系統(丁)→個體(戊)。"}, {"n": 33, "section": "四、生物體的組成層次・尺度（1-5、1-6）", "passage": "", "stem": "一棵芒果樹上結滿了芒果，且全部的花都已結成果實，則此棵芒果樹目前包括幾種器官？", "opts": ["3 種", "4 種", "5 種", "6 種"], "src": "南一 1-5", "ans": "C", "why": "根、莖、葉、花、果實 = 5 種（種子在果實裡，題目算 5）。"}, {"n": 34, "section": "四、生物體的組成層次・尺度（1-5、1-6）", "passage": "", "stem": "物體的大小會影響使用的單位，下列何者在描述物體距離的使用單位較<u>不適當</u>？", "opts": ["大樓高度──公尺", "細菌大小──公分", "病毒大小──奈米", "金星到地球的距離──光年"], "src": "南一 1-6", "ans": "B", "why": "細菌要用微米。"}, {"n": 35, "section": "四、生物體的組成層次・尺度（1-5、1-6）", "passage": " const L = 'ABCD';

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
  const tabs=document.getElementById('tabs'), main=document.getElementById('main');
  DATA.forEach((set,i)=>{
    const t=document.createElement('button'); t.className='tab'; t.role='tab'; t.id='tab-'+set.key; t.textContent=set.title; t.setAttribute('aria-selected', i===0); t.onclick=()=>show(set.key); tabs.appendChild(t);
    const sec=document.createElement('section'); sec.className='set'+(i===0?' on':''); sec.id='set-'+set.key;
    let h=`<div class="setsub">${esc(set.sub)}　·　${set.items.length} 題　<button class="reset" data-reset="${set.key}">重做這份</button></div>`;
    let lastSec='';
    set.items.forEach(q=>{
      if(q.section && q.section!==lastSec){ h+=`<div class="sec">${esc(q.section)}</div>`; lastSec=q.section; }
      if(q.passage){ h+=`<div class="passage">${q.passage}</div>`; }
      const hasOpts=q.opts.length===4;
      h+=`<article class="q" id="q-${set.key}-${q.n}" data-key="${set.key}" data-n="${q.n}"><div class="num"><span>${q.n}</span><span class="src">${esc(q.src)}</span></div><div class="stem">${q.stem}</div>`;
      if(hasOpts){ h+=`<div class="opts">`+q.opts.map((o,j)=>`<button class="opt" data-k="${L[j]}"><span class="k">${L[j]}</span><span>${o}</span></button>`).join('')+`</div>`; }
      else { h+=`<button class="reveal">看答案</button>`; }
      h+=`<div class="fb"></div></article>`;
    });
    h+=`<div class="done-all">寫完了就往上看分數；想再練一次按「重做這份」🐱</div>`;
    sec.innerHTML=h; main.appendChild(sec);
  });
  main.addEventListener('click',e=>{
    const opt=e.target.closest('.opt'), rev=e.target.closest('.reveal'), rs=e.target.closest('[data-reset]');
    if(rs){ resetSet(rs.dataset.reset); return; }
    const art=e.target.closest('.q'); if(!art) return;
    if(opt && !art.classList.contains('done')) answer(art, opt.dataset.k);
    if(rev && !art.classList.contains('done')) reveal(art);
  });
  updateScore();
}
function getQ(art){ const set=DATA.find(s=>s.key===art.dataset.key); return [set, set.items.find(q=>q.n==art.dataset.n)]; }
function answer(art,k){
  const [set,q]=getQ(art); const ok = k===q.ans;
  art.classList.add('done');
  art.querySelectorAll('.opt').forEach(b=>{ if(b.dataset.k===q.ans) b.classList.add('right'); else if(b.dataset.k===k) b.classList.add('wrong'); });
  art.querySelector('.fb').innerHTML = `<div class="verdict ${ok?'ok':'no'}"><span>${ok?'答對了 ✓':'再想想 ✗'}</span><span class="a">正解 ${esc(q.ans)}</span></div>` + why(q);
  (state[set.key] ||= {})[q.n] = {ok};
  updateScore();
}
function reveal(art){
  const [set,q]=getQ(art); art.classList.add('done');
  art.querySelector('.reveal').hidden = true;
  art.querySelector('.fb').innerHTML = `<div class="verdict ok"><span>答案</span><span class="a" style="font-family:inherit;font-size:16px">${q.ans}</span></div>` + why(q);
  (state[set.key] ||= {})[q.n] = {ok:null};
  updateScore();
}
function why(q){ return q.why ? `<div class="why"><b>為什麼：</b>${esc(q.why)}</div>` : ''; }
function updateScore(){
  const cur=document.querySelector('.set.on'); if(!cur) return;
  const key=cur.id.slice(4); const st=state[key]||{}; const set=DATA.find(s=>s.key===key);
  const done=Object.keys(st).length, ok=Object.values(st).filter(v=>v.ok===true).length, scored=Object.values(st).filter(v=>v.ok!==null).length;
  document.getElementById('score').innerHTML = `<b>${ok}</b>/${scored} 對　·　${done}/${set.items.length} 已作答`;
}
function show(key){
  document.querySelectorAll('.set').forEach(s=>s.classList.toggle('on', s.id==='set-'+key));
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.id==='tab-'+key));
  window.scrollTo({top:0}); updateScore();
}
function resetSet(key){
  state[key]={};
  document.querySelectorAll(`#set-${key} .q`).forEach(a=>{ a.classList.remove('done'); a.querySelectorAll('.opt').forEach(b=>b.classList.remove('right','wrong')); const r=a.querySelector('.reveal'); if(r) r.hidden=false; a.querySelector('.fb').innerHTML=''; });
  updateScore();
}
render();
</script></body>
</html>
