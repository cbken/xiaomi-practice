<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>小咪練習室</title>

<style>

.stuck{margin-top:6px;font-size:13px;color:var(--bad)}
.review{margin-top:10px;background:var(--why);border-left:3px solid var(--good);border-radius:0 8px 8px 0;padding:10px 12px;font-size:14.5px}
.review b{color:var(--good)}
.gate{padding:10px 12px;border-radius:10px;background:var(--accent-soft);margin-bottom:8px}

.pr{padding:16px 0 20px;border-bottom:1px solid var(--line)}
.pr h2{font:700 17px/1.4 "Noto Sans TC",sans-serif;margin:0 0 6px}
.locknote{padding:14px;border:1.5px dashed var(--line);border-radius:12px;color:var(--mute);font-size:14px;text-align:center;margin:10px 0}
.write{width:100%;box-sizing:border-box;min-height:64px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:400 15px/1.5 "Noto Sans TC",sans-serif;background:var(--paper);color:var(--ink)}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
@media (max-width:480px){.chk{grid-template-columns:1fr}}
.chk label{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);font-size:14.5px;cursor:pointer}
.chk label input{margin-top:3px;flex:0 0 auto}

.missrecite{margin:6px 0}
.sol{margin-top:8px}
.sol .st{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.sol .st .cn{flex:0 0 auto;font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px;white-space:nowrap;margin-top:2px}
.hintlist{margin:6px 0 0 18px;font-size:14px}
.ansin{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:400 16px/1.4 "Noto Sans TC",sans-serif;background:var(--paper);color:var(--ink);margin:6px 0}
.widget{margin:6px 0}

.wmsg{font-size:14px;text-align:center;margin-top:4px;min-height:1.4em}

.sig .sg1{font-weight:700}
.sig .sg2{margin-top:2px}
.sig .sg3{margin-top:2px;color:var(--ink)}

.tychk label{align-items:center}
.tyres{margin-top:8px}
.chap{margin:18px 0 8px}

.chprog{font-size:12.5px;font-weight:600;color:var(--mute);background:var(--tab);padding:2px 8px;border-radius:999px}
.secttl{font-size:13.5px;color:var(--mute);margin:12px 0 4px;letter-spacing:.02em}
.cbox{border:1.5px solid var(--line);border-radius:12px;background:var(--paper);margin:6px 0;padding:0}

.rvbox{border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;margin:8px 0 14px;background:var(--accent-soft)}
.rvhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:15px}
.rvsum{font-size:12.5px;color:var(--mute);font-weight:600}

.cbox.failed{border-color:var(--accent)}
.cbox.failed .cmark{color:var(--accent)}
.vol{border:1.5px solid var(--line);border-radius:12px;background:var(--paper);margin:8px 0;padding:0}

.vol[open] summary{border-bottom:1px dashed var(--line)}
.vbody{padding:6px 12px 12px}
.sect{margin:6px 0 10px}
.sectt{font-weight:700;font-size:13.5px;margin:6px 0 2px}
.clist{list-style:none;margin:0;padding:0}
.clist li{display:grid;grid-template-columns:1fr auto;gap:1px 10px;padding:6px 0;border-bottom:1px solid var(--line);align-items:center}
.clist li:last-child{border-bottom:none}
.clist .cn{font-weight:600;font-size:14px}
.clist .co{grid-column:1;font-size:12.5px;color:var(--mute);line-height:1.45}
.clist .tag,.clist .mini{grid-column:2;grid-row:1 / span 2}
.clist li.todo .tag{font-size:11px;color:var(--mute);background:var(--tab);padding:2px 7px;border-radius:999px;white-space:nowrap}
.gbtn.mini{padding:4px 9px;font-size:12.5px;white-space:nowrap}

4.0\" y1=\"35\" x2=\"224.0\" y2=\"45\" stroke=\"#000\"/><text x=\"224.0\" y=\"60\" font-size=\"12\" text-anchor=\"middle\">1</text><line x1=\"258.0\" y1=\"35\" x2=\"258.0\" y2=\"45\" stroke=\"#000\"/><text x=\"258.0\" y=\"60\" font-size=\"12\" text-anchor=\"middle\">2</text><line x1=\"292.0\" y1=\"35\" x2=\"292.0\" y2=\"45\" stroke=\"#000\"/><text x=\"292.0\" y=\"60\" font-size=\"12\" text-anchor=\"middle\">3</text><line x1=\"326.0\" y1=\"35\" x2=\"326.0\" y2=\"45\" stroke=\"#000\"/><text x=\"326.0\" y=\"60\" font-size=\"12\" text-anchor=\"middle\">4</text><line x1=\"360.0\" y1=\"35\" x2=\"360.0\" y2=\"45\" stroke=\"#000\"/><text x=\"360.0\" y=\"60\" font-size=\"12\" text-anchor=\"middle\">5</text><circle cx=\"54.0\" cy=\"40\" r=\"3.5\" fill=\"#000\"/><text x=\"54.0\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\">P(a)</text><circle cx=\"122.0\" cy=\"40\" r=\"3.5\" fill=\"#000\"/><text x=\"122.0\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\">Q(b)</text><circle cx=\"190.0\" cy=\"40\" r=\"3.5\" fill=\"#000\"/><text x=\"190.0\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\">O</text><circle cx=\"258.0\" cy=\"40\" r=\"3.5\" fill=\"#000\"/><text x=\"258.0\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\">R(c)</text><circle cx=\"326.0\" cy=\"40\" r=\"3.5\" fill=\"#000\"/><text x=\"326.0\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\">S(d)</text></svg>", "opts": ["| b | － | c |", "c －b", "| b | ＋ | c |", "| b－d |－| d－c |"], "src": "中正114", "ans": "A", "why": "|c－b|＝c－b＝|b|＋|c|（b 在原點左、c 在右），(A) |b|－|c| 不相等。"}, {"n": 5, "section": "一、選擇題", "passage": "", "stem": "若 a ＜ 0，b ＞ 0，c ＞ 0，d ＜ 0，且 |a| ＞ |b| ＞ |c| ＞ |d|，則下列敘述何者正確？", "opts": ["a ＞ b ＞ c ＞ d", "b ＞ c ＞ a ＞ d", "b ＞ c ＞ d ＞ a", "a ＞ d ＞ c ＞ b"], "src": "中正114", "ans": "C", "why": "a 是負數且絕對值最大 → 最小；b、c 是正數且 b＞c；d 是負數但絕對值最小 → b＞c＞d＞a。"}, {"n": 6, "section": "一、選擇題", "passage": "", "stem": "數線上有 A(5)、B(－11)、C(c) 三點，若 C 為 A、B 的中點，則 c 是多少？", "opts": ["－2", "－3", "－4", "－5"], "src": "江翠113", "ans": "B", "why": "中點＝(5＋(－11))÷2＝－3。"}, {"n": 7, "section": "一、選擇題", "passage": "", "stem": "將 －5、2.5、－(－<span class=\"frac\"><span>1</span><span class=\"d\">2</span></span>)、0、|－6|、(－3) 的相反數 這六個數由小至大排列，哪個選項正確？", "opts": ["|－6| ＜ －5 ＜ 0 ＜ －(－<span class=\"frac\"><span>1</span><span class=\"d\">2</span></span>) ＜ 2.5 ＜ (－3)的相反數", "－5 ＜ 0 ＜ －(－<span class=\"frac\"><span>1</span><span class=\"d\">2</span></span>) ＜ (－3)的相反數 ＜ 2.5 ＜ |－6|", "－5 ＜ 0 ＜ －(－<span class=\"frac\"><span>1</span><span class=\"d\">2</span></span>) ＜ 2.5 ＜ (－3)的相反數 ＜ |－6|", "－5 ＜ －(－<span class=\"frac\"><span>1</span><span class=\"d\">2</span></span>) ＜ 0 ＜ (－3)的相反數 ＜ 2.5 ＜ |－6|"], "src": "江翠113", "ans": "C", "why": "－(－½)＝0.5、(－3)的相反數＝3、|－6|＝6 → －5＜0＜0.5＜2.5＜3＜6。"}, {"n": 8, "section": "一、選擇題", "passage": "", "stem": "在右方 3×3 的方格中填入適當的整數，使橫列、直行及對角線的數字和均相等，則 a＋b＋c＋d＋e＝？<table class=\"g\" style=\"float:right;margin-left:12px\"><tr><td>a</td><td>b</td><td>c</td></tr><tr><td>－5</td><td>－2</td><td>1</td></tr><tr><td>3</td><td>d</td><td>e</td></tr></table>", "opts": ["－15", "－12", "－9", "－6"], "src": "江翠113", "ans": "A", "why": "中央 －2 → 每列和 －6；a＋b＋c＝－6，d＋e＝－6－3＝－9，合計 －15。"}, {"n": 9, "section": "一、選擇題", "passage": "", "stem": "數線上有 A(－7)、B(5)、C(－4)、D(3) 四個點，則下列敘述何者正確？", "opts": ["AB ＝ |(－7)＋5|", "BC ＝ (－4)＋5", "CD ＝ |3－(－4)|", "AD ＝ (－7)－3"], "src": "居仁113", "ans": "C", "why": "CD＝|3－(－4)|＝7 ✓；AB 應是 |－7－5|＝12，(A) 少了絕對值的減法。"}, {"n": 10, "section": "一、選擇題", "passage": "", "stem": "下列敘述何者<u>錯誤</u>？", "opts": ["|a| 表示數線上一點 a 到原點的距離", "若 a、b 互為相反數，則 |a|＝|b|", "在負數中，絕對值愈大，其值愈小", "若 |a| ＞ |b|，則表示 a ＞ b"], "src": "居仁113", "ans": "D", "why": "|a|＞|b| 只代表 a 離原點比較遠，例如 －5 和 3：|－5|＞|3| 但 －5＜3，所以 (D) 錯。"}, {"n": 11, "section": "一、選擇題", "passage": "", "stem": "下列甲～戊的敘述正確者有幾個？<br>甲：如果 a 是一個負數，則 a 到原點的距離等於 －a　　乙：如果 a 是一個負數，則 a 的相反數等於 －a<br>丙：最小的負整數是 －1　　丁：在數線上的點離原點愈遠者，其值愈大　　戊：所有整數中，不是正整數者，就是負整數", "opts": ["5 個", "4 個", "3 個", "2 個"], "src": "向上112", "ans": "D", "why": "甲、乙正確；丙錯（－1 是「最大」的負整數）；丁錯（負數離原點愈遠愈小）；戊錯（0 不是正也不是負）。"}, {"n": 12, "section": "一、選擇題", "passage": "", "stem": "小葵各科分數與某個基準比較的結果如下表，若國文科分數為 83 分，則自然科分數應為多少？<table class=\"g\"><tr><th>科目</th><td>國文</td><td>英語</td><td>數學</td><td>自然</td><td>社會</td></tr><tr><th>與基準的比較</th><td>－2</td><td>＋8</td><td>－11</td><td>＋12</td><td>－4</td></tr></table>", "opts": ["97", "95", "93", "14"], "src": "向上112", "ans": "A", "why": "國文 83＝基準－2 → 基準是 85；自然＋12 → 97。"}, {"n": 13, "section": "一、選擇題", "passage": "", "stem": "下列四個選項中，哪一個的計算結果與其他三個<u>不同</u>？", "opts": ["(－5678)＋(－9876)", "(－5678)－(－9876)", "－(5678＋9876)", "(－5678)－9876"], "src": "向上112", "ans": "B", "why": "(A)(C)(D) 都是 －15554，(B)＝4198。"}, {"n": 14, "section": "一、選擇題", "passage": "", "stem": "若數線上 C(－25) 為 A(a) 與 B(3) 的中點，則 a 為下列哪一個？", "opts": ["－53", "－47", "－11", "31"], "src": "向上112", "ans": "A", "why": "(a＋3)÷2＝－25 → a＝－53。"}, {"n": 15, "section": "一、選擇題", "passage": "", "stem": "在數線上，比 －6<span class=\"frac\"><span>3</span><span class=\"d\">5</span></span> 大但比 5 小的整數中，最大的整數與最小的整數之差為多少？", "opts": ["11", "10", "－11", "－2"], "src": "向上112", "ans": "B", "why": "最大整數 4、最小整數 －6，差 10。"}, {"n": 16, "section": "二、填充題", "passage": "", "stem": "在數線上 －1 與 －2 兩點之間分成 7 等分，則由 －2 向右開始算起，第 4 個等分點所表示的數為 <span class=\"blank\">＿＿＿＿</span>。", "opts": [], "src": "中正114", "ans": "－1<span class=\"frac\"><span>3</span><span class=\"d\">7</span></span>", "why": "每等分 1/7，由 －2 向右 4 格 → －2＋4/7。"}, {"n": 17, "section": "二、填充題", "passage": "", "stem": "絕對值小於 20 的整數共有 <span class=\"blank\">＿＿＿＿</span> 個。", "opts": [], "src": "中正114", "ans": "39", "why": "－19～19 共 39 個。"}, {"n": 18, "section": "二、填充題", "passage": "", "stem": "比較 －3、|－5.2|、0、－3<span class=\"frac\"><span>1</span><span class=\"d\">2</span></span>、5 的大小關係（用 ＞ 連接）：<span class=\"blank\">＿＿＿＿</span>", "opts": [], "src": "中正114", "ans": "|－5.2|＞5＞0＞－3＞－3<span class=\"frac\"><span>1</span><span class=\"d\">2</span></span>", "why": "全部化成小數：|－5.2|＝5.2、5、0、－3、－3.5 → 5.2＞5＞0＞－3＞－3½。"}, {"n": 19, "section": "二、填充題", "passage": "", "stem": "已知數線上 P(－14)、Q(8) 兩點，則 PQ 的中點坐標為 <span class=\"blank\">＿＿＿＿</span>。", "opts": [], "src": "中正114", "ans": "－3", "why": "中點＝(－14＋8)÷2＝－3。"}, {"n": 20, "section": "二、填充題", "passage": "", "stem": "數線上有 A、B 兩點，已知 B 點代表 －8，且 AB＝12，則 A 點代表的數是 <span class=\"blank\">＿＿＿＿</span>。（兩個答案都要寫）", "opts": [], "src": "中正114", "ans": "4，－20", "why": "－8±12。"}, {"n": 21, "section": "二、填充題", "passage": "", "stem": "下圖為 A、B、C、D 四點在數線上的位置（由左而右），坐標為 a、b、c、d。已知 AD＝50，AC＝25，BD＝29，則 | b－c |＝ <span class=\"blank\">＿＿＿＿</span>。<svg width=\"360\" height=\"70\" viewBox=\"0 0 360 70\" style=\"display:block;margin:6px 0\"><line x1=\"10\" y1=\"40\" x2=\"350\" y2=\"40\" stroke=\"#000\" stroke-width=\"1.5\"/><polygon points=\"350,40 342,36 342,44\" fill=\"#000\"/><circle cx=\"52.0\" cy=\"40\" r=\"3.5\" fill=\"#000\"/><text x=\"52.0\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\">A</text><circle cx=\"132.0\" cy=\"40\" r=\"3.5\" fill=\"#000\"/><text x=\"132.0\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\">B</text><circle cx=\"212.0\" cy=\"40\" r=\"3.5\" fill=\"#000\"/><text x=\"212.0\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\">C</text><circle cx=\"308.0\" cy=\"40\" r=\"3.5\" fill=\"#000\"/><text x=\"308.0\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\">D</text></svg>", "opts": [], "src": "中正114", "ans": "4", "why": "CD＝50－25＝25，BC＝29－25＝4。"}, {"n": 22, "section": "二、填充題", "passage": "", "stem": "已知 b 為整數，又 |b| ＜ 7.1，則 b 的可能值有 <span class=\"blank\">＿＿＿＿</span> 個。", "opts": [], "src": "江翠113", "ans": "15", "why": "－7～7 共 15 個。"}, {"n": 23, "section": "二、填充題", "passage": "", "stem": "比 －21<span class=\"frac\"><span>1</span><span class=\"d\">4</span></span> 大，且比 18<span class=\"frac\"><span>3</span><span class=\"d\">8</span></span> 小的所有整數的和為 <span class=\"blank\">＿＿＿＿</span>。", "opts": [], "src": "江翠113", "ans": "－60", "why": "－21～18 全部相加，－18～18 互相抵消，剩 (－21)＋(－20)＋(－19)＝－60。"}, {"n": 24, "section": "二、填充題", "passage": "", "stem": "數線上有 A(－14)、B(b)、C(c) 三點，若 C 為 AB 的中點，而且 AB＝6，則 c 可能為 <span class=\"blank\">＿＿＿＿</span>。", "opts": [], "src": "江翠113", "ans": "－11 或 －17", "why": "B＝－8 或 －20，C 為 A、B 中點 → －11 或 －17。"}, {"n": 25, "section": "二、填充題", "passage": "", "stem": "計算 (－27)－50 ＝ <span class=\"blank\">＿＿＿＿</span>；(－26)＋(－17)－(－13) ＝ <span class=\"blank\">＿＿＿＿</span>；67－(567－93)＋7 ＝ <span class=\"blank\">＿＿＿＿</span>；37－|(－45)＋5| ＝ <span class=\"blank\">＿＿＿＿</span>。", "opts": [], "src": "向上112", "ans": "－77；－30；－400；－3", "why": "－27－50＝－77；－26－17＋13＝－30；67－474＋7＝－400；|(－45)＋5|＝40，37－40＝－3。"}, {"n": 26, "section": "二、填充題", "passage": "", "stem": "數線上有三點 A(a)、B(b)、C(c)，<u>A 在 B 的左側</u>、C 在 B 的右側，已知 AB＝10，若 |a－c|＋|b－c|＝18，則 BC＝ <span class=\"blank\">＿＿＿＿</span>。", "opts": [], "src": "向上112", "ans": "4", "why": "|a－c|＝AC＝10＋BC、|b－c|＝BC → 10＋2BC＝18 → BC＝4。（⚠️ 若沒有「A 在 B 左側」這個條件，A 也可能在 B、C 中間 → BC＝14 也成立，所以原卷是附圖的）"}, {"n": 27, "section": "二、填充題", "passage": "", "stem": "數線上有 A、B、C、D 四點，A 與 B 相距 10 單位，B 與 C 相距 3 單位，C 與 D 相距 5 單位，且 A 與 D 的位置最接近，則 A 與 D 的距離為 <span class=\"blank\">＿＿＿＿</span>。", "opts": [], "src": "向上112", "ans": "2 或 8", "why": "把 A 放 0：B＝±10、C＝B±3、D＝C±5。「A 與 D 最接近」＝D 比 B、C 都更靠近 A。B=10,C=7,D=2（AD=2＜7＜10）✓；B=10,C=13,D=8（AD=8＜10＜13）✓ → 兩個都要寫（原卷註明「全對才給分」）。"}, {"n": 28, "section": "二、填充題", "passage": "", "stem": "柯南要步美向右移動 6 個單位、光彥向左移動 5 個單位、元太向右移動 11 個單位、灰原向左移動 10 個單位，移動後四人都能與柯南集合。若柯南所在位置坐標為 －7，則其他四人<u>原來</u>位置坐標之總和為 <span class=\"blank\">＿＿＿＿</span>。", "opts": [], "src": "居仁113", "ans": "－30", "why": "步美 －13、光彥 －2、元太 －18、灰原 3，和 －30。（居仁／向上兩校的卷沒附解答，這幾題答案是小咪核算的）"}, {"n": 29, "section": "三、作圖與計算（要寫過程）", "passage": "", "stem": "請在下方數線上標記各點的位置（含符號及坐標）：A(－4)、B(－2<span class=\"frac\"><span>1</span><span class=\"d\">4</span></span>)、C(－0.5)、D(<span class=\"frac\"><span>3</span><span class=\"d\">7</span></span>)。<svg width=\"420\" height=\"70\" viewBox=\"0 0 420 70\" style=\"display:block;margin:6px 0\"><line x1=\"10\" y1=\"40\" x2=\"410\" y2=\"40\" stroke=\"#000\" stroke-width=\"1.5\"/><polygon points=\"410,40 402,36 402,44\" fill=\"#000\"/><line x1=\"20.0\" y1=\"35\" x2=\"20.0\" y2=\"45\" stroke=\"#000\"/><text x=\"20.0\" y=\"60\" font-size=\"12\" text-anchor=\"middle\">-4</text><line x1=\"96.0\" y1=\"35\" x2=\"96.0\" y2=\"45\" stroke=\"#000\"/><text x=\"96.0\" y=\"60\" font-size=\"12\" text-anchor=\"middle\">-3</text><line x1=\"172.0\" y1=\"35\" x2=\"172.0\" y2=\"45\" stroke=\"#000\"/><text x=\"172.0\" y=\"60\" font-size=\"12\" text-anchor=\"middle\">-2</text><line x1=\"248.0\" y1=\"35\" x2=\"248.0\" y2=\"45\" stroke=\"#000\"/><text x=\"248.0\" y=\"60\" font-size=\"12\" text-anchor=\"middle\">-1</text><line x1=\"324.0\" y1=\"35\" x2=\"324.0\" y2=\"45\" stroke=\"#000\"/><text x=\"324.0\" y=\"60\" font-size=\"12\" text-anchor=\"middle\">0</text><line x1=\"400.0\" y1=\"35\" x2=\"400.0\" y2=\"45\" stroke=\"#000\"/><text x=\"400.0\" y=\"60\" font-size=\"12\" text-anchor=\"middle\">1</text></svg>", "opts": [], "src": "江翠113 素養題", "ans": "A(－4)、B(－2¼) 在 －3 與 －2 之間偏 －2、C(－0.5) 在 －1 與 0 正中間、D(3/7) 在 0 與 1 之間，3/7≈0.43，略小於中點（不要畫到 0.2 那麼左邊）。", "why": "-4-3-2-101ABCD"}, {"n": 30, "section": "三、作圖與計算（要寫過程）", "passage": "", "stem": "7 年 23 班某次數學小考全班 10 人以 75 分為標準，計算「分數－75」的值如下表：<table class=\"g\"><tr><th>座號</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td></tr><tr><th>分數－75</th><td>0</td><td>5</td><td>－5</td><td>－20</td><td>－15</td><td>10</td><td>20</td><td>15</td><td>－20</td><td>0</td></tr></table>(1) 算出上表中「分數－75」的值之總和。　(2) 利用 (1) 的結果，求該次小考的平均分數。　(3) 11 號轉學生要考多少分，全班平均才能提高 2 分？", "opts": [], "src": "中正114 計算題", "ans": "(1) －10　(2) 75＋(－10)÷10＝74 分　(3) 11 人平均要 76 分 → 總分 836，原總分 740 → 96 分", "why": "(1) 全部加起來 －10。(2) 平均＝75＋(－10)÷10＝74。(3) 11 人平均 76 → 總分 836，原總分 740 → 要考 96。"}, {"n": 31, "section": "三、作圖與計算（要寫過程）", "passage": "", "stem": "已知 8 個學生數學考試得分與全班平均分數的差如下表，若丁生得 72 分：<table class=\"g\"><tr><th>學生</th><td>甲</td><td>乙</td><td>丙</td><td>丁</td><td>戊</td><td>己</td><td>庚</td><td>辛</td></tr><tr><th>與平均的差</th><td>20</td><td>－1</td><td>14</td><td>－5</td><td>12</td><td>－4</td><td>－7</td><td>3</td></tr></table>(1) 全班平均分數是幾分？　(2) 戊生得幾分？　(3) 8 位學生中最高分和最低分相差幾分？　(4) 這 8 位學生的平均分數是多少？", "opts": [], "src": "居仁113 非選題", "ans": "(1) 72－(－5)＝77 分　(2) 77＋12＝89 分　(3) 甲 97、庚 70，相差 27 分　(4) 差的總和 32 → 77＋32÷8＝81 分", "why": "(1) 丁 72 分＝平均－5 → 平均 77。(2) 戊＝77＋12＝89。(3) 甲 97 最高、庚 70 最低，差 27。(4) 差的總和 32 → 77＋32÷8＝81。"}]}, {"key": "eng", "title": "妹妹・英文", "sub": "康軒 B1 L1  Who's That Young Man?", "items": [{"n": 1, "section": "一、文法選擇", "passage": "", "stem": "The book on my table ______ not thin（薄的）.", "opts": ["is", "are", "am", "be"], "src": "康軒L1講義", "ans": "A", "why": "主詞是 The book（單數）→ is。"}, {"n": 2, "section": "一、文法選擇", "passage": "", "stem": "Amy: ______ the books on the table great?　Cindy: Yes.", "opts": ["Isn't", "Aren't", "What are", "How are"], "src": "康軒L1講義", "ans": "B", "why": "主詞 the books 複數 → Aren't。"}, {"n": 3, "section": "一、文法選擇", "passage": "", "stem": "Ella: Is that boy your friend?　Cindy: Yes, ______.", "opts": ["you are", "it is", "he is", "he's"], "src": "康軒L1講義", "ans": "C", "why": "that boy → he；肯定簡答不能縮寫，所以不選 (D)。"}, {"n": 4, "section": "一、文法選擇", "passage": "", "stem": "Lucy is ______ girl. She's beautiful.", "opts": ["tall", "a tall", "tall a", "tall the"], "src": "康軒L1講義", "ans": "B", "why": "形容詞放名詞前要加冠詞：a tall girl。"}, {"n": 5, "section": "一、文法選擇", "passage": "", "stem": "A: Are you a farmer?　B: ______ I'm a doctor.", "opts": ["Yes, I am.", "Yes, you are.", "No, I'm not.", "No, it isn't."], "src": "康軒L1講義", "ans": "C", "why": "後面說「我是醫生」→ 否定簡答。"}, {"n": 6, "section": "一、文法選擇", "passage": "", "stem": "______ doctor is tall. Her name is Lisa.", "opts": ["An", "The", "A", "╳"], "src": "康軒L1講義", "ans": "B", "why": "已知是誰的 doctor → 用 the。"}, {"n": 7, "section": "一、文法選擇", "passage": "", "stem": "A: Is John a good student?　B: ______ He's a good student.", "opts": ["Yes, he is.", "Yes, it is.", "No, he isn't.", "He is."], "src": "康軒L1講義", "ans": "A", "why": "後面接著說「他是好學生」→ 肯定簡答 Yes, he is."}, {"n": 8, "section": "一、文法選擇", "passage": "", "stem": "A: Who's the boy?　B: He's ______.", "opts": ["Ms. Jones", "friend", "a student", "my classmate"], "src": "康軒L1講義", "ans": "D", "why": "Who 問「姓名或關係」，不能只回答職業，(C) a student 是職業。"}, {"n": 9, "section": "一、文法選擇", "passage": "", "stem": "Hank: Isn't your sister tall?　Jerry: ______", "opts": ["Yes, she is short.", "No, she is tall.", "No, the tall girl is my sister.", "Yes, she is tall."], "src": "康軒L1講義", "ans": "D", "why": "Isn't...? 回答仍看事實：她高 → Yes, she is tall."}, {"n": 10, "section": "一、文法選擇", "passage": "", "stem": "Kate: ______ John your brother or cousin?　Gina: ______ is my brother.", "opts": ["Is; No, he", "Are; No, he", "Is; He", "Are; He"], "src": "康軒L1講義", "ans": "C", "why": "John 單數 → Is；答句主詞用 He。"}, {"n": 11, "section": "一、文法選擇", "passage": "", "stem": "Fred: Are you a cook?　Lily: Yes, ______.", "opts": ["we are", "I'm", "I am", "we're"], "src": "康軒L1講義", "ans": "C", "why": "問 you 用 I 答；肯定簡答不能縮寫 → Yes, I am."}, {"n": 12, "section": "一、文法選擇", "passage": "", "stem": "Sara: ______ the toy in the box red?　Bill: Yes.", "opts": ["╳", "Are", "Is", "Be"], "src": "康軒L1講義", "ans": "C", "why": "主詞 the toy（單數）→ Is。in the box 只是修飾。"}, {"n": 13, "section": "一、文法選擇", "passage": "", "stem": "The man with glasses（戴眼鏡） ______ tall.", "opts": ["╳", "are", "is", "be"], "src": "康軒L1講義", "ans": "C", "why": "主詞是 The man（單數），with glasses 是修飾 → is。"}, {"n": 14, "section": "一、文法選擇", "passage": "", "stem": "Emma: Aren't your cars new?　Danny: ______, they are old.", "opts": ["Yes", "No", "Right", "╳"], "src": "康軒L1講義", "ans": "B", "why": "事實是舊的 → No。"}, {"n": 15, "section": "一、文法選擇", "passage": "", "stem": "Lei: ______?　Jay: No, my pen is red.", "opts": ["Is this your pen", "Is this a pen", "Is this a red pen", "Is your pen red"], "src": "康軒L1講義", "ans": "A", "why": "「No, my pen is red.」＝這支不是我的、我的是紅的 → 問的是 Is this your pen?；若問 Is your pen red? 答 No 又說是紅的會矛盾（9/13 訂正：原標 D 是錯的）。"}, {"n": 16, "section": "一、文法選擇", "passage": "", "stem": "Claire: ______ is the girl in the classroom?　Peter: She is Tom's friend Lily.", "opts": ["Where", "Who", "What", "How"], "src": "康軒L1講義", "ans": "B", "why": "問「是誰」用 Who。"}, {"n": 17, "section": "一、文法選擇", "passage": "", "stem": "Vicky: ______?　Sam: He is my brother, John.", "opts": ["Who is the tall boy", "What is your brother's name", "How old is your brother", "Is the tall boy your brother"], "src": "康軒L1講義", "ans": "A", "why": "答句「他是我哥哥 John」是回答姓名/關係 → 問 Who is the tall boy?"}, {"n": 18, "section": "一、文法選擇", "passage": "", "stem": "The new clerk is ______. He is twenty-two years old.", "opts": ["hard", "more", "young", "clean"], "src": "中正114", "ans": "C", "why": "young 年輕的（22 歲）。"}, {"n": 19, "section": "一、文法選擇", "passage": "", "stem": "Betty: ______ happy?　Kenny: No, I'm not. I am angry.", "opts": ["Is he", "Is she", "Are they", "Are you"], "src": "中正114", "ans": "D", "why": "答句 No, I'm not. → 問句主詞是 you → Are you happy?"}, {"n": 20, "section": "一、文法選擇", "passage": "", "stem": "May: What is that in your hand?　Oliver: ______ my key.", "opts": ["This is", "They're", "These are", "Those are"], "src": "中正114", "ans": "A", "why": "一把鑰匙（單數）、在手上（近）→ This is my key."}, {"n": 21, "section": "一、文法選擇", "passage": "", "stem": "Mike: Is that your frog?　Stella: No, ______.", "opts": ["it is", "it isn't", "that is", "they aren't"], "src": "中正114", "ans": "B", "why": "that 在答句換成 it。"}, {"n": 22, "section": "一、文法選擇", "passage": "", "stem": "I am a(n) ______ student in Taipei（台北）.", "opts": ["India", "father", "late", "junior high school"], "src": "中正114改", "ans": "D", "why": "a(n) 後面要接名詞：junior high school student 國中生。"}, {"n": 23, "section": "二、克漏字", "passage": "<div class=\"stem\">Hello, my name <b>(23)</b> Eddie. I am a junior high school student. This is my <b>(24)</b>. Joe is my father. He is <b>(25)</b>. Kim is my mother. She is a police officer. Tim is <b>(26)</b> brother. He is twelve years old. Rita is my sister. She is only <b>(27)</b>. She is cute.<br><span style=\"font-size:9.5pt;color:#555\">police officer 警察　only 只有</span></div>", "stem": "", "opts": ["be", "is", "am", "are"], "src": "康軒L1講義", "ans": "B", "why": "My name ______ Eddie：主詞 name 單數 → is。"}, {"n": 24, "section": "二、克漏字", "passage": "", "stem": "", "opts": ["problem", "school", "family", "name"], "src": "康軒L1講義", "ans": "C", "why": "後面在介紹爸爸、媽媽、哥哥、妹妹 → This is my family."}, {"n": 25, "section": "二、克漏字", "passage": "", "stem": "", "opts": ["teach", "teacher", "teachers", "a teacher"], "src": "康軒L1講義", "ans": "D", "why": "職業要加 a：a teacher。"}, {"n": 26, "section": "二、克漏字", "passage": "", "stem": "", "opts": ["your", "my", "our", "his"], "src": "康軒L1講義", "ans": "B", "why": "Tim 是「我的」哥哥 → my brother。"}, {"n": 27, "section": "二、克漏字", "passage": "", "stem": "", "opts": ["five-year-old girl", "girl of five", "five years old", "five years"], "src": "康軒L1講義", "ans": "C", "why": "be 動詞後接「數字 years old」；five-year-old 只能放名詞前。"}, {"n": 28, "section": "三、填空", "passage": "", "stem": "填入 a 或 an：(1) This is ____ book.　(2) He is not ____ English teacher.　(3) Is this ____ apple?　(4) Are you ____ doctor?　(5) ____ mouse　(6) ____ egg", "opts": [], "src": "康軒L1講義", "ans": "a book／an English teacher／an apple／a doctor／a mouse／an egg", "why": "（看「第一個音」是不是母音）"}, {"n": 29, "section": "三、填空", "passage": "", "stem": "寫出縮略語：(1) you are ＝ ______　(2) I am ＝ ______　(3) are not ＝ ______　(4) he is not ＝ ______ 或 ______", "opts": [], "src": "康軒L1講義", "ans": "you're／I'm／aren't／he isn't 或 he's not", "why": "you are→you're、I am→I'm、are not→aren't、he is not→he isn't 或 he's not（am not 不能縮寫）。"}, {"n": 30, "section": "三、填空", "passage": "", "stem": "引導式翻譯：我是一位護士，我也是一位學生。<br>I'm a ________, and I'm a student, ________.", "opts": [], "src": "康軒L1講義", "ans": "nurse, too", "why": "「也」用 too，放句尾、前面加逗號。"}, {"n": 31, "section": "三、填空", "passage": "", "stem": "A：Ivy，你是一位英文老師嗎？　B：不，我不是。我是一位廚師。<br>A: Ivy, ________ you ________ English teacher?　B: No, I'm not. I'm ________ ________.", "opts": [], "src": "康軒L1講義", "ans": "are, an／a cook", "why": "English 母音開頭 → an English teacher；cook 子音開頭 → a cook。"}, {"n": 32, "section": "三、填空", "passage": "", "stem": "那個高高的男人是你的數學老師嗎？<br>Is the ________ ________ your math teacher?", "opts": [], "src": "康軒L1講義", "ans": "tall man", "why": "形容詞 tall 放在名詞 man 前面：the tall man。"}, {"n": 33, "section": "三、填空", "passage": "", "stem": "Ed 是我們的寵物狗。<br>Ed is ________ ________ dog.", "opts": [], "src": "康軒L1講義", "ans": "our pet", "why": "「我們的」our ＋ pet dog。"}, {"n": 34, "section": "三、填空", "passage": "", "stem": "A：Peter 是誰？　B：他是我的朋友。<br>A: ________ ________ Peter?　B: He is ________ friend.", "opts": [], "src": "康軒L1講義", "ans": "Who is (Who's)／my", "why": "問人用 Who is…?；「我的朋友」my friend。"}, {"n": 35, "section": "四、依提示作答", "passage": "", "stem": "nurse. / is / beautiful / Amy / a（重組句子）<br><span class=\"blank\">＿＿＿＿</span>", "opts": [], "src": "康軒L1講義", "ans": "Amy is a beautiful nurse.", "why": "冠詞 a ＋ 形容詞 beautiful ＋ 名詞 nurse：Amy is a beautiful nurse."}, {"n": 36, "section": "四、依提示作答", "passage": "", "stem": "be / Emily / tall / girl（完成句子）<br><span class=\"blank\">＿＿＿＿</span>", "opts": [], "src": "康軒L1講義", "ans": "Emily is a tall girl.", "why": "be 動詞用 is；a tall girl。"}, {"n": 37, "section": "四、依提示作答", "passage": "", "stem": "Yes, <u>she is a math teacher</u>.（依畫線部分造原問句）<br><span class=\"blank\">＿＿＿＿</span>", "opts": [], "src": "康軒L1講義", "ans": "Is she a math teacher?", "why": "畫線部分是「a math teacher」→ 用 Is she a math teacher? 來問。"}, {"n": 38, "section": "四、依提示作答", "passage": "", "stem": "Is Jason a cook?（先否定簡答，再以「農夫」詳答）<br><span class=\"blank\">＿＿＿＿</span>", "opts": [], "src": "康軒L1講義", "ans": "No, he isn't. He is a farmer.", "why": "否定簡答 No, he isn't. 再詳答 He is a farmer."}, {"n": 39, "section": "四、依提示作答", "passage": "", "stem": "Who is that man at the door?（用「我的叔叔」作答）<br><span class=\"blank\">＿＿＿＿</span>", "opts": [], "src": "康軒L1講義", "ans": "He is my uncle.", "why": "Who 問人 → 用關係回答：He is my uncle."}, {"n": 40, "section": "四、依提示作答", "passage": "", "stem": "整句翻譯：Anne 是我的朋友。Logan 也是我的朋友。<br><span class=\"blank\">＿＿＿＿</span>", "opts": [], "src": "康軒L1講義", "ans": "Anne is my friend. Logan is my friend, too.", "why": "第二句用 too 表示「也」：Logan is my friend, too."}]}, {"key": "eng7np", "title": "妹妹・英文補洞", "sub": "先念三步驟：要不要 a/an（看發音）→ 一個還是很多個（-s）→ 數字-year-old 當形容詞要連字號、year 不加 s。A 組 20 題、B 組 5 題、C 組 15 題（考古卷錯的）、D 組 3 題填空。答錯的 2 天後會回來再考一次。", "items": [{"n": 1, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "My mom works at home. She is a(n) _____.", "opts": ["housewife", "farmer", "clerk", "actress"], "ans": "A", "why": "「在家工作」→ housewife 家庭主婦。順便練冠詞：housewife 開頭是子音 /h/，所以要說 a housewife；如果選 actress，開頭是母音 /æ/，就要說 an actress。", "src": "冠詞 a/an（延伸練習；原題官方考點為字義）"}, {"n": 2, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "I am a(n) _____ student in Zhong Zheng(中正).", "opts": ["India", "father", "late", "junior high school"], "ans": "D", "why": "中正是國中，所以是 a junior high school student。順便練冠詞：junior 開頭發 /dʒ/ 是子音，所以用 a 不是 an。", "src": "冠詞 a/an（延伸練習；原題官方考點為字義）"}, {"n": 3, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "May: What is that in your hand?\nOliver: _____ my key.", "opts": ["This is", "They&#x27;re", "These are", "Those are"], "ans": "A", "why": "訊號是 my key 只有一支（單數），所以動詞要用 is、前面要用單數的 This。(B) They're、(C) These are、(D) Those are 都是複數，配不上一支 key。東西在自己手上用 This，離自己遠才用 That。", "src": "單數／複數"}, {"n": 4, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "Q: What are those?\nA: _____ elephants.", "opts": ["They are", "Those aren&#x27;t", "This is", "That is"], "ans": "A", "why": "訊號是 those 和 elephants 都是複數，所以要用複數的 They are。This is / That is 是單數，配不上 elephants。", "src": "單數／複數"}, {"n": 5, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "There ______ some hard-working ______ in the Jump Rope Area.（第32題選 There 後面的字）", "opts": ["have", "is", "are", "be"], "ans": "C", "why": "訊號是後面 some hard-working players 是複數，所以 There 後面要用 are。「有」要用 There is/are，不用 have。", "src": "單數／複數"}, {"n": 6, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "There (32) some hard-working ______ in the Jump Rope Area.（第33題選空格的名詞）", "opts": ["water", "players", "spiders", "shoulders"], "ans": "B", "why": "There are 後面一定要接複數可數名詞，water 不可數先刪掉。這是跳繩場地，所以是 players（選手），而且 player 要加 s 變複數。", "src": "單數／複數"}, {"n": 7, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "（聽力）What is there under the tree?", "opts": ["It&#x27;s under the tree.", "There is a monkey.", "It is big and strong."], "ans": "B", "why": "問「樹下有什麼」，要回答 There is + a + 單數名詞。a monkey 一隻猴子，a 不能省略，這就是名詞前面要放的東西。", "src": "單數／複數"}, {"n": 8, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "Look! Some people (39) , and some kids (39) .", "opts": ["to draw ; to play", "is drawing ; are playing", "draw ; play", "are drawing ; are playing"], "ans": "D", "why": "訊號是 Some people 和 some kids 都是複數，兩個空格都要用 are。前面有 Look! 表示正在發生，所以用 are + V-ing。", "src": "單數／複數"}, {"n": 9, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "_____ poop do we need? A: We need three buckets.", "opts": ["How many", "Which", "What", "How much"], "ans": "D", "why": "poop 是不可數名詞，不能加 s、也不能用 How many 數，所以要用 How much。要數的時候就像答案一樣用 three buckets（桶）。", "src": "單數／複數"}, {"n": 10, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "_____ pieces of paper can that make? A: About 20.", "opts": ["How much", "How many", "What", "Which"], "ans": "B", "why": "訊號是 pieces 有 s，是可數的複數，所以用 How many。paper 本身不可數，但 piece 可數，所以數的是 pieces。", "src": "單數／複數"}, {"n": 11, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "Mom needs two ______ eggs to make a big cake for my birthday.", "opts": ["dozen", "dozens", "dozens of", "dozen of"], "ans": "A", "why": "數字後面接 dozen 時，dozen 不加 s、也不加 of，直接說 two dozen eggs。和 a thirty-year-old man 一樣：前面有數字，中間那個字就保持單數。", "src": "單數／複數"}, {"n": 12, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "The new clerk is _____. He is twenty-two years old.", "opts": ["hard", "more", "young", "clean"], "ans": "C", "why": "訊號是第二句 He is twenty-two years old.，二十二歲很年輕，所以選 young。注意這裡放在 be 動詞後面當述語，years 要加 s、也沒有連字號；改成放在名詞前面就要寫 a twenty-two-year-old clerk。", "src": "數字-year-old 當形容詞"}, {"n": 13, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "Mary: Who is he?\nHenry: He is _____.", "opts": ["a hippo", "a place", "my friend", "a daughter"], "ans": "C", "why": "問 Who 是問「人」，he 是男生。a hippo 是河馬、a place 是地方、a daughter 是女兒，都不行，所以是 my friend。名詞前面放 my 表示「我的」。", "src": "the / my / this 等限定詞"}, {"n": 14, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "（聽力）Who&#x27;s that girl?", "opts": ["She&#x27;s my sister.", "She&#x27;s 19 years old.", "She&#x27;s from America."], "ans": "A", "why": "Who 問的是「她是誰」，要回答身分關係，名詞前面加 my 說成 my sister。(B) 19 years old 是回答 How old，(C) 是回答 Where is she from，都答非所問。", "src": "the / my / this 等限定詞"}, {"n": 15, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "（聽力）Where is your bag?", "opts": ["There is a bag.", "It is not my bag.", "It is in my bedroom."], "ans": "C", "why": "Where 問地點，要回答在哪裡。答案用 in my bedroom，bedroom 前面放 my，表示是「我的」房間，不能只說 in bedroom。", "src": "the / my / this 等限定詞"}, {"n": 16, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "Q: Are there ______ hippos in Taipei Zoo?\nA: Yes, there are ______ hippos in Taipei Zoo.", "opts": ["any ; some", "any ; any", "some ; some", "some ; any"], "ans": "A", "why": "問句習慣用 any、肯定的回答用 some，這是課本的固定搭配。some / any 是在講「一些」的數量，問「動物園裡有沒有河馬」用 any，回答「有一些」用 some。", "src": "the / my / this 等限定詞"}, {"n": 17, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "Leo: Perfect. I&#x27;ll go to the bookstore to pick a card (32) afternoon.", "opts": ["on this", "in", "evey", "this"], "ans": "D", "why": "this afternoon 是「時間」，前面不加 in 也不加 on。時間名詞前面放了 this / that / every / next / last，介系詞就要拿掉：this morning、every day、next week。注意這條只管時間，講地點的 on this table、in this room 介系詞還是要留著。", "src": "the / my / this 等限定詞"}, {"n": 18, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "We don&#x27;t know ______ well. We just met (見面) today.", "opts": ["together", "each other", "them", "other"], "ans": "B", "why": "「彼此」要用 each other 兩個字一組，當受詞用。other 不能單獨站著當受詞，要嘛 each other、要嘛 the other、要嘛 others。", "src": "代名詞：each other"}, {"n": 19, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "Hank is very thirsty after the race. He is drinking a bottle of water, and he wants _____one.", "opts": ["each", "other", "another", "the other"], "ans": "C", "why": "他已經喝了一瓶，還想「再來一瓶」，沒有指定是哪一瓶，所以用 another（an + other）。the other 是兩個裡面剩下的那一個，這裡不只兩瓶。", "src": "the / my / this 等限定詞"}, {"n": 20, "section": "A 組・名詞前面要放什麼", "passage": "", "stem": "Nina: How can we go to the night market?\nEmma: We can take Bus 219 to the train station. Then, we can go there ______ metro.", "opts": ["on a", "in", "by the", "by"], "ans": "D", "why": "by ＋ 交通工具是固定用法，中間不加 a 也不加 the，直接說 by metro、by bus、by car、by train。加了 a 或 the 就錯了。順便記：走路是例外，要說 on foot。", "src": "the / my / this 等限定詞"}, {"n": 21, "section": "B 組・否定疑問句與 be 動詞問句", "passage": "", "stem": "Betty: _____ happy?\nKenny: No, I&#x27;m not. I am angry.", "opts": ["Is he", "Is she", "Are they", "Are you"], "ans": "D", "why": "訊號在回答 No, I'm not.，回答的人說「我」，所以問的一定是「你」，要用 Are you。be 動詞問句把 be 動詞搬到最前面：You are happy. → Are you happy?", "src": "be 動詞問句字序"}, {"n": 22, "section": "B 組・否定疑問句與 be 動詞問句", "passage": "", "stem": "Mike: Is that your frog?\nStella: No, _____.", "opts": ["it is", "it isn&#x27;t", "that is", "they aren&#x27;t"], "ans": "B", "why": "用 Is that...? 問，簡答要把 that 換成 it，而且說了 No 後面就要否定，所以是 No, it isn't。青蛙只有一隻，不能用 they。", "src": "be 動詞問句簡答"}, {"n": 23, "section": "B 組・否定疑問句與 be 動詞問句", "passage": "", "stem": "（聽力）Is your wife a doctor?", "opts": ["No, she is my wife.", "Yes, she is a doctor.", "Yes, she is an English teacher."], "ans": "B", "why": "Is your wife...? 要用 she 來回答。說 Yes 就要跟問句一致，所以是 Yes, she is a doctor.。(C) 說 Yes 卻改成 an English teacher，自相矛盾。順便看：doctor 用 a、English 用 an。", "src": "be 動詞問句簡答"}, {"n": 24, "section": "B 組・否定疑問句與 be 動詞問句", "passage": "", "stem": "（聽力）Is everything okay?", "opts": ["All is well.", "I get it.", "Excuse me."], "ans": "A", "why": "Is everything okay? 是 be 動詞問句，在問「一切都還好嗎」，要回答狀況，所以選 All is well.（都很好）。everything 當單數看，所以用 Is 不是 Are。", "src": "be 動詞問句回應"}, {"n": 25, "section": "B 組・否定疑問句與 be 動詞問句", "passage": "", "stem": "______ is your mouse? Isn&#x27;t it under your jacket?", "opts": ["Who", "What", "Where", "How old"], "ans": "C", "why": "第二句 Isn't it under your jacket?（不是在你外套下面嗎）在猜位置，所以第一句是問地點，用 Where。否定疑問句 Isn't it...? 就是 Is it...? 加上 not 縮寫，字序一樣是 be 動詞在最前面。", "src": "否定疑問句"}, {"n": 26, "section": "C 組・考古卷錯題重做（兩天後再做一次）", "passage": "", "stem": "This is my aunt, Debra. She is ____________.", "opts": ["pretty woman", "a very pretty", "a pretty woman", "very woman"], "ans": "C", "why": "單數可數名詞前面一定要有 a：a ＋ 形容詞 ＋ 名詞 → a pretty woman。", "src": "名詞片語：冠詞＋形容詞＋名詞"}, {"n": 27, "section": "C 組・考古卷錯題重做（兩天後再做一次）", "passage": "", "stem": "A: What&#x27;s this? B: __________.", "opts": ["It&#x27;s skirt", "They&#x27;re boxes", "A uniform", "This mask"], "ans": "C", "why": "問一個東西，回答要是「a ＋ 單數名詞」：A uniform。(A) 少了 a，(B) 是複數。順便記：uniform 唸起來是 /j/ 子音開頭，所以是 a uniform 不是 an uniform——a/an 看發音不看字母。", "src": "名詞片語：What's this? 的回答"}, {"n": 28, "section": "C 組・考古卷錯題重做（兩天後再做一次）", "passage": "", "stem": "Mr. and Mrs. Lee are both __________ in a big computer company.", "opts": ["offices workers", "offices worker", "office worker", "office workers"], "ans": "D", "why": "兩個人 → 要複數；複合名詞只有最後一個字加 s：office workers。", "src": "名詞片語：複合名詞的複數"}, {"n": 29, "section": "C 組・考古卷錯題重做（兩天後再做一次）", "passage": "", "stem": "My brother, Tim, is a __________ car salesperson. He sells new cars by showing and introducing the cars.", "opts": ["thirty-years-old", "thirty years old", "thirty-year-old", "thirty year old"], "ans": "C", "why": "放在名詞前面當形容詞：數字-year-old，要連字號、year 不加 s。", "src": "數字-year-old 當形容詞"}, {"n": 30, "section": "C 組・考古卷錯題重做（兩天後再做一次）", "passage": "", "stem": "Look! My mother is over there. She is __________.", "opts": ["nice mom", "pretty a woman", "a kind mom", "woman pretty"], "ans": "C", "why": "a ＋ 形容詞 ＋ 名詞，順序不能倒，也不能少 a：a kind mom。", "src": "名詞片語：冠詞＋形容詞＋名詞"}, {"n": 31, "section": "C 組・考古卷錯題重做（兩天後再做一次）", "passage": "", "stem": "Where are __________? Please help me find them out. I need to use them next class.", "opts": ["my color pencil", "a ruler and an eraser", "the dictionaries", "red pens"], "ans": "C", "why": "後面說 them（複數）→ 要複數；「找特定的那幾本」用 the：the dictionaries。(A) 單數，(D) 少了限定詞。", "src": "限定詞 the / my"}, {"n": 32, "section": "C 組・考古卷錯題重做（兩天後再做一次）", "passage": "", "stem": "A: Is this ________ orange sweet? B: No, it&#x27;s ________ sour orange.", "opts": ["X ; X", "an ; a", "a ; an", "X ; a"], "ans": "D", "why": "this 後面直接接名詞、不再加 a/an；「一顆酸橘子」a sour orange（sour 是子音開頭用 a）。", "src": "冠詞 a / an / 不加"}, {"n": 33, "section": "C 組・考古卷錯題重做（兩天後再做一次）", "passage": "", "stem": "Jamie: She is an elementary school student. My brother is just ________ baby.", "opts": ["one year old", "one years old", "a one-year-old", "an one-year-old"], "ans": "C", "why": "名詞 baby 前面 → a one-year-old；one 唸起來是 /w/ 子音開頭，用 a 不用 an。", "src": "數字-year-old 當形容詞"}, {"n": 34, "section": "C 組・考古卷錯題重做（兩天後再做一次）", "passage": "", "stem": "In my family, I am ________ mom.", "opts": ["a fifty-two-year-old", "a fifty-two-years-old", "fifty-two", "fifty-two years old"], "ans": "A", "why": "mom 前面當形容詞 → a fifty-two-year-old mom；year 不加 s。", "src": "數字-year-old 當形容詞"}, {"n": 35, "section": "C 組・考古卷錯題重做（兩天後再做一次）", "passage": "", "stem": "A: ____________ your mother? B: ____________ She&#x27;s just my dad&#x27;s friend.", "opts": ["Is the nurse not; No, she&#x27;s not.", "Is Lisa; Yes, she is.", "Is not the lady; No, she isn&#x27;t.", "Isn&#x27;t the woman; No, she is."], "ans": "A", "why": "not 放在主詞後面：Is the nurse not…?（或 Isn't the nurse…?）；她「只是朋友」所以回答是 No。(C) 字序錯，(D) 前後矛盾。", "src": "否定疑問句字序"}, {"n": 36, "section": "C 組・考古卷錯題重做（兩天後再做一次）", "passage": "", "stem": "A: __________ your aunt? B: __________.", "opts": ["Is the nurse not; No, she&#x27;s not", "Is Lisa; Yes, she&#x27;s", "Is not the lady; No, she isn&#x27;t", "Isn&#x27;t the woman; No, she is"], "ans": "A", "why": "同上一題：Is ＋ 主詞 ＋ not；簡答 Yes, she is／No, she's not。(B) 句尾不能用 she's 縮寫。", "src": "否定疑問句字序"}, {"n": 37, "section": "C 組・考古卷錯題重做（兩天後再做一次）", "passage": "", "stem": "Owen&#x27;s mother is not a teacher. My mom is not a teacher, ____________.", "opts": ["too", "also", "either", "together"], "ans": "C", "why": "否定句的「也」用 either，肯定句才用 too。", "src": "句型：too / either"}, {"n": 38, "section": "C 組・考古卷錯題重做（兩天後再做一次）", "passage": "", "stem": "A: ____________ is your uncle? B: He is a taxi driver.", "opts": ["Who", "What", "How", "How old"], "ans": "B", "why": "回答是職業 → 問 What is he?；Who 是問「他是誰（哪一個人）」。", "src": "句型：問職業用 What"}, {"n": 39, "section": "C 組・考古卷錯題重做（兩天後再做一次）", "passage": "", "stem": "His jobs ________ delivering food and answering phone calls.", "opts": ["is", "are", "is about", "are for"], "ans": "B", "why": "主詞 jobs 是複數 → are。", "src": "句型：複數主詞配 are"}, {"n": 40, "section": "C 組・考古卷錯題重做（兩天後再做一次）", "passage": "", "stem": "Our restaurant is between the public library ________ the city hospital.", "opts": ["of", "near", "to", "and"], "ans": "D", "why": "between 一定配 and：between A and B。", "src": "句型：between A and B"}, {"n": 41, "section": "D 組・填空：a/an ＋ 複數", "passage": "", "stem": "填入 a 或 an，再寫出複數：_____ mouse → 複數 __________", "opts": [], "ans": "a mouse → mice", "why": "mouse 子音開頭用 a；複數是不規則的 mice。", "src": "冠詞 a/an ＋ 複數"}, {"n": 42, "section": "D 組・填空：a/an ＋ 複數", "passage": "", "stem": "填入 a 或 an，再寫出複數：_____ egg → 複數 __________", "opts": [], "ans": "an egg → eggs", "why": "egg 母音開頭用 an；複數直接加 s。", "src": "冠詞 a/an ＋ 複數"}, {"n": 43, "section": "D 組・填空：a/an ＋ 複數", "passage": "", "stem": "填入 a 或 an，再寫出複數：_____ bus → 複數 __________", "opts": [], "ans": "a bus → buses", "why": "bus 子音開頭用 a；字尾 s 的複數加 es。", "src": "冠詞 a/an ＋ 複數"}], "drill": true}, {"key": "chi", "title": "妹妹・國文", "sub": "L1〈夏夜〉＋ 語一 標點符號", "items": [{"n": 1, "section": "一、選擇題", "passage": "", "stem": "下列各組「」中的注音寫成國字後，何組字形兩兩相同？", "opts": ["「ㄏㄨˊ」蝶飛舞／做事「ㄏㄨˊ」塗", "甜言「ㄇㄧˋ」語／「ㄇㄧˋ」切相關", "「ㄒㄧㄚˊ」不掩瑜／好整以「ㄒㄧㄚˊ」", "大排長「ㄌㄨㄥˊ」／「ㄌㄨㄥˊ」飛鳳舞"], "src": "中正114", "ans": "D", "why": "龍／龍相同；蝴／糊、蜜／密、瑕／暇 不同。"}, {"n": 2, "section": "一、選擇題", "passage": "", "stem": "閱讀新詩，要能領會詩中的情感，下列有關〈夏夜〉情境感覺的敘述何者正確？", "opts": ["「綠色的小河」與「夜風」，都給人夏夜豐富美麗的感覺", "「只有窗外瓜架上的南瓜還醒著，伸長了藤蔓輕輕地往屋頂上爬」呈現出寧靜中的生機", "「小弟弟夢見他變做一條魚在藍色的大海裡游水」凸顯小弟弟緊張不安的情緒", "「羊隊和牛群告別了田野回家了」代表動物的傷感不捨之情"], "src": "中正114", "ans": "B", "why": "南瓜「還醒著」「往屋頂上爬」＝寧靜中的生機。"}, {"n": 3, "section": "一、選擇題", "passage": "", "stem": "下列成語皆與「星」或「月」有關，何者使用正確？", "opts": ["此處的海域中，到處都是「星羅棋布」的珊瑚礁，令人目不暇給", "那位偶像歌手在眾多歌迷的簇擁下走出會場，形成一幅「物換星移」的畫面", "在「月黑風高」的夜晚獨自漫步，欣賞月色，真是愜意的事", "小時候去玩耍的空地如今已蓋了高樓，真是「披星戴月」，人事已非"], "src": "中正114", "ans": "A", "why": "星羅棋布＝分布眾多；物換星移是時光變遷；月黑風高是險惡之夜；披星戴月是早出晚歸。"}, {"n": 4, "section": "一、選擇題", "passage": "", "stem": "「撒了滿天的珍珠和一枚又大又亮的銀幣」這段詩句描寫的時間點，與下列何者相同？", "opts": ["太陽像一團火，晒在河面上，連流動著的河水，都給晒得熱氣蒸人", "皎潔的月，光芒萬丈，似乎有將整個天空照亮的雄心壯志", "旭日披著烈烈的酒氣上升，將一種無限的醉意朝田野上面遼闊的天空，酣暢的播散開", "在那太陽沉下去的水天交界的地方，卻還殘留著一抹淡淡的紅暈"], "src": "中正114", "ans": "B", "why": "珍珠＝星星、銀幣＝月亮 → 夜晚，只有 (B) 寫月亮。"}, {"n": 5, "section": "一、選擇題", "passage": "", "stem": "「蝴蝶和蜜蜂們帶著花朵的蜜糖回來了，／羊隊和牛群告別了田野回家了，／火紅的太陽也滾著火輪子回家了。」這段詩句在景物的呈現上，是採「由近到遠」的作法，下列何者與之相同？", "opts": ["那冰屑就像雪花一般，一片一片飛落盤中，俄頃堆積成一座小冰山", "來了！來了！／從山坡上輕輕地爬下來了。／來了！來了！／從椰子樹梢上輕輕地爬下來了", "書齋外面是陽臺，陽臺外面是海，是山，海是碧湛湛的一彎，山是青鬱鬱的連環", "微風拂過，稻浪一波波起伏，從遠遠的天邊，簇擁到操場上的青草，教室的玻璃上也染上了一層綠意"], "src": "中正114", "ans": "C", "why": "由近到遠：書齋→陽臺→海→山。(D) 是由遠到近。"}, {"n": 6, "section": "一、選擇題", "passage": "", "stem": "「來了！來了！／從山坡上輕輕地爬下來了。」詩中「爬下來」的是誰？", "opts": ["小弟弟", "夜風", "夏夜", "螢火蟲"], "src": "小咪自編", "ans": "C", "why": "「來了」的是夏夜本身（擬人）。"}, {"n": 7, "section": "一、選擇題", "passage": "", "stem": "〈夏夜〉後半反覆出現「只有……還醒著」，這種寫法最主要的效果是？", "opts": ["突顯夜深人靜中仍有生機與動態", "表示夏夜很吵鬧", "說明大家都失眠了", "強調時間過得很快"], "src": "小咪自編", "ans": "A", "why": "大家都睡了，只有南瓜、小河、夜風「還醒著」→ 用對比突顯夜深人靜中仍有生機。"}, {"n": 8, "section": "一、選擇題", "passage": "", "stem": "「小妹妹夢見她變做蝴蝶在大花園裡忽東忽西地飛」，「忽東忽西」是在形容？", "opts": ["蝴蝶飛得很慢", "飛行方向不定、自由自在", "蝴蝶迷路了", "蝴蝶很害怕"], "src": "小咪自編", "ans": "B", "why": "「忽東忽西」＝一下往東一下往西，寫蝴蝶飛得自由、方向不定。"}, {"n": 9, "section": "一、選擇題", "passage": "", "stem": "下列文句中的標點符號，何者使用正確？", "opts": ["每一刻都是一個新起點、每一次與人握手都是一個承諾、一個表示內心平和的記號。", "鯨魚是獸類，不是魚類；蝙蝠是獸類，不是鳥類。", "我不是跟你說過嗎、要得到好成績，不用功是不行的。為何你總是置若罔聞？", "文明的現代：戰爭仍然層出不窮，不禁令人懷疑—歷史是前進的，抑或倒退的。"], "src": "中正114（語一，改自108會考）", "ans": "B", "why": "(A) 頓號應改逗號；(C) 「嗎」後要問號；(D) 冒號用錯。"}, {"n": 10, "section": "一、選擇題", "passage": "", "stem": "下列何者是「長揚」在邀約「子舒」一起去運動場打籃球？", "opts": ["長揚、子舒打球去，你去不去？", "長揚，子舒打球去，你去不去？", "長揚：「子舒打球去，你去不去？」", "長揚：「子舒，打球去，你去不去？」"], "src": "中正114（語一）", "ans": "D", "why": "稱呼後用逗號，說話內容用冒號＋引號：長揚：「子舒，打球去……」。"}, {"n": 11, "section": "一、選擇題", "passage": "", "stem": "下列句子的標點符號，何者使用正確？", "opts": ["媽媽問我：「今天功課寫完了嗎？」", "媽媽問我，「今天功課寫完了嗎」？", "媽媽問我：「今天功課寫完了嗎」？", "媽媽問我：今天功課寫完了嗎？"], "src": "小咪自編（語一）", "ans": "A", "why": "說話者後面用冒號、引述的話用引號包起來，問號放在引號裡面 →(A)。(B) 冒號寫成逗號、(C) 問號跑到引號外、(D) 沒有引號。"}, {"n": 12, "section": "一、選擇題", "passage": "", "stem": "下列「頓號」的用法，何者正確？", "opts": ["我喜歡蘋果、香蕉、芒果。", "我喜歡蘋果、和香蕉。", "我喜歡、蘋果香蕉。", "我喜歡蘋果，香蕉，芒果。"], "src": "小咪自編（語一）", "ans": "A", "why": "頓號用在並列的詞語之間（蘋果、香蕉、芒果）；(B) 有「和」就不用頓號。"}, {"n": 13, "section": "一、選擇題", "passage": "", "stem": "下列句子的空格，何者最適合填入「分號」？", "opts": ["天氣冷了＿記得多穿衣服。", "鯨魚是獸類，不是魚類＿蝙蝠是獸類，不是鳥類。", "你叫什麼名字＿", "這裡的風景太美了＿"], "src": "小咪自編（語一）", "ans": "B", "why": "分號用在並列的兩個分句之間。"}, {"n": 14, "section": "二、題組", "passage": "<div class=\"stem\"><div class=\"poem\">接到了太陽國王的大掃除的命令，\n小雨點們就都坐上飛跑著的烏雲，\n賽跑著離開了天上的宮廷。\n\n他們給稻田和小河加足了水，\n他們給骯髒的山谷洗過了澡，\n就又來洗淨了清道夫永遠也掃不完的城市，\n也洗淨了悶熱的飛滿了塵土的天空。\n\n太陽國王為了獎賞他們真能幹，\n就送給他們一條美麗的長彩帶，\n那就是掛在明亮的雨後的天空中的\n紅、橙、黃、綠、青、藍、紫的七彩的虹。</div><div style=\"text-align:right\">（楊喚〈七彩的虹〉）</div></div>", "stem": "根據本詩，下列敘述何者正確？", "opts": ["「美麗的長彩帶」是用擬人法描繪彩虹", "本詩所呈現的氣氛是悠閒、靜態的", "首節「飛跑著的烏雲」是指放晴的徵兆", "次節描寫雨水能夠滋潤萬物、洗淨大地"], "src": "中正114", "ans": "D", "why": "「長彩帶」是比喻不是擬人；氣氛是熱鬧動態；烏雲是下雨不是放晴。"}, {"n": 15, "section": "二、題組", "passage": "", "stem": "關於這首詩的寫作手法，下列敘述何者正確？", "opts": ["以擬人手法描寫自然現象，增添詩意與趣味", "運用對話呈現轉折的戲劇張力", "採用反諷手法，暗喻人們對髒亂城市的無力感", "以第一人稱觀點出發，表達雨後美麗彩虹的讚嘆"], "src": "中正114", "ans": "A", "why": "小雨點「坐上」烏雲、「賽跑」、太陽「國王」→ 擬人。"}, {"n": 16, "section": "二、題組", "passage": "", "stem": "這首詩和〈夏夜〉同樣是楊喚的作品，兩首詩最明顯的共同寫法是？", "opts": ["大量使用文言句法", "把自然景物當成人來寫（擬人）", "以對話推動情節", "用第一人稱「我」敘述"], "src": "小咪自編", "ans": "B", "why": "兩首詩都把景物當人寫：夏夜「輕輕地爬下來」、小雨點「坐上烏雲、賽跑」→ 擬人。"}, {"n": 17, "section": "三、國字注音", "passage": "", "stem": "「闔」上雙眼：闔 ＿＿＿＿（寫注音）", "opts": [], "src": "中正114", "ans": "ㄏㄜˊ", "why": "闔：ㄏㄜˊ，關上。"}, {"n": 18, "section": "三、國字注音", "passage": "", "stem": "星光閃「爍」：爍 ＿＿＿＿（寫注音）", "opts": [], "src": "中正114", "ans": "ㄕㄨㄛˋ", "why": "爍：ㄕㄨㄛˋ，光閃動。"}, {"n": 19, "section": "三、國字注音", "passage": "", "stem": "「沁」涼暢快：沁 ＿＿＿＿（寫注音）", "opts": [], "src": "中正114", "ans": "ㄑㄧㄣˋ", "why": "沁：ㄑㄧㄣˋ，滲入。"}, {"n": 20, "section": "三、國字注音", "passage": "", "stem": "「撒」嬌賣萌：撒 ＿＿＿＿（寫注音）", "opts": [], "src": "中正114", "ans": "ㄙㄚ", "why": "撒：ㄙㄚ，撒嬌。"}, {"n": 21, "section": "三、國字注音", "passage": "", "stem": "心情「沮」喪：沮 ＿＿＿＿（寫注音）", "opts": [], "src": "中正114", "ans": "ㄐㄩˇ", "why": "沮：ㄐㄩˇ，沮喪。"}, {"n": 22, "section": "三、國字注音", "passage": "", "stem": "山「ㄌㄨㄢˊ」：＿＿＿＿（寫國字）", "opts": [], "src": "小咪自編", "ans": "巒", "why": "山巒：連綿的山。"}, {"n": 23, "section": "三、國字注音", "passage": "", "stem": "「ㄇㄥˊ ㄌㄨㄥˊ」地，山巒靜靜地睡了：＿＿＿＿（寫國字）", "opts": [], "src": "小咪自編", "ans": "朦朧", "why": "朦朧：模糊不清。"}, {"n": 24, "section": "三、國字注音", "passage": "", "stem": "伸長了「ㄊㄥˊ」蔓：＿＿＿＿（寫國字）", "opts": [], "src": "小咪自編", "ans": "藤", "why": "藤蔓：植物細長會攀爬的莖。"}, {"n": 25, "section": "四、注釋", "passage": "", "stem": "山巒：＿＿＿＿＿＿＿＿＿＿＿＿", "opts": [], "src": "中正114", "ans": "連綿的山峰", "why": "〈夏夜〉：「朦朧地，山巒靜靜地睡了」。"}, {"n": 26, "section": "四、注釋", "passage": "", "stem": "「闔」上雙眼：＿＿＿＿＿＿＿＿＿＿", "opts": [], "src": "中正114", "ans": "閉合", "why": "闔上雙眼＝把眼睛閉起來。"}, {"n": 27, "section": "四、注釋", "passage": "", "stem": "朦朧：＿＿＿＿＿＿＿＿＿＿＿＿", "opts": [], "src": "中正114", "ans": "模糊不清的樣子", "why": "看不清楚的樣子。"}, {"n": 28, "section": "四、注釋", "passage": "", "stem": "憩歇：＿＿＿＿＿＿＿＿＿＿＿＿", "opts": [], "src": "中正114", "ans": "休息", "why": "憩＝休息。"}]}, {"key": "bio", "ti , "opts": ["甲", "乙", "丙", "三者皆不可能"], "src": "對應南一 1-4", "ans": "D", "why": "植物細胞有細胞壁，在蒸餾水中只會膨脹不會破 → D。"}, {"n": 29, "section": "三、細胞的構造與物質進出（1-2～1-4、實驗1-2）", "passage": "", "stem": "媽媽用鹽巴醃蘿蔔時，發現容器中的水分越來越多，其原因為何？", "opts": ["食鹽吸收空氣中的水分", "蘿蔔細胞內的水分自細胞膜滲出", "食鹽破壞蘿蔔的構造，使水滲出", "蘿蔔本來就會滲出水分，和食鹽無關"], "src": "對應南一 1-4", "ans": "B", "why": "外面鹽濃度高，水從細胞滲出。"}, {"n": 30, "section": "四、生物體的組成層次・尺度（1-5、1-6）", "passage": "", "stem": "有關草履蟲與瓢蟲的比較，何者正確？", "opts": ["草履蟲和瓢蟲的細胞皆有分工合作現象", "瓢蟲的單一細胞功能比草履蟲多", "草履蟲和瓢蟲皆有「器官」層次", "瓢蟲個體的細胞數目比草履蟲多"], "src": "對應南一 1-5", "ans": "D", "why": "草履蟲是單細胞、沒有器官層次；瓢蟲多細胞 → D。"}, {"n": 31, "section": "四、生物體的組成層次・尺度（1-5、1-6）", "passage": "", "stem": "乃川到餐廳吃飯時，看到菜單上有四道主廚推薦的料理，請問哪道菜的食材皆為生物體的器官層次？", "opts": ["薑絲豬肝湯", "蛤蜊炒絲瓜", "蔥爆牛肉", "竹筍炒肉絲"], "src": "對應南一 1-5", "ans": "A", "why": "薑（根莖）、豬肝（器官）都是器官；絲瓜是果實(器官)但蛤蜊肉是組織級；肉絲、牛肉是肌肉組織。"}, {"n": 32, "section": "四、生物體的組成層次・尺度（1-5、1-6）", "passage": "", "stem": "甲、白血球；乙、小腸；丙、表皮；丁、循環系統；戊、豬。請將上述生物構造的層次「由低到高」排列？", "opts": ["甲丙乙丁戊", "戊丁乙丙甲", "戊丙乙丁甲", "丁戊甲丙乙"], "src": "對應南一 1-5", "ans": "A", "why": "細胞(甲)→組織(丙)→器官(乙)→器官系統(丁)→個體(戊)。"}, {"n": 33, "section": "四、生物體的組成層次・尺度（1-5、1-6）", "passage": "", "stem": "一棵芒果樹上結滿了芒果，且全部的花都已結成果實，則此棵芒果樹目前包括幾種器官？", "opts": ["3 種", "4 種", "5 種", "6 種"], "src": "對應南一 1-5", "ans": "C", "why": "題目說「全部的花都已結成果實」→ 樹上已經沒有花。剩下根、莖、葉、果實、種子 ＝ 5 種。"}, {"n": 34, "section": "四、生物體的組成層次・尺度（1-5、1-6）", "passage": "", "stem": "物體的大小會影響使用的單位，下列何者在描述物體距離的使用單位較<u>不適當</u>？", "opts": ["大樓高度──公尺", "細菌大小──公分", "病毒大小──奈米", "金星到地球的距離──光年"], "src": "對應南一 1-6", "ans": "B", "why": "細菌要用微米。", "notyet": "學校還沒教到（1-6 尺度），先跳過，教到再做"}, {"n": 35, "section": "四、生物體的組成層次・尺度（1-5、1-6）", "passage": "", "stem": "下圖為顯微鏡下跳蚤的照片，依圖中比例尺推算，跳蚤的實際長度約為何？<div style=\"margin:4px 0 0 22px\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAIAAACyr5FlAAAAAXNSR0IArs4c6QAAAHhlWElmTU0AKgAAAAgABAEaAAUAAAABAAAAPgEbAAUAAAABAAAARgEoAAMAAAABAAIAAIdpAAQAAAABAAAATgAAAAAAAABuAAAAAQAAAG4AAAABAAOgAQADAAAAAQABAACgAgAEAAAAAQAAALSgAwAEAAAAAQAAALQAAAAA3C8 WEBBxmzWCfplEISS5sj2ghCCq10QKmUzYyuA2nm3CzVLCsZ133nm2KkC58847XwqQQSEN3a0wG71LMhJBXd3KuBZbMrxbIAAaBFASNBQMMZIS9MFTMvKBgiapze14VwJYR/zbW8JwQtJ4fBrYaswZszwjoe6CA/ZmBiW6lo+Bgxt5mVCGIEBx1ST4cJWXFKIJVvBRrmQhw0kv4hjBB5TMzMwoKfhbCOeJt22u54jNXJMpKHFb8tRXzXMhSkIfzSafJx1wUNSdfLWkVI2UwR/CLGHOzr3mAx/pqyrVSAwbRdxQcDRKRwOEiSuyg/XeF2QIdS8dsMiQW3AMMP38VTxHnqd4piN88ZoPR1KWrfnbN5uiobuVZitto3SzYUzn0BYgwILbyEIWj7KRbjpzLTim027LInWjdyvLooG2k74aaMHRVzVtRQuOFgN9NdCCo69q2ooWHC0G+mqgBUdf1bQVLThaDPTVQAuOvqppK/4/wjcVWG3GZE8AAAAASUVORK5CYII=\" style=\"width:150px;max-width:100%\"></div>", "opts": ["2.5 毫米", "6.25 毫米", "2.5 公分", "6.25 公分"], "src": "對應南一 1-6", "ans": "A", "why": "比例尺 1mm，跳蚤約 2.5 個比例尺長 → 2.5 毫米。", "notyet": "學校還沒教到（1-6 尺度），先跳過，教到再做"}]}, {"key": "bio7c", "title": "妹妹・生物填空卡", "sub": "不要看課本。看到題目先「自己說出答案」（說出來或寫下來），再按「看答案」，誠實選「我記得」或「我忘了」。忘了的 2 天後會回來再考。每天 10 張、5 分鐘。", "items": [{"n": 1, "section": "染色", "passage": "", "stem": "用亞甲藍液把細胞染色，是為了讓哪一個構造看得更清楚？", "opts": [], "ans": "細胞核", "why": "亞甲藍液會把細胞核染成深藍色，口腔皮膜細胞不染色幾乎看不到核。亞甲藍液也可以用碘液代替。", "src": ""}, {"n": 2, "section": "染色", "passage": "", "stem": "口腔皮膜細胞為什麼要染色才看得清楚？洋蔥表皮細胞不染色能看到什麼？", "opts": [], "ans": "口腔皮膜細胞透明、沒有顏色，不染看不清；洋蔥表皮不染色也看得到細胞壁的輪廓，但細胞核一樣要染才明顯。", "why": "有細胞壁的植物細胞本來就有格子狀輪廓。", "src": ""}, {"n": 3, "section": "三種細胞比較", "passage": "", "stem": "洋蔥鱗葉表皮細胞、洋蔥綠葉的保衛細胞、口腔皮膜細胞，三者的「細胞壁」和「葉綠體」各是有還是沒有？", "opts": [], "ans": "細胞壁：洋蔥鱗葉表皮「有」、保衛細胞「有」、口腔皮膜「沒有」。葉綠體：洋蔥鱗葉表皮「沒有」、保衛細胞「有」、口腔皮膜「沒有」。（三者都有：細胞核、細胞膜、細胞質、粒線體）", "why": "一句話記：只有口腔皮膜（動物）沒有細胞壁，只有保衛細胞有葉綠體。洋蔥鱗葉是埋在土裡的白色部分，不行光合作用，所以沒有葉綠體。注意「洋蔥綠葉的表皮」裡面還有一般的表皮細胞，那些也是沒有葉綠體的，只有半月形、兩兩成對的保衛細胞才有。", "src": ""}, {"n": 4, "section": "三種細胞比較", "passage": "", "stem": "三種細胞都有的構造是哪三個？", "opts": [], "ans": "細胞膜、細胞質、細胞核（三者也都有粒線體）", "why": "這三個是這三種細胞都有的，而且三者也都有粒線體；細胞壁、葉綠體才是只有部分細胞有。（例外要記：人成熟的紅血球沒有細胞核，所以壽命只有約 120 天）", "src": ""}, {"n": 5, "section": "細胞發現史", "passage": "", "stem": "誰第一個用顯微鏡看到並命名「細胞」？他看的是什麼材料？看到的其實是什麼？", "opts": [], "ans": "虎克；軟木塞薄片；死細胞留下的細胞壁（空格子）", "why": "所以動物細胞（沒有細胞壁）用他的方法看不到那種格子——軟木塞、樹皮、木質地板上看得到，滷雞腿上看不到。", "src": ""}, {"n": 6, "section": "細胞發現史", "passage": "", "stem": "「所有生物都由細胞組成、細胞是生物的基本單位」這個說法叫什麼？", "opts": [], "ans": "細胞學說", "why": "由兩位科學家分別從植物和動物提出（人名譯法以課本為準，不用背）。", "src": ""}, {"n": 7, "section": "科學方法", "passage": "", "stem": "科學方法的五個步驟依序是？", "opts": [], "ans": "觀察 → 提出問題 → 提出假說 → 設計實驗（並進行）→ 討論並提出結論", "why": "口訣：觀問假實論。「提出假說」和「形成假說」是同一件事，「討論並提出結論」和「提出結論」也是，考卷兩種都出現過，看到哪一種都要認得。", "src": ""}, {"n": 8, "section": "科學方法", "passage": "", "stem": "實驗組和對照組之間只能有幾個條件不同？其他條件要怎樣？", "opts": [], "ans": "只能有一個（操作變因）不同；其他條件（控制變因）全部一樣；實驗觀察的項目叫應變變因", "why": "差兩個以上就不知道是哪一個造成結果。三個變因一起記：操作變因＝故意改的那一個；控制變因＝保持一樣的；應變變因＝你在觀察、測量的結果。", "src": ""}, {"n": 9, "section": "科學方法", "passage": "", "stem": "「一個人喝了飲料瘦 2 公斤」為什麼不能證明飲料有效？", "opts": [], "ans": "人數太少（樣本太少），難以下定論；而且沒有對照組", "why": "要多人、要有沒喝飲料的對照組才能比較。", "src": ""}, {"n": 10, "section": "細胞構造", "passage": "", "stem": "細胞裡負責產生能量的構造是？控制物質進出的是？含遺傳物質、控制細胞活動的是？", "opts": [], "ans": "粒線體；細胞膜；細胞核", "why": "粒線體位於細胞質中，行呼吸作用、產生能量，如同細胞的發電廠；細胞核被核膜包圍、內含遺傳物質 DNA，是細胞的生命中樞；細胞膜控制物質進出，是細胞與環境的分界。", "src": ""}, {"n": 11, "section": "細胞構造", "passage": "", "stem": "植物細胞有、動物細胞沒有的兩個構造是？", "opts": [], "ans": "細胞壁、葉綠體（注意：葉綠體只有植物的「綠色細胞」才有）", "why": "細胞壁支持並保護、維持細胞形狀，主要由纖維素組成；葉綠體含葉綠素、行光合作用製造養分。液泡動物細胞也有，不是植物專有，只是植物的液泡大得多——這個字是「液泡」不是「液胞」。", "src": ""}, {"n": 12, "section": "生物特性", "passage": "", "stem": "判斷「是不是生物」看哪些特性？（至少說四個）", "opts": [], "ans": "能代謝、生長、感應、生殖（繁殖）", "why": "隕石、龍眼乾都不具備這些。課本寫得更完整：代謝、生長與發育、感應與運動、生殖。", "src": ""}, {"n": 13, "section": "生物圈", "passage": "", "stem": "生物圈的定義是什麼？把地球比成蘋果的話，生物圈是哪一層？", "opts": [], "ans": "地球上所有生物體和其賴以生存的空間；比成蘋果就是「果皮」那層（不是果肉、不是果梗）。", "why": "生物圈不是整顆地球，就是地表附近薄薄一層。課本圖上的數字是「海平面向上約 10000 公尺、向下也約 10000 公尺」——記「上、下各 10000 公尺」，不要記成「總共 10000 公尺」，考卷很愛在這裡設陷阱。另外，某一種生物滅絕並不會讓生物圈的範圍變小。", "src": ""}, {"n": 14, "section": "顯微鏡口訣", "passage": "", "stem": "念一遍：倍率愈高 → ？ ？ ？ ？", "opts": [], "ans": "視野愈小、愈暗、看到的細胞愈少、物鏡愈長", "why": "想看整個、看更亮 → 用低倍；想看細節 → 才用高倍。", "src": ""}, {"n": 15, "section": "顯微鏡口訣", "passage": "", "stem": "總倍率怎麼算？目鏡 10×、物鏡 40× 是幾倍？", "opts": [], "ans": "目鏡 × 物鏡；400 倍", "why": "是相乘不是相加。", "src": ""}, {"n": 16, "section": "顯微鏡口訣", "passage": "", "stem": "影像模糊要轉哪個輪？視野太暗要調哪裡？", "opts": [], "ans": "細調節輪（高倍時）；光圈或反光鏡", "why": "粗調節輪是低倍時找影像用的。換成高倍物鏡以後，絕對不能再轉粗調節輪，只能轉細調節輪，不然會壓破玻片。", "src": ""}, {"n": 17, "section": "顯微鏡口訣", "passage": "", "stem": "用「複式顯微鏡」時，視野裡的東西在右下角，玻片要往哪裡移才會到中央？", "opts": [], "ans": "往右下移，跟你看到的方向一樣。（但用「解剖顯微鏡」時相反，要往左上移）", "why": "複式顯微鏡是「平面反像」，影像上下顛倒、左右相反，所以玻片往右下推，影像就往左上跑回中央，記成「東西在哪邊，玻片就推哪邊」。解剖顯微鏡是「立體正像」，方向跟實物一樣，所以要往反方向移，看到東西在左下就把它往右上移。", "src": ""}, {"n": 18, "section": "顯微鏡口訣", "passage": "", "stem": "載玻片上寫「p」，在複式顯微鏡裡看到什麼？", "opts": [], "ans": "d（上下左右都顛倒，等於轉 180°）；但用解剖顯微鏡看還是 p。", "why": "不是鏡像，是旋轉 180°。", "src": ""}, {"n": 19, "section": "顯微鏡種類", "passage": "", "stem": "要看蜜蜂的觸角、花的雄蕊數目（立體、不透光的東西）用哪種顯微鏡？看細胞壁用哪種？", "opts": [], "ans": "解剖顯微鏡；複式顯微鏡", "why": "解剖顯微鏡倍率低、看立體外形；複式看薄、透光的細胞。", "src": ""}, {"n": 20, "section": "顯微鏡種類", "passage": "", "stem": "找不到目標時要先用高倍還是低倍？", "opts": [], "ans": "先用低倍找到、移到中央，再換高倍", "why": "低倍視野大好找。", "src": ""}, {"n": 21, "section": "顯微鏡計算", "passage": "", "stem": "顯微鏡下量到某小生物的像長 0.9 公分，目鏡 10×、物鏡 10×，牠的實際大小是多少？", "opts": [], "ans": "0.9 ÷ 100 = 0.009 公分", "why": "實際大小 = 影像大小 ÷ 總倍率。總倍率是 10×10 = 100 倍，所以是「除以 100」不是「乘以 100」——愈放大，實物其實愈小。", "src": ""}, {"n": 22, "section": "顯微鏡計算", "passage": "", "stem": "400 倍下看到 32 個細胞，改成 800 倍（倍率變兩倍），大約會看到幾個？", "opts": [], "ans": "8 個（變成四分之一）", "why": "倍率變 2 倍，視野的長和寬各縮成一半，面積就只剩 1/4，所以細胞數目除以 4，不是除以 2。倍率變 2 倍→細胞剩 1/4，倍率變 4 倍→細胞剩 1/16。", "src": ""}, {"n": 23, "section": "顯微鏡種類", "passage": "", "stem": "解剖顯微鏡看到的影像是正的還是反的？東西在視野左下角，要往哪邊移才會到中央？", "opts": [], "ans": "是「立體正像」，方向和實物一樣；東西在左下角，要把它往右上移", "why": "複式顯微鏡是「平面反像」，玻片跟你看到的方向「同方向」推；解剖顯微鏡是「立體正像」，要往「相反方向」移。兩台的規則剛好相反，別套錯。", "src": ""}, {"n": 24, "section": "顯微鏡操作", "passage": "", "stem": "已經用低倍找到目標了，要換高倍，正確的四個步驟依序是？", "opts": [], "ans": "① 先把目標移到視野正中央 ② 轉旋轉盤換上高倍物鏡 ③ 只轉細調節輪對焦 ④ 視野變暗就放大光圈或調反光鏡", "why": "換高倍後絕對不能轉粗調節輪，會壓破玻片。順序口訣：移中央 → 換物鏡 → 細調節輪 → 補光。", "src": ""}, {"n": 25, "section": "三種細胞比較", "passage": "", "stem": "保衛細胞長什麼樣子？幾個一組？負責什麼？要不要染色才看得到葉綠體？", "opts": [], "ans": "半月形，兩兩成對，中間夾著氣孔、負責控制氣孔開閉（氣體進出）；不用染色就看得到裡面綠色的葉綠體", "why": "保衛細胞是葉的下表皮裡唯一有葉綠體的細胞，葉綠體本來就是綠色的，所以不必染色就看得見——這點考卷很常拿來跟「口腔皮膜要染色才看得到細胞核」對比著考。", "src": ""}], "drill": true, "cards": true}, {"key": "emo", "title": "姊姊・情緒動詞", "sub": "15 校九上段考 + 會考，50 題全官方解答", "items": [{"n": 1, "section": "一、選擇題（每題 2 分）", "passage": "", "stem": "The movie \"Demon Slayer: Kimetsu no Yaiba\" really ______ me. I couldn't stop thinking of it last night.", "opts": ["surprise", "surprised", "was surprised at", "are surprising to"], "src": "新北中正 114 九上一段", "ans": "B", "why": "事物當主詞＋情緒動詞＋人：過去式 surprised"}, {"n": 2, "section": "一、選擇題（每題 2 分）", "passage": "", "stem": "My husband really wants to buy a dishwasher. Washing dishes ______ him.", "opts": ["tire", "is tired of", "is tiring to", "are tiring to"], "src": "新北中正 114 九上一段", "ans": "C", "why": "Washing dishes 是事物（單數）→ is tiring to 人"}, {"n": 3, "section": "一、選擇題（每題 2 分）", "passage": "", "stem": "I was ______ to find ______ she was Hui-ting, my old neighbor.", "opts": ["surprising / X", "scary / that", "scared / it", "surprised / that"], "src": "新北中正 114 九上一段", "ans": "D", "why": "人 be surprised to V／that 子句"}, {"n": 4, "section": "一、選擇題（每題 2 分）", "passage": "", "stem": "Besides me, my brother and sister are ______ about the coming of Chinese New Year. We will put on our new clothes and eat a big meal with our grandparents.", "opts": ["worried", "tired", "excited", "interested"], "src": "新北新莊 110 九上一段", "ans": "C", "why": "be excited about"}, {"n": 5, "section": "一、選擇題（每題 2 分）", "passage": "", "stem": "Miss Lee: How can I make my class less ______ and more fun?<br>Mr. Wang: First, class is fun when there's an ______ topic. Also, try to play a game before you start a class.", "opts": ["bored; interested", "boring; interesting", "boring; interested", "interesting; interested"], "src": "新北新莊 110 九上一段", "ans": "B", "why": "課（事物）boring；主題（事物）interesting"}, {"n": 6, "section": "一、選擇題（每題 2 分）", "passage": "", "stem": "My son ______ science and math since he was 8 years old. Next year he will go to college and major in science.", "opts": ["interests", "has interested", "is interesting to", "has been interested in"], "src": "新北新莊 110 九上一段", "ans": "D", "why": "since → 現在完成式；人 be interested in"}, {"n": 7, "section": "一、選擇題（每題 2 分）", "passage": "", "stem": "Emma: Wow! I love the story. Many stories in Chinese history are so ______ to me.<br>Alex: I think so, too. That's why I can't wait to see the movie.", "opts": ["excite", "excites", "excited", "exciting"], "src": "新北新莊 110 九上一段", "ans": "D", "why": "故事（事物）→ exciting to 人"}, {"n": 8, "section": "一、選擇題（每題 2 分）", "passage": "", "stem": "Steven: Benny, why do you look so ______?<br>Benny: I just passed an interview. I got the job.<br>Steven: Wow, the good news is really ______. Congratulations!", "opts": ["exciting; surprising", "exciting; surprised", "excited; surprised", "excited; surprising"], "src": "新北新莊 111 九上二段", "ans": "D", "why": "人 excited；消息 surprising"}, {"n": 9, "section": "一、選擇題（每題 2 分）", "passage": "", "stem": "The trip to the museum was not fun at all, and it ______ me so much.", "opts": ["bored", "was bored", "to bore", "was boring"], "src": "新北新莊 111 九上二段", "ans": "A", "why": "it（事物）當主詞 + 情緒動詞 + 人 → 過去式 bored"}, {"n": 10, "section": "一、選擇題（每題 2 分）", "passage": "", "stem": "Ruby is a(an) ______ girl, so most of her classmates like to talk with her.", "opts": ["boring", "bored", "interesting", "interested"], "src": "新北新莊 112 九上一段", "ans": "C", "why": "「有趣的女孩」= 讓人有興趣 → interesting"}, {"n": 11, "section": "一、選擇題（每題 2 分）", "passage": "", "stem": "Math is difficult to me. Doing math homework often makes me ______.", "opts": ["tire", "tired", "tires", "tiring"], "src": "新北新莊 112 九上一段", "ans": "B", "why": "make + 人 + 情緒形容詞（-ed）"}, {"n": 12, "section": "一、選擇題（每題 2 分）", "passage": "", "stem": "A: Peter, why do you look so happy? Did something ______ happen?<br>B: I just passed the e const L = 'ABCD';
const state = {}; // key -> {n: {picked, ok}}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
  const tabs=document.getElementById('tabs'), main=document.getElementById('main');
  DATA.forEach((set,i)=>{
    const t=document.createElement('button'); t.className='tab'; t.role='tab'; t.id='tab-'+set.key; t.textContent=set.title; t.setAttribute('aria-selected', i===0); t.onclick=()=>show(set.key); tabs.appendChild(t);
    const sec=document.createElement('section'); sec.className='set'+(i===0?' on':''); sec.id='set-'+set.key;
    let h=`<div class="setsub">${esc(set.sub)}　·　${set.items.length} 題　<button class="reset" data-reset="${set.key}">重做這份</button></div>`;
    let lastSec='';
    set.items.forEach(q=>{
      if(q.section && q.section!==lastSec){ h+=`<div class="sec">${esc(q.section)}</div>`; lastSec=q.section; }
      if(q.passage){ h+=`<div class="passage">${q.passage}</div>`; }
      const hasOpts=q.opts.length>=3 && q.opts.length<=4;
      h+=`<article class="q" id="q-${set.key}-${q.n}" data-key="${set.key}" data-n="${q.n}"><div class="num"><span>${q.n}</span><span class="src">${esc(q.src)}</span></div>${q.notyet?`<div class="notyet">⏳ ${esc(q.notyet)}</div>`:''}<div class="stem">${q.stem}</div>`;
      if(hasOpts){ h+=`<div class="opts">`+q.opts.map((o,j)=>`<button class="opt" data-k="${L[j]}"><span class="k">${L[j]}</span><span>${o}</span></button>`).join('')+`</div>`; }
      else { h+=`<button class="reveal">看答案</button>`; }
      h+=`<div class="fb"></div></article>`;
    });
    h+=`<div class="done-all">寫完了就往上看分數；想再練一次按「重做這份」🐱</div>`;
    sec.innerHTML=h; main.appendChild(sec);
  });
  main.addEventListener('click',e=>{
    const opt=e.target.closest('.opt'), rev=e.target.closest('.reveal'), rs=e.target.closest('[data-reset]');
    if(rs){ resetSet(rs.dataset.reset); return; }
    const art=e.target.closest('.q'); if(!art) return;
    if(opt && !art.classList.contains('done')) answer(art, opt.dataset.k);
    if(rev && !art.classList.contains('done')) reveal(art);
  });
  updateScore();
  DATA.filter(s=>s.drill).forEach(s=>drillBox(s.key));
}
function getQ(art){ const set=DATA.find(s=>s.key===art.dataset.key); return [set, set.items.find(q=>q.n==art.dataset.n)]; }
function answer(art,k){
  const [set,q]=getQ(art); const ok = k===q.ans;
  art.classList.add('done');
  art.querySelectorAll('.opt').forEach(b=>{ if(b.dataset.k===q.ans) b.classList.add('right'); else if(b.dataset.k===k) b.classList.add('wrong'); });

const LSD='xm_drill_wrong_v1', DAYMS=86400000, todayMs=()=>new Date(new Date().toDateString()).getTime();

function drillRecord(set,q,ok,isReview){

  else if(w){ w.streak=(w.streak||0)+1; if(w.streak>=2) delete DRILLW[id]; else w.next=todayMs()+7*DAYMS; }

  const set=DATA.find(s=>s.key===key); const t=todayMs();
  const due=Object.values(DRILLW).filter(w=>w.key===key && w.next<=t).map(w=>set.items.find(q=>q.n==w.n)).filter(Boolean);
  const all=Object.values(DRILLW).filter(w=>w.key===key).length;

// ---------- 16 個觀念的「動手玩」小動畫（重講第 3 層） ----------
// 每個 widget：html() 產生 SVG + 一支滑桿；update(root, v) 依滑桿值重畫。
const DEG = Math.PI / 180;
const GOOD = '#2E8B57', INK = '#222', MUTE = '#888', ORANGE = '#F7B267', BLUE = '#9BB8E8', PINK = '#F3B0A5';

function sector(px, py, r, a1, a2) {
  const x1 = px + r * Math.cos(a1 * DEG), y1 = py - r * Math.sin(a1 * DEG);
  const x2 = px + r * Math.cos(a2 * DEG), y2 = py - r * Math.sin(a2 * DEG);
  const big = (a2 - a1) > 180 ? 1 : 0;
  return `M${px.toFixed(1)},${py.toFixed(1)} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${big} 0 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;  // sweep=0：螢幕 y 向下，數學角逆時針要用 0 才是凸的扇形（widget-B 9/15 抓到）
}
// 從 p 看向 q 的角度（數學慣例，螢幕 y 已翻轉）
function ang(p, q) { let a = Math.atan2(-(q[1] - p[1]), q[0] - p[0]) / DEG; return (a + 360) % 360; }
// 以 p 為頂點、夾在 pq1 與 pq2 之間的「內角」扇形
function arc(p, r, q1, q2) {
  let a1 = ang(p, q1), a2 = ang(p, q2);
  if (a2 < a1) a2 += 360;
  if (a2 - a1 > 180) { const t = a1; a1 = a2 - 360; a2 = t; }
  return sector(p[0], p[1], r, a1, a2);
}
function angDeg(p, q1, q2) { let d = Math.abs(ang(p, q1) - ang(p, q2)); if (d > 180) d = 360 - d; return d; }
// 直角符號
function rightMark(v, a, b, s) {
  const u1 = norm(sub(a, v)), u2 = norm(sub(b, v));
  const p1 = add(v, mul(u1, s)), p2 = add(add(v, mul(u1, s)), mul(u2, s)), p3 = add(v, mul(u2, s));
  return `${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)} ${p3[0].toFixed(1)},${p3[1].toFixed(1)}`;
}
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const mul = (a, k) => [a[0] * k, a[1] * k];
const len = a => Math.hypot(a[0], a[1]);
const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l]; };
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
const pt = a => `${a[0].toFixed(1)},${a[1].toFixed(1)}`;

function wrap(name, inner, slider, cap) {
  return `<div class="widget" data-w="${name}">
    <svg viewBox="0 0 320 210" class="wsvg" width="320">${inner}</svg>
    ${slider}<div class="wcap">${cap}</div><div class="wmsg"></div></div>`;
}
function slider(name, min, max, val, label, step) {
  return `<input type="range" min="${min}" max="${max}" value="${val}" ${step ? `step="${step}"` : ''} data-widget="${name}" aria-label="${label}" style="width:100%">`;
}
function setTxt(root, sel, x, y, t, opt = {}) {

  const _cp = (cx, cy, r, a) => [cx + r * Math.cos(a * DEG), cy - r * Math.sin(a * DEG)];
  const _sec = (cx, cy, r, a1, a2) => {
    const p1 = _cp(cx, cy, r, a1), p2 = _cp(cx, cy, r, a2);
    const big = (a2 - a1) > 180 ? 1 : 0;
    return `M${cx.toFixed(1)},${cy.toFixed(1)} L${pt(p1)} A${r},${r} 0 ${big} 0 ${pt(p2)} Z`;
  };
  const _arc = (cx, cy, r, a1, a2) => {
    const p1 = _cp(cx, cy, r, a1), p2 = _cp(cx, cy, r, a2);
    const big = (a2 - a1) > 180 ? 1 : 0;
    return `M${pt(p1)} A${r},${r} 0 ${big} 0 ${pt(p2)}`;
  };
  // 以 v 為頂點、夾在 vq1 與 vq2 之間的「內角」扇形
  const _wed = (v, r, q1, q2) => {
    let a1 = ang(v, q1), a2 = ang(v, q2);
    if (a2 < a1) a2 += 360;
    if (a2 - a1 > 180) { const t = a1; a1 = a2 - 360; a2 = t; }
    return _sec(v[0], v[1], r, a1, a2);

    const e = root.querySelector(cls);
    e.setAttribute('cx', p[0].toFixed(1)); e.setAttribute('cy', p[1].toFixed(1));
  };
  const _pd = (root, cls, d) => root.querySelector(cls).setAttribute('d', d);
  const _op = (root, cls, o) => root.querySelector(cls).setAttribute('opacity', o);

  return {

        // 外公切線：法向量 nx ＝ (r－R)/d

    for (let i = 0; i < n; i++) {

    const qa = A[0] * A[0] + A[1] * A[1], qb = B[0] * B[0] + B[1] * B[1], qc = C[0] * C[0] + C[1] * C[1];
    return [(qa * (B[1] - C[1]) + qb * (C[1] - A[1]) + qc * (A[1] - B[1])) / d,
            (qa * (C[0] - B[0]) + qb * (A[0] - C[0]) + qc * (B[0] - A[0])) / d];
  };
  // 內心 + 內切圓半徑
  const inC = (A, B, C) => {
    const a = len(sub(B, C)), b = len(sub(C, A)), c = len(sub(A, B)), p = a + b + c;
    const I = [(a * A[0] + b * B[0] + c * C[0]) / p, (a * A[1] + b * B[1] + c * C[1]) / p];

// ===== 國中生物 七上 第 1 章 顯微鏡：3 個「動手玩」小動畫 =====
// 共用 helper（DEG / INK / MUTE / ORANGE / BLUE / PINK / GOOD / wrap / slider / setTxt / msg …）
// 由 guided_widgets.js 前段提供，這裡只放私有 helper（IIFE 內，不與共用 helper 同名）。
Object.assign(WIDGETS, (function () {

  const ACC = '#D9694F', DEEP = '#2A4E8C', PAPER = '#F7F5F0';

  // 箭頭（絕對座標，不用 transform，避免 getBBox 誤判出框）
  function mkArrow(x1, y1, x2, y2, col, w) {
    const a = Math.atan2(y2 - y1, x2 - x1), h = 9, sp = 0.42;
    const hx = x2 - h * Math.cos(a), hy = y2 - h * Math.sin(a);
    const p1x = x2 - h * 1.25 * Math.cos(a - sp), p1y = y2 - h * 1.25 * Math.sin(a - sp);
    const p2x = x2 - h * 1.25 * Math.cos(a + sp), p2y = y2 - h * 1.25 * Math.sin(a + sp);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`
      + `<polygon points="${x2.toFixed(1)},${y2.toFixed(1)} ${p1x.toFixed(1)},${p1y.toFixed(1)} ${p2x.toFixed(1)},${p2y.toFixed(1)}" fill="${col}"/>`;
  }

  // 草履蟲（橢圓＋纖毛＋核）
  function mkPara(cx, cy, s, col, op) {
    const rx = 13 * s, ry = 7 * s;
    let d = `<g opacity="${op}">`;
    d += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="${col}" stroke="${INK}" stroke-width="1.3"/>`;
    for (let i = 0; i < 10; i++) {
      const a = i * 36 * DEG, ux = Math.cos(a), uy = -Math.sin(a);
      const x1 = cx + rx * ux, y1 = cy + ry * uy;
      const x2 = cx + (rx + 4) * ux, y2 = cy + (ry + 4) * uy;
      d += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${INK}" stroke-width="1"/>`;
    }
    d += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(2.8 * s).toFixed(1)}" fill="${INK}" opacity=".5"/></g>`;
    return d;
  }

  // 視野內的細胞：一圈一圈排（ring = [顆數, 半徑比例, 起始角]）
  function mkCells(cx, cy, R, rc, rings, fill) {
    let d = '';
    rings.forEach(function (rg) {
      const n = rg[0], f = rg[1], off = rg[2];
      for (let j = 0; j < n; j++) {
        const a = (off + j * 360 / n) * DEG;
        const x = cx + R * f * Math.cos(a), y = cy - R * f * Math.sin(a);
        d += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rc}" fill="${fill}" stroke="${INK}" stroke-width="1" opacity=".95"/>`;
        d += `<circle cx="${x.toFixed(1)}" cy="${(y - rc * 0.18).toFixed(1)}" r="${(rc * 0.3).toFixed(1)}" fill="${INK}" opacity=".45"/>`;
      }
    });
    return d;
  }

  // 文字槽（不套 CSS class，size / weight 用 style，fill 用屬性）
  function putTxt(root, k, x, y, t, size, fill, weight) {
    const e = root.querySelector('.p' + k);

    e.setAttribute('x', x); e.setAttribute('y', y);
    e.setAttribute('fill', fill || INK);
    e.style.fontSize = size + 'px';
    e.style.fontWeight = weight || 500;
    e.textContent = t || '';
  }

  return {

          slider('mic_power', 1, 4, 1, '選總倍率', 1),
          '← 把倍率從 100× 拖到 800× →　每拖一格倍率變 2 倍：看視野、亮度、細胞數、物鏡長度');
      },
      update(root, v) {

        const LV = [
          { mag: 100, obj: 10, R: 60, rc: 3.2, n: 128, rings: [[1, 0, 0], [8, 0.2, 0], [15, 0.38, 12], [22, 0.55, 0], [30, 0.72, 6], [52, 0.9, 0]], sky: '#FFFCEC', len: 34, ld: '最短' },
          { mag: 200, obj: 20, R: 48, rc: 5.5, n: 32, rings: [[1, 0, 0], [6, 0.32, 0], [11, 0.62, 15], [14, 0.88, 8]], sky: '#F0E7C8', len: 48, ld: '短' },

          { mag: 800, obj: 80, R: 28, rc: 13, n: 2, rings: [[2, 0.50, 45]], sky: '#948D79', len: 80, ld: '最長' }

        // 視野圓：倍率愈高 → 半徑愈小（視野愈小）、底色愈暗（愈暗）
        const fov = root.querySelector('.fov');

        fov.setAttribute('fill', LV.sky);

        // 細胞：倍率愈高 → 顆數愈少、每顆愈大
        root.querySelector('.cells').innerHTML = mkCells(88, 96, LV.R, LV.rc, LV.rings, BLUE);
        root.querySelector('.cn').textContent = `視野內有 ${LV.n} 顆細胞`;
